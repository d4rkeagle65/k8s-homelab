# The front-door Bluetooth proxy (README.md): upstream's wt32/wt32-eth01.yaml from
# esphome/bluetooth-proxies on Wi-Fi, with upstream's Wi-Fi proxy settings
# (esp32-generic/esp32-generic.yaml), and a fixed name, an API encryption key, an OTA
# password and the Wi-Fi network from secrets.yaml beside this file, which git never holds.

esphome:
  name: !secret device_name
  friendly_name: Front door Bluetooth proxy
  min_version: 2025.11.0
  platformio_options:
    board_build.flash_mode: dio

esp32:
  variant: esp32
  framework:
    type: esp-idf

# Wi-Fi, so the board needs only 5 V where it stands. ESPHome runs Ethernet or Wi-Fi,
# never both, so the board's LAN8720 stays off.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

logger:

ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

# ESPHome's default scan window and connection slots, upstream's for a Wi-Fi proxy: the
# ESP32's one radio serves Wi-Fi and Bluetooth in turn.
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

button:
  - platform: safe_mode
    id: button_safe_mode
    name: Safe Mode Boot

  - platform: factory_reset
    id: factory_reset_btn
    name: Factory reset
