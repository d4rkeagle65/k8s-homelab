# Ansible's settings for the playbooks in ansible/, read when Ansible runs from
# the repo root (Semaphore's templates do): the default output with each task
# numbered, "TASK [17/34 - Name]" (ansible/callback_plugins/homelab_progress.py),
# and the NetBox inventory with its last-good copy
# (ansible/inventory_plugins/netbox_fallback.py, ansible/inventory/netbox.yml).
[defaults]
callback_plugins = ./ansible/callback_plugins
inventory_plugins = ./ansible/inventory_plugins
stdout_callback = homelab_progress
