# Databasus on the Docker host, deployed by Dockhand from this folder (a Git
# stack): nightly backups of the host's own PostgreSQL databases (Semaphore's
# semaphore and tfstate, Kea's kea and stork) to the Garage bucket
# docker-backups on the NAS, with failure alerts. Its databases, storage,
# schedules and notifiers are set in its web UI and kept in /opt/databasus;
# README.md lists them, so they can be set again.
#
# It reaches each database over that stack's own Docker network (joined
# below by name), as the read-only role `databasus` each stack's
# databasus-role-init keeps; no database is published.
#
# The web UI is on the host's management address only, port 4005, and is
# served at databasus.<domain> through Traefik to private networks only
# (kubernetes external-services). Its logins are its own: it has no OIDC.
#
# Variables, from Key Vault (references in .env):
#   DOCKER_VM_1_MGMT_ADDRESS  the host's management address (the web UI)
#   BASE_DOMAIN               the domain: its links use https://databasus.<domain>
#   DATABASUS_AGENT_ID        the verification agent's ID (Settings > Verification
#                             agents in the UI)
#   DATABASUS_AGENT_TOKEN     its token, shown once when it's created
#
# databasus-verification-agent restores each backup into a throwaway
# PostgreSQL and reports row counts. It starts those databases through the
# host's Docker socket, which is root on this host and reads every stack's
# secrets: accepted on 2026-10-09. What it starts is locked down (all
# capabilities dropped, no-new-privileges, CPU, memory and process limits,
# an isolated network) and reached on a random 127.0.0.1 port, hence the host
# network. Its binary comes from Databasus itself at each start, matching
# the server's version; its settings, token included, are written to a
# memory-only folder, never to disk or the process list.
services:
  databasus:
    mem_limit: 1g
    image: databasus/databasus:v3.61.0
    container_name: databasus
    restart: unless-stopped
    ports:
    - ${DOCKER_VM_1_MGMT_ADDRESS}:4005:4005
    volumes:
    - /opt/databasus:/databasus-data
    environment:
      DATABASUS_URL: https://databasus.${BASE_DOMAIN}
      IS_DISABLE_ANONYMOUS_TELEMETRY: "true"
    networks:
    - default
    - semaphore
    - kea
    - netbox
    healthcheck:
      test: ["CMD", "databasus", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Its first start takes up to ~2 minutes.
      start_period: 120s

  databasus-verification-agent:
    mem_limit: 256m
    image: buildpack-deps:trixie-curl
    container_name: databasus-verification-agent
    restart: unless-stopped
    depends_on:
      databasus:
        condition: service_healthy
    network_mode: host
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
    - /run/agent:rw,exec,mode=700,size=128m
    working_dir: /run/agent
    environment:
      DATABASUS_URL: https://databasus.${BASE_DOMAIN}
      DATABASUS_AGENT_ID: ${DATABASUS_AGENT_ID}
      DATABASUS_AGENT_TOKEN: ${DATABASUS_AGENT_TOKEN}
    # Budgets for all verifications together; these databases are tiny.
    command:
    - /bin/sh
    - -c
    - |
      set -e
      [ -n "$$DATABASUS_AGENT_ID" ] && [ -n "$$DATABASUS_AGENT_TOKEN" ] || { echo "DATABASUS_AGENT_ID or DATABASUS_AGENT_TOKEN is empty"; exit 1; }
      curl -fsSL -o verification-agent "$$DATABASUS_URL/api/v1/system/verification-agent?arch=amd64"
      chmod 700 verification-agent
      umask 077
      printf '{"databasusHost":"%s","agentId":"%s","token":"%s","maxCpu":1,"maxRamMb":1024,"maxDiskGb":5,"maxConcurrentJobs":1}\n' \
        "$$DATABASUS_URL" "$$DATABASUS_AGENT_ID" "$$DATABASUS_AGENT_TOKEN" > databasus-verification.json
      exec ./verification-agent run

# Each stack's default network, which Docker names <stack>_default.
networks:
  semaphore:
    external: true
    name: semaphore_default
  kea:
    external: true
    name: kea_default
  netbox:
    external: true
    name: netbox_default
