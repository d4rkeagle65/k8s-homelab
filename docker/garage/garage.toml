# Garage on the NAS: one node, S3-compatible object storage for the database
# backups. Copied once to the NAS (README.md); the secrets come from the
# stack's environment (GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN, GARAGE_METRICS_TOKEN).
#
# One node, one copy: Garage calls that a test setup, and here the NAS's own
# disk redundancy covers the drives, and what's stored is itself the second
# copy of the databases.
replication_factor = 1

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
# Snapshots of the metadata database, to recover from if it's ever corrupted.
metadata_auto_snapshot_interval = "6h"

# The NAS has 1 GB of memory: keep Garage's block buffer small.
block_ram_buffer_max = "64MiB"
compression_level = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
