# NetBox on the Docker host, deployed by Dockhand from this folder (a Git
# stack): the homelab's documentation, and the source of Semaphore's hosts
# (old-queues/QUEUE-netbox.md). Its image is built here (Dockerfile) with the plugins in
# plugin_requirements.txt. The web UI is published on the host's management
# address only, and served at netbox.<domain> through Traefik (kubernetes
# external-services), private networks only. Logins go through Authentik
# (OIDC, config/sso.py); scripts use API tokens. See README.md.
#
# Variables, from Key Vault (references in .env):
#   DOCKER_VM_1_MGMT_ADDRESS the host's management address (the web UI, 8085)
#   BASE_DOMAIN             the domain: netbox.<domain> is the name it answers to,
#                           auth.<domain> its OIDC provider (Authentik)
#   NETBOX_DB_PASSWORD      the netbox database role's
#   NETBOX_SECRET_KEY       signs sessions and the like (50+ random characters)
#   NETBOX_API_TOKEN_PEPPER hashes API tokens (50+ random characters);
#                           changing it invalidates every token
#   AUTHENTIK_NETBOX_OIDC_CLIENT_SECRET  the same one Authentik's blueprint reads
#   DATABASUS_NETBOX_DB_PASSWORD  the databasus role's (read-only, for backups)
#   TIMEZONE                e.g. America/New_York
#   NETBOX_DNS_SYNC_TOKEN, PIHOLE_1_URL, PIHOLE_1_PASSWORD, PIHOLE_2_URL,
#   PIHOLE_2_PASSWORD       netbox-dns-sync's (below)
#
# The Kea plugin calls http://kea-dhcp4:8000 on the kea stack's network (below).
x-netbox: &netbox
  image: homelab/netbox:local
  restart: unless-stopped
  user: "netbox:root"
  environment: &netbox-env
    DB_HOST: netbox-postgres
    DB_NAME: netbox
    DB_USER: netbox
    DB_PASSWORD: ${NETBOX_DB_PASSWORD}
    # One Valkey: database 0 holds the task queue, 1 the cache.
    REDIS_HOST: netbox-valkey
    REDIS_DATABASE: "0"
    REDIS_CACHE_HOST: netbox-valkey
    REDIS_CACHE_DATABASE: "1"
    SECRET_KEY: ${NETBOX_SECRET_KEY}
    API_TOKEN_PEPPER_1: ${NETBOX_API_TOKEN_PEPPER}
    # Space-separated: the public name, and the service's own name, which only
    # this stack's network reaches (netbox-dns-sync calls http://netbox:8080).
    ALLOWED_HOSTS: netbox.${BASE_DOMAIN} netbox
    CSRF_TRUSTED_ORIGINS: https://netbox.${BASE_DOMAIN}
    LOGIN_REQUIRED: "true"
    TIME_ZONE: ${TIMEZONE:-UTC}
    SKIP_SUPERUSER: "true"
    GRANIAN_WORKERS: "2"
    OIDC_ENDPOINT: https://auth.${BASE_DOMAIN}/application/o/netbox/
    OIDC_CLIENT_SECRET: ${AUTHENTIK_NETBOX_OIDC_CLIENT_SECRET}
    # Uploads (image attachments, netbox-attachments' files) go to the media
    # folder mounted below. Unset, the image's configuration.py puts them in
    # /etc/netbox/media, beside itself, which nothing mounts and NetBox's user
    # can't write. Reports and scripts need nothing: NetBox's own defaults are
    # the folders mounted below.
    MEDIA_ROOT: /opt/netbox/netbox/media
  networks: [default, kea]
  volumes:
  - /opt/netbox/media:/opt/netbox/netbox/media
  - /opt/netbox/reports:/opt/netbox/netbox/reports
  - /opt/netbox/scripts:/opt/netbox/netbox/scripts

services:
  netbox-postgres:
    mem_limit: 512m
    image: postgres:18.6-alpine
    container_name: netbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: ${NETBOX_DB_PASSWORD}
      POSTGRES_DB: netbox
    # PostgreSQL 18's image keeps its data in a version folder under here.
    volumes:
    - /opt/netbox/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netbox"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The task queue survives a restart (append-only file); the cache needn't.
  netbox-valkey:
    mem_limit: 256m
    image: valkey/valkey:9.1.2-alpine
    container_name: netbox-valkey
    restart: unless-stopped
    command: [valkey-server, --appendonly, "yes"]
    volumes:
    - /opt/netbox/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The read-only role Databasus backs this database up as (docker/databasus/):
  # created when missing, password set from DATABASUS_DB_PASSWORD, and
  # pg_read_all_data, on every deploy, then exits.
  databasus-role-init:
    image: postgres:18.6-alpine
    restart: "no"
    # Exits once its job is done: no Dockhand notification for that.
    labels:
      dockhand.notify: "false"
    depends_on:
      netbox-postgres:
        condition: service_healthy
    environment:
      PGHOST: netbox-postgres
      PGUSER: netbox
      PGDATABASE: netbox
      PGPASSWORD: ${NETBOX_DB_PASSWORD}
      DATABASUS_DB_PASSWORD: ${DATABASUS_NETBOX_DB_PASSWORD}
    command:
    - /bin/sh
    - -c
    - |
      set -e
      [ -n "$$DATABASUS_DB_PASSWORD" ] || { echo "DATABASUS_DB_PASSWORD is empty"; exit 1; }
      psql -v ON_ERROR_STOP=1 -v pw="$$DATABASUS_DB_PASSWORD" <<'SQL'
      SELECT 'CREATE ROLE databasus LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'databasus')\gexec
      ALTER ROLE databasus PASSWORD :'pw';
      GRANT pg_read_all_data TO databasus;
      SQL
      psql -tA -c "SELECT 'databasus role: login ' || rolcanlogin || ', reads all data ' || pg_has_role('databasus', 'pg_read_all_data', 'MEMBER') FROM pg_roles WHERE rolname = 'databasus'"

  # The host folders NetBox writes (uploads, reports, scripts) belong to its
  # user, which runs without root: owned on every deploy, then exits.
  netbox-files-init:
    <<: *netbox
    user: root
    restart: "no"
    # Exits once its job is done: no Dockhand notification for that.
    labels:
      dockhand.notify: "false"
    pull_policy: never
    command: [chown, -R, "netbox:root", /opt/netbox/netbox/media, /opt/netbox/netbox/reports, /opt/netbox/netbox/scripts]

  netbox:
    mem_limit: 4g
    <<: *netbox
    # Built here from the Dockerfile, which holds the versions; never pulled,
    # since no registry has it.
    build: .
    pull_policy: build
    container_name: netbox
    depends_on:
      netbox-postgres:
        condition: service_healthy
      netbox-valkey:
        condition: service_healthy
      netbox-files-init:
        condition: service_completed_successfully
    ports:
    - ${DOCKER_VM_1_MGMT_ADDRESS}:8085:8080
    # The first start migrates an empty database with every plugin (about 15
    # minutes in testing); the worker waits for healthy, so a shorter grace marks
    # NetBox unhealthy mid-migration and the worker never starts. A passing check
    # ends the grace early.
    healthcheck:
      test: /opt/netbox/health.sh
      start_period: 30m
      timeout: 3s
      interval: 15s

  # Background jobs, housekeeping among them (NetBox schedules it itself).
  netbox-worker:
    mem_limit: 1g
    <<: *netbox
    pull_policy: never
    container_name: netbox-worker
    depends_on:
      netbox:
        condition: service_healthy
    command: [/opt/netbox/venv/bin/python, /opt/netbox/netbox/manage.py, rqworker]
    # Healthy while this container's RQ worker is registered in Valkey: its key
    # there lives only as long as the worker's heartbeat renews it (RQ's worker
    # TTL), so a worker that hangs or loses Valkey turns unhealthy. The process
    # itself needs no check: tini stops the container when it exits.
    healthcheck:
      test:
      - CMD
      - /opt/netbox/venv/bin/python
      - -c
      - >-
        import os, socket, redis;
        r = redis.Redis(host=os.environ['REDIS_HOST'], db=int(os.environ.get('REDIS_DATABASE', '0')),
        password=os.environ.get('REDIS_PASSWORD') or None, socket_timeout=5);
        me = socket.gethostname().encode();
        raise SystemExit(0 if any(r.hget(w, 'hostname') == me for w in r.smembers('rq:workers')) else 1)
      start_period: 2m
      timeout: 10s
      interval: 60s
      retries: 3

  # NetBox DNS's records to every Pi-hole, each minute (dns-sync/,
  # old-queues/QUEUE-netbox-dns.md). Report-only until SYNC_APPLY is true; a record
  # NetBox lacks is removed only once SYNC_DELETE is true too.
  netbox-dns-sync:
    mem_limit: 64m
    build: ./dns-sync
    image: homelab/netbox-dns-sync:local
    pull_policy: build
    container_name: netbox-dns-sync
    restart: unless-stopped
    depends_on:
      netbox:
        condition: service_healthy
    environment:
      NETBOX_API: http://netbox:8080
      # A read-only NetBox token.
      NETBOX_TOKEN: ${NETBOX_DNS_SYNC_TOKEN}
      # Each Pi-hole's web address (scheme, no path) and an app password.
      PIHOLE_1_URL: ${PIHOLE_1_URL}
      PIHOLE_1_PASSWORD: ${PIHOLE_1_PASSWORD}
      PIHOLE_2_URL: ${PIHOLE_2_URL}
      PIHOLE_2_PASSWORD: ${PIHOLE_2_PASSWORD}
      PIHOLE_TLS_VERIFY: "true"
      SYNC_APPLY: "true"
      SYNC_DELETE: "false"
    command: [--every, "60", --health, /tmp/healthy]
    # Healthy while a round has finished cleanly in the last five minutes.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/healthy -mmin -5 | grep -q ."]
      start_period: 3m
      timeout: 3s
      interval: 60s

networks:
  # Kea's control API (the Kea plugin), on the kea stack's default network,
  # which Docker names <stack>_default.
  kea:
    external: true
    name: kea_default
