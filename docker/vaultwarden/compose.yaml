# Vaultwarden on the Docker host, deployed by Dockhand from this folder (a
# Git stack), not by Flux. Each variable is a Key Vault reference in .env.
# Dockhand resolves them at each deploy and hands the values to compose as its
# environment, never through a file, so a value containing `$` (the argon2
# VAULTWARDEN_ADMIN_TOKEN) arrives intact.
#
# Variables, from Key Vault:
#   DOCKER_VM_1_PROD_ADDRESS  the host's main-network address (443)
#   BASE_DOMAIN               the domain: its own address (vaultwarden.<domain>),
#                             the signups whitelist, smtp-relay.<domain> and
#                             Authentik's issuer (auth.<domain>) are built from it
#   VAULTWARDEN_ADMIN_TOKEN   the /admin page's token, an argon2 hash
#   M365_SHARED_MAILBOX_ADDRESS
#                             the shared mailbox its mail is sent from: the relay
#                             sends as that mailbox, so the Entra app behind
#                             ENTRA_VAULTWARDEN_SMTP_USERNAME needs send rights on it
#   ENTRA_VAULTWARDEN_SMTP_USERNAME, ENTRA_VAULTWARDEN_SMTP_CLIENT_SECRET
#                             its login on the SMTP relay
#   AUTHENTIK_VAULTWARDEN_OIDC_CLIENT_ID, AUTHENTIK_VAULTWARDEN_OIDC_CLIENT_SECRET
#                             the same pair Authentik's blueprint reads
#
# Vaultwarden serves HTTPS itself on 443. scripts/vaultwarden-cert-sync.sh
# (cron, daily) copies cert-manager's certificate into /opt/vaultwarden/ssl
# and restarts the container when it changes. The cluster's bitwarden-cli pod
# connects straight here (vaultwarden-direct.<domain>), never through
# Traefik, and refuses plain HTTP; see
# kubernetes/prod/system/external-services/external-services/app/vaultwarden.yaml.
#
# vaultwarden-backup (ttionya/vaultwarden-backup) backs the data folder up to
# the Garage bucket docker-backups on the NAS, nightly: the database through
# SQLite's own .backup (safe while Vaultwarden runs), with the RSA key that
# signs logins, config.json, attachments and Sends, in one 7z archive
# encrypted with VAULTWARDEN_BACKUP_ZIP_PASSWORD. Keep that password OUTSIDE
# Vaultwarden: it's what opens the backup when Vaultwarden is the thing that's
# gone. Blank, the image falls back to its own published default
# (scripts/includes.sh), which protects nothing.
# Restore: see the image's README (`restore` command, the container stopped).
#
# Backup variables, from Key Vault:
#   GARAGE_S3_ENDPOINT  Garage's S3 API
#   VAULTWARDEN_BACKUP_S3_ACCESS_KEY_ID, VAULTWARDEN_BACKUP_S3_SECRET_ACCESS_KEY
#                       the docker-backups key
#   VAULTWARDEN_BACKUP_ZIP_PASSWORD  the archive's password
services:
  vaultwarden:
    mem_limit: 768m
    image: vaultwarden/server:1.37.4
    container_name: vaultwarden
    restart: unless-stopped
    ports:
    # The host's main-network address only, not its management one.
    - ${DOCKER_VM_1_PROD_ADDRESS}:443:443
    volumes:
    - /opt/vaultwarden/data:/data
    - /opt/vaultwarden/ssl:/ssl:ro
    environment:
      ROCKET_TLS: '{certs="/ssl/tls.crt",key="/ssl/tls.key"}'
      ROCKET_PORT: "443"
      DOMAIN: https://vaultwarden.${BASE_DOMAIN}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      SIGNUPS_ALLOWED: "false"
      SIGNUPS_DOMAINS_WHITELIST: ${BASE_DOMAIN}
      SMTP_HOST: smtp-relay.${BASE_DOMAIN}
      SMTP_PORT: "8025"
      SMTP_SECURITY: starttls
      SMTP_FROM: ${M365_SHARED_MAILBOX_ADDRESS}
      SMTP_USERNAME: ${ENTRA_VAULTWARDEN_SMTP_USERNAME}
      SMTP_PASSWORD: ${ENTRA_VAULTWARDEN_SMTP_CLIENT_SECRET}
      SSO_ENABLED: "true"
      SSO_ONLY: "false"
      SSO_AUTHORITY: https://auth.${BASE_DOMAIN}/application/o/vaultwarden/
      SSO_CLIENT_ID: ${AUTHENTIK_VAULTWARDEN_OIDC_CLIENT_ID}
      SSO_CLIENT_SECRET: ${AUTHENTIK_VAULTWARDEN_OIDC_CLIENT_SECRET}
      SSO_SCOPES: openid email profile offline_access
      SSO_SIGNUPS_MATCH_EMAIL: "true"
      SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: "false"
      SSO_CLIENT_CACHE_EXPIRATION: "0"
      # Authentik, smtp-relay and LAN sites' icons have private addresses,
      # which Vaultwarden refuses to contact by default.
      HTTP_REQUEST_BLOCK_NON_GLOBAL_IPS: "false"
      ICON_BLACKLIST_NON_GLOBAL_IPS: "false"
      LOG_LEVEL: info

  vaultwarden-backup:
    mem_limit: 512m
    image: ttionya/vaultwarden-backup:1.27.2
    container_name: vaultwarden-backup
    restart: unless-stopped
    volumes:
    - /opt/vaultwarden/data:/bitwarden/data
    # The rclone remote comes from the environment (RCLONE_CONFIG_GARAGE_*,
    # below), which rclone reads over a config file's values. The image only
    # starts when `rclone config show` lists the remote, which takes a file
    # naming it, so a two-line one is written at every start. Not an inline
    # compose config (configs: content): its copy into the container isn't
    # guaranteed when Dockhand recreates it, and without the file the image
    # exits at every start.
    entrypoint:
    - /bin/sh
    - -c
    - mkdir -p /config/rclone && printf '[garage]\ntype = s3\n' > /config/rclone/rclone.conf && exec /app/entrypoint.sh
    environment:
      DATA_DIR: /bitwarden/data
      RCLONE_REMOTE_NAME: garage
      RCLONE_REMOTE_DIR: /docker-backups/vaultwarden/
      # 03:30 UTC: after the cluster's database backups and the 01:00
      # Proxmox backup.
      CRON: "30 3 * * *"
      TIMEZONE: UTC
      BACKUP_KEEP_DAYS: "30"
      ZIP_ENABLE: "TRUE"
      ZIP_TYPE: 7z
      ZIP_PASSWORD: ${VAULTWARDEN_BACKUP_ZIP_PASSWORD}
      DISPLAY_NAME: vaultwarden
      # Garage over S3: path-style addressing and its region name; the bucket
      # already exists, so rclone doesn't try to create it.
      RCLONE_CONFIG_GARAGE_PROVIDER: Other
      RCLONE_CONFIG_GARAGE_ENDPOINT: ${GARAGE_S3_ENDPOINT}
      RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID: ${VAULTWARDEN_BACKUP_S3_ACCESS_KEY_ID}
      RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY: ${VAULTWARDEN_BACKUP_S3_SECRET_ACCESS_KEY}
      RCLONE_CONFIG_GARAGE_REGION: garage
      RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_GARAGE_NO_CHECK_BUCKET: "true"

