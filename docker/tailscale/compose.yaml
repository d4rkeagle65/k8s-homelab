# Tailscale subnet router and exit node, on the Docker host, deployed by
# Dockhand from this folder (a Git stack). Host networking and kernel mode,
# so it routes with the host's own interfaces and /dev/net/tun. Its node key
# lives in /opt/tailscale, so the auth key is only used on the first start.
#
# Variables (set in the stack's environment in Dockhand):
#   TS_AUTHKEY      auth key from the admin console (Settings > Keys), secret
#   TS_HOSTNAME     the machine name it shows in the tailnet
#   TS_ROUTES       subnets to advertise, comma-separated
#   TS_EXTRA_ARGS   optional; defaults to advertising the exit node,
#                   forwarding without source NAT and without stateful
#                   filtering (replies to tailnet clients come back through
#                   the firewall, not the connection Tailscale saw), and
#                   accepting other subnet routers' routes (LAN devices
#                   reach those subnets through this node). Add
#                   --advertise-tags=tag:<name> here if the tailnet uses tags.
#
# No source NAT: LAN hosts see tailnet clients' own 100.x addresses, and the
# firewall routes 100.64.0.0/10 back to this host (avoiding triangular
# routing), so Traefik's private-networks allows that range. It also
# forwards UDP 41641 here for direct connections. The host needs IP
# forwarding on and its management-address routing rules after Tailscale's
# own; see README.md.
services:
  tailscale:
    image: tailscale/tailscale:v1.102.5
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
    - NET_ADMIN
    - NET_RAW
    devices:
    - /dev/net/tun:/dev/net/tun
    volumes:
    - /opt/tailscale:/var/lib/tailscale
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_HOSTNAME: ${TS_HOSTNAME}
      TS_ROUTES: ${TS_ROUTES}
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:---advertise-exit-node --snat-subnet-routes=false --stateful-filtering=false --accept-routes}
      # The port the firewall forwards here.
      TS_TAILSCALED_EXTRA_ARGS: --port=41641
      # The host keeps using Pi-hole; don't let MagicDNS take over its DNS.
      TS_ACCEPT_DNS: "false"
