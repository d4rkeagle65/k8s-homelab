# Tailscale subnet router and exit node, on the Docker host, deployed by
# Dockhand from this folder (a Git stack). Host networking and kernel mode,
# so it routes with the host's own interfaces and /dev/net/tun. Its node key
# lives in /opt/tailscale, so the auth key is only used on the first start.
#
# Variables, from Key Vault (references in .env); the TS_* names under
# environment: are Tailscale's own:
#   TAILSCALE_AUTH_KEY  an auth key (Settings > Keys), or an OAuth client's
#                       secret with ?ephemeral=false&preauthorized=true
#                       appended, which never expires (needs the tag below)
#   TAILSCALE_HOSTNAME  the machine name it shows in the tailnet: the name of the
#                       NetBox VM it runs on (the VM claims TAILSCALE-HOSTNAME),
#                       written to Key Vault by the facts sync
#   TAILSCALE_ROUTES    subnets to advertise, comma-separated: the prefixes NetBox
#                       tags tailscale-route-home, written to Key Vault by the facts
#                       sync (scripts/keyvault_views/tailscale_routes.py), the same
#                       tag tofu/tailscale's policy approves
#
# It registers with tag:subnet-router, the tag tofu/tailscale/policy.tf owns and
# approves routes for. A tagged node's key never expires.
#
# Its fixed flags: advertise the exit node; forward without source NAT and
# without stateful filtering (replies to tailnet clients come back through
# the firewall, not the connection Tailscale saw); accept other subnet
# routers' routes (LAN devices reach those subnets through this node).
#
# No source NAT: LAN hosts see tailnet clients' own 100.x addresses, so
# Traefik's private-networks allows that range. To keep the firewall seeing
# both directions of every connection (no triangular routing), the host
# sends everything this node forwards out through its DMZ interface, and the
# firewall routes 100.64.0.0/10 (and other tailnet routers' subnets) back to
# that interface. The host needs that routing, IP forwarding, and its
# management-address rules after Tailscale's own; see README.md.
services:
  tailscale:
    mem_limit: 512m
    image: tailscale/tailscale:v1.104.1
    container_name: tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
    - NET_ADMIN
    - NET_RAW
    devices:
    - /dev/net/tun:/dev/net/tun
    volumes:
    - /opt/tailscale:/var/lib/tailscale
    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTH_KEY}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME}
      TS_ROUTES: ${TAILSCALE_ROUTES}
      # Applied when the node registers. Later starts only reapply
      # TS_ROUTES and TS_HOSTNAME; see README.md to change the rest.
      TS_EXTRA_ARGS: --advertise-exit-node --snat-subnet-routes=false --stateful-filtering=false --accept-routes --advertise-tags=tag:subnet-router
      # A fixed port for the encrypted tunnel; direct connections work
      # through the firewall's NAT without a port forward.
      TS_TAILSCALED_EXTRA_ARGS: --port=41641
      # The host keeps using Pi-hole; don't let MagicDNS take over its DNS.
      TS_ACCEPT_DNS: "false"
