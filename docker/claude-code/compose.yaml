# Claude Code on the Docker host, with Remote Control on: a session that
# claude.ai/code and the Claude app can reach without the PC, and that
# doesn't go down with the cluster it works on. Deployed by Dockhand from
# this folder (a Git stack). Claude Code runs in a tmux session inside the
# container, a window per lane (README.md, Lanes): attach with
# `docker exec -it claude-code tmux attach -t claude`.
#
# Everything it keeps is in /opt/claude-code/home on the host (its home
# folder): its login, settings and conversations (~/.claude, ~/.claude.json),
# the repo clone, and the credentials it works with (~/.kube/config, the
# Proxmox and Kea API credentials, the GitHub CLI's token), none of them in
# git or in Dockhand; README.md says how each one gets there. Its Key Vault
# sign-in is the exception: Key Vault holds it, and Dockhand puts it in the
# environment (below).
#
# Host networking: it only makes outbound connections, and this way it
# reaches the cluster, the management network and the tailnet exactly as
# the host does. It has no access to Docker itself.
#
# Variables, from Key Vault (references in .env):
#   ENTRA_CLAUDE_CODE_CLIENT_ID, ENTRA_CLAUDE_CODE_CLIENT_SECRET
#              the k8s-homelab-claude-code service principal ("Key Vault
#              Secrets User": it reads every secret, and writes none)
#   ENTRA_TENANT_ID  its tenant
# Optional, blank in .env:
#   REPO_URL   the repo it clones on the first start; this repo by default
services:
  claude-code:
    mem_limit: 4g
    # Built here from the Dockerfile, which holds the versions; never pulled,
    # since no registry has it.
    build: .
    image: homelab/claude-code:local
    pull_policy: build
    container_name: claude-code
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/d4rkeagle65/k8s-homelab.git}
      # Each lane's Remote Control name is "<this> - <Lane>": the clone is Main.
      REMOTE_CONTROL_NAME: k8s-homelab - Docker
      # The lanes besides Main, space-separated: each a worktree at
      # .claude/worktrees/<name> with a Claude Code process of its own.
      CLAUDE_LANES: netbox
      # Key Vault's sign-in, under the names the Azure tools and
      # scripts/keyvault_copy.py read.
      AZURE_CLIENT_ID: ${ENTRA_CLAUDE_CODE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${ENTRA_CLAUDE_CODE_CLIENT_SECRET}
      AZURE_TENANT_ID: ${ENTRA_TENANT_ID}
    volumes:
    - /opt/claude-code/home:/home/claude
