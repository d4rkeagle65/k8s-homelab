# Claude Code on the Docker host, with Remote Control on: a session that
# claude.ai/code and the Claude app can reach without the PC, and that
# doesn't go down with the cluster it works on. Deployed by Dockhand from
# this folder (a Git stack). Claude Code runs in a tmux session inside the
# container: attach with `docker exec -it claude-code tmux attach -t claude`.
#
# Everything it keeps is in /opt/claude-code/home on the host (its home
# folder): its login, settings and conversations (~/.claude, ~/.claude.json),
# the repo clone, and the credentials it works with (~/.kube/config, the
# Proxmox and Kea API credentials, the GitHub CLI's token). None of them are
# in git or in Dockhand; README.md says how each one gets there.
#
# Host networking: it only makes outbound connections, and this way it
# reaches the cluster, the management network and the tailnet exactly as
# the host does. It has no access to Docker itself.
#
# Variables (set in the stack's environment in Dockhand), all optional:
#   REPO_URL   the repo it clones on the first start; this repo by default
services:
  claude-code:
    build: .
    image: homelab/claude-code:k8s-1.33.3-flux-2.9.5-helm-4.2.2
    container_name: claude-code
    network_mode: host
    init: true
    restart: unless-stopped
    environment:
      REPO_URL: ${REPO_URL:-https://github.com/d4rkeagle65/k8s-homelab.git}
      REMOTE_CONTROL_NAME: homelab
    volumes:
    - /opt/claude-code/home:/home/claude
