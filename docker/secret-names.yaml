# The Key Vault secret each Dockhand stack variable reads, under its standard name (the
# standard: scripts/README.md's "Add or change a substitution variable"; the decisions behind
# each name: old-queues/QUEUE-secret-names.md). A stack sets
# each name it reads to azurekv://<the name with - for _>; its compose file reads ${NAME}.
# scripts/dockhand_keyvault_copy.py copies Dockhand's export into Key Vault by this map.
#
#   VARIABLE: NAME               one secret, NAME, shared wherever the cluster or another
#                                stack holds the same thing
#   VARIABLE: {built: "..."}     not stored: the compose file builds it from the ${NAME}s
#                                in the template, which the stack reads
#   VARIABLE: {none: "..."}      not stored and not read, for the reason given
#
# The keys are the variables as Dockhand holds them today; each compose file moves to the
# standard names when its stack does.

cadvisor:
  CADVISOR_ADDRESS: DOCKER_VM_1_MGMT_ADDRESS

claude-code:
  ENTRA_CLAUDE_CODE_CLIENT_ID: ENTRA_CLAUDE_CODE_CLIENT_ID
