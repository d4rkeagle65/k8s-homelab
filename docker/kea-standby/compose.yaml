# Kea's hot-standby partner (QUEUE-kea-ha.md), on the second Docker VM, deployed
# by Dockhand through that VM's Hawser agent. It runs the same configuration as
# the primary (docker/kea/kea-dhcp4.conf), fetched from this repo's main
# branch at every deploy by kea-config into the kea-config volume: a Hawser
# stack can't bind-mount a file from git. Its site files (subnets, the
# reservations database, the API credentials, ha.json naming it the standby) are
# in /opt/kea/site on the VM, written by ansible/kea-ha.yml from the primary's.
# Redeploy it after a change to kea-dhcp4.conf, which redeploys only the
# primary's stack by itself.
#
# Variables (set in the stack's environment in Dockhand):
#   KEA_DHCP_ADDRESS   the VM's address the firewall relays DHCP to
#   KEA_API_ADDRESS    the VM's management address: Kea's API (8000), which
#                      the HA peers talk through
services:
  # Fetches the pair's Kea configuration from git, then exits.
  kea-config:
    image: busybox:1.38.0
    restart: "no"
    command:
    - sh
    - -c
    - |
      set -e
      wget -q -O /conf/kea-dhcp4.conf.new https://raw.githubusercontent.com/d4rkeagle65/k8s-homelab/main/docker/kea/kea-dhcp4.conf
      grep -q '"Dhcp4"' /conf/kea-dhcp4.conf.new
      mv /conf/kea-dhcp4.conf.new /conf/kea-dhcp4.conf
      echo "kea-dhcp4.conf fetched: $(wc -l < /conf/kea-dhcp4.conf) lines"
    volumes:
    - kea-config:/conf

  kea-dhcp4:
    mem_limit: 256m
    image: docker.cloudsmith.io/isc/docker/kea-dhcp4:3.2.1
    container_name: kea-dhcp4
    restart: unless-stopped
    depends_on:
      kea-config:
        condition: service_completed_successfully
    command: ["/usr/sbin/kea-dhcp4", "-c", "/etc/kea/conf/kea-dhcp4.conf"]
    ports:
    - ${KEA_DHCP_ADDRESS}:67:67/udp
    - ${KEA_API_ADDRESS}:8000:8000
    - 127.0.0.1:8000:8000
    volumes:
    - kea-config:/etc/kea/conf:ro
    - /opt/kea/site:/etc/kea/site:ro
    - /opt/kea/lib:/var/lib/kea

volumes:
  kea-config:
