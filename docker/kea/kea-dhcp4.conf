// Kea DHCPv4: the settings that are the same everywhere. The site's
// subnets, options and reservations come from /etc/kea/site/site.json
// (included at the end), which lives only on the host.
{
  "Dhcp4": {
    // All requests arrive relayed by the firewall, as unicast UDP, so Kea
    // needs no raw sockets. It picks each request's subnet from the relay
    // address (giaddr), which is the VLAN's gateway.
    "interfaces-config": {
      "interfaces": [ "eth0" ],
      "dhcp-socket-type": "udp",
      "service-sockets-max-retries": 5,
      "service-sockets-require-all": true
    },
    // NAK requests for addresses Kea doesn't know, so a client still holding
    // a lease from the old server asks again straight away.
    "authoritative": true,
    "control-sockets": [
      {
        "socket-type": "unix",
        "socket-name": "/var/run/kea/control_socket_4"
      },
      {
        // Kea's API: published only on the host's management address.
        // The credentials file holds one "user:password" line.
        "socket-type": "http",
        "socket-address": "0.0.0.0",
        "socket-port": 8000,
        "authentication": {
          "type": "basic",
          "realm": "kea",
          "directory": "/etc/kea/site",
          "clients": [ { "password-file": "api-credentials" } ]
        }
      }
    ],
    // Leases in a CSV file in /var/lib/kea (/opt/kea/lib on the host),
    // compacted hourly.
    "lease-database": {
      "type": "memfile",
      "persist": true,
      "lfc-interval": 3600
    },
    "hooks-libraries": [
      // lease4-get/-add/-del and friends, for imports and lookups.
      { "library": "libdhcp_lease_cmds.so" },
      // Live subnet changes through the API (and later Stork).
      { "library": "libdhcp_subnet_cmds.so" },
      // Per-subnet lease statistics.
      { "library": "libdhcp_stat_cmds.so" }
    ],
    "loggers": [
      {
        "name": "kea-dhcp4",
        "output-options": [ { "output": "stdout" } ],
        "severity": "INFO"
      }
    ],
    <?include "/etc/kea/site/site.json"?>
  }
}
