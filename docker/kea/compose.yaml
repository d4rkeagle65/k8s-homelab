# Kea DHCPv4 on the Docker host, with Stork (ISC's web UI for Kea) and a
# PostgreSQL database for host reservations and for Stork, deployed by
# Dockhand from this folder (a Git stack). It replaced the dnsmasq DHCP VM.
# Every client is on a VLAN the host isn't on, so the firewall relays all
# requests here (DHCP relay): plain unicast UDP, which works through a
# published port without host networking.
#
# kea-dhcp4.conf (here) holds what's the same everywhere. Subnets, pools,
# options, the reservations database's connection and the API credentials
# are in /opt/kea/site on the host: they're full of addresses and secrets,
# so they never go in this public repo. Reservations live in the database,
# where Stork and the API change them live. See README.md.
#
# Variables, from Key Vault (references in .env):
#   DOCKER_VM_1_PROD_ADDRESS  the host address the firewall relays to
#   DOCKER_VM_1_MGMT_ADDRESS  the host's management address: Kea's API (8000),
#                       Stork's web UI (8080), Kea's metrics (9547) and its HA
#                       state and lease counts (9548)
#   KEA_POSTGRES_PASSWORD  the database superuser's
#   KEA_DB_PASSWORD     the kea role's (also in site.json)
#   STORK_DB_PASSWORD   the stork role's
#   DATABASUS_KEA_DB_PASSWORD  the databasus role's (read-only, for backups)
#   BASE_DOMAIN         the domain: Stork's OIDC issuer (auth.<domain>, Authentik)
#                       and its redirect (stork.<domain>) are built from it
#   AUTHENTIK_STORK_OIDC_CLIENT_SECRET  the same one Authentik's blueprint reads
services:
  kea-postgres:
    mem_limit: 512m
    image: postgres:17.11-alpine
    container_name: kea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${KEA_POSTGRES_PASSWORD}
      # Read by initdb/00-databases.sh on the first start only.
      KEA_DB_PASSWORD: ${KEA_DB_PASSWORD}
      STORK_DB_PASSWORD: ${STORK_DB_PASSWORD}
    volumes:
    - /opt/kea/postgres:/var/lib/postgresql/data
    - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The read-only role Databasus backs these databases up as
  # (docker/databasus/): created when missing, password set from
  # DATABASUS_KEA_DB_PASSWORD, and pg_read_all_data (read every table, change
  # nothing), on every deploy, then exits.
  databasus-role-init:
    image: postgres:17.11-alpine
    restart: "no"
    # Exits once its job is done: no Dockhand notification for that.
    labels:
      dockhand.notify: "false"
    depends_on:
      kea-postgres:
        condition: service_healthy
    environment:
      PGHOST: kea-postgres
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${KEA_POSTGRES_PASSWORD}
      DATABASUS_DB_PASSWORD: ${DATABASUS_KEA_DB_PASSWORD}
    command:
    - /bin/sh
    - -c
    - |
      set -e
      [ -n "$$DATABASUS_DB_PASSWORD" ] || { echo "DATABASUS_DB_PASSWORD is empty"; exit 1; }
      psql -v ON_ERROR_STOP=1 -v pw="$$DATABASUS_DB_PASSWORD" <<'SQL'
      SELECT 'CREATE ROLE databasus LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'databasus')\gexec
      ALTER ROLE databasus PASSWORD :'pw';
      GRANT pg_read_all_data TO databasus;
      SQL
      psql -tA -c "SELECT 'databasus role: login ' || rolcanlogin || ', reads all data ' || pg_has_role('databasus', 'pg_read_all_data', 'MEMBER') FROM pg_roles WHERE rolname = 'databasus'"

  # Creates Kea's tables on an empty database, and upgrades them to match
  # this Kea version otherwise; runs on every deploy, then exits. The database
  # is the one Kea itself uses: hosts-databases in the site file (kea-db on
  # CloudNativePG since 2026-10-17), with its ssl-mode and, for verify-ca, its
  # trust-anchor (the CA's certificate in the site folder, ansible/kea-ha.yml).
  kea-db-init:
    # Built here from the Dockerfile, which holds the versions; never pulled,
    # since no registry has it.
    build: .
    image: homelab/kea-tools:local
    pull_policy: build
    restart: "no"
    # Exits once its job is done: no Dockhand notification for that.
    labels:
      dockhand.notify: "false"
    volumes:
    - /opt/kea/site:/etc/kea/site:ro
    command:
    - /bin/bash
    - -c
    - |
      set -e
      eval "$$(python3 -c '
      import json, shlex
      raw = open("/etc/kea/site/site.json").read()
      db = json.loads("{" + raw.strip().rstrip(",") + "}")["hosts-databases"][0]
      for k, v in (("HOST", db["host"]), ("PORT", db.get("port", 5432)), ("USER", db["user"]),
                   ("NAME", db["name"]), ("PASS", db["password"]), ("SSL", db.get("ssl-mode", "prefer")),
                   ("CA", db.get("trust-anchor", ""))):
          print("DB_%s=%s" % (k, shlex.quote(str(v))))
      ')"
      export PGSSLMODE="$$DB_SSL"
      if [ -n "$$DB_CA" ]; then export PGSSLROOTCERT="$$DB_CA"; fi
      args="pgsql -h $$DB_HOST -P $$DB_PORT -u $$DB_USER -p $$DB_PASS -n $$DB_NAME"
      if kea-admin db-version $$args >/dev/null 2>&1; then
        kea-admin db-upgrade $$args
      else
        kea-admin db-init $$args
      fi

  kea-dhcp4:
    mem_limit: 256m
    image: docker.cloudsmith.io/isc/docker/kea-dhcp4:3.2.1
    container_name: kea-dhcp4
    restart: unless-stopped
    depends_on:
      kea-postgres:
        condition: service_healthy
      kea-db-init:
        condition: service_completed_successfully
    ports:
    - ${DOCKER_VM_1_PROD_ADDRESS}:67:67/udp
    - ${DOCKER_VM_1_MGMT_ADDRESS}:8000:8000
    # Stork's agent (sharing this container's network) exports Kea's statistics
    # for Prometheus in the cluster.
    - ${DOCKER_VM_1_MGMT_ADDRESS}:9547:9547
    # The API on loopback too, for the host itself and its host-network
    # containers (claude-code). From there, connections to the management
    # address leave from it, and its routing rules (table 250) send them
    # out to the management network instead of to this container.
    - 127.0.0.1:8000:8000
    volumes:
    # Relative to this folder in Dockhand's clone, which sits at the same
    # path on the host.
    - ./kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
    - /opt/kea/site:/etc/kea/site:ro
    - /opt/kea/lib:/var/lib/kea

  # Shares Kea's network and process namespaces: it finds Kea through the
  # process list, reads the same config files at the same paths, runs Kea's
  # binary for its version, and reaches the API on localhost. Stork's server
  # reaches it as kea-dhcp4:8080. It registers itself on start; approve it
  # once in Stork (Services > Machines).
  stork-agent:
    mem_limit: 256m
    build: .
    image: homelab/kea-tools:local
    pull_policy: build
    restart: unless-stopped
    depends_on:
    - kea-dhcp4
    - stork-server
    network_mode: service:kea-dhcp4
    pid: service:kea-dhcp4
    command: ["stork-agent"]
    environment:
      STORK_AGENT_SERVER_URL: http://stork-server:8080
      STORK_AGENT_HOST: kea-dhcp4
      STORK_AGENT_PORT: "8080"
    volumes:
    - ./kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
    - /opt/kea/site:/etc/kea/site:ro
    - /opt/kea/lib:/var/lib/kea:ro
    - /opt/kea/stork-agent:/var/lib/stork-agent

  stork-server:
    mem_limit: 256m
    build: .
    image: homelab/kea-tools:local
    pull_policy: build
    container_name: stork-server
    restart: unless-stopped
    depends_on:
      kea-postgres:
        condition: service_healthy
    command: ["stork-server"]
    environment:
      STORK_DATABASE_HOST: kea-postgres
      STORK_DATABASE_NAME: stork
      STORK_DATABASE_USER_NAME: stork
      STORK_DATABASE_PASSWORD: ${STORK_DB_PASSWORD}
      STORK_REST_HOST: 0.0.0.0
      STORK_REST_PORT: "8080"
      # Login through Authentik (OIDC). Only members of authentik Admins may
      # log in, as Stork super-admins; Stork's own admin login stays as the
      # fallback for when Authentik (in the cluster) is down.
      STORK_OIDC_ISSUER_URL: https://auth.${BASE_DOMAIN}/application/o/stork/
      STORK_OIDC_REDIRECT_URI: https://stork.${BASE_DOMAIN}/oidc/callback
      STORK_OIDC_CLIENT_ID: stork
      STORK_OIDC_CLIENT_SECRET: ${AUTHENTIK_STORK_OIDC_CLIENT_SECRET}
      STORK_OIDC_PROVIDER_NAME: Authentik
      STORK_OIDC_GROUP_ALLOW: authentik Admins
      STORK_OIDC_MAP_GROUPS: "1"
      STORK_OIDC_GROUP_SUPER_ADMIN: authentik Admins
    ports:
    - ${DOCKER_VM_1_MGMT_ADDRESS}:8080:8080

  # Kea's HA state and lease counts, for Prometheus (/metrics) and Homepage
  # (/status): asks the API's status-get and statistic-get-all on each request,
  # with the API's credentials file, which stays on this host (ha_exporter.py
  # says what each figure means). Root
  # inside, as only root reads that file; no capabilities, read-only.
  kea-ha-exporter:
    mem_limit: 64m
    image: python:3.14.8-alpine
    container_name: kea-ha-exporter
    restart: unless-stopped
    depends_on:
    - kea-dhcp4
    command: ["python", "-I", "/app/ha_exporter.py"]
    environment:
      KEA_API_URL: http://kea-dhcp4:8000/
      KEA_API_CREDENTIALS: /run/secrets/kea-api-credentials
    ports:
    - ${DOCKER_VM_1_MGMT_ADDRESS}:9548:9548
    volumes:
    - ./ha_exporter.py:/app/ha_exporter.py:ro
    - /opt/kea/site/api-credentials:/run/secrets/kea-api-credentials:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
