# Kea DHCPv4 on the Docker host, with Stork (ISC's web UI for Kea) and a
# PostgreSQL database for host reservations and for Stork, deployed by
# Dockhand from this folder (a Git stack). It replaced the dnsmasq DHCP VM.
# Every client is on a VLAN the host isn't on, so the firewall relays all
# requests here (DHCP relay): plain unicast UDP, which works through a
# published port without host networking.
#
# kea-dhcp4.conf (here) holds what's the same everywhere. Subnets, pools,
# options, the reservations database's connection and the API credentials
# are in /opt/kea/site on the host: they're full of addresses and secrets,
# so they never go in this public repo. Reservations live in the database,
# where Stork and the API change them live. See README.md.
#
# Variables (set in the stack's environment in Dockhand):
#   KEA_DHCP_ADDRESS    the host address the firewall relays to
#   KEA_API_ADDRESS     the host's management address: Kea's API (8000),
#                       Stork's web UI (8080) and Kea's metrics (9547)
#   POSTGRES_PASSWORD   secret: the database superuser's
#   KEA_DB_PASSWORD     secret: the kea role's (also in site.json)
#   STORK_DB_PASSWORD   secret: the stork role's
#   DATABASUS_DB_PASSWORD  secret: the databasus role's (read-only, for backups)
#   STORK_OIDC_ISSUER_URL     Authentik's issuer for Stork:
#                             https://auth.<domain>/application/o/stork/
#   STORK_OIDC_REDIRECT_URI   https://stork.<domain>/oidc/callback
#   STORK_OIDC_CLIENT_SECRET  secret: the same one Authentik's blueprint
#                             reads (AUTHENTIK_STORK_OIDC_CLIENT_SECRET)
services:
  kea-postgres:
    image: postgres:17-alpine
    container_name: kea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by initdb/00-databases.sh on the first start only.
      KEA_DB_PASSWORD: ${KEA_DB_PASSWORD}
      STORK_DB_PASSWORD: ${STORK_DB_PASSWORD}
    volumes:
    - /opt/kea/postgres:/var/lib/postgresql/data
    - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  # The read-only role Databasus backs these databases up as
  # (docker/databasus/): created when missing, password set from
  # DATABASUS_DB_PASSWORD, and pg_read_all_data (read every table, change
  # nothing), on every deploy, then exits.
  databasus-role-init:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      kea-postgres:
        condition: service_healthy
    environment:
      PGHOST: kea-postgres
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DATABASUS_DB_PASSWORD: ${DATABASUS_DB_PASSWORD}
    command:
    - /bin/sh
    - -c
    - |
      set -e
      [ -n "$$DATABASUS_DB_PASSWORD" ] || { echo "DATABASUS_DB_PASSWORD is empty"; exit 1; }
      psql -v ON_ERROR_STOP=1 -v pw="$$DATABASUS_DB_PASSWORD" <<'SQL'
      SELECT 'CREATE ROLE databasus LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'databasus')\gexec
      ALTER ROLE databasus PASSWORD :'pw';
      GRANT pg_read_all_data TO databasus;
      SQL
      psql -tA -c "SELECT 'databasus role: login ' || rolcanlogin || ', reads all data ' || pg_has_role('databasus', 'pg_read_all_data', 'MEMBER') FROM pg_roles WHERE rolname = 'databasus'"

  # Creates Kea's tables on an empty database, and upgrades them to match
  # this Kea version otherwise; runs on every deploy, then exits.
  kea-db-init:
    build: .
    image: homelab/kea-tools:3.2.1-stork-2.5.1
    restart: "no"
    depends_on:
      kea-postgres:
        condition: service_healthy
    environment:
      KEA_DB_PASSWORD: ${KEA_DB_PASSWORD}
    command:
    - /bin/bash
    - -c
    - |
      set -e
      args="pgsql -h kea-postgres -u kea -p $$KEA_DB_PASSWORD -n kea"
      if kea-admin db-version $$args >/dev/null 2>&1; then
        kea-admin db-upgrade $$args
      else
        kea-admin db-init $$args
      fi

  kea-dhcp4:
    image: docker.cloudsmith.io/isc/docker/kea-dhcp4:3.2.1
    container_name: kea-dhcp4
    restart: unless-stopped
    depends_on:
      kea-postgres:
        condition: service_healthy
      kea-db-init:
        condition: service_completed_successfully
    ports:
    - ${KEA_DHCP_ADDRESS}:67:67/udp
    - ${KEA_API_ADDRESS}:8000:8000
    # Stork's agent (sharing this container's network) exports Kea's statistics
    # for Prometheus in the cluster.
    - ${KEA_API_ADDRESS}:9547:9547
    # The API on loopback too, for the host itself and its host-network
    # containers (claude-code). From there, connections to the management
    # address leave from it, and its routing rules (table 250) send them
    # out to the management network instead of to this container.
    - 127.0.0.1:8000:8000
    volumes:
    # Relative to this folder in Dockhand's clone, which sits at the same
    # path on the host.
    - ./kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
    - /opt/kea/site:/etc/kea/site:ro
    - /opt/kea/lib:/var/lib/kea

  # Shares Kea's network and process namespaces: it finds Kea through the
  # process list, reads the same config files at the same paths, runs Kea's
  # binary for its version, and reaches the API on localhost. Stork's server
  # reaches it as kea-dhcp4:8080. It registers itself on start; approve it
  # once in Stork (Services > Machines).
  stork-agent:
    build: .
    image: homelab/kea-tools:3.2.1-stork-2.5.1
    restart: unless-stopped
    depends_on:
    - kea-dhcp4
    - stork-server
    network_mode: service:kea-dhcp4
    pid: service:kea-dhcp4
    command: ["stork-agent"]
    environment:
      STORK_AGENT_SERVER_URL: http://stork-server:8080
      STORK_AGENT_HOST: kea-dhcp4
      STORK_AGENT_PORT: "8080"
    volumes:
    - ./kea-dhcp4.conf:/etc/kea/kea-dhcp4.conf:ro
    - /opt/kea/site:/etc/kea/site:ro
    - /opt/kea/lib:/var/lib/kea:ro
    - /opt/kea/stork-agent:/var/lib/stork-agent

  stork-server:
    build: .
    image: homelab/kea-tools:3.2.1-stork-2.5.1
    container_name: stork-server
    restart: unless-stopped
    depends_on:
      kea-postgres:
        condition: service_healthy
    command: ["stork-server"]
    environment:
      STORK_DATABASE_HOST: kea-postgres
      STORK_DATABASE_NAME: stork
      STORK_DATABASE_USER_NAME: stork
      STORK_DATABASE_PASSWORD: ${STORK_DB_PASSWORD}
      STORK_REST_HOST: 0.0.0.0
      STORK_REST_PORT: "8080"
      # Login through Authentik (OIDC). Only members of authentik Admins may
      # log in, as Stork super-admins; Stork's own admin login stays as the
      # fallback for when Authentik (in the cluster) is down.
      STORK_OIDC_ISSUER_URL: ${STORK_OIDC_ISSUER_URL}
      STORK_OIDC_REDIRECT_URI: ${STORK_OIDC_REDIRECT_URI}
      STORK_OIDC_CLIENT_ID: stork
      STORK_OIDC_CLIENT_SECRET: ${STORK_OIDC_CLIENT_SECRET}
      STORK_OIDC_PROVIDER_NAME: Authentik
      STORK_OIDC_GROUP_ALLOW: authentik Admins
      STORK_OIDC_MAP_GROUPS: "1"
      STORK_OIDC_GROUP_SUPER_ADMIN: authentik Admins
    ports:
    - ${KEA_API_ADDRESS}:8080:8080
