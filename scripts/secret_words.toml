# Where scripts/secret_words.py finds the secret-words list in Key Vault. Names only: the
# words themselves are in Key Vault, never here.

# The Key Vault secret holding the words no variable below holds, one a line.
key_vault_list = "SECRET-WORDS"

# cluster-secrets variables whose current value is a secret word, named as
# kubernetes/secrets/cluster-secrets.yaml names them. The list follows a value that changes.
# A value that is also an ordinary word (an app's own "admin" login) stays off: every file
# using the word would be blocked, and tests/test-identifying-data.py goes red on it.
variables = [
    "BASE_DOMAIN",
    "CLUSTER_DOMAIN",
    "Child1",
    "CLOUDFLARE_TUNNEL_SECRET_TUNNEL_NAME",
    "DOCKHAND_ADDRESS",
    "INGRESS_IP",
    "ISOLATED_INGRESS_IP",
    "METALLB_POOL_RANGE",
    "NAS_HOSTNAME",
    "NFS_SERVER",
    "NOIP_DUC_CREDENTIALS_NOIP_USERNAME",
    "OWNER_EMAIL",
    "PIHOLE_ADDRESS",
]
