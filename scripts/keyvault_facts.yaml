# What each Key Vault secret takes from the NetBox object that claims it in its custom field
# keyvault_secrets, for scripts/keyvault_facts.py (QUEUE-site-facts.md, stage 3):
#   {take: address}    an IP address's host part
#   {take: cidr}       an IP address, or a prefix, with its mask
#   {take: dns_name}   an IP address's DNS name
#   {take: range}      an IP range, "start-end", host parts
#   {take: name}       a device's or VM's name
#   {collect: FORM}    every claiming object's FORM, sorted, joined with "," (or join: "x")
#   {template: "text"} the text with each {NAME} replaced: a name mapped here gives its
#                      value, any other Key Vault's
#   {view: NAME}       scripts/keyvault_views/NAME.py, for a value with structure (JSON)
# A name is added once --find's evidence shows its object and form, and the object is tagged.
facts:
  ALLOY-SYSLOG-ADDRESS: {take: address}
  DOCKER-VM-1-MGMT-ADDRESS: {take: address}
  DOCKER-VM-1-PROD-ADDRESS: {take: address}
  DOCKER-VM-2-MGMT-ADDRESS: {take: address}
  DOCKER-VM-2-PROD-ADDRESS: {take: address}
  DOCKHAND-ADDRESS: {take: dns_name}
  INGRESS-IP: {take: address}
  ISOLATED-INGRESS-IP: {take: address}
  KEA-DB-ADDRESS: {take: address}
  METALLB-POOL-RANGE: {take: range}
  NAS-MGMT-HOSTNAME: {take: address}
  OPENWRT-AP1-ADDRESS: {take: address}
  OPENWRT-AP2-ADDRESS: {take: address}
  OPENWRT-AP3-ADDRESS: {take: address}
  PICTURE-FRAME-ADDRESS: {take: address}
  PIHOLE-ADDRESS: {take: address}
  PIHOLE1-MGMT-ADDRESS: {take: address}
  PIHOLE2-MGMT-ADDRESS: {take: address}
  SWITCH-02-ADDRESS: {take: address}
  SWITCH-04-ADDRESS: {take: address}
  SWITCH-CORE-ADDRESS: {take: address}
  TERRAMASTER-MGMT-ADDRESS: {take: address}
  TRAEFIK-MGMT-ADDRESS: {take: address}
