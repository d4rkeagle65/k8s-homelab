# Semaphore's variable groups, made from Key Vault by scripts/semaphore_variable_groups.py,
# Semaphore's "Sync: Key Vault → Semaphore (script)" (QUEUE-semaphore-variables.md).
#
# Each group lists its extra variables (`variables:`, Ansible's) and its environment variables
# (`environment:`), each from one source:
#   {keyvault: NAME}        Key Vault's secret NAME; a secret in Semaphore unless secret: false
#   {template: "text"}      the text with each {NAME} replaced by Key Vault's secret NAME
#                           (https://n8n.{BASE-DOMAIN}), so no domain or address is written here
#   {value: x}              x as it is: only what names nothing of the site (a flag, a count)
# and `secret: true` or `false` to override where Semaphore keeps it; `json: true` on an extra
# variable from Key Vault reads the secret as JSON (a list, an object, a flag); `candidates:`
# beside keyvault lists templates the report tests against its value, so a URL can move to
# the one that matches. A Python template gets a
# group's extra variables as arguments, which its scripts refuse: give those `environment:` only.
#
# A group is written only with `managed: true`, and then exactly as declared: what it holds
# that isn't declared here is removed. One without it is compared and reported, never
# changed. A group not listed here is left alone. "Key Vault Sync", the sync's own, is never
# listed: it holds the credentials the sync reads Key Vault and writes Semaphore with.
project: Homelab

# Key Vault secrets the sync's report compares with the config's, by name only: which hold the
# same value, or contain another's. Each is an existing one a group's value may be the same as.
compare: [BASE-DOMAIN, TIMEZONE, PVE-API-HOST, PVE-EXPORTER-TOKEN-VALUE, TFSTATE-DB-PASSWORD,
          NETBOX-READ-TOKEN, NETBOX-HOMEPAGE-TOKEN, NETBOX-SEMAPHORE-TOKEN, NETBOX-DNS-TOKEN,
          NETBOX-DNS-SYNC-TOKEN, RENOVATE-GITHUB-TOKEN, HOMEASSISTANT-TOKEN,
          CERT-MANAGER-CLOUDFLARE-API-TOKEN-API-TOKEN, CLOUDFLARE-HOMEPAGE-API-TOKEN,
          TAILSCALE-API-KEY, TAILSCALE-EXPORTER-OAUTH-CLIENT-ID, TAILSCALE-EXPORTER-OAUTH-CLIENT-SECRET]

groups:
  # scripts/alerting_test.py ("Tool: Alerting test (script)"; n8n/README.md).
  Alerting Test:
    managed: true
    environment:
      N8N_URL: {template: "https://n8n.{BASE-DOMAIN}"}
      ZAMMAD_URL: {template: "https://zammad.{BASE-DOMAIN}"}
      LOKI_PUSH_URL: {template: "https://loki-push.{BASE-DOMAIN}/loki/api/v1/push"}
      ZAMMAD_API_TOKEN: {keyvault: ZAMMAD-BRIDGE-API-TOKEN}
      SEMAPHORE_ALERT_TOKEN: {keyvault: SEMAPHORE-ALERT-TOKEN}
      DATABASUS_ALERT_TOKEN: {keyvault: DATABASUS-ALERT-TOKEN}
      DOCKHAND_ALERT_TOKEN: {keyvault: DOCKHAND-ALERT-TOKEN}
      LOKI_PUSH_PASSWORD: {keyvault: LOKI-PUSH-PASSWORD}

  # ansible/README.md, "The Synology": the Hawser token Dockhand's environment for the Synology holds.
  Synology Baseline:
    managed: false
    environment:
      HAWSER_TOKEN: {keyvault: HAWSER-TOKEN-SYNOLOGY}

  # ansible/README.md, "The TerraMaster": the Hawser token Dockhand's environment for it holds.
  Terramaster Baseline:
    managed: false
    environment:
      HAWSER_TOKEN: {keyvault: HAWSER-TOKEN-TERRAMASTER}

  # ansible/windows-update.yml: the account it signs in to the Windows hosts with.
  Windows Updates:
    managed: false
    environment:
      WINDOWS_ANSIBLE_USER: {keyvault: WINDOWS-ANSIBLE-USER, secret: false}
      WINDOWS_ANSIBLE_PASSWORD: {keyvault: WINDOWS-ANSIBLE-PASSWORD}

  # ansible/README.md, step 4: Semaphore's access to the cluster (cluster-access/semaphore,
  # which reads no Secrets) and an os:admin talosconfig, for the templates that check the
  # cluster or drain nodes.
  k8s and Talos Connection:
    managed: false
    environment:
      K8S_API_URL: {keyvault: SEMAPHORE-K8S-API-URL}
      K8S_CA_B64: {keyvault: SEMAPHORE-K8S-CA-B64}
      K8S_TOKEN: {keyvault: SEMAPHORE-K8S-TOKEN}
      TALOSCONFIG_B64: {keyvault: SEMAPHORE-TALOSCONFIG-B64}

  # ansible/README.md, "Debian Host Baseline". Its extra variables are JSON in Key Vault
  # (json: true), since some are lists; plain where they're plain today, so the sync can
  # compare them.
  Debian Host Baseline:
    managed: false
    variables:
      admin_ssh_keys: {keyvault: DEBIAN-ADMIN-SSH-KEYS, json: true, secret: false}
      admin_sudo_nopasswd: {value: true}
      admin_user: {keyvault: DEBIAN-ADMIN-USER, json: true, secret: false}
      host_alloy: {value: "true"}
      host_exporters: {value: "true"}
      loki_push_url: {template: "https://loki-push.{BASE-DOMAIN}/loki/api/v1/push"}
      management_network: {keyvault: DEBIAN-MANAGEMENT-NETWORK, json: true, secret: false}
    environment:
      loki_push_password: {keyvault: LOKI-PUSH-PASSWORD}

  # scripts/ha_iot_setup.py ("Sync: NetBox IoT → Home Assistant (script)"). Rooms come from
  # NetBox Locations since #352: the group's empty HA_IOT_AREAS is left out, so managing the
  # group removes it.
  Home Assistant IoT:
    managed: false
    environment:
      HA_TOKEN: {keyvault: HA-IOT-HA-TOKEN}
      HA_URL: {template: "https://homeassistant.{BASE-DOMAIN}"}
      NETBOX_API: {template: "https://netbox.{BASE-DOMAIN}"}
      NETBOX_TOKEN: {keyvault: HA-IOT-NETBOX-TOKEN}
      TPLINK_PASSWORD: {keyvault: HA-IOT-TPLINK-PASSWORD}
      TPLINK_USERNAME: {keyvault: HA-IOT-TPLINK-USERNAME}

  # scripts/netbox_seed.py and scripts/netbox_guests.py.
  Netbox Sync:
    managed: false
    environment:
      KEA_URL: {value: "http://kea-dhcp4:8000/"}
      PROXMOX_URL: {keyvault: NETBOX-SYNC-PROXMOX-URL, secret: false, candidates: ["https://{PVE-API-HOST}:8006", "https://{PVE-API-HOST}:8006/", "https://{PVE-API-HOST}:8006/api2/json", "https://{PVE-API-HOST}", "https://{PVE-API-HOST}/"]}
      GITHUB_TOKEN: {keyvault: NETBOX-SYNC-GITHUB-TOKEN}
      KEA_API: {keyvault: NETBOX-SYNC-KEA-API}
      NETBOX_WRITE_TOKEN: {keyvault: NETBOX-SYNC-NETBOX-WRITE-TOKEN}
      PROXMOX_TOKEN: {keyvault: NETBOX-SYNC-PROXMOX-TOKEN}

  # tofu/cloudflare/.
  "OpenTofu: Cloudflare":
    managed: false
    environment:
      CLOUDFLARE_API_TOKEN: {keyvault: TOFU-CLOUDFLARE-API-TOKEN}
      PG_CONN_STR: {template: "postgres://tfstate:{TFSTATE-DB-PASSWORD}@semaphore-postgres:5432/tfstate?sslmode=disable", secret: true}
      TF_VAR_dns: {keyvault: TOFU-CLOUDFLARE-TF-VAR-DNS}

  # tofu/proxmox/ (tofu/README.md). PG_CONN_STR is both plain and secret here today; the group
  # keeps the secret only. The three modules' PG_CONN_STR are one value, tofu/README.md's form
  # on TFSTATE-DB-PASSWORD (task 1471); NetBox's token is the shared read-only one, which this
  # module takes with or without "Bearer ".
  "OpenTofu: Proxmox and Talos":
    managed: false
    environment:
      PROXMOX_VE_ENDPOINT: {template: "https://{PVE-API-HOST}:8006/"}
      TF_VAR_netbox_url: {template: "https://netbox.{BASE-DOMAIN}"}
      PG_CONN_STR: {template: "postgres://tfstate:{TFSTATE-DB-PASSWORD}@semaphore-postgres:5432/tfstate?sslmode=disable", secret: true}
      PROXMOX_VE_API_TOKEN: {keyvault: TOFU-PROXMOX-VE-API-TOKEN}
      TF_VAR_netbox_token: {keyvault: NETBOX-READ-TOKEN}
      TF_VAR_site: {keyvault: TOFU-PROXMOX-TF-VAR-SITE}
      TF_VAR_talos_secrets: {keyvault: TOFU-PROXMOX-TF-VAR-TALOS-SECRETS}

  # tofu/tailscale/ (tofu/README.md: its own OAuth client, Key Vault's TAILSCALE-OPENTOFU-*).
  "OpenTofu: Tailscale":
    managed: false
    environment:
      PG_CONN_STR: {template: "postgres://tfstate:{TFSTATE-DB-PASSWORD}@semaphore-postgres:5432/tfstate?sslmode=disable", secret: true}
      TF_VAR_netbox_url: {template: "https://netbox.{BASE-DOMAIN}"}
      TAILSCALE_OAUTH_CLIENT_ID: {keyvault: TAILSCALE-OPENTOFU-OAUTH-CLIENT-ID}
      TAILSCALE_OAUTH_CLIENT_SECRET: {keyvault: TAILSCALE-OPENTOFU-OAUTH-CLIENT-SECRET}
      TF_VAR_netbox_token: {keyvault: NETBOX-READ-TOKEN}

  # ansible/pihole-setting.yml.
  Pi-Hole Settings:
    managed: false
    variables:
      pihole_settings: {keyvault: PIHOLE-SETTINGS, json: true, secret: false}

  # ansible/proxmox-setting.yml.
  Proxmox Settings:
    managed: false
    variables:
      acme_cf_zone_id: {keyvault: PROXMOX-SETTINGS-ACME-CF-ZONE-ID, json: true, secret: false}
      acme_domain: {template: "{BASE-DOMAIN}"}
      acme_email: {keyvault: PROXMOX-SETTINGS-ACME-EMAIL, json: true, secret: false}
      lxc_timezone: {template: "{TIMEZONE}"}
      nas_block_initialise: {value: "true"}
      nas_block_portal: {keyvault: PROXMOX-SETTINGS-NAS-BLOCK-PORTAL, json: true, secret: false}
      nas_block_target: {keyvault: PROXMOX-SETTINGS-NAS-BLOCK-TARGET, json: true, secret: false}
      ntp_serve_networks: {keyvault: PROXMOX-SETTINGS-NTP-SERVE-NETWORKS, json: true, secret: false}
      acme_cf_token: {keyvault: PROXMOX-SETTINGS-ACME-CF-TOKEN, json: true}
