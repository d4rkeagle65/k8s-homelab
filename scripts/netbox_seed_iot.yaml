# What scripts/netbox_seed.py needs to model the IoT network's devices in NetBox
# (each Kea reservation on that network becomes a device): the kinds of device,
# and which kind a reservation is, read from its hostname. Nothing here names a
# device or holds an address.
#
# A reservation's hostname is <site code>iot<brand><device><room>, e.g. a Kasa
# light switch is "<site>iot" + "kali" + its room; a two-letter area code may
# follow the site code ("<site><area>iot"). `name` below matches what
# follows "iot"; the first rule that matches decides. A reservation no rule
# matches is reported and gets no device.
#
# The model a rule gives is where a device starts: NetBox owns it after that, so
# a device whose exact model is set by hand in NetBox (an HS210 where the rule
# says HS200, an Echo's generation) keeps it. A model known before the device is
# made can come from NETBOX_SEED_IOT_MODELS instead (the script's docstring).

# The network whose reservations become devices, by its name in netbox_seed.yaml.
network: IoT

manufacturers:
- {name: AiMOR, slug: aimor}
- {name: Amazon, slug: amazon}
- {name: eufy, slug: eufy}
- {name: Furbo, slug: furbo}
- {name: Generic, slug: generic}
- {name: Govee, slug: govee}
