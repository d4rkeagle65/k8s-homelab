- {name: '^mtwash', type: maytag-mvw6230hw, role: Washing Machine}
- {name: '^mtdry', type: maytag-smart-dryer, role: Dryer}
- {name: '^ut', type: ultraloq-bridge, role: Smart Lock}
- {name: '^fucam', type: furbo-dog-camera, role: Camera}
- {name: '^harest', type: hatch-sleep-rest-2nd-gen, role: Noise Machine}
- {name: '^hanoise', type: hatch-sleep-rest-baby, role: Noise Machine}
- {name: '^vehumid', type: levoit-classic300s, role: Humidifier}
- {name: '^goli', type: govee-h60561d1, role: Smart Light}
- {name: '^goair', type: govee-h5106, role: Air Quality Sensor}
- {name: '^gopur24', type: govee-h7124, role: Air Purifier}
- {name: '^gopur', type: govee-h7126, role: Air Purifier}
- {name: '^smtv', type: samsung-un32j5500afxza, role: TV}
- {name: '^wzpan', type: wyze-pan-cam-v3, role: Camera}
- {name: '^wzcam', type: wyze-cam-v3, role: Camera}
- {name: '^eucam', type: eufy-t8417, role: Camera}
