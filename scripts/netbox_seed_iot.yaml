- {slug: amazon-echo-spot, manufacturer: amazon, model: Echo Spot, description: Smart display with clock,
   interfaces: [{name: wifi0, type: ieee802.11ac}, {name: bt0, type: ieee802.15.1}], power_ports: [{name: pIn1, type: dc-terminal}]}
- {slug: amazon-echo-dot, manufacturer: amazon, model: Echo Dot,
   interfaces: [{name: bt0, type: ieee802.15.1}, {name: wifi0, type: ieee802.11ac}],
   power_ports: [{name: pIn1, type: dc-terminal}]}
