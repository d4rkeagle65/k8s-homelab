# Which Home Assistant integration adds each kind of IoT device by its address
# (scripts/ha_iot_setup.py). The devices are NetBox's from the IoT network
# (netbox_seed_iot.yaml); the first entry whose `type` (a NetBox device type slug) or
# `manufacturer` (a NetBox manufacturer slug) matches decides. A device no entry
# matches is left to the integrations set up by hand in Home Assistant (the cloud ones).
#
# `handler` is the integration's domain. `fields` answer the flow's first step beside
# the host. `login` names the environment variables holding the username and password
# a later step asks for; unset, the flow is closed and the device is reported as
# waiting for the login, which the owner enters in Home Assistant's UI. `attended: true`
# marks a flow that needs someone at the device (a prompt or PIN on a TV): a run
# skips it unless given --attended.

integrations:
- {manufacturer: kasa, handler: tplink,
   login: {username: TPLINK_USERNAME, password: TPLINK_PASSWORD}}
- {manufacturer: tp-link, handler: tplink,
   login: {username: TPLINK_USERNAME, password: TPLINK_PASSWORD}}
- {type: amazon-fire-stick-4k, handler: androidtv, attended: true, fields: {device_class: firetv, port: 5555}}
- {type: amazon-fire-tv-4k-43, handler: androidtv, attended: true, fields: {device_class: firetv, port: 5555}}
- {type: samsung-un32j5500afxza, handler: samsungtv, attended: true}

# A device Home Assistant knows by a MAC NetBox doesn't hold, worked out from one it does:
# the device `type`'s MAC on `interface` with `add` added to its last octet (mod 256, no
# carry). An ESP32 reports its base MAC, and ESP-IDF makes its Ethernet MAC by adding 3
# to the base's last octet.
derived_macs:
- {type: wireless-tag-wt32-eth01, interface: eth0, add: -3}
