# What scripts/netbox_seed.py puts in NetBox that the live sources can't tell
# it: names. Nothing here is an address; each network's subnet is read from
# Kea and from the Proxmox hosts' and guests' addresses on its bridge.
site: Condo

# The Proxmox cluster's type in NetBox; the cluster's own name comes from Proxmox.
cluster_type: Proxmox

# Each network by the Proxmox bridge that carries it (the same on every host),
# with its VLAN when it's tagged. A bridge not listed here is left out.
networks:
- {bridge: vmbr0, name: Management}
- {bridge: vmbr2, name: Work laptop, vlan: 3}
- {bridge: vmbr6, name: IoT, vlan: 6}
- {bridge: vmbr7, name: Production, vlan: 7}
- {bridge: vmbr8, name: DMZ, vlan: 8}
- {bridge: vmbr1, name: 2.5G}

# Proxmox guests to leave out, by VMID (none now).
skip_vmids: []

# The Proxmox nodes, as devices.
hypervisor: {role: Hypervisor, type: Proxmox host}

# The VM roles whose shape NetBox owns (QUEUE-netbox-shape.md), by OpenTofu's name
# for each: the sync never writes their vCPUs, memory, disks or shape fields.
vm_roles:
  controlplane: Talos control plane
  worker: Talos worker
  container: Plain container
