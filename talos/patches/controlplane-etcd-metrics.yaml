# etcd's metrics on a port of their own (2381, plain HTTP, metrics and health
# only), which monitors/app/scrapeconfig-etcd.yaml scrapes; by default etcd
# serves them only on its client port, behind client certificates.
# etcd takes it only when it next starts, and Talos won't restart etcd through
# its API: a node patched in no-reboot mode needs a reboot (talos-reboot.yml).
cluster:
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
