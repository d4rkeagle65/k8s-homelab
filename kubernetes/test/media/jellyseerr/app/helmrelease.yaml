apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr-test
  namespace: media-test
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: fallenbagel/jellyseerr
              tag: latest
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: LOG_LEVEL
                value: info
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 5055
    ingress:
      main:
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
        hosts:
          - host: jellyseerr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: jellyseerr-test-tls
            hosts:
              - jellyseerr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    persistence:
      config:
        existingClaim: jellyseerr-test-config
        globalMounts:
          - path: /app/config
