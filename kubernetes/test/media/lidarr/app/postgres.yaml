apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lidarr-postgres
  namespace: media-test
spec:
  instances: 2
  storage:
    size: 5Gi
    storageClass: nfs-retain-rwo
  bootstrap:
    initdb:
      database: lidarr-main
      owner: lidarr
      postInitApplicationSQL:
        - CREATE DATABASE "lidarr-log" OWNER lidarr;
