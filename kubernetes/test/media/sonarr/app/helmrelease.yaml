apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr-test
  namespace: media-test
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: linuxserver/sonarr
              tag: latest
            env:
              - name: PUID
                value: "1000"
              - name: PGID
                value: "1000"
              - name: TZ
                value: ${TIMEZONE}
              - name: SONARR__APP__POSTGRESHOST
                value: sonarr-postgres-rw
              - name: SONARR__APP__POSTGRESPORT
                value: "5432"
              - name: SONARR__APP__POSTGRESUSER
                value: sonarr
              - name: SONARR__APP__POSTGRESPASSWORD
                valueFrom:
                  secretKeyRef:
                    name: sonarr-postgres-app
                    key: password
              - name: SONARR__APP__POSTGRESMAINDB
                value: sonarr-main
              - name: SONARR__APP__POSTGRESLOGDB
                value: sonarr-log
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8989
    ingress:
      main:
        className: nginx
        hosts:
          - host: sonarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
    persistence:
      config:
        existingClaim: sonarr-test-config
        globalMounts:
          - path: /config
      synmedia:
        existingClaim: synmedia-nfs
        globalMounts:
          - path: /synmedia
