apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: sonarr-postgres
  namespace: media-test
spec:
  instances: 2
  storage:
    size: 5Gi
    storageClass: nfs-retain-rwo
  bootstrap:
    initdb:
      database: sonarr-main
      owner: sonarr
      postInitApplicationSQL:
        - CREATE DATABASE "sonarr-log" OWNER sonarr;
