apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-test-server
  namespace: media-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-test-configs
  namespace: media-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-test-logs
  namespace: media-test
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 1Gi
