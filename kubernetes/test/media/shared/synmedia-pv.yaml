# Static NFS PersistentVolume for the Synology media share (/volume1/media).
# Path is hardcoded (not a substitution variable) since it is a fixed NFS
# export path on the Synology, not a value that varies between environments.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: synmedia-nfs-test
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: ${NFS_SERVER}
    path: /volume1/media
  mountOptions:
    - nfsvers=4.1
    - hard
    - timeo=600
    - retrans=2
