apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd-test
  namespace: media-test
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: linuxserver/sabnzbd
              tag: latest
            env:
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: SABNZBD__MISC__HOST_WHITELIST_ENTRIES
                value: "sabnzbd${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}"
              - name: TZ
                value: ${TIMEZONE}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    ingress:
      main:
        className: nginx
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
        hosts:
          - host: sabnzbd${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - sabnzbd${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            secretName: sabnzbd-test-tls
    persistence:
      config:
        existingClaim: sabnzbd-test-config
        globalMounts:
          - path: /config
      synmedia:
        existingClaim: synmedia-nfs
        globalMounts:
          - path: /synmedia
