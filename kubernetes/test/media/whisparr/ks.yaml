apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: whisparr-test
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/test/media/whisparr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: media-test
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-substitutions
      optional: true
    - kind: ConfigMap
      name: cluster-substitutions-test
      optional: true
    - kind: Secret
      name: cluster-substitutions-secret
      optional: true
