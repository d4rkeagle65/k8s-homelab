# Test overlay. Only lists releases currently under test; everything else
# comes from ../prod. Never add cluster-wide infra (cert-manager, metallb,
# ingress-nginx, cnpg, nfs-client, cloudflare-tunnel) here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- media/namespace.yaml   # media-test
- media/shared           # PV synmedia-nfs-test + PVC synmedia-nfs in media-test
- ../prod/apps/media/sonarr/ks.yaml
- ../prod/apps/media/radarr/ks.yaml
- ../prod/apps/media/prowlarr/ks.yaml
- ../prod/apps/media/sabnzbd/ks.yaml
- ../prod/apps/media/qbittorrent/ks.yaml
- ../prod/apps/media/lidarr/ks.yaml
- ../prod/apps/media/jellyseerr/ks.yaml
- ../prod/apps/media/whisparr/ks.yaml
- ../prod/apps/media/tdarr/ks.yaml
patches:
# Every media Kustomization: deploy into media-test and layer test values on top.
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
  patch: |-
    - op: replace
      path: /spec/targetNamespace
      value: media-test
    - op: add
      path: /spec/postBuild/substituteFrom/-
      value:
        kind: ConfigMap
        name: cluster-substitutions-test
        optional: true
    # Labelled test, not prod: the Kustomization's own objects, and (through a
    # patch on the HelmRelease it builds) everything the chart renders.
    - op: replace
      path: /spec/commonMetadata/labels/homelab.local~1env
      value: test
    - op: add
      path: /spec/patches
      value:
      - target:
          kind: HelmRelease
        patch: |-
          - op: replace
            path: /spec/commonMetadata/labels/homelab.local~1env
            value: test
# Unique names in flux-system so test never collides with production.
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: sonarr
  patch: |-
    - op: replace
      path: /metadata/name
      value: sonarr-test
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: radarr
  patch: |-
    - op: replace
      path: /metadata/name
      value: radarr-test
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: prowlarr
  patch: |-
    - op: replace
      path: /metadata/name
      value: prowlarr-test
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: sabnzbd
  patch: |-
    - op: replace
      path: /metadata/name
      value: sabnzbd-test
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: qbittorrent
  patch: |-
    - op: replace
      path: /metadata/name
      value: qbittorrent-test
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: lidarr
  patch: |-
    - op: replace
      path: /metadata/name
      value: lidarr-test
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: jellyseerr
  patch: |-
    - op: replace
      path: /metadata/name
      value: jellyseerr-test
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: whisparr
  patch: |-
    - op: replace
      path: /metadata/name
      value: whisparr-test
- target:
    group: kustomize.toolkit.fluxcd.io
    kind: Kustomization
    name: tdarr
  patch: |-
    - op: replace
      path: /metadata/name
      value: tdarr-test
