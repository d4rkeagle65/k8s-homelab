# Hand-authored (not generator-owned). Applies kubernetes/shared/.
# No dependsOn: the media PVC needs the media namespace (created by `cluster`);
# until it exists this reconcile fails and retries every retryInterval.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-shared
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  path: ./kubernetes/shared
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
