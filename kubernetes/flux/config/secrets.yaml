# Hand-authored (not generator-owned). Applies kubernetes/secrets/: the
# ExternalSecret that builds `cluster-secrets` from Vaultwarden. No
# substitution here: it produces the variables, it doesn't use them.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-secrets
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  path: ./kubernetes/secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # The ClusterSecretStores it reads through.
  dependsOn:
  - name: bitwarden-cli
