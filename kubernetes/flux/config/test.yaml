apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-test
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/test
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: false
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-substitutions
      optional: true
    - kind: ConfigMap
      name: cluster-substitutions-test
      optional: true
    - kind: Secret
      name: cluster-substitutions-secret
      optional: true
