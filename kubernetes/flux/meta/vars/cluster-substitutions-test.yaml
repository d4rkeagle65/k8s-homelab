# Applied manually once, then tracked by git.
# Overrides used by the cluster-test Kustomization only.
# The base value, SUBDOMAIN_SUFFIX: "", is in cluster-settings.yaml, so
# production never errors on an undefined variable. This one is listed after
# it in the test Kustomizations, so it wins there.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-substitutions-test
  namespace: flux-system
data:
  SUBDOMAIN_SUFFIX: "-test"
