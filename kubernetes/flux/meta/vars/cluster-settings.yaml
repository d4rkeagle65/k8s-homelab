# Plain settings every Flux Kustomization substitutes as variables. Only values
# that are fine to be public belong here; anything private is a Key Vault
# secret instead, which `cluster-secrets` maps (kubernetes/secrets/).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  MEDIA_PUID: "1028"
  MEDIA_PGID: "100"
  # Logins that are each app's own default, not the site's: public, so here rather than in
  # Key Vault.
  GRAFANA_ADMIN_USER: "admin"
  QBITTORRENT_USERNAME: "admin"
  # Empty in production; the test overlay sets "-test".
  SUBDOMAIN_SUFFIX: ""
