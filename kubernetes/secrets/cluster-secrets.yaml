# The private values every Flux Kustomization substitutes as variables, built by External
# Secrets from Azure Key Vault (the azure-keyvault store): one Key Vault secret per variable,
# named after it with "_" replaced by "-". Public settings are in
# kubernetes/flux/meta/vars/cluster-settings.yaml instead.
#
# To add a variable: add its secret to Key Vault, then an entry here.
#
# prune: disabled: deleting this ExternalSecret would delete the Secret it
# owns, and every Kustomization would lose its variables.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  # Held while the base64-held values become plain (QUEUE-secret-names.md, "The switch"):
  # External Secrets refreshes only when this ExternalSecret's spec, labels or annotations
  # change, or its Secret's data is edited, never on refreshInterval. A value changed in Key
  # Vault meanwhile arrives through keyvault-secrets.ps1's force-sync. The switch's last
  # batch restores Periodic.
  refreshPolicy: OnChange
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: cluster-secrets
    creationPolicy: Owner
    # Keep the last good values if a secret goes missing from Key Vault.
    deletionPolicy: Retain
    # Every variable below as it is, plus variables built from them: the whole
    # header Dockhand's stack webhooks check, which a Secret in git can only
    # hold as one variable (external-services/dockhand-webhooks/). A key named
    # after its own variable replaces it: {{ .NAME | b64enc }} for a variable a
    # Secret's data: uses, since Key Vault holds every value plain.
    template:
      mergePolicy: Merge
      data:
        DOCKHAND_WEBHOOK_HEADER: "X-Gitlab-Token: {{ .DOCKHAND_WEBHOOK_SECRET }}"
        AUTHENTIK_DOCKHAND_OIDC_CLIENT_SECRET: "{{ .AUTHENTIK_DOCKHAND_OIDC_CLIENT_SECRET | b64enc }}"
        AUTHENTIK_GRAFANA_OIDC_CLIENT_SECRET: "{{ .AUTHENTIK_GRAFANA_OIDC_CLIENT_SECRET | b64enc }}"
        AUTHENTIK_GRIMMORY_OIDC_CLIENT_SECRET: "{{ .AUTHENTIK_GRIMMORY_OIDC_CLIENT_SECRET | b64enc }}"
        AUTHENTIK_HOMEPAGE_OIDC_CLIENT_SECRET: "{{ .AUTHENTIK_HOMEPAGE_OIDC_CLIENT_SECRET | b64enc }}"
        AUTHENTIK_NETBOX_OIDC_CLIENT_SECRET: "{{ .AUTHENTIK_NETBOX_OIDC_CLIENT_SECRET | b64enc }}"
        AUTHENTIK_ORGANIZR_OIDC_CLIENT_SECRET: "{{ .AUTHENTIK_ORGANIZR_OIDC_CLIENT_SECRET | b64enc }}"
        AUTHENTIK_REDIS_PASSWORD_PASSWORD: "{{ .AUTHENTIK_REDIS_PASSWORD_PASSWORD | b64enc }}"
        AUTHENTIK_SEMAPHORE_OIDC_CLIENT_SECRET: "{{ .AUTHENTIK_SEMAPHORE_OIDC_CLIENT_SECRET | b64enc }}"
        AUTHENTIK_STORK_OIDC_CLIENT_SECRET: "{{ .AUTHENTIK_STORK_OIDC_CLIENT_SECRET | b64enc }}"
        BABYBUDDY_MCP_SECRETS_AUTHENTIK_CLIENT_ID: "{{ .BABYBUDDY_MCP_SECRETS_AUTHENTIK_CLIENT_ID | b64enc }}"
        BABYBUDDY_MCP_SECRETS_AUTHENTIK_CLIENT_SECRET: "{{ .BABYBUDDY_MCP_SECRETS_AUTHENTIK_CLIENT_SECRET | b64enc }}"
        BABYBUDDY_MCP_SECRETS_BABYBUDDY_API_TOKEN: "{{ .BABYBUDDY_MCP_SECRETS_BABYBUDDY_API_TOKEN | b64enc }}"
        BABYBUDDY_MCP_SECRETS_MCP_AUTH_TOKEN: "{{ .BABYBUDDY_MCP_SECRETS_MCP_AUTH_TOKEN | b64enc }}"
        CERT_MANAGER_CLOUDFLARE_API_TOKEN_API_TOKEN: "{{ .CERT_MANAGER_CLOUDFLARE_API_TOKEN_API_TOKEN | b64enc }}"
        CLOUDFLARE_TUNNEL_SECRET_ACCOUNT_ID: "{{ .CLOUDFLARE_TUNNEL_SECRET_ACCOUNT_ID | b64enc }}"
        CLOUDFLARE_TUNNEL_SECRET_API_TOKEN: "{{ .CLOUDFLARE_TUNNEL_SECRET_API_TOKEN | b64enc }}"
        CLOUDFLARE_TUNNEL_SECRET_TUNNEL_NAME: "{{ .CLOUDFLARE_TUNNEL_SECRET_TUNNEL_NAME | b64enc }}"
        IMMICH_POWER_TOOLS_APIKEY_APIKEY: "{{ .IMMICH_POWER_TOOLS_APIKEY_APIKEY | b64enc }}"
        IMMICH_POWER_TOOLS_APIKEY_GEMINI_APIKEY: "{{ .IMMICH_POWER_TOOLS_APIKEY_GEMINI_APIKEY | b64enc }}"
        IMMICH_POWER_TOOLS_APIKEY_IMMICH_APIKEY: "{{ .IMMICH_POWER_TOOLS_APIKEY_IMMICH_APIKEY | b64enc }}"
