# The private values every Flux Kustomization substitutes as variables, built
# by External Secrets from the custom fields of one Vaultwarden item (field
# name = variable name), read through the bitwarden-cli pod. Public settings
# are in kubernetes/flux/meta/vars/cluster-settings.yaml instead.
#
# To add a variable: add the field to the Vaultwarden item, then an entry
# here. `key` is the item's ID (the itemId in its web-vault URL).
#
# prune: disabled: deleting this ExternalSecret would delete the Secret it
# owns, and every Kustomization would lose its variables.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets
  namespace: flux-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: cluster-secrets
    creationPolicy: Owner
    # Keep the last good values if a field or the item goes missing.
    deletionPolicy: Retain
  data:
  - secretKey: ACME_EMAIL
    remoteRef:
      key: 7a95474d-9b99-419d-a6ee-d5d0781a59eb
      property: ACME_EMAIL
  - secretKey: AUTHENTIK_REDIS_PASSWORD_PASSWORD
    remoteRef:
      key: 7a95474d-9b99-419d-a6ee-d5d0781a59eb
      property: AUTHENTIK_REDIS_PASSWORD_PASSWORD
  - secretKey: AUTHENTIK_SECRET_BOOTSTRAP_EMAIL
    remoteRef:
      key: 7a95474d-9b99-419d-a6ee-d5d0781a59eb
      property: AUTHENTIK_SECRET_BOOTSTRAP_EMAIL
  - secretKey: AUTHENTIK_SECRET_BOOTSTRAP_PASSWORD
    remoteRef:
      key: 7a95474d-9b99-419d-a6ee-d5d0781a59eb
      property: AUTHENTIK_SECRET_BOOTSTRAP_PASSWORD
  - secretKey: AUTHENTIK_SECRET_KEY_PASSWORD
    remoteRef:
      key: 7a95474d-9b99-419d-a6ee-d5d0781a59eb
      property: AUTHENTIK_SECRET_KEY_PASSWORD
  - secretKey: BABYBUDDY_MCP_SECRETS_AUTHENTIK_CLIENT_ID
    remoteRef:
      key: 7a95474d-9b99-419d-a6ee-d5d0781a59eb
