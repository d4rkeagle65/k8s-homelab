# The proof the azure-keyvault store reads every variable before cluster-secrets switches to
# it (QUEUE-azure-keyvault.md): every secret in the vault, keyed by its Key Vault name, into
# the scratch Secret cluster-secrets-keyvault-test, compared with cluster-secrets by hash.
# Nothing reads that Secret; this goes at the cutover. Hourly: about 141 reads an hour.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-secrets-keyvault-test
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: cluster-secrets-keyvault-test
    creationPolicy: Owner
  dataFrom:
  - find:
      name:
        regexp: ".*"
