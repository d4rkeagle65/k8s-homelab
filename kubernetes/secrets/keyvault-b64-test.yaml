# The proof for QUEUE-secret-names.md's "Base64 becomes plain with no refresh in between",
# on TIMEZONE alone (plain, not secret): two scratch ExternalSecrets into scratch Secrets
# nothing reads. Both go once it is answered.
#
# keyvault-b64-test: does refreshPolicy OnChange hold refreshes while the spec is unchanged
# (refreshTime fixed across many 1m intervals), and does a template key override the data key
# of the same name under mergePolicy Merge (TIMEZONE comes out base64 of the plain value)?
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keyvault-b64-test
  namespace: flux-system
spec:
  refreshPolicy: OnChange
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: keyvault-b64-test
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        TIMEZONE: "{{ .TIMEZONE | b64enc }}"
  data:
  - secretKey: TIMEZONE
    remoteRef:
      key: TIMEZONE
---
# keyvault-b64-fallback-test: the plain value under a name of its own and the template writing
# TIMEZONE, in case the override doesn't hold. Periodic every 1m, so its refreshTime is the
# control for the one above: the same interval, moving.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keyvault-b64-fallback-test
  namespace: flux-system
spec:
  refreshPolicy: Periodic
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: keyvault-b64-fallback-test
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data:
        TIMEZONE: "{{ .TIMEZONE_PLAIN | b64enc }}"
  data:
  - secretKey: TIMEZONE_PLAIN
    remoteRef:
      key: TIMEZONE
