env:
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  TZ: ${TIMEZONE}
image:
  tag: 2026.2.2
ingress:
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
  className: nginx
  enabled: true
  hosts:
  - host: manictime.${BASE_DOMAIN}
    paths:
    - /
  tls:
  - hosts:
    - manictime.${BASE_DOMAIN}
    secretName: manictime-tls
persistence:
  enabled: true
  mountPath: /app/Data
  size: 10Gi
  storageClass: nfs-retain-rwo
rbac:
  k8sLocking:
    enabled: true
resources:
  limits:
    memory: 1Gi
  requests:
    cpu: 50m
    memory: 256Mi
service:
  httpPort: 8080
  type: ClusterIP
settings:
  database:
    coreDatabase: ManicTimeCore
    host: manictime-pg-rw
    passwordSecret:
      key: password
      name: manictime-pg-app
    port: 5432
    reportsDatabase: ManicTimeReports
    sslMode: Prefer
    user: manictime
  extra:
    automaticVersionCheck:
      enabled: false
  seed: true
