# How External Secrets reads Vaultwarden items through bw serve. From the
# external-secrets Bitwarden example; `key` is the item's ID (the itemId in
# its web-vault URL), `property` the field's name.
# https://external-secrets.io/latest/examples/bitwarden/
#
# Each store serves ExternalSecrets in flux-system only (`conditions`): the
# CLI can read every item the Vaultwarden account can, so an ExternalSecret
# anywhere else could otherwise read any of them. To use a store from another
# namespace, add that namespace to its list.
#
# refreshInterval: 1m rechecks each store every minute. After any restart of
# the bitwarden-cli pod (Flux undoes `kubectl rollout restart`, so a push
# can cause one), External Secrets marks the stores invalid and, left to
# its default, takes many minutes to recheck them; cluster-secrets can't
# sync meanwhile.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-login
spec:
  refreshInterval: 1m
  conditions:
  - namespaces:
    - flux-system
  provider:
    webhook:
      url: "http://bitwarden-cli.external-secrets.svc:8087/object/item/{{ .remoteRef.key }}"
      headers:
        Content-Type: application/json
      result:
        jsonPath: "$.data.login.{{ .remoteRef.property }}"
---
# Custom fields: what cluster-secrets uses, one field per variable.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-fields
spec:
  refreshInterval: 1m
  conditions:
  - namespaces:
    - flux-system
  provider:
    webhook:
      url: "http://bitwarden-cli.external-secrets.svc:8087/object/item/{{ .remoteRef.key }}"
      result:
        jsonPath: "$.data.fields[?@.name==\"{{ .remoteRef.property }}\"].value"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-notes
spec:
  refreshInterval: 1m
  conditions:
  - namespaces:
    - flux-system
  provider:
    webhook:
      url: "http://bitwarden-cli.external-secrets.svc:8087/object/item/{{ .remoteRef.key }}"
      result:
        jsonPath: "$.data.notes"
