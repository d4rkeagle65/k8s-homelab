# External Secrets Operator (https://external-secrets.io). Builds Kubernetes
# Secrets from Vaultwarden items, read through the bitwarden-cli pod
# (../../bitwarden-cli). The chart installs its own CRDs (installCRDs: true).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  interval: 30m
  # The bitwarden-cli NetworkPolicy selects the controller by this name.
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.11.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    installCRDs: true
