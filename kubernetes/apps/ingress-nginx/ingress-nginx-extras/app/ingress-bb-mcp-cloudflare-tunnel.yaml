apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bb-mcp-cloudflare-tunnel
  namespace: ingress-nginx
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: bb-mcp.${BASE_DOMAIN}
    http:
      paths:
      - backend:
          service:
            name: ingress-nginx-controller
            port:
              number: 80
        path: /
        pathType: Prefix
