apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
  name: emby
  namespace: emby
spec:
  ingressClassName: nginx
  rules:
  - host: emby.${BASE_DOMAIN}
    http:
      paths:
      - backend:
          service:
            name: emby
            port:
              number: 8096
        path: /
        pathType: Prefix
  - host: e2.${BASE_DOMAIN}
    http:
      paths:
      - backend:
          service:
            name: emby
            port:
              number: 8096
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - emby.${BASE_DOMAIN}
    - e2.${BASE_DOMAIN}
    secretName: emby-tls
