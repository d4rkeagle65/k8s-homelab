# The IngressClass ManicTime's Ingress names (`className: nginx-isolated`).
# traefik-isolated's NGINX provider serves Ingresses through it (by its
# controller value). The ingress-nginx-isolated chart created it; that chart
# was uninstalled in Batch 5c with helm.sh/resource-policy: keep on it, and
# Flux owns it since.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx-isolated
spec:
  controller: k8s.io/ingress-nginx-isolated
