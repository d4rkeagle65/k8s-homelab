# Second Traefik (it replaced ingress-nginx-isolated; see QUEUE-traefik.md):
# serves only the `traefik-isolated` IngressClass (ManicTime Server), on its
# own address (ISOLATED_INGRESS_IP), so a firewall rule can let an isolated
# VLAN reach that and nothing behind the main ingress. Publishes that address
# as the Ingress status. Same chart and version as ../../traefik; keep them in
# step.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik-isolated
spec:
  interval: 30m
  releaseName: traefik-isolated
  chart:
    spec:
      chart: traefik
      version: 41.6.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  # The main traefik release installs and upgrades the CRDs; two releases
  # replacing the same CRDs would fight over them.
  install:
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    providers:
      # Class `traefik-isolated` only.
      kubernetesIngress:
        enabled: true
        ingressClass: traefik-isolated
        publishedService:
          enabled: true
      # No IngressRoutes for this controller.
      kubernetesCRD:
        enabled: false
    # The `traefik-isolated` IngressClass for native Ingresses; not the
    # cluster default.
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik-isolated
    # As the main traefik: see its helmrelease.yaml for each.
    ports:
      web:
        transport:
          respondingTimeouts:
            readTimeout: 0
        http:
          aliasHeadersStrategy: delete
          # Every request on port 80 to HTTPS, as ingress-nginx did for
          # ManicTime. On the whole entry point here: no tunnel uses plain
          # HTTP on this controller.
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 0
        http:
          aliasHeadersStrategy: delete
      traefik:
        http:
          aliasHeadersStrategy: delete
      metrics:
        http:
          aliasHeadersStrategy: delete
    service:
      annotations:
        metallb.io/loadBalancerIPs: ${ISOLATED_INGRESS_IP}
      spec:
        type: LoadBalancer
        # Keeps the client's source address, so ManicTime sees which VLAN a
        # request came from.
        externalTrafficPolicy: Local
