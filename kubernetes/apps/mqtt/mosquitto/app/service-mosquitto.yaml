apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: mqtt
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: mqtt
    port: 1883
    protocol: TCP
    targetPort: 1883
  - name: websockets
    port: 9001
    protocol: TCP
    targetPort: 9001
  selector:
    app: mosquitto
  sessionAffinity: None
  type: ClusterIP
