apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: traefik_authentik@kubernetescrd
  name: babybuddy-ingress
  namespace: babybuddy
spec:
  ingressClassName: traefik
  rules:
  - host: bb.${BASE_DOMAIN}
    http:
      paths:
      - backend:
          service:
            name: authentik-outpost
            port:
              number: 9000
        path: /outpost.goauthentik.io
        pathType: ImplementationSpecific
      - backend:
          service:
            name: babybuddy-svc
            port:
              number: 8000
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - bb.${BASE_DOMAIN}
    secretName: babybuddy-http-tls
