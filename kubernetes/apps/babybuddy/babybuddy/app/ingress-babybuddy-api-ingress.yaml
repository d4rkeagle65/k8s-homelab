apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
  name: babybuddy-api-ingress
  namespace: babybuddy
spec:
  ingressClassName: traefik
  rules:
  - host: bb.${BASE_DOMAIN}
    http:
      paths:
      - backend:
          service:
            name: babybuddy-svc
            port:
              number: 8000
        path: /api
        pathType: Prefix
  tls:
  - hosts:
    - bb.${BASE_DOMAIN}
    secretName: babybuddy-http-tls
