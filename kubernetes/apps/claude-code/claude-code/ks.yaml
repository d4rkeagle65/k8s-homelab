apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-code
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/claude-code/claude-code/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: claude-code
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
