# cluster-admin, the same access the PC's admin kubeconfig has: the work
# includes Flux reconciles, patches, rollouts and exec into pods everywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-code
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: claude-code
  namespace: claude-code
