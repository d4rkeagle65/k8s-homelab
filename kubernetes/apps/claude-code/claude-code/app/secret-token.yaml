# A long-lived token for the claude-code ServiceAccount. Kubernetes fills in
# the token and the cluster's CA certificate itself, so nothing secret is in
# git. Deleting this Secret revokes the token; Flux then makes a new one.
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-token
  annotations:
    kubernetes.io/service-account.name: claude-code
type: kubernetes.io/service-account-token
