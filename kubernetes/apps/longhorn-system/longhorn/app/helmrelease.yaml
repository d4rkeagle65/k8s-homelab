# Longhorn distributed block storage (https://longhorn.io).
# Worker nodes need open-iscsi installed with iscsid running; the manager
# refuses to start without it. Upgrades must go one minor version at a time
# (1.12 -> 1.13, never skip), so bump chart.spec.version accordingly.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    persistence:
      # nfs-eph-rwo stays the cluster default; PVCs opt in to Longhorn with
      # storageClassName: longhorn.
      defaultClass: false
    preUpgradeChecker:
      # The chart's pre-upgrade hook Job is meant for plain `helm upgrade`;
      # the chart docs say to disable it under GitOps. The manager's own
      # version-skip check (upgradeVersionCheck) stays on.
      jobEnabled: false
