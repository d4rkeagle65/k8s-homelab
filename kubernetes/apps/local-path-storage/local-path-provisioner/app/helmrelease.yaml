# Local-disk volumes for the CloudNativePG databases, via the `local-db`
# StorageClass. Each worker LXC has a dedicated 128G ZFS dataset mounted at
# /opt/local-path-provisioner; a volume is a directory on the dataset of the
# node its pod runs on. CNPG's own replication covers losing a node.
# (Longhorn can't run in these LXC nodes: ZFS has no file-extent support and
# the containers have no block-device access.)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  interval: 30m
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
        namespace: flux-system
  values:
    helperImage:
      # Pinned rather than the chart's `latest`.
      tag: 1.37.0
    nodePathMap:
    # Nodes not listed (the control planes, with 8G root disks) are refused.
    # Node names are WORKER_NODE_* in the cluster-substitutions ConfigMap.
    - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
      paths: []
    - node: ${WORKER_NODE_1}
      paths:
      - /opt/local-path-provisioner
    - node: ${WORKER_NODE_2}
      paths:
      - /opt/local-path-provisioner
    - node: ${WORKER_NODE_3}
      paths:
      - /opt/local-path-provisioner
    storageClass:
      defaultClass: false
      name: local-db
      provisionerName: rancher.io/local-path
      # Deleting a claim (or a CNPG Cluster) never deletes its data.
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer
