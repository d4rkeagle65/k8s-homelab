apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/local-path-storage/local-path-provisioner/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: local-path-storage
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-substitutions
      optional: true
    - kind: Secret
      name: cluster-substitutions
      optional: true
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
