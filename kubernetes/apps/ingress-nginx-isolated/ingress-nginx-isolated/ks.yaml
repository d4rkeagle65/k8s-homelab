apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ingress-nginx-isolated
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/ingress-nginx-isolated/ingress-nginx-isolated/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: ingress-nginx-isolated
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-substitutions
      optional: true
    - kind: Secret
      name: cluster-substitutions
      optional: true
