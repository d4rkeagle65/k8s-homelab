# Second ingress-nginx controller with its own MetalLB IP (ISOLATED_INGRESS_IP,
# a field of the cluster-secrets Vaultwarden item), so a firewall rule can let an
# isolated VLAN reach only what uses the `nginx-isolated` IngressClass
# (ManicTime Server) and nothing behind the main controller's IP. Same chart
# and version as ../../ingress-nginx; keep them in step.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-isolated
  namespace: ingress-nginx-isolated
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: 4.13.9
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      admissionWebhooks:
        # The webhook validates every Ingress in the cluster, not only this
        # class's, so with the default (Fail) any Ingress change anywhere is
        # rejected while this controller is down. Ignore lets it through
        # unvalidated instead.
        failurePolicy: Ignore
      ingressClass: nginx-isolated
      ingressClassResource:
        controllerValue: k8s.io/ingress-nginx-isolated
        default: false
        name: nginx-isolated
      service:
        annotations:
          metallb.io/loadBalancerIPs: ${ISOLATED_INGRESS_IP}
        # Same as the main controller's Service (set there by `kubectl edit`,
        # not in git): keeps the client's source IP, so ManicTime and the
        # nginx logs see which VLAN a request came from.
        externalTrafficPolicy: Local
      watchIngressWithoutClass: false
