# Second ingress-nginx controller, for the `nginx-isolated` IngressClass
# (ManicTime Server). Being replaced by traefik-isolated (QUEUE-traefik.md,
# Batch 5): since the 5b cutover traefik-isolated holds ISOLATED_INGRESS_IP and
# this one is internal-only, kept until 5c removes it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx-isolated
  namespace: ingress-nginx-isolated
spec:
  interval: 30m
  chart:
    spec:
      chart: ingress-nginx
      version: 4.13.9
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      admissionWebhooks:
        # The webhook validates every Ingress in the cluster, not only this
        # class's, so with the default (Fail) any Ingress change anywhere is
        # rejected while this controller is down. Ignore lets it through
        # unvalidated instead.
        failurePolicy: Ignore
      ingressClass: nginx-isolated
      ingressClassResource:
        # Uninstalling the chart in 5c then leaves the IngressClass, which
        # traefik-isolated finds ManicTime's Ingress through.
        annotations:
          helm.sh/resource-policy: keep
        controllerValue: k8s.io/ingress-nginx-isolated
        default: false
        name: nginx-isolated
      service:
        # Releases ISOLATED_INGRESS_IP to traefik-isolated.
        type: ClusterIP
      watchIngressWithoutClass: false
