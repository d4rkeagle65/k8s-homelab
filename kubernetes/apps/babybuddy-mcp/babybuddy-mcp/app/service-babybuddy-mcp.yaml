apiVersion: v1
kind: Service
metadata:
  name: babybuddy-mcp
  namespace: babybuddy-mcp
spec:
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: babybuddy-mcp
  sessionAffinity: None
  type: ClusterIP
