apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: smtp-oauth-relay
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/smtp-relay/smtp-oauth-relay/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: smtp-relay
  # The Certificate is a cert-manager CRD.
  dependsOn:
  - name: cert-manager
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
