# Reached from outside the cluster on the main ingress address, port 8025:
# ingress-nginx forwards that port here as raw TCP (`tcp:` in its values), so
# STARTTLS and the certificate stay with the relay.
apiVersion: v1
kind: Service
metadata:
  name: smtp-oauth-relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: smtp-oauth-relay
  ports:
  - name: smtp
    port: 8025
    targetPort: smtp
    protocol: TCP
