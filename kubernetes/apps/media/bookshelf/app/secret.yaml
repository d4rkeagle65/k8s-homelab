# Bookshelf's API key, pinned so the apps that store it (Prowlarr) keep
# working if Bookshelf's config is ever rebuilt. The READARR__AUTH__APIKEY env
# var takes precedence over config.xml. MEDIA_BOOKSHELF_API_KEY holds it
# base64-encoded, as for every variable used in a Secret's data.
apiVersion: v1
kind: Secret
metadata:
  name: bookshelf
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  api-key: ${MEDIA_BOOKSHELF_API_KEY}
