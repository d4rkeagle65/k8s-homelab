apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sabnzbd
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/media/sabnzbd/app
  prune: true
  targetNamespace: media
  dependsOn: []
  sourceRef:
    kind: GitRepository
    name: flux-system
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-substitutions
      optional: true
    - kind: Secret
      name: cluster-substitutions-secret
      optional: true
