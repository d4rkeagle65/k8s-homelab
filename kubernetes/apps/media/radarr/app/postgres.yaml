apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: radarr-postgres
spec:
  instances: 2
  storage:
    size: 5Gi
    storageClass: local-db
  bootstrap:
    initdb:
      database: radarr-main
      owner: radarr
      postInitApplicationSQL:
        - CREATE DATABASE "radarr-log" OWNER radarr;
