# Radarr's API key, pinned so the apps that store it (Prowlarr, Jellyseerr,
# the other *arrs) keep working if Radarr's config is ever rebuilt. The
# RADARR__AUTH__APIKEY env var takes precedence over config.xml.
# MEDIA_RADARR_API_KEY holds it base64-encoded, as for every variable used
# in a Secret's data.
apiVersion: v1
kind: Secret
metadata:
  name: radarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  api-key: ${MEDIA_RADARR_API_KEY}
