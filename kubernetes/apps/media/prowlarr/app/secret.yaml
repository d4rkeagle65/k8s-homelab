# Prowlarr's API key, pinned so the apps that store it (Prowlarr, Jellyseerr,
# the other *arrs) keep working if Prowlarr's config is ever rebuilt. The
# PROWLARR__AUTH__APIKEY env var takes precedence over config.xml.
# MEDIA_PROWLARR_API_KEY holds it base64-encoded, as for every variable used
# in a Secret's data.
apiVersion: v1
kind: Secret
metadata:
  name: prowlarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  api-key: ${MEDIA_PROWLARR_API_KEY}
