apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: prowlarr-postgres
spec:
  instances: 2
  storage:
    size: 2Gi
    storageClass: local-db
  bootstrap:
    initdb:
      database: prowlarr-main
      owner: prowlarr
      postInitApplicationSQL:
        - CREATE DATABASE "prowlarr-log" OWNER prowlarr;
