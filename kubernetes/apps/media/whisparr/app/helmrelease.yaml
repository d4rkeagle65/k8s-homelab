apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whisparr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            # v2-develop: the stable v2 build (latest, 2.2.0.231) can't log in
            # to qBittorrent 5.2+, which answers a successful login with an
            # empty 204. The fix is only in v2-develop so far. Whisparr
            # upgrades its database on start and can't go back, so return to
            # latest only once a stable v2 release is newer than this build.
            image:
              repository: ghcr.io/hotio/whisparr
              tag: v2-develop
              pullPolicy: Always
            env:
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: TZ
                value: ${TIMEZONE}
              - name: WHISPARR__POSTGRES__HOST
                value: whisparr-postgres-rw
              - name: WHISPARR__POSTGRES__PORT
                value: "5432"
              - name: WHISPARR__POSTGRES__USER
                value: whisparr
              - name: WHISPARR__POSTGRES__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: whisparr-postgres-app
                    key: password
              - name: WHISPARR__POSTGRES__MAINDB
                value: whisparr-main
              - name: WHISPARR__POSTGRES__LOGDB
                value: whisparr-log
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 6969
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
        hosts:
          - host: whisparr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: whisparr-tls
            hosts:
              - whisparr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    persistence:
      config:
        existingClaim: whisparr-config
        globalMounts:
          - path: /config
      synmedia:
        existingClaim: synmedia-nfs
        globalMounts:
          - path: /synmedia
