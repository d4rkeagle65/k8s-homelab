# The client ID and secret of Authentik's mealie provider. The MEALIE_OIDC_*
# fields hold them base64-encoded, as for every variable used in a Secret's
# data; scripts/vaultwarden-fields.ps1 encodes them when run from a checkout
# that has this file.
apiVersion: v1
kind: Secret
metadata:
  name: mealie-oidc
type: Opaque
data:
  client-id: ${MEALIE_OIDC_CLIENT_ID}
  client-secret: ${MEALIE_OIDC_CLIENT_SECRET}
