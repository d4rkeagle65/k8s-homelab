apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mealie
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/mealie/mealie/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: mealie
  # mealie-postgres is a CloudNativePG Cluster.
  dependsOn:
  - name: cnpg
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
