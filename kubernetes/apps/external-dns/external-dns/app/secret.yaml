# The Pi-hole app password ExternalDNS logs in with (Pi-hole: Settings > Web
# interface / API > Configure app password). The PIHOLE_PASSWORD field holds
# it base64-encoded, as for every variable used in a Secret's data;
# scripts/vaultwarden-fields.ps1 encodes it when run from a checkout that
# has this file.
apiVersion: v1
kind: Secret
metadata:
  name: external-dns-pihole
type: Opaque
data:
  EXTERNAL_DNS_PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
