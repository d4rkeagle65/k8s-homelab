---
# Two rules for the one host, as the nginx version had. Plain HTTP to immich
# is redirected to HTTPS, so the working tunnel must be using the 443 one.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-cloudflare-tunnel
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: immich.${BASE_DOMAIN}
    http:
      paths:
      - backend:
          service:
            name: traefik
            port:
              number: 80
        path: /
        pathType: Prefix
  - host: immich.${BASE_DOMAIN}
    http:
      paths:
      - backend:
          service:
            name: traefik
            port:
              number: 443
        path: /
        pathType: Prefix
