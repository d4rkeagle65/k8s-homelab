# The Cloudflare tunnel's routes into the main ingress, which now is Traefik
# (moved from the ingress-nginx namespace at the Batch 3 cutover; an Ingress
# can only use a Service in its own namespace). The tunnel sends each request
# on to Traefik, which routes it by host like any other. Apps that redirect
# plain HTTP to HTTPS on Traefik can't come through here (the tunnel uses
# port 80, so they'd loop); their tunnel routes go straight to the app's
# Service from its own namespace instead (Authentik, immich).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bb-cloudflare-tunnel
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: bb.${BASE_DOMAIN}
    http:
      paths:
      - backend:
          service:
            name: traefik
            port:
              number: 80
        path: /
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bb-mcp-cloudflare-tunnel
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: bb-mcp.${BASE_DOMAIN}
    http:
      paths:
      - backend:
          service:
            name: traefik
            port:
              number: 80
        path: /
        pathType: Prefix
