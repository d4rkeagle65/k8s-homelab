# Traefik, the main ingress (it replaced the retired ingress-nginx; see
# QUEUE-traefik.md). Serves Ingresses of the `traefik` IngressClass, with
# Traefik annotations and the Middlewares below, on the main ingress address
# (INGRESS_IP), and publishes that address as each Ingress's status.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 30m
  releaseName: traefik
  chart:
    spec:
      chart: traefik
      version: 41.6.0
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    providers:
      # Class `traefik` only. Not the cluster default (see ingressClass below),
      # and the isolated controller has its own class.
      kubernetesIngress:
        enabled: true
        ingressClass: traefik
        # babybuddy routes /outpost.goauthentik.io to the Authentik outpost
        # through an ExternalName Service in its own namespace (an Ingress
        # can only use Services there). ingress-nginx allowed these too.
        allowExternalNameServices: true
        publishedService:
          enabled: true
      # For the SMTP IngressRouteTCP and the Middlewares below.
      kubernetesCRD:
        enabled: true
        # Collision-safe names for the routers/services it generates, as
        # Traefik recommends for new setups (unset, it logs a warning). Only
        # matters to config that refers to generated names; nothing here does.
        # https://doc.traefik.io/traefik/reference/install-configuration/providers/kubernetes/kubernetes-crd/#safenaming
        safeNaming: true
    # The `traefik` IngressClass for native Ingresses; not the cluster
    # default, so an Ingress without a class isn't picked up.
    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik
    # aliasHeadersStrategy: delete drops request headers whose names alias
    # another's (X_Auth_User for X-Auth-User). Python/PHP apps read both as one
    # variable, so a client could otherwise spoof the X-authentik-* headers the
    # Authentik forward-auth sets (babybuddy). nginx drops them by default.
    # https://doc.traefik.io/traefik/reference/install-configuration/entrypoints/#aliasheadersstrategy
    ports:
      web:
        # Traefik limits reading a whole request (body included) to 60s by
        # default; nginx has no such limit, and large uploads (immich) take
        # longer. 0 = no limit.
        transport:
          respondingTimeouts:
            readTimeout: 0
        http:
          aliasHeadersStrategy: delete
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 0
        http:
          aliasHeadersStrategy: delete
      # Internal (dashboard/API and metrics; not exposed): set so Traefik
      # doesn't warn about every entry point.
      traefik:
        http:
          aliasHeadersStrategy: delete
      metrics:
        http:
          aliasHeadersStrategy: delete
      # smtp-oauth-relay (clients use INGRESS_IP:8025).
      smtp:
        port: 8025
        expose:
          default: true
        exposedPort: 8025
        protocol: TCP
        http:
          aliasHeadersStrategy: delete
    service:
      annotations:
        metallb.io/loadBalancerIPs: ${INGRESS_IP}
      spec:
        type: LoadBalancer
        # As ingress-nginx: keep the client's source address.
        externalTrafficPolicy: Local
    extraObjects:
    # HTTP to HTTPS, as ingress-nginx did for every Ingress with TLS. Per
    # Ingress, not on the whole `web` entry point: the Cloudflare tunnel
    # reaches bb and bb-mcp over plain HTTP. Used as
    # traefik.ingress.kubernetes.io/router.middlewares:
    # traefik_redirect-https@kubernetescrd (the name under safeNaming). Does
    # nothing to a request that is already HTTPS.
    # Authentik forward auth (babybuddy), per Authentik's Traefik docs; used
    # as traefik_authentik@kubernetescrd. /auth/traefik reads the
    # X-Forwarded-* headers Traefik sends, and handles the login callback
    # itself.
    - apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: authentik
        namespace: traefik
      spec:
        forwardAuth:
          address: http://ak-outpost-default-proxy-outpost.authentik.svc.${CLUSTER_DOMAIN}:9000/outpost.goauthentik.io/auth/traefik
          trustForwardHeader: true
          authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt
          - X-authentik-meta-jwks
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
    - apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata:
        name: redirect-https
        namespace: traefik
      spec:
        redirectScheme:
          scheme: https
          permanent: true
    # Plain TCP (STARTTLS passes through to the relay, which holds the
    # certificate). In the relay's namespace: the CRD provider doesn't
    # follow references across namespaces.
    - apiVersion: traefik.io/v1alpha1
      kind: IngressRouteTCP
      metadata:
        name: smtp-oauth-relay
        namespace: smtp-relay
      spec:
        entryPoints:
        - smtp
        routes:
        - match: HostSNI(`*`)
          services:
          - name: smtp-oauth-relay
            port: 8025
