# The IngressClass every app's Ingress names (`ingressClassName: nginx`).
# Traefik's NGINX provider serves Ingresses through it (by its controller
# value). The ingress-nginx chart created it; that chart was uninstalled in
# Batch 4 with helm.sh/resource-policy: keep on it, and Flux owns it since.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: nginx
spec:
  controller: k8s.io/ingress-nginx
