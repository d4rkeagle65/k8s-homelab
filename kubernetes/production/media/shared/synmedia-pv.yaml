apiVersion: v1
kind: PersistentVolume
metadata:
  name: synmedia-nfs
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    server: ${NFS_SERVER}
    path: /volume1/media
  mountOptions:
    - nfsvers=3
    - hard
    - timeo=600
    - retrans=2
