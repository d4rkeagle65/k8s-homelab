apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ocis
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: ocis
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/apps/ocis/ocis/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: ocis
  # Core types only; the Traefik private-networks middleware and the Authentik
  # OIDC provider (blueprint ocis.yaml) resolve at runtime.
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
