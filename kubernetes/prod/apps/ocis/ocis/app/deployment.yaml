# ownCloud Infinite Scale (oCIS), single container: one binary runs every oCIS
# microservice in-process (the Helm chart's ~25 Deployments are for scale-out we don't
# need). No database - metadata lives on the filesystem (decomposedfs on ocis-data).
#
# Login is Authentik OIDC (blueprint ocis.yaml in authentik-extras). oCIS's web UI is a
# public PKCE client (client_id ocis-web, no secret). The built-in IDM still holds the
# user directory; PROXY_AUTOPROVISION_ACCOUNTS creates an account from the OIDC claims on
# first sign-in, so there's no separate oCIS user list to manage.
#
# One replica, Recreate: ocis-data is RWO and decomposedfs is single-writer.
#
# Env values confirmed against doc.owncloud.com/ocis/9.0 (proxy, web, ocis-init pages),
# except PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD=none, which is needed because Authentik's
# access tokens are opaque, not JWT (so oCIS can't verify them as JWT).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ocis
  template:
    metadata:
      labels:
        app: ocis
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      # nas-iscsi (ocis-data) mounts only on Talos nodes with the iscsi-tools extension
      # (democratic-csi's helmrelease.yaml says why).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: extensions.talos.dev/iscsi-tools
                    operator: Exists
      # `ocis init` writes /etc/ocis/ocis.yaml (the internal service secrets) on the first
      # start only; it exits non-zero when the file already exists, so `|| true` lets every
      # later start through. The generated admin password is printed to this container's log
      # on that first run (kubectl logs -c ocis-init) and stored in ocis.yaml.
      initContainers:
      - name: ocis-init
        image: owncloud/ocis:8.2.3
        command: ["/bin/sh", "-c", "ocis init || true"]
        env:
        - name: OCIS_URL
          value: https://ocis${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        - name: OCIS_BASE_DATA_PATH
          value: /var/lib/ocis
        # Pin the config dir to /etc/ocis. Without this, OCIS_BASE_DATA_PATH drags
        # `ocis init`'s ocis.yaml onto the data volume, but `ocis server` reads config
        # from /etc/ocis, so it can't find the generated jwt_secret and crash-loops.
        - name: OCIS_CONFIG_DIR
          value: /etc/ocis
        - name: OCIS_LOG_LEVEL
          value: info
        # `ocis init` prompts interactively ("configure with certificate checking
        # disabled?") unless OCIS_INSECURE is set, which hangs the initContainer. true
        # also lets oCIS skip TLS verification on its internal service calls; it's
        # single-binary behind Traefik, which holds the only real (LAN-only) cert.
        - name: OCIS_INSECURE
          value: "true"
        volumeMounts:
        - name: config
          mountPath: /etc/ocis
        - name: data
          mountPath: /var/lib/ocis
      containers:
      - name: ocis
        image: owncloud/ocis:8.2.3
        command: ["ocis", "server"]
        ports:
        - name: http
          containerPort: 9200
        env:
        - name: OCIS_URL
          value: https://ocis${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        - name: OCIS_LOG_LEVEL
          value: info
        - name: OCIS_BASE_DATA_PATH
          value: /var/lib/ocis
        # Read config from /etc/ocis, where the initContainer wrote it (see there).
        - name: OCIS_CONFIG_DIR
          value: /etc/ocis
        # Skip TLS verification on oCIS's internal service calls (see the initContainer).
        - name: OCIS_INSECURE
          value: "true"
        # Traefik terminates TLS; oCIS's proxy serves plain HTTP on 9200.
        - name: PROXY_TLS
          value: "false"
        # External IdP: Authentik. The trailing slash matches Authentik's issuer exactly.
        - name: OCIS_OIDC_ISSUER
          value: https://auth.${BASE_DOMAIN}/application/o/ocis/
        - name: WEB_OIDC_CLIENT_ID
          value: ocis-web
        # oCIS proxies the IdP's .well-known so the web client discovers it through oCIS.
        - name: PROXY_OIDC_REWRITE_WELLKNOWN
          value: "true"
        # Authentik access tokens are opaque, not JWT; verify via the userinfo endpoint.
        - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
          value: none
        # Auto-provision an account from the OIDC claims on first sign-in. Needs the built-in
        # graph/IDM to accept writes (GRAPH_LDAP_SERVER_WRITE_ENABLED). Look the user up by a
        # stable claim; provisioned accounts key on the username claim.
        - name: PROXY_AUTOPROVISION_ACCOUNTS
          value: "true"
        - name: GRAPH_LDAP_SERVER_WRITE_ENABLED
          value: "true"
        - name: PROXY_USER_OIDC_CLAIM
          value: preferred_username
        - name: PROXY_USER_CS3_CLAIM
          value: username
        - name: PROXY_AUTOPROVISION_CLAIM_USERNAME
          value: preferred_username
        # TCP probes: with OIDC on, an unauthenticated HTTP GET to the proxy has no simple
        # health path, so probe the port. oCIS starts all its services, so allow time.
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 30
          periodSeconds: 15
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/ocis
        - name: data
          mountPath: /var/lib/ocis
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: ocis-config
      - name: data
        persistentVolumeClaim:
          claimName: ocis-data
