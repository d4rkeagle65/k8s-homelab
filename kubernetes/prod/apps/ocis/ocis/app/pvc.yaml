# oCIS storage. decomposedfs (the default metadata backend) keeps file metadata in
# POSIX extended attributes, which the nfs-retain classes don't carry reliably, so the
# file data goes on nas-iscsi: a real block device (ext4, xattr-safe) and this repo's
# home for single-copy, constant-write data (kubernetes/CLAUDE.md "Nodes and storage").
# The deployment needs node affinity for extensions.talos.dev/iscsi-tools to mount it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ocis-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-iscsi
  resources:
    requests:
      storage: 50Gi
---
# oCIS's config: /etc/ocis/ocis.yaml, written once by `ocis init` (the initContainer) and
# holding every internal service secret (JWT, transfer, machine-auth, system-user). Small
# and no xattr need, so plain NFS. Prune-protected: deleting it loses the secrets, which
# would orphan the data under ocis-data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ocis-config
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 1Gi
