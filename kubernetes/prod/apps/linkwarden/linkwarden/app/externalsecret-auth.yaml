# The key Linkwarden signs and encrypts its login sessions with (helmrelease.yaml's
# envFrom), made once in the cluster. To rotate: delete the Secret linkwarden-auth, then
# restart Linkwarden; everyone logs in again.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: linkwarden-auth
spec:
  secretKeys: [NEXTAUTH_SECRET]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-auth
spec:
  refreshPolicy: CreatedOnce
  target:
    name: linkwarden-auth
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: linkwarden-auth
