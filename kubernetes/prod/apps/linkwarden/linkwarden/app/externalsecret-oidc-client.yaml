# Linkwarden's Authentik client secret, made once here and read through
# helmrelease.yaml's envFrom. Authentik's worker reads it through authentik-extras'
# secretstore-linkwarden.yaml, which the Role below lets read only this Secret. To
# rotate: delete the Secret linkwarden-oidc-client, then restart Authentik's worker and
# Linkwarden.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: linkwarden-oidc-client
spec:
  secretKeys: [AUTHENTIK_CLIENT_SECRET]
  length: 64
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkwarden-oidc-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: linkwarden-oidc-client
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: linkwarden-oidc-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-oidc-reader-linkwarden
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [linkwarden-oidc-client]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-oidc-reader-linkwarden
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-oidc-reader-linkwarden
subjects:
- kind: ServiceAccount
  name: authentik-oidc-reader
  namespace: authentik
