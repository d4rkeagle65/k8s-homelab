# The archived pages, previews and uploads, on the NAS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkwarden-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 20Gi
