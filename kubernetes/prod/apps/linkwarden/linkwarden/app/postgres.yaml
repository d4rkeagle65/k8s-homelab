# Linkwarden's database: two copies on the workers' local disks (local-db), so it
# survives losing a worker, backed up continuously to Garage (objectstore.yaml).
# CloudNativePG puts the app user's credentials in linkwarden-postgres-app.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: linkwarden-postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  affinity:
    podAntiAffinityType: preferred
  enablePDB: true
  resources:
    requests:
      cpu: 20m
      memory: 192Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: linkwarden
      owner: app
  storage:
    size: 4Gi
    storageClass: local-db
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
