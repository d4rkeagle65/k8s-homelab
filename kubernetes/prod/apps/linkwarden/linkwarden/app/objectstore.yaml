# Where linkwarden's database backups go: the cnpg-backups bucket in Garage,
# like every database's (apps/mealie/mealie/app/objectstore.yaml has the why of
# each setting).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: garage
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://cnpg-backups/
    endpointURL: ${CNPG_BACKUP_S3_ENDPOINT}
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-s3
        key: ACCESS_SECRET_KEY
    wal:
      compression: zstd
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
    - name: AWS_DEFAULT_REGION
      value: garage
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
