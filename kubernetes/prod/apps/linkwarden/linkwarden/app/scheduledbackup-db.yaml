# A base backup every night at 02:40, and one as soon as this is applied.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: linkwarden-db-nightly
spec:
  schedule: "0 40 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: linkwarden-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
