# Linkwarden's session secret and Authentik's client secret for it (the same
# value as the worker's, authentik-extras/app/secret-authentik-linkwarden-oidc.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: linkwarden
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  NEXTAUTH_SECRET: ${LINKWARDEN_NEXTAUTH_SECRET}
  AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_LINKWARDEN_OIDC_CLIENT_SECRET}
