# Authentik's client secret for Linkwarden (the same value as the worker's,
# authentik-extras/app/secret-authentik-linkwarden-oidc.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: linkwarden
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_LINKWARDEN_OIDC_CLIENT_SECRET}
