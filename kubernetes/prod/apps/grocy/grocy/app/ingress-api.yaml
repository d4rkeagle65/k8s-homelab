# Grocy's /api: private networks only, NOT behind forward-auth, so companions
# (Barcode Buddy, Penny, pygrocy) reach it with a Grocy API key. Grocy's
# ReverseProxyAuthMiddleware tries API-key auth first on /api routes, so the
# X-authentik-username header isn't needed here. Traefik still strips any
# client-supplied X-authentik-* header at the entrypoint.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grocy-api
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: grocy.${BASE_DOMAIN}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: grocy
            port:
              number: 80
  tls:
  - hosts:
    - grocy.${BASE_DOMAIN}
    secretName: grocy-tls
