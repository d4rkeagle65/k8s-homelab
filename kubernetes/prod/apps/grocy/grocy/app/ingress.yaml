# Grocy's UI: private networks only, behind Authentik forward-auth (blueprint
# grocy.yaml). Grocy trusts the X-authentik-username header the authentik
# middleware passes; Traefik strips any client-supplied one at the entrypoint.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grocy
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd,traefik_authentik@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: grocy.${BASE_DOMAIN}
    http:
      paths:
      - path: /outpost.goauthentik.io
        pathType: Prefix
        backend:
          service:
            name: authentik-outpost
            port:
              number: 9000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grocy
            port:
              number: 80
  tls:
  - hosts:
    - grocy.${BASE_DOMAIN}
    secretName: grocy-tls
---
# Plain http:// redirects to https:// (the route above listens on websecure
# only, and the Cloudflare tunnel has no route for this host).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grocy-http-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: grocy.${BASE_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grocy
            port:
              number: 80
