# Grocy's data: its SQLite database and uploaded files, under /config. Grocy
# needs no separate database.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grocy-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 2Gi
