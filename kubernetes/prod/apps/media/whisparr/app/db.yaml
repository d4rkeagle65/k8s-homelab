# Whisparr's databases on PostgreSQL 18 (Debian trixie), taking over from
# whisparr-postgres (16, Debian bullseye; QUEUE-updates.md). Created empty with
# both databases owned by whisparr; the data is copied in with pg_dump and
# pg_restore while Whisparr is stopped, then Whisparr is pointed here.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: whisparr-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  # Scheduled before ordinary pods when nodes are short (cluster-policy).
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 20m
      memory: 288Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  storage:
    size: 2Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (media-backup/).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
  bootstrap:
    initdb:
      database: whisparr-main
      owner: whisparr
      postInitSQL:
        - CREATE DATABASE "whisparr-log" OWNER whisparr;
