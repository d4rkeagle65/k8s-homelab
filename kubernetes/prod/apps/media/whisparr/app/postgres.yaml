apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: whisparr-postgres
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:16
  storage:
    size: 2Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (media-backup/).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
  bootstrap:
    initdb:
      database: whisparr-main
      owner: whisparr
      postInitSQL:
        - CREATE DATABASE "whisparr-log" OWNER whisparr;
