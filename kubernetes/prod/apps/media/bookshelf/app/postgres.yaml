# Bookshelf (a Readarr fork) keeps three databases: main, log, and a cache of
# book metadata.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: bookshelf-postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  instances: 2
  storage:
    size: 5Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (media-backup/).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
  bootstrap:
    initdb:
      database: bookshelf-main
      owner: bookshelf
      postInitApplicationSQL:
        - CREATE DATABASE "bookshelf-log" OWNER bookshelf;
        - CREATE DATABASE "bookshelf-cache" OWNER bookshelf;
