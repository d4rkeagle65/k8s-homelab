# A base backup of whisparr-v3-db every night at 02:55 (CloudNativePG's schedule
# has a seconds field first; the databases are spread five minutes apart), and one
# as soon as this is applied. The WAL archive covers every change in between.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: whisparr-v3-db-nightly
spec:
  schedule: "0 55 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: whisparr-v3-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
