# A base backup of bookshelf-db every night at 02:20 (CloudNativePG's schedule
# has a seconds field first; the databases are spread five minutes apart), and one
# as soon as this is applied. The WAL archive covers every change in between.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: bookshelf-db-nightly
spec:
  schedule: "0 20 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: bookshelf-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
