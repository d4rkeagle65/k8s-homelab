# A base backup of lidarr-postgres every night at 02:25 (CloudNativePG's schedule
# has a seconds field first; the databases are spread five minutes apart), and one
# as soon as this is applied. The WAL archive covers every change in between.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: lidarr-postgres-nightly
spec:
  schedule: "0 25 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: lidarr-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
