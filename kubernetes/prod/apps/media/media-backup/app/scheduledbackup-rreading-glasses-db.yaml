# A base backup of rreading-glasses-db every night at 03:10 (CloudNativePG's schedule
# has a seconds field first; the databases are spread five minutes apart), and one
# as soon as this is applied. The WAL archive covers every change in between.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: rreading-glasses-db-nightly
spec:
  schedule: "0 10 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: rreading-glasses-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
