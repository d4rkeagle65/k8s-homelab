# A base backup of whisparr-postgres every night at 02:45 (CloudNativePG's schedule
# has a seconds field first; the databases are spread five minutes apart), and one
# as soon as this is applied. The WAL archive covers every change in between.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: whisparr-postgres-nightly
spec:
  schedule: "0 45 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: whisparr-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
