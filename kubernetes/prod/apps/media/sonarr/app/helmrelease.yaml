apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: linuxserver/sonarr
              tag: 4.0.20.3014-ls327
            env:
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: TZ
                value: ${TIMEZONE}
              - name: SONARR__POSTGRES__HOST
                value: sonarr-postgres-rw
              - name: SONARR__POSTGRES__PORT
                value: "5432"
              - name: SONARR__POSTGRES__USER
                value: sonarr
              - name: SONARR__POSTGRES__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: sonarr-postgres-app
                    key: password
              - name: SONARR__POSTGRES__MAINDB
                value: sonarr-main
              - name: SONARR__POSTGRES__LOGDB
                value: sonarr-log
              - name: SONARR__AUTH__APIKEY
                valueFrom:
                  secretKeyRef:
                    name: sonarr
                    key: api-key
            # Startup allows ten minutes (database migrations); after that a
            # minute and a half without an answer takes it out of service and
            # two and a half restarts it. Without them, a start that gave up on
            # its database hung while counted as ready (2026-10-12). The other
            # media apps use the same timings.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 8989}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 8989}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 8989}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 110m
                memory: 608Mi
              limits:
                cpu: 1000m
                memory: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8989
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
        hosts:
          - host: sonarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: sonarr-tls
            hosts:
              - sonarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    persistence:
      config:
        existingClaim: sonarr-config
        globalMounts:
          - path: /config
      synmedia:
        existingClaim: synmedia-nfs
        globalMounts:
          - path: /synmedia
