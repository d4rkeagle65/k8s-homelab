apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-low
    controllers:
      main:
        containers:
          main:
            image:
              repository: linuxserver/sonarr
              tag: 4.0.20.3014-ls327
            env:
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: TZ
                value: ${TIMEZONE}
              - name: SONARR__POSTGRES__HOST
                value: sonarr-db-rw
              - name: SONARR__POSTGRES__PORT
                value: "5432"
              - name: SONARR__POSTGRES__USER
                value: sonarr
              - name: SONARR__POSTGRES__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: sonarr-db-app
                    key: password
              - name: SONARR__POSTGRES__MAINDB
                value: sonarr-main
              - name: SONARR__POSTGRES__LOGDB
                value: sonarr-log
              - name: SONARR__AUTH__APIKEY
                valueFrom:
                  secretKeyRef:
                    name: sonarr
                    key: api-key
              # Start-up settings pinned here rather than in config.xml, which
              # they override (old-queues/QUEUE-arr-config.md): Forms login, as set up;
              # info logs (debug floods Loki); the update channel it runs.
              - name: SONARR__AUTH__METHOD
                value: Forms
              - name: SONARR__AUTH__REQUIRED
                value: Enabled
              - name: SONARR__LOG__LEVEL
                value: info
              - name: SONARR__UPDATE__BRANCH
                value: main
              - name: SONARR__LOG__ANALYTICSENABLED
                value: "false"
              # Traefik reaches it from the pod network: trusting that network lets its
              # X-Forwarded-Proto through, so the redirect to the login page is https.
              # An http one is blocked as mixed content in Organizr's frame, which
              # then stays blank whenever the session has lapsed.
              - name: SONARR__SERVER__TRUSTEDNETWORKS
                value: ${CALICO_POD_CIDR}
            # Startup allows ten minutes (database migrations); after that a
            # minute and a half without an answer takes it out of service and
            # two and a half restarts it. Without them, a start that gave up on
            # its database hung while counted as ready (2026-10-12). The other
            # media apps use the same timings.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 8989}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 8989}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 8989}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 110m
                memory: 608Mi
              limits:
                cpu: 1000m
                memory: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8989
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
        hosts:
          - host: sonarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: sonarr-tls
            hosts:
              - sonarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    persistence:
      config:
        existingClaim: sonarr-config
        globalMounts:
          - path: /config
      # Only its own folders of the media share, each at the path it had
      # (kubernetes/shared/media/synmedia-pvc.yaml): its library, and the qBittorrent and SABnzbd
      # category folders its downloads land in.
      synmedia:
        existingClaim: synmedia-nfs
        globalMounts:
          - path: /synmedia/media/tv
            subPath: media/tv
          - path: /synmedia/torrents/tv-sonarr
            subPath: torrents/tv-sonarr
          - path: /synmedia/nzbget/tv
            subPath: nzbget/tv
