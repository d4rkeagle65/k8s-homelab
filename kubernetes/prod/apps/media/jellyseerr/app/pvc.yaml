# Seerr's config (settings.json and its SQLite database). seerr-config takes
# over from jellyseerr-config in the rename to seerr; both are kept from
# pruning, so moving between Flux Kustomizations never deletes one, and the
# old one is deleted by hand once Seerr runs on the new.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyseerr-config
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 1Gi
