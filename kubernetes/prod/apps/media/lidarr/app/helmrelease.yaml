apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lidarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-low
    controllers:
      main:
        containers:
          main:
            # The nightly channel, pinned: its qBittorrent client takes the Web UI
            # API key like Sonarr's and Radarr's (3.1.3.4968 on); stable has no
            # release since 3.1.0. Its database is upgraded past stable's.
            image:
              repository: linuxserver/lidarr
              tag: nightly-3.1.6.5102-ls221
            env:
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: TZ
                value: ${TIMEZONE}
              - name: LIDARR__POSTGRES__HOST
                value: lidarr-db-rw
              - name: LIDARR__POSTGRES__PORT
                value: "5432"
              - name: LIDARR__POSTGRES__USER
                value: lidarr
              - name: LIDARR__POSTGRES__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: lidarr-db-app
                    key: password
              - name: LIDARR__POSTGRES__MAINDB
                value: lidarr-main
              - name: LIDARR__POSTGRES__LOGDB
                value: lidarr-log
              - name: LIDARR__AUTH__APIKEY
                valueFrom:
                  secretKeyRef:
                    name: lidarr
                    key: api-key
              # Start-up settings pinned here rather than in config.xml, which
              # they override (old-queues/QUEUE-arr-config.md): Forms login, as set up;
              # info logs (debug floods Loki); the update channel it runs.
              - name: LIDARR__AUTH__METHOD
                value: Forms
              - name: LIDARR__AUTH__REQUIRED
                value: Enabled
              - name: LIDARR__LOG__LEVEL
                value: info
              - name: LIDARR__UPDATE__BRANCH
                value: nightly
              - name: LIDARR__LOG__ANALYTICSENABLED
                value: "false"
              # Traefik's forwarded headers trusted, as Sonarr's (sonarr/app/helmrelease.yaml).
              - name: LIDARR__SERVER__TRUSTEDNETWORKS
                value: ${CALICO_POD_CIDR}
            # Health probes, timed as Sonarr's (sonarr/app/helmrelease.yaml).
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 8686}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 8686}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 8686}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 40m
                memory: 352Mi
              limits:
                cpu: 500m
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8686
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
        hosts:
          - host: lidarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - lidarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            secretName: lidarr-tls
    persistence:
      config:
        existingClaim: lidarr-config
        globalMounts:
          - path: /config
      # Only its own folders of the media share, each at the path it had
      # (kubernetes/shared/media/synmedia-pvc.yaml): its library, and the qBittorrent and SABnzbd
      # category folders its downloads land in.
      synmedia:
        existingClaim: synmedia-nfs
        globalMounts:
          - path: /synmedia/media/music
            subPath: media/music
          - path: /synmedia/torrents/lidarr
            subPath: torrents/lidarr
          - path: /synmedia/nzbget/music
            subPath: nzbget/music
