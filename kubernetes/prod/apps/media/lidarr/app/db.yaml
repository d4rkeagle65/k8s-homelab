# Lidarr's databases on PostgreSQL 18 (Debian trixie), taking over from
# lidarr-postgres (Debian bullseye; old-queues/QUEUE-postgres18.md). Created empty; the data is
# copied in with pg_dump and pg_restore while the app is stopped.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: lidarr-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  instances: 2
  primaryUpdateMethod: switchover
  # Scheduled before ordinary pods when nodes are short (cluster-policy).
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  storage:
    size: 5Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (media-backup/).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
  bootstrap:
    initdb:
      database: lidarr-main
      owner: lidarr
      postInitApplicationSQL:
        - CREATE DATABASE "lidarr-log" OWNER lidarr;
