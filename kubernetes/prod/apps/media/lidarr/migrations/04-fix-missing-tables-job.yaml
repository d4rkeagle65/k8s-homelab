apiVersion: batch/v1
kind: Job
metadata:
  name: lidarr-fix-tables
  namespace: media-test
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lidarr-postgres-app
                  key: password
          command:
            - bash
            - -c
            - |
              set -e
              HOST="lidarr-postgres-rw"
              USER="lidarr"
              DB="lidarr-main"

              echo "=== Renaming any remaining lowercase tables in $DB ==="
              psql -h "$HOST" -U "$USER" -d "$DB" -t -c \
                "SELECT format('ALTER TABLE IF EXISTS %I RENAME TO %I;', tablename, initcap(tablename)) FROM pg_tables WHERE schemaname='public' AND tablename = lower(tablename);" \
                > /tmp/fix.sql
              cat /tmp/fix.sql
              psql -h "$HOST" -U "$USER" -d "$DB" -f /tmp/fix.sql
              echo "=== Done ==="
