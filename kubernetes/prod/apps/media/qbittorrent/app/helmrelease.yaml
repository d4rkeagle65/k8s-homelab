apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-low
    controllers:
      main:
        containers:
          main:
            image:
              repository: linuxserver/qbittorrent
              tag: 5.2.4_v2.0.15-ls480
            env:
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: TZ
                value: ${TIMEZONE}
              - name: WEBUI_PORT
                value: "8080"
            # Health probes, timed as Sonarr's (sonarr/app/helmrelease.yaml).
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/", port: 8080}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/", port: 8080}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/", port: 8080}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 20m
                memory: 320Mi
              limits:
                cpu: 900m
                memory: 1536Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
        hosts:
          - host: qbittorrent${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - qbittorrent${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            secretName: qbittorrent-tls
    persistence:
      config:
        existingClaim: qbittorrent-config
        globalMounts:
          - path: /config
      # Only the torrents folder of the media share, at the path it had
      # (kubernetes/shared/media/synmedia-pvc.yaml): every category's save path and the temp path.
      synmedia:
        existingClaim: synmedia-nfs
        globalMounts:
          - path: /synmedia/torrents
            subPath: torrents
