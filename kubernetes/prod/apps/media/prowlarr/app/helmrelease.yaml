apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: linuxserver/prowlarr
              tag: 2.6.5.5623-ls163
            env:
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: TZ
                value: ${TIMEZONE}
              - name: PROWLARR__POSTGRES__HOST
                value: prowlarr-postgres-rw
              - name: PROWLARR__POSTGRES__PORT
                value: "5432"
              - name: PROWLARR__POSTGRES__USER
                value: prowlarr
              - name: PROWLARR__POSTGRES__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: prowlarr-postgres-app
                    key: password
              - name: PROWLARR__POSTGRES__MAINDB
                value: prowlarr-main
              - name: PROWLARR__POSTGRES__LOGDB
                value: prowlarr-log
              - name: PROWLARR__AUTH__APIKEY
                valueFrom:
                  secretKeyRef:
                    name: prowlarr
                    key: api-key
            # Health probes, timed as Sonarr's (sonarr/app/helmrelease.yaml).
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 9696}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 9696}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 9696}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 20m
                memory: 224Mi
              limits:
                cpu: 500m
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 9696
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
        hosts:
          - host: prowlarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - prowlarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            secretName: prowlarr-tls
    persistence:
      config:
        existingClaim: prowlarr-config
        globalMounts:
          - path: /config
