apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: prowlarr-postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11
  instances: 2
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  storage:
    size: 2Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (media-backup/).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
  bootstrap:
    initdb:
      database: prowlarr-main
      owner: prowlarr
      postInitApplicationSQL:
        - CREATE DATABASE "prowlarr-log" OWNER prowlarr;
