# Prowlarr's databases on PostgreSQL 18 (Debian trixie), taking over from
# prowlarr-postgres (Debian bullseye; old-queues/QUEUE-postgres18.md). Created empty; the data is
# copied in with pg_dump and pg_restore while the app is stopped.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: prowlarr-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  instances: 2
  # Spread over the workers (scripts/tests/test_structure.py,
  # test_databases_spread, says why).
  affinity:
    podAntiAffinityType: required
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchLabels:
              cnpg.io/podRole: instance
          namespaceSelector: {}
          topologyKey: kubernetes.io/hostname
  primaryUpdateMethod: switchover
  # WAL to Garage at least hourly (scripts/tests/test_structure.py,
  # test_databases_archive_hourly, says why).
  postgresql:
    parameters:
      archive_timeout: 1h
  # Scheduled before ordinary pods when nodes are short (cluster-policy).
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 20m
      memory: 160Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  storage:
    size: 2Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (media-backup/).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
  bootstrap:
    initdb:
      database: prowlarr-main
      owner: prowlarr
      postInitApplicationSQL:
        - CREATE DATABASE "prowlarr-log" OWNER prowlarr;
