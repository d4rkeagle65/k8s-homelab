apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sabnzbd
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-low
    controllers:
      main:
        containers:
          main:
            image:
              repository: linuxserver/sabnzbd
              tag: 5.1.3-ls276
            # This image takes no settings from env vars. The hostname the
            # ingress uses must be in host_whitelist (Config > Special) in
            # /config/sabnzbd.ini, or SABnzbd refuses it while it has no login.
            env:
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: TZ
                value: ${TIMEZONE}
            # Health probes, timed as Sonarr's (sonarr/app/helmrelease.yaml).
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api?mode=version", port: 8080}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api?mode=version", port: 8080}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api?mode=version", port: 8080}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 270m
                memory: 736Mi
              limits:
                cpu: 1000m
                memory: 1920Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8080
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          # Organizr opens it in a frame (frame-from-organizr in Traefik's release).
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd,traefik_frame-from-organizr@kubernetescrd
        hosts:
          - host: sabnzbd${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - sabnzbd${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            secretName: sabnzbd-tls
    persistence:
      config:
        existingClaim: sabnzbd-config
        globalMounts:
          - path: /config
      # Only the nzbget folder of the media share, at the path it had
      # (kubernetes/shared/media/synmedia-pvc.yaml): its incomplete and complete folders and
      # every category's folder.
      synmedia:
        existingClaim: synmedia-nfs
        globalMounts:
          - path: /synmedia/nzbget
            subPath: nzbget
