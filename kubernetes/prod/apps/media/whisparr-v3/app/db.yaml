# Whisparr v3's databases on PostgreSQL 18, both owned by whisparr: its own,
# separate from v2's whisparr-db, which v2 keeps until it's retired.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: whisparr-v3-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  primaryUpdateMethod: switchover
  # WAL to Garage at least hourly (scripts/tests/test_structure.py,
  # test_databases_archive_hourly, says why).
  postgresql:
    parameters:
      archive_timeout: 1h
  # Scheduled before ordinary pods when nodes are short (cluster-policy).
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 20m
      memory: 288Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  storage:
    size: 2Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (media-backup/).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
  bootstrap:
    initdb:
      database: whisparr-main
      owner: whisparr
      postInitSQL:
        - CREATE DATABASE "whisparr-log" OWNER whisparr;
