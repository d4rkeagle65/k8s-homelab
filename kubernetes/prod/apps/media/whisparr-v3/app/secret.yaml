# Whisparr v3's API key, pinned so Configarr and Prowlarr keep working if its
# config is ever rebuilt. The WHISPARR__AUTH__APIKEY env var takes precedence
# over config.xml. WHISPARR_API_KEY holds it plain, so this is stringData.
apiVersion: v1
kind: Secret
metadata:
  name: whisparr-v3
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  api-key: ${WHISPARR_API_KEY}
