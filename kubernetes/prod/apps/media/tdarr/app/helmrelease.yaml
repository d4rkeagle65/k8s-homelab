apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-low
    controllers:
      main:
        containers:
          server:
            image:
              repository: ghcr.io/haveagitgat/tdarr
              tag: 3.00.00
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: UMASK_SET
                value: "002"
              - name: serverIP
                value: "0.0.0.0"
              - name: serverPort
                value: "8266"
              - name: webUIPort
                value: "8265"
              - name: internalNode
                value: "false"
            # Health probes, timed as Sonarr's (sonarr/app/helmrelease.yaml). The
            # node container serves nothing to probe; it reconnects to the server.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api/v2/status", port: 8265}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api/v2/status", port: 8265}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api/v2/status", port: 8265}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 10m
                memory: 320Mi
              limits:
                cpu: 500m
                memory: 640Mi
          node:
            image:
              repository: ghcr.io/haveagitgat/tdarr_node
              tag: 3.00.00
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: UMASK_SET
                value: "002"
              - name: nodeName
                value: tdarr-internal-node
              - name: serverIP
                value: "localhost"
              - name: serverPort
                value: "8266"
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                cpu: 2000m
                memory: 4Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8265
          server:
            port: 8266
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
        hosts:
          - host: tdarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: tdarr-tls
            hosts:
              - tdarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    persistence:
      server:
        existingClaim: tdarr-server
        advancedMounts:
          main:
            server:
              - path: /app/server
      configs:
        existingClaim: tdarr-configs
        advancedMounts:
          main:
            server:
              - path: /app/configs
            node:
              - path: /app/configs
      logs:
        existingClaim: tdarr-logs
        advancedMounts:
          main:
            server:
              - path: /app/logs
            node:
              - path: /app/logs
      transcode-cache:
        type: emptyDir
        advancedMounts:
          main:
            node:
              - path: /temp
      # Only the libraries it transcodes, each at the path it had
      # (kubernetes/shared/media/synmedia-pvc.yaml); the server and the node see the same paths.
      synmedia:
        existingClaim: synmedia-nfs
        advancedMounts:
          main:
            server:
              - path: /synmedia/media/tv
                subPath: media/tv
              - path: /synmedia/media/movies
                subPath: media/movies
            node:
              - path: /synmedia/media/tv
                subPath: media/tv
              - path: /synmedia/media/movies
                subPath: media/movies
