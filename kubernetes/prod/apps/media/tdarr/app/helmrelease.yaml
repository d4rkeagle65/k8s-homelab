apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tdarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-low
      # The cache is nas-iscsi, which only nodes with Talos's iscsi-tools can mount
      # (democratic-csi's helmrelease.yaml says why).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: extensions.talos.dev/iscsi-tools
                    operator: Exists
    controllers:
      main:
        # Copies the server's data from its old NFS volume (tdarr-server, kept untouched) to
        # tdarr-server-data once: the marker file says it's done, and a copy cut short
        # leaves no marker, so the next start copies again. It checks the file count.
        initContainers:
          copy-server-data:
            image:
              repository: ghcr.io/haveagitgat/tdarr
              tag: 3.01.00
            command: [sh, -c]
            args:
              - |
                set -e
                if [ -e /new/.copied-from-nfs ]; then echo "already copied"; exit 0; fi
                cp -a /old/. /new/
                want=$(cd /old && find . | wc -l)
                have=$(cd /new && find . -path ./lost+found -prune -o -print | wc -l)
                [ "$want" = "$have" ] || { echo "copied $have of $want entries"; exit 1; }
                touch /new/.copied-from-nfs
                echo "copied $have entries"
            resources:
              requests: {cpu: 10m, memory: 32Mi}
              limits: {cpu: 500m, memory: 256Mi}
        containers:
          server:
            image:
              repository: ghcr.io/haveagitgat/tdarr
              tag: 3.01.00
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: UMASK_SET
                value: "002"
              - name: serverIP
                value: "0.0.0.0"
              - name: serverPort
                value: "8266"
              - name: webUIPort
                value: "8265"
              - name: internalNode
                value: "false"
            # Health probes, timed as Sonarr's (sonarr/app/helmrelease.yaml) but allowed 15
            # seconds an answer: a busy library's database writes hold the API that long.
            # The node container serves nothing to probe; it reconnects to the server.
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api/v2/status", port: 8265}
                  periodSeconds: 10
                  timeoutSeconds: 15
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api/v2/status", port: 8265}
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api/v2/status", port: 8265}
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 5
            resources:
              requests:
                cpu: 10m
                memory: 320Mi
              limits:
                cpu: 500m
                memory: 640Mi
          node:
            image:
              repository: ghcr.io/haveagitgat/tdarr_node
              tag: 3.01.00
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: UMASK_SET
                value: "002"
              - name: nodeName
                value: tdarr-internal-node
              - name: serverIP
                value: "localhost"
              - name: serverPort
                value: "8266"
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                cpu: 2000m
                memory: 4Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 8265
          server:
            port: 8266
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
        hosts:
          - host: tdarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: tdarr-tls
            hosts:
              - tdarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    persistence:
      server:
        existingClaim: tdarr-server-data
        advancedMounts:
          main:
            server:
              - path: /app/server
            copy-server-data:
              - path: /new
      # The old NFS volume, read by the copy only; to be removed once the move is proven.
      server-nfs:
        existingClaim: tdarr-server
        advancedMounts:
          main:
            copy-server-data:
              - path: /old
                readOnly: true
      configs:
        existingClaim: tdarr-configs
        advancedMounts:
          main:
            server:
              - path: /app/configs
            node:
              - path: /app/configs
      logs:
        existingClaim: tdarr-logs
        advancedMounts:
          main:
            server:
              - path: /app/logs
            node:
              - path: /app/logs
      # The library's cache path in Tdarr is /temp, mounted on both: Tdarr wants the server
      # and its nodes to see the same library and cache paths.
      transcode-cache:
        existingClaim: tdarr-cache
        advancedMounts:
          main:
            server:
              - path: /temp
            node:
              - path: /temp
      # Only the libraries it transcodes, each at the path it had
      # (kubernetes/shared/media/synmedia-pvc.yaml); the server and the node see the same paths.
      synmedia:
        existingClaim: synmedia-nfs
        advancedMounts:
          main:
            server:
              - path: /synmedia/media/tv
                subPath: media/tv
              - path: /synmedia/media/movies
                subPath: media/movies
            node:
              - path: /synmedia/media/tv
                subPath: media/tv
              - path: /synmedia/media/movies
                subPath: media/movies
