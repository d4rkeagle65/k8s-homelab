apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-server
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-configs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-logs
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 1Gi
---
# The node's transcode cache: each file is written here in full while a flow works on it,
# more than a worker's own disk has free (about 20 GB), so a LUN on the NAS. Scratch only:
# nothing here outlives a job, so it carries no prune protection.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-cache
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-iscsi
  resources:
    requests:
      storage: 200Gi
---
# The server's data (/app/server: settings, plugins, and its file-per-record database,
# DB2) on a NAS LUN: on NFS (tdarr-server) a library's staging writes queued for tens of
# seconds, the server stopped answering, and its probes restarted it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-server-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-iscsi
  resources:
    requests:
      storage: 10Gi
