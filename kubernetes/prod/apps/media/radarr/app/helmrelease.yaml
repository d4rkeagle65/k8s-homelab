apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          main:
            image:
              repository: linuxserver/radarr
              tag: 6.4.4.10685-ls320
            env:
              - name: PUID
                value: "${MEDIA_PUID}"
              - name: PGID
                value: "${MEDIA_PGID}"
              - name: TZ
                value: ${TIMEZONE}
              - name: RADARR__POSTGRES__HOST
                value: radarr-db-rw
              - name: RADARR__POSTGRES__PORT
                value: "5432"
              - name: RADARR__POSTGRES__USER
                value: radarr
              - name: RADARR__POSTGRES__PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: radarr-db-app
                    key: password
              - name: RADARR__POSTGRES__MAINDB
                value: radarr-main
              - name: RADARR__POSTGRES__LOGDB
                value: radarr-log
              - name: RADARR__AUTH__APIKEY
                valueFrom:
                  secretKeyRef:
                    name: radarr
                    key: api-key
              # Start-up settings pinned here rather than in config.xml, which
              # they override (QUEUE-arr-config.md): Forms login, as set up;
              # info logs (debug floods Loki); the update channel it runs.
              - name: RADARR__AUTH__METHOD
                value: Forms
              - name: RADARR__AUTH__REQUIRED
                value: Enabled
              - name: RADARR__LOG__LEVEL
                value: info
              - name: RADARR__UPDATE__BRANCH
                value: master
              - name: RADARR__LOG__ANALYTICSENABLED
                value: "false"
            # Health probes, timed as Sonarr's (sonarr/app/helmrelease.yaml).
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 7878}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 7878}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/ping", port: 7878}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 20m
                memory: 384Mi
              limits:
                cpu: 1000m
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 7878
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
        hosts:
          - host: radarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - hosts:
              - radarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            secretName: radarr-tls
    persistence:
      config:
        existingClaim: radarr-config
        globalMounts:
          - path: /config
      synmedia:
        existingClaim: synmedia-nfs
        globalMounts:
          - path: /synmedia
