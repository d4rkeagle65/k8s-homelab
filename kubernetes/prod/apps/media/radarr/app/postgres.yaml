apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: radarr-postgres
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  instances: 2
  storage:
    size: 5Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (media-backup/).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
  bootstrap:
    initdb:
      database: radarr-main
      owner: radarr
      postInitApplicationSQL:
        - CREATE DATABASE "radarr-log" OWNER radarr;
