# Youtarr's database passwords and its own login (AUTH_PRESET_*: set at every
# start, so the Key Vault values are the login).
apiVersion: v1
kind: Secret
metadata:
  name: youtarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  db-password: ${YOUTARR_DB_PASSWORD}
  db-root-password: ${YOUTARR_DB_ROOT_PASSWORD}
  admin-username: ${YOUTARR_ADMIN_USERNAME}
  admin-password: ${YOUTARR_ADMIN_PASSWORD}
