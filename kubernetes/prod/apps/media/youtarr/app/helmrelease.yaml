# Youtarr (QUEUE-youtarr.md): follows YouTube channels and downloads their
# videos, with NFO files and posters, into media/youtube for Emby. Its database
# is youtarr-db (mariadb.yaml), on mariadb-operator.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: youtarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-low
      # The media user, which owns the share's folders; Youtarr runs as any UID
      # whose folders are its own, and its yt-dlp updates itself in /opt/yt-dlp
      # (mode 0777).
      securityContext:
        runAsUser: ${MEDIA_PUID}
        runAsGroup: ${MEDIA_PGID}
        fsGroup: ${MEDIA_PGID}
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      main:
        containers:
          main:
            # Pinned by version and digest.
            image:
              repository: dialmaster/youtarr
              tag: v1.90.0@sha256:b5efa19f4742e041281f9e9e2636db7eead2f3882dc425d79e1b64d28b1d5b18
            env:
              TZ: ${TIMEZONE}
              LOG_LEVEL: info
              DB_HOST: youtarr-db
              DB_PORT: "3306"
              DB_NAME: youtarr
              DB_USER: youtarr
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: youtarr
                    key: db-password
              # Its own login, set at every start from the Secret (Key Vault).
              AUTH_PRESET_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: youtarr
                    key: admin-username
              AUTH_PRESET_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: youtarr
                    key: admin-password
              # Informational only in Youtarr: where its videos are on the share.
              YOUTUBE_OUTPUT_DIR: media/youtube on the media share
            # Startup allows ten minutes (database migrations on a new version).
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /api/health, port: 3011}
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /api/health, port: 3011}
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /api/health, port: 3011}
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
            # Its compose example reserves 1Gi and limits 2Gi; downloads run
            # ffmpeg. Measure after a week of downloads and tighten.
            resources:
              requests:
                cpu: 20m
                memory: 512Mi
              limits:
                cpu: 2000m
                memory: 2Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 3011
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
        hosts:
          - host: youtarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: youtarr-tls
            hosts:
              - youtarr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    persistence:
      # Its own files, the three folders its docs say to keep. /app/migrations
      # is never mounted: an empty mount there replaces the image's migrations.
      config:
        existingClaim: youtarr-config
        globalMounts:
          - path: /app/config
            subPath: config
          - path: /app/jobs
            subPath: jobs
          - path: /app/server/images
            subPath: images
      # Only its own folder of the media share (kubernetes/shared/media/
      # synmedia-pvc.yaml), at the path Youtarr writes videos to.
      synmedia:
        existingClaim: synmedia-nfs
        globalMounts:
          - path: /usr/src/app/data
            subPath: media/youtube
