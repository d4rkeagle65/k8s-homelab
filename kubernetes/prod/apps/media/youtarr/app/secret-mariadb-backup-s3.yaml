# The Garage key for mariadb-operator's backups, allowed on the mariadb-backups
# bucket only (docker/garage/README.md, More buckets).
apiVersion: v1
kind: Secret
metadata:
  name: mariadb-backup-s3
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  access-key-id: ${MARIADB_BACKUP_S3_ACCESS_KEY_ID}
  secret-access-key: ${MARIADB_BACKUP_S3_SECRET_ACCESS_KEY}
