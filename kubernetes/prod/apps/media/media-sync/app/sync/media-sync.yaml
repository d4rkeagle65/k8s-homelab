# The media apps' settings outside Configarr (old-queues/QUEUE-arr-config.md), applied by
# media-sync.py through each app's API. A setting not named here stays the
# app's UI's; nothing unnamed is ever deleted. env:NAME takes a value from the
# Job's environment, so no secret is in this file.

bookshelf:
  # Bookshelf's book metadata comes from rreading-glasses, not Readarr's
  # retired service (prod/apps/media/rreading-glasses/).
  development:
    metadataSource: http://rreading-glasses.media:8788

qbittorrent:
  preferences:
    save_path: /synmedia/torrents/downloads/complete
    temp_path_enabled: true
    temp_path: /synmedia/torrents/downloads/temp
    # Automatic torrent management: a category's save path decides where a
    # torrent goes (each app has its own folder; synmedia-pvc.yaml).
    auto_tmm_enabled: true
    torrent_changed_tmm_enabled: true
    save_path_changed_tmm_enabled: false
    category_changed_tmm_enabled: false
    max_ratio_enabled: true
    max_ratio: 1
    max_seeding_time_enabled: true
    max_seeding_time: 1440
    max_ratio_act: 0
    queueing_enabled: true
    max_active_downloads: 3
    max_active_torrents: 5
    max_active_uploads: 3
  # Created if missing, its save path set if it differs.
  categories:
    books: /synmedia/torrents/books
    console: /synmedia/torrents/console
    lidarr: /synmedia/torrents/lidarr
    movies: /synmedia/torrents/movies
    music: /synmedia/torrents/music
    other: /synmedia/torrents/other
    prowlarr: ""
    radarr: /synmedia/torrents/radarr
    software: ""
    tv: /synmedia/torrents/tv
    tv-sonarr: /synmedia/torrents/tv-sonarr
    tv-whisparr: /synmedia/torrents/tv-whisparr
    xxx: /synmedia/torrents/xxx

sabnzbd:
  misc:
    download_dir: /synmedia/nzbget/intermediate
    complete_dir: /synmedia/nzbget/completed
  # One folder per category under nzbget/; "*" is the default category.
  categories:
    "*": {dir: "", pp: "3", script: None, priority: 0}
    movies: {dir: /synmedia/nzbget/movies, pp: "", script: Default, priority: -100}
    tv: {dir: /synmedia/nzbget/tv, pp: "", script: Default, priority: -100}
    music: {dir: /synmedia/nzbget/music, pp: "", script: Default, priority: -100}
    xxx: {dir: /synmedia/nzbget/xxx, pp: "", script: Default, priority: -100}
    prowlarr: {dir: /synmedia/nzbget/prowlarr, pp: "", script: Default, priority: -100}
    console: {dir: /synmedia/nzbget/console, pp: "", script: Default, priority: -100}
    software: {dir: /synmedia/nzbget/software, pp: "", script: Default, priority: -100}
    books: {dir: /synmedia/nzbget/books, pp: "", script: Default, priority: -100}
    other: {dir: /synmedia/nzbget/other, pp: "", script: Default, priority: -100}

seerr:
  # Matched by name; created if missing.
  radarr:
    - name: Radarr
      hostname: radarr
      port: 7878
      apiKey: env:RADARR_API_KEY
      useSsl: false
      activeProfileId: 6
      activeProfileName: HD - 720p/1080p
      activeDirectory: /synmedia/media/movies
      is4k: false
      minimumAvailability: released
      tags: []
      isDefault: true
      externalUrl: env:RADARR_EXTERNAL_URL
      syncEnabled: true
      preventSearch: false
      tagRequests: false
  sonarr:
    - name: Sonarr
      hostname: sonarr
      port: 8989
      apiKey: env:SONARR_API_KEY
      useSsl: false
      baseUrl: ""
      activeProfileId: 4
      activeProfileName: HD-1080p - Main
      activeDirectory: /synmedia/media/tv
      animeSeriesType: anime
      activeAnimeProfileId: 10
      activeAnimeProfileName: Remux-1080p - Anime - Main
      activeAnimeDirectory: /synmedia/media/tv
      tags: []
      animeTags: []
      is4k: false
      isDefault: true
      enableSeasonFolders: true
      externalUrl: env:SONARR_EXTERNAL_URL
      syncEnabled: true
      preventSearch: false
      tagRequests: false
