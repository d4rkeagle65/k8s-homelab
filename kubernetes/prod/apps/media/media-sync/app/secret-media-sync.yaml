# Seerr's API key, for media-sync's Seerr section; the other apps' keys come
# from their own Secrets (job-media-sync.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: media-sync
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  seerr-api-key: ${SEERR_API_KEY}
