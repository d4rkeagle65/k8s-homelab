apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- job-media-sync.yaml
- secret-media-sync.yaml
# The wanted settings and the script that applies them. The generated name
# carries a hash of both, so a change renames the ConfigMap and the Job runs
# again (job-media-sync.yaml).
configMapGenerator:
- name: media-sync
  files:
  - sync/media-sync.yaml
  - sync/media-sync.py
