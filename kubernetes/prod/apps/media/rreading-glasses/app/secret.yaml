# Hardcover's API token for rreading-glasses (helmrelease.yaml adds the
# "Bearer " its header needs). Hardcover resets every token on January 1:
# paste the new one into HARDCOVER_API_TOKEN, or Bookshelf's searches fail.
apiVersion: v1
kind: Secret
metadata:
  name: rreading-glasses
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  hardcover-token: ${HARDCOVER_API_TOKEN}
