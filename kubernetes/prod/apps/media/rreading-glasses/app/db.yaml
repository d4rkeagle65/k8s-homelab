# rreading-glasses' cache of Hardcover's metadata: a key-value store it fills
# as Bookshelf asks, so losing it costs only slower lookups while it refills.
# Its own cluster so its growth can never fill Bookshelf's.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rreading-glasses-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  instances: 1
  # Spread over the workers (scripts/tests/test_structure.py,
  # test_databases_spread, says why).
  affinity:
    podAntiAffinityType: required
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchLabels:
              cnpg.io/podRole: instance
          namespaceSelector: {}
          topologyKey: kubernetes.io/hostname
  # WAL to Garage at least hourly (scripts/tests/test_structure.py,
  # test_databases_archive_hourly, says why).
  postgresql:
    parameters:
      archive_timeout: 1h
  # Scheduled before ordinary pods when nodes are short (cluster-policy).
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 120m
      memory: 384Mi
    limits:
      cpu: 1000m
      memory: 1536Mi
  storage:
    size: 5Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (media-backup/).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
  bootstrap:
    initdb:
      database: rreading-glasses
      owner: rreading-glasses
