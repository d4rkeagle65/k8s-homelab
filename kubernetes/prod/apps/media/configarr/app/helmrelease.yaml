apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: configarr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-low
    controllers:
      main:
        type: cronjob
        cronjob:
          # Hourly, off the hour; a run takes about a minute.
          schedule: "17 * * * *"
          timeZone: ${TIMEZONE}
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 600
          backoffLimit: 1
          successfulJobsHistory: 1
          failedJobsHistory: 3
        pod:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
        containers:
          main:
            # Configarr (github.com/raydak-labs/configarr): applies config.yml to
            # the apps through their APIs, then exits. Pinned by digest as well.
            image:
              repository: ghcr.io/raydak-labs/configarr
              tag: 1.35.0@sha256:13ef4d9a6ebc13178c8c74813dd12e11ea7331e186a492d79d938513887b96d4
            env:
              # "true" makes every run only report its diff: set it for a change
              # whose diff should be read first (QUEUE-arr-config.md).
              - name: DRY_RUN
                value: "false"
              - name: TZ
                value: ${TIMEZONE}
              - name: HOME
                value: /tmp
              - name: QBITTORRENT_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: configarr
                    key: qbittorrent-api-key
              - name: SABNZBD_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: configarr
                    key: sabnzbd-api-key
              # Each app's own API key, from the Secret that pins it there.
              - name: SONARR_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: sonarr
                    key: api-key
              - name: RADARR_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: radarr
                    key: api-key
              - name: LIDARR_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: lidarr
                    key: api-key
              - name: BOOKSHELF_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: bookshelf
                    key: api-key
              - name: PROWLARR_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: prowlarr
                    key: api-key
            resources:
              requests:
                cpu: 20m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
    persistence:
      config:
        type: configMap
        name: configarr
        globalMounts:
          - path: /app/config/config.yml
            subPath: config.yml
            readOnly: true
      # The template repositories it clones on each run, and its temp files.
      repos:
        type: emptyDir
        globalMounts:
          - path: /app/repos
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
