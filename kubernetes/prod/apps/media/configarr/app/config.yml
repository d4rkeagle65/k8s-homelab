# Configarr's configuration: the media apps' database-held settings, from git
# (QUEUE-arr-config.md). Each instance names only where it is and its API key
# (from the app's own Secret, through the CronJob's env) until a phase captures
# a section; a section left out is the app's UI's to set. Nothing unmanaged is
# ever deleted.
#
# Quality profiles: Configarr compares a profile's qualities by name and order
# only, so flipping one's `enabled` here applies only with another change to that
# profile (and one flipped in the app's UI isn't put back). Every profile needs an
# `upgrade` block, or Configarr drops it; with upgrades off it keeps until_quality
# as the cutoff and sets the cutoff score to 1.
sonarr:
  sonarr:
    base_url: http://sonarr:8989
    api_key: !env SONARR_API_KEY
    # Phase 5 (QUEUE-arr-config.md): quality captured from the app as it was;
    # its custom formats are in customFormatDefinitions at the end of this file.
    quality_definition:
      qualities:
        - quality: "Unknown"
          min: 1
          preferred: 95
          max: 199.9
        - quality: "SDTV"
          min: 2
          preferred: 95
          max: 100
