      authorFolderFormat: "{Author Name}"
      includeAuthorName: false
      includeBookTitle: false
      includeQuality: false
      replaceSpaces: false
    media_management:
      autoUnmonitorPreviouslyDownloadedBooks: false
      recycleBin: ""
      recycleBinCleanupDays: 7
      downloadPropersAndRepacks: "preferAndUpgrade"
      createEmptyAuthorFolders: false
      deleteEmptyFolders: true
      fileDate: "none"
      watchLibraryForChanges: true
      rescanAfterRefresh: "always"
      allowFingerprinting: "newFiles"
      setPermissionsLinux: false
      chmodFolder: "755"
      chownGroup: ""
      skipFreeSpaceCheckWhenImporting: false
      minimumFreeSpaceWhenImporting: 100
      copyUsingHardlinks: true
      importExtraFiles: true
      extraFileExtensions: "srt,sub,nfo,mobi"
    ui_config:
      firstDayOfWeek: 0
      calendarWeekColumnHeader: "ddd M/D"
      shortDateFormat: "MMM D YYYY"
      longDateFormat: "dddd, MMMM D YYYY"
      timeFormat: "h(:mm)a"
      showRelativeDates: true
      enableColorImpairedMode: false
      uiLanguage: 1
      theme: "auto"
    # "None" is built in and stays the app's. "Standard" keeps a book with a
    # popularity (ratings x average stars) of 15 or more.
    metadata_profiles:
      - name: "Standard"
        min_popularity: 15
        skip_missing_date: true
        skip_missing_isbn: false
        skip_parts_and_sets: true
        skip_secondary_series: false
        allowed_languages: ["eng", "null"]
        min_pages: 0
        must_not_contain: []
      # For authors whose books few people rate (the D&D rulebooks: popularity is
      # ratings x average stars, and most have under five ratings).
      - name: "Everything"
        min_popularity: 0
        skip_missing_date: false
        skip_missing_isbn: false
        skip_parts_and_sets: false
        skip_secondary_series: false
        allowed_languages: ["eng"]
        min_pages: 0
        must_not_contain: []
    # qBittorrent and SABnzbd, every field as the app had it. A client Configarr
    # updates takes the schema's default for any field left out.
    download_clients:
      # The key is written on every run: the apps never show it, so it can't
      # be compared, and the diff report lists it each time.
      update_password: true
      data:
        - name: qBittorrent
          type: qbittorrent
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: "qBittorrent"
            port: 8080
            use_ssl: false
            api_key: !env QBITTORRENT_API_KEY
            music_category: "books"
            recent_tv_priority: 0
            older_tv_priority: 0
            initial_state: 0
            sequential_order: false
            first_and_last: false
            content_layout: 0
        - name: SABnzbd
          type: sabnzbd
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: "sabnzbd"
            port: 8080
            use_ssl: false
            api_key: !env SABNZBD_API_KEY
            music_category: "books"
            recent_tv_priority: -100
            older_tv_priority: -100
      config:
        download_client_working_folders: "_UNPACK_|_FAILED_"
        enable_completed_download_handling: true
        auto_redownload_failed: true
        auto_redownload_failed_from_interactive_search: true
whisparr:
  whisparr-v3:
    base_url: http://whisparr-v3:6969
    api_key: !env WHISPARR_API_KEY
    # Whisparr v3 (QUEUE-arr-config.md), Configarr's experimental support. Started
    # empty (2026-10-19), so these are set rather than captured: v2's root
    # folders and download category. Its qBittorrent client waits: this build
    # takes only a Web UI username and password, not the API key.
    root_folders:
      - "/synmedia/media/xxx/movies"
      - "/synmedia/media/xxx/scenes"
    download_clients:
      # The key is written on every run: the apps never show it, so it can't
      # be compared, and the diff report lists it each time.
      update_password: true
      data:
        - name: SABnzbd
          type: sabnzbd
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: "sabnzbd"
            port: 8080
            use_ssl: false
            api_key: !env SABNZBD_API_KEY
            movie_category: "xxx"
            recent_movie_priority: -100
            older_movie_priority: -100

