    # Phase 4 (QUEUE-arr-config.md): captured from the app as it was.
    # Created if missing; unlisted tags are left alone.
    tags:
      - "1 - david"
      - "kids"
      - "x265-megusta"
    # The complete list: Configarr deletes a root folder not named here.
    root_folders:
      - "/synmedia/media/tv"
      - "/synmedia/media/youtube"
    delay_profiles:
      default:
        enableUsenet: true
        enableTorrent: true
        preferredProtocol: "usenet"
        usenetDelay: 0
        torrentDelay: 0
        bypassIfHighestQuality: true
        bypassIfAboveCustomFormatScore: false
        minimumCustomFormatScore: 0
    media_naming_api:
      renameEpisodes: true
      replaceIllegalCharacters: true
      colonReplacementFormat: 4
      customColonReplacementFormat: ""
      multiEpisodeStyle: 5
      standardEpisodeFormat: "{Series TitleYear} - S{season:00}E{episode:00} - {Episode CleanTitle} [{Custom Formats }{Quality Full}]{[MediaInfo VideoDynamicRangeType]}{[Mediainfo AudioCodec}{ Mediainfo AudioChannels]}{[MediaInfo VideoCodec]}{-Release Group}"
      dailyEpisodeFormat: "{Series TitleYear} - {Air-Date} - {Episode CleanTitle} [{Custom Formats }{Quality Full}]{[MediaInfo VideoDynamicRangeType]}{[Mediainfo AudioCodec}{ Mediainfo AudioChannels]}{[MediaInfo VideoCodec]}{-Release Group}"
      animeEpisodeFormat: "{Series TitleYear} - S{season:00}E{episode:00} - {absolute:000} - {Episode CleanTitle} [{Custom Formats }{Quality Full}]{[MediaInfo VideoDynamicRangeType]}[{MediaInfo VideoBitDepth}bit]{[MediaInfo VideoCodec]}[{Mediainfo AudioCodec} { Mediainfo AudioChannels}]{MediaInfo AudioLanguages}{-Release Group}"
      seriesFolderFormat: "{Series TitleYear} [imdb-{ImdbId}]"
      seasonFolderFormat: "{Series CleanTitle} Season {season:00}"
      specialsFolderFormat: "{Series CleanTitle} Specials"
    media_management:
      autoUnmonitorPreviouslyDownloadedEpisodes: true
      recycleBin: ""
      recycleBinCleanupDays: 7
      downloadPropersAndRepacks: "doNotPrefer"
      createEmptySeriesFolders: false
      deleteEmptyFolders: true
      fileDate: "none"
      rescanAfterRefresh: "always"
      setPermissionsLinux: false
      chmodFolder: "755"
      chownGroup: ""
      episodeTitleRequired: "always"
      skipFreeSpaceCheckWhenImporting: false
      minimumFreeSpaceWhenImporting: 100
      copyUsingHardlinks: true
      useScriptImport: false
      scriptImportPath: ""
      importExtraFiles: true
      extraFileExtensions: "sub,nfo"
      enableMediaInfo: true
    ui_config:
      firstDayOfWeek: 0
      calendarWeekColumnHeader: "ddd M/D"
      shortDateFormat: "MMM D YYYY"
      longDateFormat: "dddd, MMMM D YYYY"
      timeFormat: "h(:mm)a"
      showRelativeDates: true
      enableColorImpairedMode: false
      theme: "auto"
      uiLanguage: 1
    # qBittorrent and SABnzbd, every field as the app had it. A client Configarr
    # updates takes the schema's default for any field left out.
    download_clients:
      # The key is written on every run: the apps never show it, so it can't
      # be compared, and the diff report lists it each time.
      update_password: true
      data:
        - name: qBittorrent
          type: qbittorrent
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: "qbittorrent"
            port: 8080
            use_ssl: false
            api_key: !env QBITTORRENT_API_KEY
            tv_category: "tv-sonarr"
            recent_tv_priority: 0
            older_tv_priority: 0
            initial_state: 0
            sequential_order: false
            first_and_last: false
            content_layout: 0
        - name: SABnzbd
          type: sabnzbd
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: "sabnzbd"
            port: 8080
            use_ssl: false
            api_key: !env SABNZBD_API_KEY
            tv_category: "tv"
            recent_tv_priority: -100
            older_tv_priority: -100
      config:
        download_client_working_folders: "_UNPACK_|_FAILED_"
        enable_completed_download_handling: true
        auto_redownload_failed: true
        auto_redownload_failed_from_interactive_search: true
