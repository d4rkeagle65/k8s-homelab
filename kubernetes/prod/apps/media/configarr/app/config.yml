        download_client_working_folders: "_UNPACK_|_FAILED_"
        enable_completed_download_handling: true
        auto_redownload_failed: true
        auto_redownload_failed_from_interactive_search: true
# Bookshelf is a Readarr fork, and Configarr's Readarr support drives it.
readarr:
  bookshelf:
    base_url: http://bookshelf:8787
    api_key: !env BOOKSHELF_API_KEY
    # Phase 4 (QUEUE-arr-config.md): captured from the app as it was.
    # The complete list: Configarr deletes a root folder not named here.
    root_folders:
      - path: "/synmedia/media/books"
        name: "Synmedia books"
        quality_profile: "eBook"
        metadata_profile: "Standard"
        monitor: "all"
        monitor_new_items: "all"
        is_calibre_library: false
    delay_profiles:
      default:
        enableUsenet: true
        enableTorrent: true
        preferredProtocol: "usenet"
        usenetDelay: 0
        torrentDelay: 0
        bypassIfHighestQuality: true
        bypassIfAboveCustomFormatScore: false
        minimumCustomFormatScore: 0
    media_naming_api:
      renameBooks: true
      replaceIllegalCharacters: true
      colonReplacementFormat: 4
      # Under the author folder (authorFolderFormat), so a file lands at
      # {Author Name}/{Book Title}/{Author Name} - {Book Title}{ (PartNumber)}.
      standardBookFormat: "{Book Title}/{Author Name} - {Book Title}{ (PartNumber)}"
      authorFolderFormat: "{Author Name}"
      includeAuthorName: false
      includeBookTitle: false
      includeQuality: false
      replaceSpaces: false
    media_management:
      autoUnmonitorPreviouslyDownloadedBooks: false
      recycleBin: ""
      recycleBinCleanupDays: 7
      downloadPropersAndRepacks: "preferAndUpgrade"
      createEmptyAuthorFolders: false
      deleteEmptyFolders: true
      fileDate: "none"
      watchLibraryForChanges: true
      rescanAfterRefresh: "always"
      allowFingerprinting: "newFiles"
      setPermissionsLinux: false
      chmodFolder: "755"
      chownGroup: ""
      skipFreeSpaceCheckWhenImporting: false
      minimumFreeSpaceWhenImporting: 100
      copyUsingHardlinks: true
      importExtraFiles: true
      extraFileExtensions: "srt,sub,nfo,mobi"
    ui_config:
      firstDayOfWeek: 0
      calendarWeekColumnHeader: "ddd M/D"
      shortDateFormat: "MMM D YYYY"
      longDateFormat: "dddd, MMMM D YYYY"
      timeFormat: "h(:mm)a"
      showRelativeDates: true
      enableColorImpairedMode: false
      uiLanguage: 1
      theme: "auto"
    # "None" is built in and stays the app's. "Standard" keeps a book with a
    # popularity (ratings x average stars) of 15 or more.
    metadata_profiles:
      - name: "Standard"
        min_popularity: 15
        skip_missing_date: true
        skip_missing_isbn: false
        skip_parts_and_sets: true
        skip_secondary_series: false
        allowed_languages: ["eng", "null"]
        min_pages: 0
        must_not_contain: []
      # For authors whose books few people rate (the D&D rulebooks: popularity is
      # ratings x average stars, and most have under five ratings).
      - name: "Everything"
        min_popularity: 0
        skip_missing_date: false
        skip_missing_isbn: false
        skip_parts_and_sets: false
        skip_secondary_series: false
        allowed_languages: ["eng"]
        min_pages: 0
        must_not_contain: []
    # qBittorrent and SABnzbd, every field as the app had it. A client Configarr
    # updates takes the schema's default for any field left out.
    download_clients:
      # The key is written on every run: the apps never show it, so it can't
      # be compared, and the diff report lists it each time.
      update_password: true
      data:
        - name: qBittorrent
          type: qbittorrent
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: "qBittorrent"
            port: 8080
            use_ssl: false
            api_key: !env QBITTORRENT_API_KEY
            music_category: "books"
            recent_tv_priority: 0
            older_tv_priority: 0
            initial_state: 0
            sequential_order: false
            first_and_last: false
            content_layout: 0
        - name: SABnzbd
          type: sabnzbd
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: "sabnzbd"
            port: 8080
            use_ssl: false
            api_key: !env SABNZBD_API_KEY
            music_category: "books"
            recent_tv_priority: -100
            older_tv_priority: -100
      config:
        download_client_working_folders: "_UNPACK_|_FAILED_"
        enable_completed_download_handling: true
        auto_redownload_failed: true
        auto_redownload_failed_from_interactive_search: true
prowlarr:
  prowlarr:
    base_url: http://prowlarr:9696
    api_key: !env PROWLARR_API_KEY
    # Phase 4 (QUEUE-arr-config.md): captured from Prowlarr as it was. Its link to
    # Whisparr stays the UI's (Whisparr is being replaced, and its key isn't in a Secret).
    applications:
      data:
        - name: "Bookshelf"
          type: Readarr
          sync_level: fullSync
          fields:
            prowlarrUrl: "http://prowlarr:9696"
            baseUrl: "http://bookshelf:8787"
            apiKey: !env BOOKSHELF_API_KEY
            syncCategories: [3030, 7000, 7010, 7020, 7030, 7040, 7050, 7060]
            syncRejectBlocklistedTorrentHashesWhileGrabbing: false
          tags: []
        - name: "Lidarr"
          type: Lidarr
          sync_level: fullSync
          fields:
            prowlarrUrl: "http://prowlarr:9696"
            baseUrl: "http://lidarr:8686"
            apiKey: !env LIDARR_API_KEY
            syncCategories: [3000, 3010, 3030, 3040, 3050, 3060]
            syncRejectBlocklistedTorrentHashesWhileGrabbing: false
          tags: []
        - name: "Radarr"
          type: Radarr
          sync_level: fullSync
          fields:
            prowlarrUrl: "http://prowlarr:9696"
            baseUrl: "http://radarr:7878"
            apiKey: !env RADARR_API_KEY
            syncCategories: [2000, 2010, 2020, 2030, 2040, 2045, 2050, 2060, 2070, 2080, 2090]
            syncRejectBlocklistedTorrentHashesWhileGrabbing: false
          tags: []
        - name: "Sonarr"
          type: Sonarr
          sync_level: fullSync
          fields:
            prowlarrUrl: "http://prowlarr:9696"
            baseUrl: "http://sonarr:8989"
            apiKey: !env SONARR_API_KEY
            syncCategories: [5000, 5010, 5020, 5030, 5040, 5045, 5050, 5090]
            animeSyncCategories: [5070]
            syncAnimeStandardFormatSearch: true
            syncRejectBlocklistedTorrentHashesWhileGrabbing: false
          tags: []
    sync_profiles:
      data:
        - name: "Standard"
          enable_rss: true
          enable_automatic_search: true
          enable_interactive_search: true
          minimum_seeders: 1
    # qBittorrent and SABnzbd, every field as the app had it. A client Configarr
    # updates takes the schema's default for any field left out.
    download_clients:
      # The key is written on every run: the apps never show it, so it can't
      # be compared, and the diff report lists it each time.
      update_password: true
      data:
        - name: qBittorrent
          type: qbittorrent
          enable: true
          priority: 1
          fields:
            host: "qbittorrent"
            port: 8080
            use_ssl: false
            api_key: !env QBITTORRENT_API_KEY
            category: "prowlarr"
            priority: 0
            initial_state: 0
            sequential_order: false
            first_and_last: false
            content_layout: 0
        - name: SABnzbd
          type: sabnzbd
          enable: true
          priority: 1
          fields:
            host: "sabnzbd"
            port: 8080
            use_ssl: false
            api_key: !env SABNZBD_API_KEY
            category: "prowlarr"
            priority: -100
