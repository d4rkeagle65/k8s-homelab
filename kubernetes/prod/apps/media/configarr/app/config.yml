# Configarr's configuration: the media apps' database-held settings, from git
# (QUEUE-arr-config.md). Each instance names only where it is and its API key
# (from the app's own Secret, through the CronJob's env) until a phase captures
# a section; a section left out is the app's UI's to set. Nothing unmanaged is
# ever deleted.
sonarr:
  sonarr:
    base_url: http://sonarr:8989
    api_key: !env SONARR_API_KEY
    # qBittorrent only, every field as the app had it (phase 3); SABnzbd stays
    # the UI's until its API key is in Vaultwarden: a client Configarr updates
    # takes the schema's default for any field left out, blanking its key.
    download_clients:
      # The key is written on every run: the apps never show it, so it can't
      # be compared, and the diff report lists it each time.
      update_password: true
      data:
        - name: qBittorrent
          type: qbittorrent
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: "qbittorrent"
            port: 8080
            use_ssl: false
            api_key: !env QBITTORRENT_API_KEY
            tv_category: "tv-sonarr"
            recent_tv_priority: 0
            older_tv_priority: 0
            initial_state: 0
            sequential_order: false
            first_and_last: false
            content_layout: 0
      config:
        download_client_working_folders: "_UNPACK_|_FAILED_"
        enable_completed_download_handling: true
        auto_redownload_failed: true
        auto_redownload_failed_from_interactive_search: true
