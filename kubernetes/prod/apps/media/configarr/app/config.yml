lidarr:
  lidarr:
    base_url: http://lidarr:8686
    api_key: !env LIDARR_API_KEY
    # Phase 4 (QUEUE-arr-config.md): captured from the app as it was.
    # The complete list: Configarr deletes a root folder not named here.
    root_folders:
      - path: "/synmedia/media/music"
        name: "Synmedia Music"
        quality_profile: "Any"
        metadata_profile: "Standard"
        monitor: "all"
        monitor_new_album: "all"
    delay_profiles:
      default:
        items:
          - {name: "Usenet", protocol: "UsenetDownloadProtocol", allowed: true, delay: 0}
          - {name: "Torrent", protocol: "TorrentDownloadProtocol", allowed: true, delay: 0}
        bypassIfHighestQuality: true
        bypassIfAboveCustomFormatScore: false
        minimumCustomFormatScore: 0
    media_naming_api:
      renameTracks: false
      replaceIllegalCharacters: true
      colonReplacementFormat: 4
      standardTrackFormat: "{Album Title} ({Release Year})/{Artist Name} - {Album Title} - {track:00} - {Track Title}"
      multiDiscTrackFormat: "{Album Title} ({Release Year})/{Medium Format} {medium:00}/{Artist Name} - {Album Title} - {track:00} - {Track Title}"
      artistFolderFormat: "{Artist Name}"
      includeArtistName: false
      includeAlbumTitle: false
      includeQuality: false
      replaceSpaces: false
    media_management:
      autoUnmonitorPreviouslyDownloadedTracks: false
      recycleBin: ""
      recycleBinCleanupDays: 7
      downloadPropersAndRepacks: "preferAndUpgrade"
      createEmptyArtistFolders: false
      deleteEmptyFolders: false
      fileDate: "none"
      watchLibraryForChanges: true
      rescanAfterRefresh: "always"
      allowFingerprinting: "newFiles"
      setPermissionsLinux: false
      chmodFolder: "755"
      chownGroup: ""
      skipFreeSpaceCheckWhenImporting: false
      minimumFreeSpaceWhenImporting: 100
      copyUsingHardlinks: true
      enableMediaInfo: true
      useScriptImport: false
      scriptImportPath: ""
      importExtraFiles: false
      extraFileExtensions: "srt"
    ui_config:
      firstDayOfWeek: 0
      calendarWeekColumnHeader: "ddd M/D"
      shortDateFormat: "MMM D YYYY"
      longDateFormat: "dddd, MMMM D YYYY"
      timeFormat: "h(:mm)a"
      showRelativeDates: true
      enableColorImpairedMode: false
      uiLanguage: 1
      expandAlbumByDefault: false
      expandSingleByDefault: false
      expandEPByDefault: false
      expandBroadcastByDefault: false
      expandOtherByDefault: false
      theme: "auto"
    # "None" is built in (nothing allowed) and stays the app's.
    metadata_profiles:
      - name: "Standard"
        primary_types: ["Album"]
        secondary_types: ["Studio"]
        release_statuses: ["Official"]
    # qBittorrent and SABnzbd, every field as the app had it. A client Configarr
    # updates takes the schema's default for any field left out.
    download_clients:
      # The key is written on every run: the apps never show it, so it can't
      # be compared, and the diff report lists it each time.
      update_password: true
      data:
        - name: qBittorrent
          type: qbittorrent
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: "qbittorrent"
            port: 8080
            use_ssl: false
            api_key: !env QBITTORRENT_API_KEY
            username: ""
            password: ""
            music_category: "lidarr"
            recent_music_priority: 0
            older_music_priority: 0
            initial_state: 0
            sequential_order: false
            first_and_last: false
            content_layout: 0
        - name: SABnzbd
          type: sabnzbd
          enable: true
          priority: 1
          remove_completed_downloads: true
          remove_failed_downloads: true
          fields:
            host: "sabnzbd"
            port: 8080
            use_ssl: false
            api_key: !env SABNZBD_API_KEY
            music_category: "music"
            recent_music_priority: -100
            older_music_priority: -100
