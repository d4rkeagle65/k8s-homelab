# The download clients' API keys, which Configarr writes into each app's
# qBittorrent and SABnzbd clients (config.yml), and qBittorrent's Web UI login,
# for Whisparr v3's client, which takes no API key. Rotate one in its app, then
# paste it into its Vaultwarden field: the next hourly run sets it everywhere.
apiVersion: v1
kind: Secret
metadata:
  name: configarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  qbittorrent-api-key: ${QBITTORRENT_API_KEY}
  qbittorrent-username: ${QBITTORRENT_USERNAME}
  qbittorrent-password: ${QBITTORRENT_PASSWORD}
  sabnzbd-api-key: ${SABNZBD_API_KEY}
