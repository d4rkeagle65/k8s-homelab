# The download clients' API keys, which Configarr writes into each app's
# qBittorrent and SABnzbd clients (config.yml). Rotate one in its app, then paste
# it into its Vaultwarden field: the next hourly run sets it everywhere.
apiVersion: v1
kind: Secret
metadata:
  name: configarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  qbittorrent-api-key: ${QBITTORRENT_API_KEY}
  sabnzbd-api-key: ${SABNZBD_API_KEY}
