# qBittorrent's Web UI API key, which Configarr writes into each app's
# qBittorrent client (config.yml). Rotate it in qBittorrent, then paste it into
# QBITTORRENT_API_KEY: the next hourly run sets it everywhere.
apiVersion: v1
kind: Secret
metadata:
  name: configarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  qbittorrent-api-key: ${QBITTORRENT_API_KEY}
