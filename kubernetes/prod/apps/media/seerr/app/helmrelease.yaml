# Seerr, Jellyseerr's successor: requests for the *arr apps. It migrated
# Jellyseerr's settings.json and database on its first start, one way; the copy
# from before is jellyseerr-2.7.3-backup.tgz on the config claim.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seerr
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: media
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-low
    controllers:
      main:
        # Seerr runs as its image's node user, not root: the config claim's
        # files belong to it (1000:1000).
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
        containers:
          main:
            image:
              repository: ghcr.io/seerr-team/seerr
              tag: v3.5.0
            env:
              - name: TZ
                value: ${TIMEZONE}
              - name: LOG_LEVEL
                value: info
            # Health probes, timed as Sonarr's (sonarr/app/helmrelease.yaml).
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api/v1/status", port: 5055}
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api/v1/status", port: 5055}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: "/api/v1/status", port: 5055}
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 10m
                memory: 576Mi
              limits:
                cpu: 1000m
                memory: 1152Mi
    service:
      main:
        controller: main
        ports:
          http:
            port: 5055
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
        hosts:
          - host: seerr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: seerr-tls
            hosts:
              - seerr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    persistence:
      config:
        existingClaim: seerr-config
        globalMounts:
          - path: /app/config
