# Seerr's config (settings.json and its SQLite database). Kept from pruning,
# so moving it between Flux Kustomizations never deletes it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seerr-config
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 1Gi
