# A base backup of mealie's database every night at 02:30 (CloudNativePG's
# schedule has a seconds field first), and one as soon as this is applied.
# Between them, the WAL archive covers every change, so any moment in the
# retention window can be restored.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mealie-postgres-nightly
spec:
  schedule: "0 30 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: mealie-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
