# The client ID and secret of Authentik's mealie provider. Key Vault holds the
# MEALIE_OIDC_* values plain, and the cluster-secrets template encodes them
# (b64enc) for this Secret's data.
apiVersion: v1
kind: Secret
metadata:
  name: mealie-oidc
type: Opaque
data:
  client-id: ${MEALIE_OIDC_CLIENT_ID}
  client-secret: ${MEALIE_OIDC_CLIENT_SECRET}
