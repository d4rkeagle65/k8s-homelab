# mealie's files: recipe images, uploads and its own backups. Its database is
# mealie-postgres.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mealie-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 5Gi
