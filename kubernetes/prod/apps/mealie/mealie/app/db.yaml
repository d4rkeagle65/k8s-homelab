# Mealie's database on PostgreSQL 18 (Debian trixie), taking over from mealie-postgres
# (Debian bullseye; QUEUE-postgres18.md). Created empty; the data is copied in
# with pg_dump and pg_restore while Mealie is stopped.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mealie-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  affinity:
    podAntiAffinityType: preferred
  enablePDB: true
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: mealie
      owner: app
      # mealie's backup restore starts with SET session_replication_role,
      # which only a superuser may set unless granted. This runs once, when
      # the database is first created; the live one got it by hand.
      postInitApplicationSQL:
      - GRANT SET ON PARAMETER session_replication_role TO app
  storage:
    size: 2Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (objectstore.yaml).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
