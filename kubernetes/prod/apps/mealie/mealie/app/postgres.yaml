# mealie's database: two copies on the workers' local disks (local-db), so it
# survives losing a worker. CloudNativePG puts the app user's credentials in
# the mealie-postgres-app Secret.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mealie-postgres
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  affinity:
    podAntiAffinityType: preferred
  enablePDB: true
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: mealie
      owner: app
      # mealie's backup restore starts with SET session_replication_role,
      # which only a superuser may set unless granted. This runs once, when
      # the database is first created; the live one got it by hand.
      postInitApplicationSQL:
      - GRANT SET ON PARAMETER session_replication_role TO app
  storage:
    size: 2Gi
    storageClass: local-db
