apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: nextcloud
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/apps/nextcloud/nextcloud/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: nextcloud
  # nextcloud-db is a CloudNativePG Cluster; secrets are generated by External Secrets.
  dependsOn:
  - name: cnpg
  - name: plugin-barman-cloud
  - name: external-secrets
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
