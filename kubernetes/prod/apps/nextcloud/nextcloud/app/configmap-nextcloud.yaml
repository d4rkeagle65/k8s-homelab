# before-starting hook the nextcloud image runs (as www-data) on every start, after
# install/upgrade and before Apache. It configures what the image's env vars don't (or
# only apply at first install): the trusted domain, Redis cache + file locking, the
# reverse-proxy trust, allowing server-side requests to the private-IP IdP, cron
# background jobs, and the Authentik OIDC provider (user_oidc). Everything is an
# idempotent occ upsert, so running it every start is safe and lets config changes
# (like a hostname change) take effect on a pod restart. Shell env refs are written as
# $${VAR} so Flux leaves them for the container; ${SUBDOMAIN_SUFFIX}/${BASE_DOMAIN} are
# Flux variables.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud-hooks
data:
  setup.sh: |
    #!/bin/sh
    occ="php /var/www/html/occ"

    # The access hostname. NEXTCLOUD_TRUSTED_DOMAINS only applies at first install, so
    # set it here too (and so a rename takes effect on restart).
    $$occ config:system:set trusted_domains 0 --value='nextcloud${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}'

    # Redis: distributed cache + transactional file locking (needed on NFS).
    $$occ config:system:set memcache.local --value='\OC\Memcache\APCu'
    $$occ config:system:set memcache.distributed --value='\OC\Memcache\Redis'
    $$occ config:system:set memcache.locking --value='\OC\Memcache\Redis'
    $$occ config:system:set redis host --value='nextcloud-redis'
    $$occ config:system:set redis port --type=integer --value=6379
    $$occ config:system:set redis password --value="$${REDIS_HOST_PASSWORD}"

    # Trust the in-cluster reverse proxy (Traefik reaches us from the pod network),
    # run background jobs via cron (the sidecar), and give the nightly jobs a window.
    $$occ config:system:set trusted_proxies 0 --value='10.229.0.0/16'
    $$occ config:system:set maintenance_window_start --type=integer --value=1
    $$occ background:cron

    # serverinfo API token for the Prometheus exporter (exporter.yaml reads the same
    # value from nextcloud-secrets); lets it scrape without an admin login.
    $$occ config:app:set serverinfo token --value="$${NEXTCLOUD_SERVERINFO_TOKEN}"

    # Let Nextcloud's server-side HTTP client reach the IdP: auth.${BASE_DOMAIN} resolves
    # to a private (in-cluster Traefik) address, which Nextcloud blocks by default -
    # that's the "Could not reach the OpenID Connect provider" error from user_oidc.
    $$occ config:system:set allow_local_remote_servers --type=boolean --value=true
    $$occ config:system:set user_oidc httpclient.allowlocal --type=boolean --value=true

    # Authentik OIDC via user_oidc. Non-fatal (|| true) so a transient App Store or
    # IdP hiccup doesn't block the pod.
    $$occ app:install user_oidc || $$occ app:enable user_oidc || true
    $$occ user_oidc:provider Authentik \
      --clientid='nextcloud' \
      --clientsecret="$${NEXTCLOUD_OIDC_CLIENT_SECRET}" \
      --discoveryuri="https://auth.${BASE_DOMAIN}/application/o/nextcloud/.well-known/openid-configuration" \
      --scope='openid email profile' || true
    # One provider -> the login page offers the Authentik button; the local admin can
    # still sign in at /login?direct=1.
    $$occ config:app:set --type=string --value=0 user_oidc allow_multiple_user_backends || true
