# Nextcloud: private networks only (LAN, cluster, tailnet). No Cloudflare tunnel route,
# so it isn't reachable from the internet; sync clients work on-network or over Tailscale.
# Nextcloud does its own OIDC against Authentik, so there's no forward-auth middleware.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: cloud${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nextcloud
            port:
              number: 80
  tls:
  - hosts:
    - cloud${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    secretName: nextcloud-tls
---
# Plain http:// redirects to https:// (the route above listens on websecure only, and
# the Cloudflare tunnel has no route for this host).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextcloud-http-redirect
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: cloud${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nextcloud
            port:
              number: 80
