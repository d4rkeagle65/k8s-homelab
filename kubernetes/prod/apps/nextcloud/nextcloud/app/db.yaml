# Nextcloud's PostgreSQL. One database `nextcloud` owned by the `nextcloud` role;
# the app connects as that role (deployment.yaml's POSTGRES_* env). The password is
# generated (externalsecret-db.yaml) and applied by CloudNativePG as a managed role.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  primaryUpdateMethod: switchover
  # WAL to Garage at least hourly (scripts/tests/test_structure.py,
  # test_databases_archive_hourly, says why).
  postgresql:
    parameters:
      archive_timeout: 1h
  # Scheduled before ordinary pods when nodes are short (cluster-policy).
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 30m
      memory: 352Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  # Spread over the workers (scripts/tests/test_structure.py, test_databases_spread).
  affinity:
    podAntiAffinityType: required
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchLabels:
              cnpg.io/podRole: instance
          namespaceSelector: {}
          topologyKey: kubernetes.io/hostname
  enablePDB: true
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      secret:
        name: nextcloud-db-owner-login
  managed:
    roles:
    # The owner, so CloudNativePG applies its generated password after first setup.
    - name: nextcloud
      ensure: present
      login: true
      passwordSecret:
        name: nextcloud-db-owner-login
  storage:
    size: 10Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (objectstore.yaml).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
