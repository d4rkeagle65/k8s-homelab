# Generated passwords for the Nextcloud install admin and the dedicated Redis.
# nextcloud-secrets holds both; the deployment and redis read their keys from it.
# The admin password is set only at first install (NEXTCLOUD_ADMIN_PASSWORD); retrieve
# it from this Secret to log in locally at /login?direct=1.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: nextcloud-secrets
spec:
  secretKeys: [admin, redis]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-secrets
spec:
  refreshPolicy: CreatedOnce
  target:
    name: nextcloud-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEXTCLOUD_ADMIN_PASSWORD: "{{ .admin }}"
        REDIS_HOST_PASSWORD: "{{ .redis }}"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: nextcloud-secrets
