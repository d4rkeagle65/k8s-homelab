# Nextcloud's Authentik client secret, made once here and read two ways: the Nextcloud
# container's NEXTCLOUD_OIDC_CLIENT_SECRET env (for the occ user_oidc setup hook), and
# Authentik's worker through authentik-extras' secretstore-nextcloud.yaml, whose Role
# below lets it read only this Secret. To rotate: delete nextcloud-oidc-client, then
# restart Authentik's worker and Nextcloud.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: nextcloud-oidc-client
spec:
  secretKeys: [NEXTCLOUD_OIDC_CLIENT_SECRET]
  length: 64
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-oidc-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: nextcloud-oidc-client
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: nextcloud-oidc-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-oidc-reader-nextcloud
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [nextcloud-oidc-client]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-oidc-reader-nextcloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-oidc-reader-nextcloud
subjects:
- kind: ServiceAccount
  name: authentik-oidc-reader
  namespace: authentik
