# Nextcloud's database password, generated once into nextcloud-db-passwords and
# exposed two ways: nextcloud-db-owner-login (basic-auth) for CloudNativePG's managed
# role, and nextcloud-db-app (POSTGRES_PASSWORD) for the app container. To rotate:
# delete nextcloud-db-passwords, then restart the db and the app.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: nextcloud-db-passwords
spec:
  secretKeys: [owner]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-db-passwords
spec:
  refreshPolicy: CreatedOnce
  target:
    name: nextcloud-db-passwords
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: nextcloud-db-passwords
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: nextcloud-db-passwords
spec:
  provider:
    kubernetes:
      remoteNamespace: nextcloud
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: nextcloud-db-passwords-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nextcloud-db-passwords-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nextcloud-db-passwords-reader
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [nextcloud-db-passwords]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nextcloud-db-passwords-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nextcloud-db-passwords-reader
subjects:
- kind: ServiceAccount
  name: nextcloud-db-passwords-reader
  namespace: nextcloud
---
# The owner login, as CloudNativePG wants it (basic-auth, reloaded on change).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-db-owner-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: nextcloud-db-passwords
  target:
    name: nextcloud-db-owner-login
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: nextcloud
        password: "{{ .password }}"
  data:
  - {secretKey: password, remoteRef: {key: nextcloud-db-passwords, property: owner}}
---
# The same password as POSTGRES_PASSWORD for the Nextcloud app container.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-db-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: nextcloud-db-passwords
  target:
    name: nextcloud-db-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .password }}"
  data:
  - {secretKey: password, remoteRef: {key: nextcloud-db-passwords, property: owner}}
