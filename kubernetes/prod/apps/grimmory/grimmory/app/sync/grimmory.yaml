# Grimmory's configuration, applied through its API by the grimmory-sync Job
# (grimmory-sync.py says how). Edit here, not in Grimmory's settings: the next
# run puts a setting listed here back. A value written env:NAME comes from the
# grimmory-sync Secret; Flux fills in the cluster variables as everywhere else.

# The local admin: created by the first-run setup, and the login this Job uses.
# Also the way in when Authentik is down (Grimmory keeps its own login form).
admin:
  username: env:GRIMMORY_ADMIN_USERNAME
  password: env:GRIMMORY_ADMIN_PASSWORD
  email: env:GRIMMORY_ADMIN_EMAIL
  name: Grimmory admin

# The books Bookshelf collects. Bookshelf gives each book its own folder
# ({Author Name}/{Book Title}/), so a folder is one book and its files are
# that book's formats; BOOK_PER_FILE would make each format a book of its own.
libraries:
  - name: Books
    paths: [/books]
    watch: true
    icon: library
    iconType: LUCIDE
    organizationMode: BOOK_PER_FOLDER
    metadataSource: PREFER_EMBEDDED

settings:
  # Login through Authentik (its grimmory blueprint). A first login creates
  # the account; the group mappings below then set its rights on each login.
  OIDC_ENABLED: true
  OIDC_PROVIDER_DETAILS:
    providerName: Authentik
    clientId: grimmory
    issuerUri: https://auth.${BASE_DOMAIN}/application/o/grimmory/
    scopes: openid profile email
    claimMapping:
      username: preferred_username
      name: name
      email: email
      groups: groups
  OIDC_PROVIDER_CLIENT_SECRET: env:OIDC_CLIENT_SECRET
  OIDC_AUTO_PROVISION_DETAILS:
    enableAutoProvisioning: true
    allowLocalAccountLinking: true
    defaultPermissions: []
    defaultLibraryIds: []
  OIDC_GROUP_SYNC_MODE: ON_LOGIN
  # Reader apps (KOReader, Moon+, Panels) browse and download over OPDS, with
  # a Grimmory login of their own (each user's OPDS settings).
  OPDS_SERVER_ENABLED: true
  # Uploads up to 250 MB (Grimmory's own ceiling is 1 GB; Traefik adds none).
  MAX_FILE_UPLOAD_SIZE_IN_MB: 250

# Authentik groups (the blueprint admits only these two) to Grimmory's rights.
groupMappings:
  - group: Grimmory Admins
    admin: true
    libraries: [Books]
    description: Everything
  - group: Grimmory Users
    libraries: [Books]
    permissions: [permissionDownload, permissionAccessOpds, permissionSyncKoreader, permissionSyncKobo]
    description: Read, download and sync

# Homepage's Grimmory widget logs in as this read-only user.
users:
  - username: homepage
    password: env:HOMEPAGE_PASSWORD
    name: Homepage
    email: homepage@grimmory.invalid
    libraries: [Books]
