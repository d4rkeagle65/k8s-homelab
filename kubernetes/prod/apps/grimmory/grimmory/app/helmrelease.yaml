# Grimmory, the e-book library and reader (the community's fork of Booklore),
# over the books Bookshelf collects (/synmedia/media/books, mounted at /books),
# with its own MariaDB (it supports no other database). Login through Authentik (the grimmory blueprint); its
# settings, libraries and users come from sync/grimmory.yaml through the
# grimmory-sync Job. Only on the private networks.
#
# Reader apps (KOReader, Moon+, Panels) over OPDS: each user makes an OPDS
# login in Grimmory's settings, and the app points at
# https://grimmory.<domain>/api/v1/opds (private networks only, so at home or
# over Tailscale).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grimmory
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: grimmory
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-important
    controllers:
      grimmory:
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/grimmory-tools/grimmory
              tag: v3.5.0
            env:
              # The media apps' user, which owns the library on the NAS.
              USER_ID: "${MEDIA_PUID}"
              GROUP_ID: "${MEDIA_PGID}"
              TZ: ${TIMEZONE}
              # grimmory-db's primary (app/mariadb.yaml), on mariadb-operator.
              DATABASE_URL: jdbc:mariadb://grimmory-db-primary:3306/grimmory
              DATABASE_USERNAME: grimmory
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: grimmory-db
                    key: password
              SWAGGER_ENABLED: "false"
              # The library is on the NAS over NFS: Grimmory then never deletes,
              # moves or renames files there (Bookshelf owns that folder).
              DISK_TYPE: NETWORK
              # Grimmory refuses outbound connections to private addresses, and
              # Authentik is one, so its login couldn't fetch Authentik's
              # discovery document. This lifts the filter for its OIDC calls
              # only, which go to the issuer set in sync/grimmory.yaml.
              OIDC_ALLOW_UNSAFE_HOSTS: "true"
            # A library scan takes every core it's given; capped so a scan on a
            # 2-core worker leaves room for the databases beside it. Java's heap
            # defaults to a quarter of the memory limit, so the limit sizes the
            # heap too; the rest of its working set is the books' file cache.
            resources:
              requests: {cpu: 100m, memory: 864Mi}
              limits: {cpu: 1000m, memory: 2Gi}
            probes:
              startup: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: 6060
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                <<: *probe
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: 6060
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                <<: *probe
                spec:
                  httpGet:
                    path: /api/v1/healthcheck
                    port: 6060
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
      mariadb:
        type: statefulset
        # A database, as the CloudNativePG ones are (cluster-policy).
        pod:
          priorityClassName: homelab-critical
        containers:
          app:
            image:
              repository: mariadb
              tag: 11.8.9
            # innodb_snapshot_isolation off (11.8's default is on): with it on, an
            # update of rows another transaction changed since this one's snapshot
            # fails ("Record has changed since last read"), and Grimmory's library
            # scans write beside the web app without retrying.
            args: [--innodb-snapshot-isolation=OFF]
            env:
              MARIADB_DATABASE: grimmory
              MARIADB_USER: grimmory
              MARIADB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: grimmory-db
                    key: password
              MARIADB_ROOT_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: grimmory-db
                    key: root-password
              # Upgrade the data files in place after a new MariaDB version.
              MARIADB_AUTO_UPGRADE: "1"
            resources:
              requests: {cpu: 30m, memory: 224Mi}
              limits: {cpu: 1000m, memory: 768Mi}
            probes:
              liveness: &dbprobe
                enabled: true
                custom: true
                spec:
                  exec:
                    command: [healthcheck.sh, --connect, --innodb_initialized]
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *dbprobe
          # Prometheus's view of the database (the grimmory-mariadb
          # ServiceMonitor below), through the root login on localhost.
          exporter:
            image:
              repository: prom/mysqld-exporter
              tag: v0.20.0
            args:
              - --mysqld.address=localhost:3306
              - --mysqld.username=root
            env:
              MYSQLD_EXPORTER_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: grimmory-db
                    key: root-password
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket: {port: 9104}
                  periodSeconds: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket: {port: 9104}
                  periodSeconds: 60
                  failureThreshold: 5
            resources:
              requests: {cpu: 10m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
        statefulset:
          # Node-local disk, Retain, like the CloudNativePG databases.
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 5Gi
              storageClass: local-db
              advancedMounts:
                app:
                  - path: /var/lib/mysql
    service:
      grimmory:
        controller: grimmory
        ports:
          http:
            port: 6060
      mariadb:
        controller: mariadb
        ports:
          mysql:
            port: 3306
          metrics:
            port: 9104
    serviceMonitor:
      mariadb:
        serviceName: grimmory-mariadb
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 60s
    ingress:
      grimmory:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd
        hosts:
          - host: grimmory${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: grimmory
                  port: http
        tls:
          - secretName: grimmory-tls
            hosts:
              - grimmory${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    persistence:
      # Settings, covers and caches.
      data:
        existingClaim: grimmory-data
        advancedMounts:
          grimmory:
            app:
              - path: /app/data
              - path: /bookdrop
                subPath: bookdrop
      # The library, straight from the NAS's export (the same one the media
      # apps' synmedia-nfs volume mounts).
      books:
        type: nfs
        server: ${NAS_HOSTNAME}
        path: /volume1/media/media/books
        advancedMounts:
          grimmory:
            app:
              - path: /books
