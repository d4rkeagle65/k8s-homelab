# grimmory-db's root login (mariadb.yaml), the operator's; Grimmory's own is generated
# (externalsecret-db-user.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: grimmory-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  root-password: ${GRIMMORY_DB_ROOT_PASSWORD}
