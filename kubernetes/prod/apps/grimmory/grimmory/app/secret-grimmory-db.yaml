# MariaDB's logins: grimmory (Grimmory itself) and root (the exporter sidecar
# and the nightly dump).
apiVersion: v1
kind: Secret
metadata:
  name: grimmory-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  password: ${GRIMMORY_DB_PASSWORD}
  root-password: ${GRIMMORY_DB_ROOT_PASSWORD}
