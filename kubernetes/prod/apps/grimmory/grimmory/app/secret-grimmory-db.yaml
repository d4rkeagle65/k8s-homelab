# grimmory-db's logins (mariadb.yaml): grimmory (Grimmory itself) and root (the
# operator's).
apiVersion: v1
kind: Secret
metadata:
  name: grimmory-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  password: ${GRIMMORY_DB_PASSWORD}
  root-password: ${GRIMMORY_DB_ROOT_PASSWORD}
