# Grimmory's settings, covers and caches, and its upload folder (bookdrop).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grimmory-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 5Gi
