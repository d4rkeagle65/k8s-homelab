# What the grimmory-sync Job reads through env:NAME in grimmory.yaml: the
# local admin, Authentik's client secret (base64, under data), and the
# password of Homepage's read-only user.
apiVersion: v1
kind: Secret
metadata:
  name: grimmory-sync
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  OIDC_CLIENT_SECRET: ${AUTHENTIK_GRIMMORY_OIDC_CLIENT_SECRET}
stringData:
  GRIMMORY_ADMIN_USERNAME: ${OWNER_USERNAME}
  GRIMMORY_ADMIN_PASSWORD: ${GRIMMORY_ADMIN_PASSWORD}
  GRIMMORY_ADMIN_EMAIL: ${GRIMMORY_ADMIN_EMAIL}
  HOMEPAGE_PASSWORD: ${GRIMMORY_API_HOMEPAGE_PASSWORD}
