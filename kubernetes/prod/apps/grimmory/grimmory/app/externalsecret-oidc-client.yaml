# Grimmory's Authentik client secret, made once here and set in Grimmory by
# job-grimmory-sync.yaml. Authentik's worker reads it through authentik-extras'
# secretstore-grimmory.yaml, which the Role below lets read only this Secret. To rotate:
# delete the Secret grimmory-oidc-client, then restart Authentik's worker and rerun the
# sync Job.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grimmory-oidc-client
spec:
  secretKeys: [OIDC_CLIENT_SECRET]
  length: 64
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory-oidc-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grimmory-oidc-client
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: grimmory-oidc-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-oidc-reader-grimmory
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [grimmory-oidc-client]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-oidc-reader-grimmory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-oidc-reader-grimmory
subjects:
- kind: ServiceAccount
  name: authentik-oidc-reader
  namespace: authentik
