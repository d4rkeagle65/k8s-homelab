# The grimmory database user's password (grimmory-db's User in mariadb.yaml, and what Grimmory
# logs in with), made once in the cluster. Root's stays in Key Vault: the operator logs in
# as root and doesn't apply a changed root password, and a restored backup keeps the old
# one. To rotate: delete the Secret grimmory-db-user; the operator sets the new one, then
# restart Grimmory.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grimmory-db-user
spec:
  secretKeys: [password]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grimmory-db-user
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grimmory-db-user
    creationPolicy: Owner
    # The operator applies a changed password only from a Secret with this label.
    template:
      engineVersion: v2
      metadata:
        labels:
          k8s.mariadb.com/watch: ""
      data:
        password: "{{ .password }}"
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: grimmory-db-user
