apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grimmory
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: grimmory
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/apps/grimmory/grimmory/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: grimmory
  # Its MariaDB is mariadb-operator's.
  dependsOn:
  - name: mariadb-operator
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
