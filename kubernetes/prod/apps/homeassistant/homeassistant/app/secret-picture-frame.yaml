# The token Home HQ on the picture frame checks before it takes a command
# (devices/picture-frame/). Home Assistant reads it as an environment variable
# (configuration.yaml's rest_command).
apiVersion: v1
kind: Secret
metadata:
  name: picture-frame
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  command-token: ${PICTURE_FRAME_COMMAND_TOKEN}
