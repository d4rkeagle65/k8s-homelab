apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: homeassistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      priorityClassName: homelab-important
      containers:
      - env:
        - name: TZ
          value: ${TIMEZONE}
        image: ghcr.io/home-assistant/home-assistant:2026.10.3
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8123
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        name: homeassistant
        ports:
        - containerPort: 8123
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 5
          httpGet:
            path: /
            port: 8123
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 1408Mi
          requests:
            cpu: 60m
            memory: 704Mi
        securityContext:
          capabilities:
            add:
            - NET_RAW
        # Up to 10 minutes to first answer: the first start after an upgrade can take
        # minutes, and liveness and readiness wait until this succeeds.
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /
            port: 8123
            scheme: HTTP
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 10
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /config
          name: config
        # configuration.yaml from git, over the volume's own (app/config/).
        - mountPath: /config/configuration.yaml
          name: configuration
          subPath: configuration.yaml
          readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: homeassistant-config
      - name: configuration
        configMap:
          name: homeassistant-configuration
