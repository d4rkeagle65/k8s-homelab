apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment-homeassistant.yaml
- ingress-homeassistant.yaml
- persistentvolumeclaim-homeassistant-config.yaml
- secret-picture-frame.yaml
- service-homeassistant.yaml
# configuration.yaml from git. The generated name carries a hash of the
# content, so a change renames the ConfigMap, the Deployment's reference
# follows, and Home Assistant restarts with it.
configMapGenerator:
- name: homeassistant-configuration
  namespace: homeassistant
  files:
  - config/configuration.yaml
# The dashboards kept in git, one file each in dashboards/, declared in
# configuration.yaml's lovelace: dashboards:. This name has no hash and the
# Deployment mounts it as a folder at /config/dashboards, so the kubelet
# updates the files in place and Home Assistant, which rereads a dashboard
# whose file changed, shows the change at the next page load, no restart.
# The UI can't edit these; the other dashboards are made there.
- name: homeassistant-dashboards
  namespace: homeassistant
  files:
  - dashboards/front-door.yaml
  - dashboards/wyze-cameras.yaml
  options:
    disableNameSuffixHash: true
