# Home Assistant's configuration.yaml, from git: mounted read-only over the one
# on the config volume (kustomization.yaml's configMapGenerator; a change here
# rolls Home Assistant). What Home Assistant writes itself stays on the volume:
# .storage (integrations set up in the UI), automations, scripts.yaml, the
# database. Private parts (Baby Buddy's sensors and scripts) are package files
# in /config/packages on the volume, never in this public repo. Secrets come
# from the volume's secrets.yaml through !secret.

default_config:

homeassistant:
  packages: !include_dir_named packages

http:
  use_x_forwarded_for: true
  trusted_proxies:
    - ${CALICO_POD_CIDR}

# Login through Authentik (its home-assistant provider).
auth_oidc:
  client_id: ${HOMEASSISTANT_OIDC_CLIENT_ID}
  client_secret: !secret authentik_client_secret
  discovery_url: "https://auth.${BASE_DOMAIN}/application/o/home-assistant/.well-known/openid-configuration"
  features:
    default_redirect: true

# Dashboards kept in git (app/dashboards/; kustomization.yaml says how they arrive).
# The others are made in the UI and stay there: storage stays the default mode. A
# url_path needs a hyphen.
lovelace:
  dashboards:
    front-door:
      mode: yaml
      title: Front Door
      icon: mdi:door
      show_in_sidebar: true
      filename: dashboards/front-door.yaml
    wyze-cameras:
      mode: yaml
      title: Wyze Cameras
      icon: mdi:cctv
      show_in_sidebar: true
      filename: dashboards/wyze-cameras.yaml

# The Prometheus endpoint (/api/prometheus), scraped from the cluster with a
# long-lived token (monitors/scrapeconfig-homeassistant.yaml).
prometheus:
  namespace: hass

# The washer and the dryer, running or not, from their Tapo plugs' power draw. Idle,
# each plug reads 1-2 W. delay_on ignores a short spike, such as the dryer's
# wrinkle-guard tumble after a cycle. delay_off rides out a pause inside a cycle,
# which reads the same 2 W as idle, so no threshold can tell them apart: the
# washer's longest pause, before its final spin, was 4.7 minutes.
template:
  - binary_sensor:
      - name: Washer running
        unique_id: laundry_washer_running
        device_class: running
        icon: mdi:washing-machine
        state: "{{ states('sensor.washer_current_consumption') | float(0) > 8 }}"
        availability: "{{ has_value('sensor.washer_current_consumption') }}"
        delay_on: "00:00:30"
        delay_off: "00:08:00"
      - name: Dryer running
        unique_id: laundry_dryer_running
        device_class: running
        icon: mdi:tumble-dryer
        state: "{{ states('sensor.dryer_current_consumption') | float(0) > 8 }}"
        availability: "{{ has_value('sensor.dryer_current_consumption') }}"
        delay_on: "00:02:00"
        delay_off: "00:02:00"

# A phone notification when either finishes. It goes to every phone signed in to
# the Companion app (each one's notify entity), so no device name is in this file.
automation laundry:
  - id: laundry_cycle_finished
    alias: Laundry cycle finished
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.washer_running
          - binary_sensor.dryer_running
        from: "on"
        to: "off"
    actions:
      - action: notify.send_message
        target:
          entity_id: "{{ integration_entities('mobile_app') | select('match', 'notify\\.') | list }}"
        data:
          title: Laundry
          message: >-
            The {{ 'washer' if 'washer' in trigger.entity_id else 'dryer' }} finished after
            {{ ((as_timestamp(trigger.to_state.last_changed) - as_timestamp(trigger.from_state.last_changed)) / 60) | round(0) | int }} minutes.

# HACS' integrations and cards update themselves early on Sunday, and Home Assistant restarts
# only when one did. A big version change waits for the owner: a new first number (the second
# under 1.0, where minor versions break things), or a version that isn't numbers, such as a
# commit. A date version (2026.10.2) changes its first number every year, so it updates. Home
# Assistant itself is pinned in deployment-homeassistant.yaml and updates through Renovate's
# pull requests. The phones get the list, as the laundry's message does.
automation hacs_updates:
  - id: hacs_weekly_updates
    alias: HACS weekly updates
    mode: single
    triggers:
      - trigger: time
        at: "04:00:00"
    conditions:
      - condition: time
        weekday: sun
    variables:
      pending: >-
        {%- set ns = namespace(safe=[], held=[]) -%}
        {%- for e in integration_entities('hacs') | select('match', 'update\\.') if is_state(e, 'on') -%}
          {%- set a = state_attr(e, 'installed_version') -%}
          {%- set b = state_attr(e, 'latest_version') -%}
          {%- set pa = ((a or '') | regex_replace('^v', '')).split('.') -%}
          {%- set pb = ((b or '') | regex_replace('^v', '')).split('.') -%}
          {%- set numeric = pa | count > 1 and pb | count > 1 and pa[0] | int(-1) >= 0 and pb[0] | int(-1) >= 0 -%}
          {%- set safe = numeric and (pa[0] | int >= 2000 or (pa[0] == pb[0] and (pa[0] | int > 0 or pa[1] == pb[1]))) -%}
          {%- set item = {'entity': e, 'name': state_attr(e, 'friendly_name') | regex_replace('(?i) update$', ''), 'from': a, 'to': b} -%}
          {%- if safe -%}{%- set ns.safe = ns.safe + [item] -%}{%- else -%}{%- set ns.held = ns.held + [item] -%}{%- endif -%}
        {%- endfor -%}
        {{ {'safe': ns.safe, 'held': ns.held} }}
    actions:
      - condition: template
        value_template: "{{ (pending.safe + pending.held) | count > 0 }}"
      - repeat:
          for_each: "{{ pending.safe }}"
          sequence:
            - action: update.install
              target:
                entity_id: "{{ repeat.item.entity }}"
              continue_on_error: true
      # Installed means HACS now reports the new version, not that the call returned.
      - variables:
          result: >-
            {%- set ns = namespace(done=[], failed=[]) -%}
            {%- for i in pending.safe -%}
              {%- if state_attr(i.entity, 'installed_version') == i.to -%}{%- set ns.done = ns.done + [i] -%}
              {%- else -%}{%- set ns.failed = ns.failed + [i] -%}{%- endif -%}
            {%- endfor -%}
            {{ {'done': ns.done, 'failed': ns.failed} }}
      - action: notify.send_message
        target:
          entity_id: "{{ integration_entities('mobile_app') | select('match', 'notify\\.') | list }}"
        data:
          title: HACS updates
          message: >-
            {%- macro list(items) -%}{%- for i in items -%}{{ i.name }} {{ i.from }} → {{ i.to }}{{ ', ' if not loop.last }}{%- endfor -%}{%- endmacro -%}
            {%- if result.done %}Updated, restarting Home Assistant: {{ list(result.done) }}.{% endif %}
            {%- if result.failed %} Didn't install: {{ list(result.failed) }}.{% endif %}
            {%- if pending.held %} Waiting for you: {{ list(pending.held) }}.{% endif %}
      - if:
          - condition: template
            value_template: "{{ result.done | count > 0 }}"
        then:
          # Time for the message to leave before the restart.
          - delay: "00:00:10"
          - action: homeassistant.restart

# The living-room picture frame (devices/picture-frame/): commands to its Home HQ,
# which turns them into the page's own keys (Right, Left, Space), its mute toggle or
# a reboot. The token comes from the Deployment's environment.
rest_command:
  picture_frame:
    url: "http://${PICTURE_FRAME_ADDRESS}:8766/{{ command }}"
    method: post
    headers:
      X-Token: !env_var PICTURE_FRAME_COMMAND_TOKEN unset
    timeout: 10

script picture_frame:
  picture_frame_next:
    alias: Picture frame next
    icon: mdi:skip-next
    sequence:
      - action: rest_command.picture_frame
        data: {command: next}
  picture_frame_back:
    alias: Picture frame back
    icon: mdi:skip-previous
    sequence:
      - action: rest_command.picture_frame
        data: {command: back}
  picture_frame_pause:
    alias: Picture frame pause or resume
    icon: mdi:play-pause
    sequence:
      - action: rest_command.picture_frame
        data: {command: pause}
  picture_frame_mute:
    alias: Picture frame mute or unmute
    icon: mdi:volume-mute
    sequence:
      - action: rest_command.picture_frame
        data: {command: mute}
  picture_frame_reboot:
    alias: Picture frame reboot
    icon: mdi:restart
    sequence:
      - action: rest_command.picture_frame
        data: {command: reboot}

# Typing into a Fire TV: the text goes in that TV's box, then script.tv_type_text sends it as
# Android's `input text`, into whatever field has focus. Spaces become %s, which is how
# `input text` takes them; the text is single-quoted for the TV's shell, with any single
# quote taken out, so nothing typed runs as a command. The dashboards' Type buttons pass the
# TV's remote and its text box.
input_text:
  living_room_tv_text:
    name: Text for the living room TV
    max: 100
  bedroom_tv_text:
    name: Text for the bedroom TV
    max: 100

script tv_typing:
  tv_type_text:
    alias: Type into a TV
    icon: mdi:keyboard
    fields:
      remote:
        description: The TV's remote entity
        example: remote.living_room_fire_tv
        required: true
        selector:
          entity:
            domain: remote
      text_entity:
        description: The text box to type from
        example: input_text.living_room_tv_text
        required: true
        selector:
          entity:
            domain: input_text
    sequence:
      - action: remote.send_command
        target:
          entity_id: "{{ remote }}"
        data:
          command: >-
            input text '{{ states(text_entity) | replace("'", "") | replace(" ", "%s") }}'
