# The Wyze account the bridge signs in with, its API key from Wyze's developer console, and
# the account's authenticator (TOTP) secret, as it signs in with two-factor.
apiVersion: v1
kind: Secret
metadata:
  name: wyze-bridge
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  WYZE_EMAIL: ${WYZE_EMAIL}
  WYZE_PASSWORD: ${WYZE_PASSWORD}
  WYZE_API_ID: ${WYZE_API_ID}
  WYZE_API_KEY: ${WYZE_API_KEY}
  WYZE_TOTP_KEY: ${WYZE_TOTP_KEY}
