# The Wyze account the bridge signs in with, and its API key from Wyze's developer console.
apiVersion: v1
kind: Secret
metadata:
  name: wyze-bridge
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  WYZE_EMAIL: ${WYZE_EMAIL}
  WYZE_PASSWORD: ${WYZE_PASSWORD}
  WYZE_API_ID: ${WYZE_API_ID}
  WYZE_API_KEY: ${WYZE_API_KEY}
