# The eufy account the bridge signs in with: a second one, shared from the main account
# with admin rights, as eufy allows one active login per account.
apiVersion: v1
kind: Secret
metadata:
  name: eufy-bridge
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  EUFY_EMAIL: ${OWNER_GMAIL}
  EUFY_PASSWORD: ${EUFY_HOMEASSISTANT_PASSWORD}
