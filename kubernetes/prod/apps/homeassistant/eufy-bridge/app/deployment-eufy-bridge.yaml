# One bridge only: eufy allows a single session per account, and a second would sign the
# first out. On the host's network: on the pod network the C10 answered P2P from another port
# than it was sent to (14007, not 32108), which the node's NAT couldn't match to the bridge, so
# every reply got "port unreachable" (a capture on the node, 2026-10-31). Its P2P leaves from
# the node's address, which the firewall's IoT rule names. Its ports (3000; go2rtc's 1984, 8554
# and 8555) are free on the nodes; the Wyze bridge's 8554 keeps the two on different nodes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eufy-bridge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: eufy-bridge
  template:
    metadata:
      labels:
        app: eufy-bridge
    spec:
      hostNetwork: true
      # Cluster DNS still, for eufy's cloud and go2rtc's own lookups.
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: bridge
        image: ghcr.io/mega-yfue/ha-eufy-sdk-bridge:0.6.0@sha256:7053521bbd1e6abc1634d710ff09b2dbfdb03dfabda53a28e10f109339de2c86
        envFrom:
        - secretRef:
            name: eufy-bridge
        env:
        - name: EUFY_COUNTRY
          value: US
        - name: BRIDGE_PORT
          value: "3000"
        - name: TZ
          value: ${TIMEZONE}
        ports:
        - name: http
          containerPort: 3000
        - name: rtsp
          containerPort: 8554
        - name: go2rtc
          containerPort: 1984
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: 1000m
            memory: 768Mi
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: eufy-bridge-data
