apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eufy-bridge
  namespace: flux-system
spec:
  interval: 30m
  commonMetadata:
    labels:
      homelab.local/env: prod
      homelab.local/category: apps
      app.kubernetes.io/part-of: homeassistant
      homelab.local/managed-by: hand
  path: ./kubernetes/prod/apps/homeassistant/eufy-bridge/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: homeassistant
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
