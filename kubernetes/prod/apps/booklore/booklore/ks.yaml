apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: booklore
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: booklore
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/apps/booklore/booklore/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: booklore
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
