# What the booklore-sync Job reads through env:NAME in booklore.yaml: the
# local admin, Authentik's client secret (base64, under data), and the
# password of Homepage's read-only user.
apiVersion: v1
kind: Secret
metadata:
  name: booklore-sync
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  OIDC_CLIENT_SECRET: ${AUTHENTIK_BOOKLORE_OIDC_CLIENT_SECRET}
stringData:
  BOOKLORE_ADMIN_USERNAME: ${BOOKLORE_ADMIN_USERNAME}
  BOOKLORE_ADMIN_PASSWORD: ${BOOKLORE_ADMIN_PASSWORD}
  BOOKLORE_ADMIN_EMAIL: ${BOOKLORE_ADMIN_EMAIL}
  HOMEPAGE_PASSWORD: ${BOOKLORE_API_HOMEPAGE_PASSWORD}
