apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- cronjob-booklore-db-backup.yaml
- helmrelease.yaml
- job-booklore-sync.yaml
- pvc.yaml
- secret-booklore-db.yaml
- secret-booklore-sync.yaml
# Booklore's configuration and the script that applies it. The generated name
# carries a hash of both, so a change renames the ConfigMap and the Job runs
# again (job-booklore-sync.yaml).
configMapGenerator:
- name: booklore-sync
  files:
  - sync/booklore.yaml
  - sync/booklore-sync.py
