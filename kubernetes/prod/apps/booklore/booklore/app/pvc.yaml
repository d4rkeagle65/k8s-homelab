# Booklore's settings, covers and caches, and its upload folder (bookdrop).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-data
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 5Gi
---
# The nightly database dumps (cronjob-booklore-db-backup.yaml), on the NAS.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: booklore-db-backup
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 2Gi
