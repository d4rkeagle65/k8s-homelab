# MariaDB's logins: booklore (Booklore itself) and root (the exporter sidecar
# and the nightly dump).
apiVersion: v1
kind: Secret
metadata:
  name: booklore-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  password: ${BOOKLORE_DB_PASSWORD}
  root-password: ${BOOKLORE_DB_ROOT_PASSWORD}
