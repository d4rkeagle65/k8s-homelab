apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: claude-whatsapp
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: claude-whatsapp
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/apps/claude-whatsapp/claude-whatsapp/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: claude-whatsapp
  # Its settings are an ExternalSecret from the azure-keyvault store.
  dependsOn:
  - name: azure-keyvault
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
