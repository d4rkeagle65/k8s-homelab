# The bot's keys and settings, straight from Key Vault (this namespace opts in to the
# azure-keyvault store). Each is required: the Secret isn't made until every one exists,
# and the pod waits for it. Read once at start; a value changed in Key Vault reaches the
# pod with kubectl -n claude-whatsapp rollout restart deploy/claude-whatsapp, after the
# refresh below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: claude-whatsapp
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: claude-whatsapp
    creationPolicy: Owner
  data:
  # An API key from the Claude Console, used only by this bot.
  - {secretKey: ANTHROPIC_API_KEY, remoteRef: {key: ANTHROPIC-CLAUDE-WHATSAPP-API-KEY}}
  # The Meta app's permanent token (a system user's, with whatsapp_business_messaging).
  - {secretKey: WHATSAPP_ACCESS_TOKEN, remoteRef: {key: META-CLAUDE-WHATSAPP-ACCESS-TOKEN}}
  # The Meta app's App Secret, which signs each webhook delivery.
  - {secretKey: WHATSAPP_APP_SECRET, remoteRef: {key: META-CLAUDE-WHATSAPP-APP-SECRET}}
  # Chosen here and given to Meta with the callback URL, which sends it back once to check.
  - {secretKey: WHATSAPP_VERIFY_TOKEN, remoteRef: {key: META-CLAUDE-WHATSAPP-VERIFY-TOKEN}}
  # The ID of the WhatsApp number the bot sends from (not the number itself).
  - {secretKey: WHATSAPP_PHONE_NUMBER_ID, remoteRef: {key: META-CLAUDE-WHATSAPP-PHONE-NUMBER-ID}}
  # Who it answers: phone numbers with country code, split by commas.
  - {secretKey: ALLOWED_NUMBERS, remoteRef: {key: CLAUDE-WHATSAPP-ALLOWED-NUMBERS}}
