# Reads redis-ha's generated passwords (redis-ha's role-immich-redis-reader.yaml grants
# immich-redis-reader that one Secret).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: redis-ha
spec:
  provider:
    kubernetes:
      remoteNamespace: redis-ha
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: immich-redis-reader
