# Immich's REDIS_URL (the immich release's values.yaml): ioredis's base64 JSON of the three
# Sentinels, the master group and redis-ha's two passwords, read from redis-ha-auth.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-redis
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: redis-ha
  target:
    name: immich-redis
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_URL: >-
          ioredis://{{ dict
          "sentinels" (list
            (dict "host" "redis-ha-announce-0.redis-ha.svc.${CLUSTER_DOMAIN}" "port" 26379)
            (dict "host" "redis-ha-announce-1.redis-ha.svc.${CLUSTER_DOMAIN}" "port" 26379)
            (dict "host" "redis-ha-announce-2.redis-ha.svc.${CLUSTER_DOMAIN}" "port" 26379))
          "name" "mymaster"
          "password" .password
          "sentinelPassword" .sentinelPassword
          | toJson | b64enc }}
  data:
  - {secretKey: password, remoteRef: {key: redis-ha-auth, property: auth}}
  - {secretKey: sentinelPassword, remoteRef: {key: redis-ha-auth, property: sentinel-password}}
