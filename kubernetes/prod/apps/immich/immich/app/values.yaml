controllers:
  main:
    containers:
      main:
        env:
          DB_DATABASE_NAME: immich
          DB_HOSTNAME: immich-postgres-rw
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                key: password
                name: immich-postgres-app
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                key: username
                name: immich-postgres-app
          IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
          REDIS_URL:
            valueFrom:
              secretKeyRef:
                key: REDIS_URL
                name: immich-redis-url
        image:
          repository: ghcr.io/immich-app/immich-server
          tag: v3.3.1
immich:
  configuration: {}
  configurationKind: ConfigMap
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich-data
machine-learning:
  defaultPodOptions:
    priorityClassName: homelab-important
  controllers:
    main:
      containers:
        main:
          env:
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
            TRANSFORMERS_CACHE: /cache
          image:
            pullPolicy: IfNotPresent
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.3.1
          # Its memory is the face and search models it loads, far above its idle
          # use: 1918Mi at peak during the library import. 3Gi rather than the
          # rules' 2.5 x peak (4.7Gi), since more jobs reuse the loaded models.
          # The requests are the import's: sized again once it's done.
          resources:
            requests:
              cpu: 620m
              memory: 2304Mi
            limits:
              cpu: 1000m
              memory: 3Gi
  enabled: true
  persistence:
    cache:
      accessMode: ReadWriteMany
      enabled: true
      size: 10Gi
      type: emptyDir
server:
  defaultPodOptions:
    priorityClassName: homelab-important
  controllers:
    main:
      containers:
        main:
          image:
            pullPolicy: IfNotPresent
            repository: ghcr.io/immich-app/immich-server
          # It makes thumbnails and transcodes on upload, hence a whole core; 6Gi
          # while the owner's library import runs (QUEUE-resource-limits.md).
          resources:
            requests:
              cpu: 30m
              memory: 1376Mi
            limits:
              cpu: 1000m
              memory: 6Gi
  enabled: true
  ingress:
    main:
      annotations:
        cert-manager.io/cluster-issuer: cloudflare-letsencrypt
        nginx.ingress.kubernetes.io/proxy-body-size:
        traefik.ingress.kubernetes.io/router.middlewares: traefik_redirect-https@kubernetescrd
      className: traefik
      enabled: true
      hosts:
      - host: immich.${BASE_DOMAIN}
        paths:
        - path: /
      tls:
      - hosts:
        - immich.${BASE_DOMAIN}
        secretName: immich-http-tls
valkey:
  controllers:
    main:
      containers:
        main:
          image:
            pullPolicy: IfNotPresent
            repository: docker.io/valkey/valkey
            tag: 9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
  enabled: false
  persistence:
    data:
      accessMode: ReadWriteOnce
      enabled: true
      size: 1Gi
      type: emptyDir
