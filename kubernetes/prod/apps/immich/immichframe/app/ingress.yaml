# Private only (LAN, cluster and tailnet): the frames sit on the home networks, and
# ImmichFrame has no login of its own for viewers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immichframe
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: immichframe${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: immichframe
            port:
              name: http
  tls:
  - hosts:
    - immichframe${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    secretName: immichframe-tls
