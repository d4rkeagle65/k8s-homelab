# The Immich API key ImmichFrame reads photos with, and the password for its
# admin UI. IMMICHFRAME_ADMIN_PASSWORD always wins over one saved in the admin UI,
# so a fresh install isn't open for whoever reaches /admin first.
apiVersion: v1
kind: Secret
metadata:
  name: immichframe
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  api-key: ${IMMICHFRAME_API_KEY}
  admin-password: ${IMMICHFRAME_ADMIN_PASSWORD}
