apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
- ingress.yaml
- pvc.yaml
- secret.yaml
- service.yaml
# The first-start settings (config/Settings.yml). The hash in the generated name
# rolls the Deployment on a change, though only a fresh settings database reads it.
configMapGenerator:
- name: immichframe-seed
  namespace: immich
  files:
  - config/Settings.yml
