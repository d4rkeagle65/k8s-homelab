# Uploads to Immich, nightly, the photos and videos Cloud Sync on the NAS brings
# down from OneDrive into the media share's oneDrive folder (QUEUE.md's Immich
# import). The CLI hashes every file and asks Immich which it already holds, so
# a run uploads only what's new, and a failed run's retry carries on where it
# stopped. Immich keeps its own copy: nothing here writes to the folder, and a
# file deleted from it or from OneDrive stays in Immich. The CLI's --watch can't
# replace the schedule: a pod's NFS mount gets no event for a file the NAS
# writes, and polling would stat every photo every 300ms.
#
# --dry-run in the args makes a run upload nothing and log how many files are new
# and how many Immich has. A run between schedules, under a Job name not used yet:
#   kubectl -n immich create job --from=cronjob/immich-import immich-import-<n>
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-import
spec:
  # A quiet hour: a file Cloud Sync is still writing could upload cut short.
  schedule: "30 4 * * *"
  timeZone: ${TIMEZONE}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        spec:
          restartPolicy: OnFailure
          # The media apps' user and group, which read the media share.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1028
            runAsGroup: 100
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: upload
              # The CLI's version follows the server's (../../immich/app/values.yaml).
              image: ghcr.io/immich-app/immich-cli:3.3.5
              args:
                - upload
                - --recursive
                # Synology's thumbnails, in an @eaDir folder beside each photo.
                - --ignore
                - "@eaDir/**"
                - --no-progress
                - /import
              env:
                - {name: HOME, value: /tmp}
                - {name: IMMICH_INSTANCE_URL, value: "http://immich-server.immich.svc.${CLUSTER_DOMAIN}:2283/api"}
                - name: IMMICH_API_KEY
                  valueFrom: {secretKeyRef: {name: immich-import, key: api-key}}
              # The CLI holds each file in memory while it uploads it, so the limit
              # is set by the biggest video: one of 2.9 GB was OOM-killed at 1Gi
              # (2026-10-22). A video over about 3.5 GB needs this raised.
              resources:
                requests: {cpu: 100m, memory: 1Gi}
                limits: {cpu: 1000m, memory: 4Gi}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
              volumeMounts:
                - {name: photos, mountPath: /import, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: photos
              nfs:
                server: ${NAS_HOSTNAME}
                path: /volume1/media/oneDrive
                readOnly: true
            - name: tmp
              emptyDir: {}
