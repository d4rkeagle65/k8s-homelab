# Kept's four database logins (db.yaml): their passwords made once into kept-db-passwords,
# and the Secrets CloudNativePG and the chart read built from it through a store in this
# namespace that may read only that Secret. CloudNativePG applies a changed password to
# every role (all four are managed roles). To rotate all four: delete the Secret
# kept-db-passwords, then restart Kept.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kept-db-passwords
spec:
  secretKeys: [owner, app, auth, system]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kept-db-passwords
spec:
  refreshPolicy: CreatedOnce
  target:
    name: kept-db-passwords
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: kept-db-passwords
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kept-db-passwords-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kept-db-passwords-reader
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [kept-db-passwords]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kept-db-passwords-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kept-db-passwords-reader
subjects:
- kind: ServiceAccount
  name: kept-db-passwords-reader
  namespace: kept
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kept-db-passwords
spec:
  provider:
    kubernetes:
      remoteNamespace: kept
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: kept-db-passwords-reader
---
# kept_owner's login, as CloudNativePG wants it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kept-db-owner-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kept-db-passwords
  target:
    name: kept-db-owner-login
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CloudNativePG re-reads it when it changes.
          cnpg.io/reload: "true"
      data:
        username: kept_owner
        password: "{{ .password }}"
  data:
  - {secretKey: password, remoteRef: {key: kept-db-passwords, property: owner}}
---
# kept_app's login, as CloudNativePG wants it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kept-db-app-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kept-db-passwords
  target:
    name: kept-db-app-login
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CloudNativePG re-reads it when it changes.
          cnpg.io/reload: "true"
      data:
        username: kept_app
        password: "{{ .password }}"
  data:
  - {secretKey: password, remoteRef: {key: kept-db-passwords, property: app}}
---
# kept_auth's login, as CloudNativePG wants it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kept-db-auth-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kept-db-passwords
  target:
    name: kept-db-auth-login
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CloudNativePG re-reads it when it changes.
          cnpg.io/reload: "true"
      data:
        username: kept_auth
        password: "{{ .password }}"
  data:
  - {secretKey: password, remoteRef: {key: kept-db-passwords, property: auth}}
---
# kept_system's login, as CloudNativePG wants it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kept-db-system-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kept-db-passwords
  target:
    name: kept-db-system-login
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CloudNativePG re-reads it when it changes.
          cnpg.io/reload: "true"
      data:
        username: kept_system
        password: "{{ .password }}"
  data:
  - {secretKey: password, remoteRef: {key: kept-db-passwords, property: system}}
---
# The four, as the chart's roles.existingSecret wants them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kept-db-role-passwords
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kept-db-passwords
  target:
    name: kept-db-role-passwords
    creationPolicy: Owner
  data:
  - {secretKey: KEPT_DB_OWNER_PASSWORD, remoteRef: {key: kept-db-passwords, property: owner}}
  - {secretKey: KEPT_DB_APP_PASSWORD, remoteRef: {key: kept-db-passwords, property: app}}
  - {secretKey: KEPT_DB_AUTH_PASSWORD, remoteRef: {key: kept-db-passwords, property: auth}}
  - {secretKey: KEPT_DB_SYSTEM_PASSWORD, remoteRef: {key: kept-db-passwords, property: system}}
