# The bearer token /metrics answers to (metrics.tokenSecret); Prometheus has the same
# in monitoring-extras' kept-metrics.
apiVersion: v1
kind: Secret
metadata:
  name: kept-metrics
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  KEPT_METRICS_TOKEN: ${KEPT_METRICS_TOKEN}
