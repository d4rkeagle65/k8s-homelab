# Kept's own nightly restic backup to Garage's kept-backups bucket (backup.existingSecret);
# the rest of its settings are the HelmRelease's backup.env.
apiVersion: v1
kind: Secret
metadata:
  name: kept-backup
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  KEPT_BACKUP_PASSWORD: ${KEPT_BACKUP_PASSWORD}
  KEPT_BACKUP_S3_ACCESS_KEY_ID: ${GARAGE_KEPT_S3_ACCESS_KEY_ID}
  KEPT_BACKUP_S3_SECRET_ACCESS_KEY: ${GARAGE_KEPT_S3_SECRET_ACCESS_KEY}
