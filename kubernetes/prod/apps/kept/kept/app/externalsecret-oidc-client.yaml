# Kept's Authentik client secret, made once here and read through helmrelease.yaml's
# extraEnvFrom. Authentik's worker reads it through authentik-extras'
# secretstore-kept.yaml, which the Role below lets read only this Secret. To rotate:
# delete the Secret kept-oidc-client, then restart Authentik's worker and Kept.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kept-oidc-client
spec:
  secretKeys: [KEPT_OIDC_CLIENT_SECRET]
  length: 64
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kept-oidc-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: kept-oidc-client
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: kept-oidc-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-oidc-reader-kept
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [kept-oidc-client]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-oidc-reader-kept
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-oidc-reader-kept
subjects:
- kind: ServiceAccount
  name: authentik-oidc-reader
  namespace: authentik
