# The bearer token Kept's /metrics answers to (helmrelease.yaml's metrics.tokenSecret),
# made once here; Prometheus reads it through monitoring-extras' externalsecret-kept-metrics.yaml,
# which the Role below lets read this one Secret. To rotate: delete the Secret
# kept-metrics-token, then restart Kept.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kept-metrics-token
spec:
  secretKeys: [KEPT_METRICS_TOKEN]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kept-metrics-token
spec:
  refreshPolicy: CreatedOnce
  target:
    name: kept-metrics-token
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: kept-metrics-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kept-metrics-reader
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [kept-metrics-token]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kept-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kept-metrics-reader
subjects:
- kind: ServiceAccount
  name: kept-metrics-reader
  namespace: monitoring
