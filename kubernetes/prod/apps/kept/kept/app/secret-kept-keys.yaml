# Kept's encryption and session keys (keys.existingSecret), from Key Vault rather
# than generated into the config volume, whose loss would make stored secrets unreadable.
apiVersion: v1
kind: Secret
metadata:
  name: kept-keys
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  KEPT_SECRET_KEY: ${KEPT_SECRET_KEY}
  KEPT_AUTH_SECRET: ${KEPT_AUTH_SECRET}
