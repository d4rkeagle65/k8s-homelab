# The four logins' passwords, as the chart's roles.existingSecret wants them; the
# same values as secret-db-logins.yaml's.
apiVersion: v1
kind: Secret
metadata:
  name: kept-db-roles
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  KEPT_DB_OWNER_PASSWORD: ${KEPT_DB_OWNER_PASSWORD}
  KEPT_DB_APP_PASSWORD: ${KEPT_DB_APP_PASSWORD}
  KEPT_DB_AUTH_PASSWORD: ${KEPT_DB_AUTH_PASSWORD}
  KEPT_DB_SYSTEM_PASSWORD: ${KEPT_DB_SYSTEM_PASSWORD}
