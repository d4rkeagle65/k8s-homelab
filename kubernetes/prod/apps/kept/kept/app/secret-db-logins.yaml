# Kept's four database logins, for kept-db (db.yaml): the owner's for its
# bootstrap, the others' for its managed roles.
apiVersion: v1
kind: Secret
metadata:
  name: kept-db-owner
  labels:
    # CloudNativePG re-reads it when it changes.
    cnpg.io/reload: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: kubernetes.io/basic-auth
stringData:
  username: kept_owner
  password: ${KEPT_DB_OWNER_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: kept-db-app
  labels:
    # CloudNativePG re-reads it when it changes.
    cnpg.io/reload: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: kubernetes.io/basic-auth
stringData:
  username: kept_app
  password: ${KEPT_DB_APP_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: kept-db-auth
  labels:
    # CloudNativePG re-reads it when it changes.
    cnpg.io/reload: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: kubernetes.io/basic-auth
stringData:
  username: kept_auth
  password: ${KEPT_DB_AUTH_PASSWORD}
---
apiVersion: v1
kind: Secret
metadata:
  name: kept-db-system
  labels:
    # CloudNativePG re-reads it when it changes.
    cnpg.io/reload: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: kubernetes.io/basic-auth
stringData:
  username: kept_system
  password: ${KEPT_DB_SYSTEM_PASSWORD}
