env:
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  TZ: ${TIMEZONE}
image:
  repository: manictime/manictimeserver
  tag: 2026.2.4
# Two routes on traefik-isolated. manictime.${BASE_DOMAIN} serves LAN clients on
# the isolated VLAN directly and holds the TLS cert. ${TAILSCALE_FUNNEL_HOST} (the
# node's *.ts.net funnel name) is the public path: BunkerWeb (docker/bunkerweb)
# forwards that Host so the server advertises a resolvable URL back to clients
# (ManicTime builds client URLs from the request -- see settings.extra.web below).
# Only manictime.${BASE_DOMAIN} is in tls: the funnel name is Tailscale's domain,
# not ours, so cert-manager can't issue for it; BunkerWeb connects with SNI
# manictime.${BASE_DOMAIN} to get that cert, routing by the funnel Host.
ingress:
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
  className: traefik-isolated
  enabled: true
  hosts:
  - host: manictime.${BASE_DOMAIN}
    paths:
    - /
  - host: ${TAILSCALE_FUNNEL_HOST}
    paths:
    - /
  tls:
  - hosts:
    - manictime.${BASE_DOMAIN}
    secretName: manictime-tls
persistence:
  enabled: true
  mountPath: /app/Data
  size: 10Gi
  storageClass: nfs-retain-rwo
rbac:
  k8sLocking:
    enabled: true
resources:
  requests:
    cpu: 10m
    memory: 224Mi
  limits:
    cpu: 500m
    memory: 1Gi
service:
  httpPort: 8080
  type: ClusterIP
settings:
  database:
    coreDatabase: ManicTimeCore
    host: manictime-postgres-rw
    passwordSecret:
      key: password
      name: manictime-postgres-app
    port: 5432
    reportsDatabase: ManicTimeReports
    sslMode: Prefer
    user: manictime
  extra:
    automaticVersionCheck:
      enabled: false
    # Trust the in-cluster reverse proxy (traefik) so the server honours its
    # X-Forwarded-Host / X-Forwarded-Proto and advertises the public funnel URL
    # to clients instead of the Host it received. Only traefik reaches this
    # ClusterIP, so "*" is scoped to it. The chart seeds this file only once, so
    # an existing deployment needs ManicTimeServerSettings.json reset on the PVC
    # for a change here to take effect (QUEUE-manictime-waf.md).
    web:
      reverseProxy:
        networks:
        - "*"
  seed: true
