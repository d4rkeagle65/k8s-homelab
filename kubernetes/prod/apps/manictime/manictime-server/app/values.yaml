env:
  ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
  TZ: ${TIMEZONE}
image:
  repository: manictime/manictimeserver
  tag: 2026.2.4
# The host is served by the manictime-waf release (a hand-written Ingress ->
# the OWASP CRS WAF -> this server). The chart's own Ingress is off so the two
# don't both claim manictime.${BASE_DOMAIN}.
ingress:
  enabled: false
persistence:
  enabled: true
  mountPath: /app/Data
  size: 10Gi
  storageClass: nfs-retain-rwo
rbac:
  k8sLocking:
    enabled: true
resources:
  requests:
    cpu: 10m
    memory: 224Mi
  limits:
    cpu: 500m
    memory: 1Gi
service:
  httpPort: 8080
  type: ClusterIP
settings:
  database:
    coreDatabase: ManicTimeCore
    host: manictime-postgres-rw
    passwordSecret:
      key: password
      name: manictime-postgres-app
    port: 5432
    reportsDatabase: ManicTimeReports
    sslMode: Prefer
    user: manictime
  extra:
    automaticVersionCheck:
      enabled: false
  seed: true
