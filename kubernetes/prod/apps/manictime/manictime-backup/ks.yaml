apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: manictime-backup
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: manictime
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/apps/manictime/manictime-backup/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: manictime
  dependsOn:
  - name: plugin-barman-cloud
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
