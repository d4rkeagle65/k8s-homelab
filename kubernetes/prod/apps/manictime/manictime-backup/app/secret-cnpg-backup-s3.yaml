# The access key for the database backups in Garage (docker/garage/), from the
# cluster-secrets Vaultwarden item. The ObjectStore reads it.
apiVersion: v1
kind: Secret
metadata:
  name: cnpg-backup-s3
type: Opaque
stringData:
  ACCESS_KEY_ID: ${CNPG_BACKUP_S3_ACCESS_KEY_ID}
  ACCESS_SECRET_KEY: ${CNPG_BACKUP_S3_SECRET_ACCESS_KEY}
