apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: manictime-waf
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: manictime
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/apps/manictime/manictime-waf/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: manictime
  # Native Ingress, Service and Deployment only (networking.k8s.io / core): no
  # operator CRD, and the cert-manager cluster-issuer annotation doesn't count.
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
