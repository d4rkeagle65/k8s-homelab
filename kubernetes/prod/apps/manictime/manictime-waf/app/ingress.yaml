# Repoints ManicTime's host to the WAF. Replaces the manictime-server chart's own
# Ingress (its values set ingress.enabled: false). traefik-isolated has
# kubernetesCRD disabled, so this is a native Ingress with no Middleware.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: manictime-waf
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
spec:
  ingressClassName: traefik-isolated
  tls:
  - hosts:
    - manictime.${BASE_DOMAIN}
    secretName: manictime-tls
  rules:
  # The LAN name: ExternalDNS publishes it (-> ISOLATED_INGRESS_IP) and it is the
  # certificate's SAN. Isolated-VLAN clients reach ManicTime here, now via the WAF.
  - host: manictime.${BASE_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: manictime-waf
            port:
              number: 8080
  # Catch-all (no host): Tailscale Funnel's reverse proxy forwards the original
  # <node>.<tailnet>.ts.net Host header unchanged (serve sets r.Out.Host =
  # r.In.Host), so it would not match the rule above. traefik-isolated serves only
  # ManicTime, so a hostless rule safely routes funnel traffic to the WAF too. TLS
  # is still presented from the manictime-tls cert above (funnel connects with SNI
  # manictime.${BASE_DOMAIN}, as its backend target is https://manictime.${BASE_DOMAIN}).
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: manictime-waf
            port:
              number: 8080
