# OWASP CRS WAF (ModSecurity v3 on nginx) in front of ManicTime Server. It sits
# in the request path: traefik-isolated Ingress (ingress.yaml) -> this pod ->
# manictime-server:8080. It lets the ManicTime desktop client reach the server
# over a public Tailscale Funnel endpoint while keeping full in-path request
# inspection (ManicTime sync is POST bodies; a forward-auth check can't see them,
# and self-hosted ManicTime has no OIDC, so the server's own OAuth2 bearer-token
# login stays the real gate and this is defence in depth).
#
# Starts in DetectionOnly: it blocks nothing, only logs rule hits to stdout
# (JSON audit log, RelevantOnly). After a real client sync, review the audit log
# for false positives, add any CRS exclusions, then set MODSEC_RULE_ENGINE to On
# (QUEUE.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: manictime-waf
  labels:
    app.kubernetes.io/name: manictime-waf
spec:
  # One replica, like manictime-server: ManicTime is homelab-low (non-critical),
  # and the cluster is memory-constrained. A WAF restart is a brief ManicTime
  # outage on both the LAN and the funnel path; a second replica would remove
  # that single point of failure at the cost of another memory request.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: manictime-waf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: manictime-waf
    spec:
      # Matches manictime-server's intended tier (QUEUE-resource-limits.md): the
      # WAF only serves ManicTime, so it is shed with it under memory pressure and
      # never preempts a more important app.
      priorityClassName: homelab-low
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: modsecurity-crs
        # Pinned stable CRS 4.30.0 tag + digest (coreruleset/modsecurity-crs-docker);
        # the rolling `nginx-alpine` tag is not for production.
        image: owasp/modsecurity-crs:4.30.0-nginx-alpine-202611090911@sha256:b8d5bbf88c643800e31b248993858c335e4907ba0ee473d0c81c5726fb2c1bdc
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        # Upstream: the ManicTime Server Service in this namespace.
        - name: BACKEND
          value: http://manictime-server:8080
        - name: PORT
          value: "8080"
        # Review mode: evaluate rules and log, block nothing. Flip to On after the
        # audit-log review (QUEUE.md).
        - name: MODSEC_RULE_ENGINE
          value: DetectionOnly
        # ManicTime syncs are large POST bodies. Default limit is 13107200 (~12.5
        # MiB), which would cap a sync; raise it. NOFILES is the one that applies
        # to ManicTime's non-multipart bodies.
        - name: MODSEC_REQ_BODY_LIMIT
          value: "134217728"            # 128 MiB
        - name: MODSEC_REQ_BODY_NOFILES_LIMIT
          value: "134217728"            # 128 MiB
        # Never reject an over-limit body: inspect the first 128 MiB, pass the rest
        # uninspected, so a large sync is never hard-capped (the server's own auth
        # still gates it). Default action is Reject.
        - name: MODSEC_REQ_BODY_LIMIT_ACTION
          value: ProcessPartial
        # Tolerate a slow upload over the public funnel (nginx default 10s between
        # body reads). nginx client_max_body_size is already 0 (unlimited) in this
        # image and proxy_read_timeout is 36000s, so no nginx config mount is needed.
        - name: CLIENT_BODY_TIMEOUT
          value: 300s
        resources:
          # No history yet; resize after a week per QUEUE-resource-limits.md. The
          # 1Gi limit leaves headroom for ModSecurity buffering a request body up
          # to MODSEC_REQ_BODY_LIMIT while it inspects it.
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        readinessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
