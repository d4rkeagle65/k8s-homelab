# RomM's Authentik client secret, generated once here and read through helmrelease.yaml's env
# (OIDC_CLIENT_SECRET). Authentik's worker reads the same value through authentik-extras'
# secretstore-romm.yaml, which the Role below lets read only this Secret. To rotate: delete the
# Secret romm-oidc-client, then restart Authentik's worker and RomM.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: romm-oidc-client
spec:
  secretKeys: [AUTHENTIK_CLIENT_SECRET]
  length: 64
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-oidc-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: romm-oidc-client
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: romm-oidc-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-oidc-reader-romm
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [romm-oidc-client]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-oidc-reader-romm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-oidc-reader-romm
subjects:
- kind: ServiceAccount
  name: authentik-oidc-reader
  namespace: authentik
