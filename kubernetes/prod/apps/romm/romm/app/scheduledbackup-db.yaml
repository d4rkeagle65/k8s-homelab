# A base backup every night at 03:00, and one as soon as this is applied.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: romm-db-nightly
spec:
  schedule: "0 0 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: romm-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
