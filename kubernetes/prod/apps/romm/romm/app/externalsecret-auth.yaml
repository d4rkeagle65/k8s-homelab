# RomM's app secret (ROMM_AUTH_SECRET_KEY, required; helmrelease.yaml's env), made once in the
# cluster. Upstream suggests `openssl rand -hex 32`; a 64-character random secret is equivalent
# entropy and RomM uses it to sign sessions. If RomM rejects it (e.g. it must be valid hex),
# replace this generator with a Key Vault variable holding an `openssl rand -hex 32` value.
# To rotate: delete the Secret romm-auth, then restart RomM; everyone signs in again.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: romm-auth
spec:
  secretKeys: [ROMM_AUTH_SECRET_KEY]
  length: 64
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: romm-auth
spec:
  refreshPolicy: CreatedOnce
  target:
    name: romm-auth
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: romm-auth
