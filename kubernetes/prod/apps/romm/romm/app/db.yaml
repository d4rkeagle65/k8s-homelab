# RomM's database on PostgreSQL 18 (Debian trixie). RomM supports postgresql
# (ROMM_DB_DRIVER=postgresql); the helmrelease points it here through the romm-db-app secret.
# RomM runs Alembic migrations on first boot - watch the pod log that they apply cleanly on
# PostgreSQL (the only first-boot risk).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: romm-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  primaryUpdateMethod: switchover
  # WAL to Garage at least hourly (scripts/tests/test_structure.py,
  # test_databases_archive_hourly, says why).
  postgresql:
    parameters:
      archive_timeout: 1h
  # Scheduled before ordinary pods when nodes are short (cluster-policy).
  priorityClassName: homelab-critical
  # Spread over the workers (scripts/tests/test_structure.py,
  # test_databases_spread, says why).
  affinity:
    podAntiAffinityType: required
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchLabels:
              cnpg.io/podRole: instance
          namespaceSelector: {}
          topologyKey: kubernetes.io/hostname
  enablePDB: true
  resources:
    requests:
      cpu: 20m
      memory: 160Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: romm
      owner: app
  storage:
    size: 4Gi
    storageClass: local-db
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
