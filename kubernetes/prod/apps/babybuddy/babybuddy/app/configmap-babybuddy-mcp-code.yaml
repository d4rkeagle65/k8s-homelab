  server.py: |
    """
    BabyBuddy MCP server.

    Thin, narrowly-scoped MCP wrapper around a subset of the BabyBuddy REST API
    (https://bb.${BASE_DOMAIN}/api/), exposed as a remote MCP connector so
    Claude can check for and log feeding/diaper-change records without needing
    direct access to the BabyBuddy API token or the home network.

    Auth model:
      - This server's own bearer token (MCP_AUTH_TOKEN) gates every MCP request,
        supplied as a fixed 'Authorization: Bearer <token>' request header on
        the Claude custom connector (no-sign-in mode).
      - BabyBuddy's own API token (BABYBUDDY_API_TOKEN) is only ever used
        server-side, talking to BabyBuddy over the cluster network. It is never
        returned to a caller.
    """

    import os
    import sys
    from datetime import datetime, timedelta

    import httpx
    from fastmcp import FastMCP
    from starlette.middleware import Middleware
    from starlette.middleware.base import BaseHTTPMiddleware
    from starlette.requests import Request
    from starlette.responses import JSONResponse, PlainTextResponse
    from starlette.routing import Route

    MCP_AUTH_TOKEN = os.environ.get("MCP_AUTH_TOKEN")
    BABYBUDDY_API_TOKEN = os.environ.get("BABYBUDDY_API_TOKEN")
    BABYBUDDY_BASE_URL = os.environ.get("BABYBUDDY_BASE_URL", "http://babybuddy-svc.babybuddy:8000/api")

    if not MCP_AUTH_TOKEN:
        print("FATAL: MCP_AUTH_TOKEN is not set", file=sys.stderr)
        sys.exit(1)
    if not BABYBUDDY_API_TOKEN:
        print("FATAL: BABYBUDDY_API_TOKEN is not set", file=sys.stderr)
        sys.exit(1)

    mcp = FastMCP(name="babybuddy")

    _client = httpx.Client(
        base_url=BABYBUDDY_BASE_URL,
        headers={"Authorization": f"Token {BABYBUDDY_API_TOKEN}"},
        timeout=15.0,
    )


    def _parse_iso(value: str) -> datetime:
        """Parse an ISO 8601 datetime string, accepting a trailing 'Z'."""
        return datetime.fromisoformat(value.replace("Z", "+00:00"))


    @mcp.tool()
    def list_children() -> list[dict]:
        """List all children configured in BabyBuddy, with their child IDs.

        Use this to resolve a child's name to the numeric child_id required by
        the other tools. Returns id, first_name, last_name, birth_date for each.
        """
        resp = _client.get("/children/", params={"limit": 50})
        resp.raise_for_status()
        data = resp.json()
        return [
            {
                "id": c["id"],
                "first_name": c["first_name"],
                "last_name": c["last_name"],
                "birth_date": c.get("birth_date"),
            }
            for c in data.get("results", [])
        ]


    @mcp.tool()
    def check_feedings(child_id: int, start_time: str, end_time: str) -> list[dict]:
        """List BabyBuddy feeding records for a child whose start time falls within a window.

        Args:
            child_id: BabyBuddy child ID (e.g. 2 for ${Child1}).
            start_time: ISO 8601 datetime (with offset), start of the window to check.
            end_time: ISO 8601 datetime (with offset), end of the window to check.

        Returns a list of matching feeding records (id, start, end, type, method, amount, notes).
        Empty list means no BabyBuddy feeding record exists for that child in that window.
        """
        resp = _client.get(
            "/feedings/",
            params={
                "child": child_id,
                "start_min": start_time,
                "start_max": end_time,
                "limit": 50,
            },
        )
        resp.raise_for_status()
        data = resp.json()
        return [
            {
                "id": f["id"],
                "start": f["start"],
                "end": f["end"],
                "type": f["type"],
                "method": f["method"],
                "amount": f["amount"],
                "notes": f["notes"],
            }
            for f in data.get("results", [])
        ]


    @mcp.tool()
    def check_diaper_changes(child_id: int, start_time: str, end_time: str) -> list[dict]:
        """List BabyBuddy diaper change records for a child whose time falls within a window.

        Args:
            child_id: BabyBuddy child ID (e.g. 2 for ${Child1}).
            start_time: ISO 8601 datetime (with offset), start of the window to check.
            end_time: ISO 8601 datetime (with offset), end of the window to check.

        Returns a list of matching diaper change records (id, time, wet, solid, color, notes).
        Empty list means no BabyBuddy diaper change record exists for that child in that window.
        """
        start_dt = _parse_iso(start_time)
        end_dt = _parse_iso(end_time)
        # BabyBuddy's /changes/ date_min/date_max filter buckets by calendar date
        # and date_max is exclusive, so widen the API-side query by a day on each
        # side, then filter precisely on the actual 'time' field ourselves.
        resp = _client.get(
            "/changes/",
            params={
                "child": child_id,
                "date_min": (start_dt.date() - timedelta(days=1)).isoformat(),
                "date_max": (end_dt.date() + timedelta(days=1)).isoformat(),
                "limit": 200,
            },
        )
        resp.raise_for_status()
        data = resp.json()
        matches = []
        for c in data.get("results", []):
            t = _parse_iso(c["time"])
            if start_dt <= t <= end_dt:
                matches.append(
                    {
                        "id": c["id"],
                        "time": c["time"],
                        "wet": c["wet"],
                        "solid": c["solid"],
                        "color": c["color"],
                        "notes": c["notes"],
                    }
                )
        return matches


    @mcp.tool()
    def log_feeding(
        child_id: int,
        time: str,
        amount_oz: float,
        feeding_type: str = "formula",
        method: str = "bottle",
        notes: str = "",
    ) -> dict:
        """Create a new BabyBuddy feeding record.

        Args:
            child_id: BabyBuddy child ID (e.g. 2 for ${Child1}).
            time: ISO 8601 datetime (with offset) the feeding occurred.
            amount_oz: Amount fed, in ounces (BabyBuddy instance is configured in oz).
            feeding_type: One of "breast milk", "formula", "fortified breast milk", "solid food".
            method: One of "bottle", "left breast", "right breast", "both breasts", "parent fed", "self fed".
            notes: Optional free-text note. Callers auto-logging from a transcript should
                note that here (e.g. "Auto-logged from Fieldy transcript <id>; review for accuracy.").

        Returns the created record.
        """
        payload = {
            "child": child_id,
            "start": time,
            "end": time,
            "type": feeding_type,
            "method": method,
            "amount": amount_oz,
            "notes": notes,
        }
        resp = _client.post("/feedings/", json=payload)
        resp.raise_for_status()
        return resp.json()


    @mcp.tool()
    def log_diaper_change(
        child_id: int,
        time: str,
        wet: bool,
        solid: bool,
        notes: str = "",
    ) -> dict:
        """Create a new BabyBuddy diaper change record.

        Args:
            child_id: BabyBuddy child ID (e.g. 2 for ${Child1}).
            time: ISO 8601 datetime (with offset) the change occurred.
            wet: Whether the diaper was wet.
            solid: Whether the diaper was solid.
            notes: Optional free-text note. Callers auto-logging from a transcript should
                note that here (e.g. "Auto-logged from Fieldy transcript <id>; review for accuracy.").

        Returns the created record.
        """
        payload = {"child": child_id, "time": time, "wet": wet, "solid": solid, "notes": notes}
        resp = _client.post("/changes/", json=payload)
        resp.raise_for_status()
        return resp.json()


    class BearerAuthMiddleware(BaseHTTPMiddleware):
        async def dispatch(self, request: Request, call_next):
            if request.url.path == "/healthz":
                return await call_next(request)
            auth = request.headers.get("authorization", "")
            if auth != f"Bearer {MCP_AUTH_TOKEN}":
                return JSONResponse({"error": "unauthorized"}, status_code=401)
            return await call_next(request)


    async def healthz(request):
        return PlainTextResponse("ok")


    app = mcp.http_app(path="/mcp", middleware=[Middleware(BearerAuthMiddleware)])
    app.router.routes.insert(0, Route("/healthz", healthz))


    if __name__ == "__main__":
        import uvicorn

        uvicorn.run(app, host="0.0.0.0", port=8080)
