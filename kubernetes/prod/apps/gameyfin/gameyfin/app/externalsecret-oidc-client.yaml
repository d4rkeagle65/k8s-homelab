# Gameyfin's Authentik client secret, generated once here. Gameyfin has no OIDC env or API, so
# this value is also what the owner pastes into Gameyfin's Administration > Security page by hand
# (kubectl get secret -n gameyfin gameyfin-oidc-client -o jsonpath='{.data.AUTHENTIK_CLIENT_SECRET}'
# | base64 -d). Authentik's worker reads it through authentik-extras' secretstore-gameyfin.yaml,
# which the Role below lets read only this Secret. To rotate: delete the Secret, restart
# Authentik's worker, and paste the new value into Gameyfin.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: gameyfin-oidc-client
spec:
  secretKeys: [AUTHENTIK_CLIENT_SECRET]
  length: 64
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gameyfin-oidc-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: gameyfin-oidc-client
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: gameyfin-oidc-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-oidc-reader-gameyfin
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [gameyfin-oidc-client]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-oidc-reader-gameyfin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-oidc-reader-gameyfin
subjects:
- kind: ServiceAccount
  name: authentik-oidc-reader
  namespace: authentik
