# The key Gameyfin signs/encrypts with (APP_KEY, required; helmrelease.yaml's env), made once
# in the cluster. Gameyfin turns APP_KEY into an AES key and rejects any length but 128/192/256
# bits (AppKeyValidator). The length below must stay a multiple of 4 so it is valid base64: at
# 32 characters it decodes to 24 bytes (192-bit) if Gameyfin base64-decodes it, and is 32 bytes
# (256-bit) if it uses the raw bytes - valid either way. 44 characters decoded to 33 bytes and
# was refused. If a future release needs a different form, the fallback is a Key Vault variable
# holding an `openssl rand -base64 32` value, read like the other secrets.
# To rotate: delete the Secret gameyfin-app-key, then restart Gameyfin.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: gameyfin-app-key
spec:
  secretKeys: [APP_KEY]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gameyfin-app-key
spec:
  refreshPolicy: CreatedOnce
  target:
    name: gameyfin-app-key
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: gameyfin-app-key
