# The key Gameyfin signs/encrypts with (APP_KEY, required; helmrelease.yaml's env), made once
# in the cluster. Upstream suggests `openssl rand -base64 32`; a 44-character random secret is
# equivalent entropy. If Gameyfin rejects it (e.g. it must base64-decode to exactly 32 bytes),
# replace this generator with a Key Vault variable holding an `openssl rand -base64 32` value.
# To rotate: delete the Secret gameyfin-app-key, then restart Gameyfin.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: gameyfin-app-key
spec:
  secretKeys: [APP_KEY]
  length: 44
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gameyfin-app-key
spec:
  refreshPolicy: CreatedOnce
  target:
    name: gameyfin-app-key
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: gameyfin-app-key
