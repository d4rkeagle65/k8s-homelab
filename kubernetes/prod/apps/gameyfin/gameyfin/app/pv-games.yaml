# The games library on the NAS media share. A PV of gameyfin's own (the shared synmedia-nfs PVC
# is scoped to the media namespace), bound one-to-one to pvc-games below. Read-write: Gameyfin
# refuses a library whose directory isn't writable (it writes metadata/images alongside the
# games), so this cannot be mounted read-only. Create /volume1/media/games on the NAS first,
# writable by MEDIA_PUID:999 (the kubelet makes a missing path as root, which Gameyfin then
# can't use). Gameyfin's admin UI points a library at the mount path (/library).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gameyfin-games-nfs
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    name: gameyfin-games
    namespace: gameyfin
  nfs:
    server: ${NFS_SERVER}
    path: /volume1/media/games
  mountOptions:
    - nfsvers=3
    - hard
    - timeo=600
    - retrans=2
