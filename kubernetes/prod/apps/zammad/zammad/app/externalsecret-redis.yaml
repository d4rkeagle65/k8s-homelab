# The password of Zammad's own Redis (the chart's subchart), read by Redis and by
# Zammad, made once in the cluster. Letters and digits only, so it needs no
# URL-encoding (Zammad builds a URL from it). To rotate: delete the Secret
# zammad-redis-auth, then restart Redis and Zammad.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: zammad-redis-auth
spec:
  secretKeys: [redis-password]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zammad-redis-auth
spec:
  refreshPolicy: CreatedOnce
  target:
    name: zammad-redis-auth
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: zammad-redis-auth
