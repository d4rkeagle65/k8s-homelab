# Zammad, the helpdesk: alerts become tickets here (QUEUE-zammad.md). Zammad's
# own chart, with its database on CloudNativePG (db.yaml) instead of the
# chart's PostgreSQL, and the chart's own Redis and Memcached. Search is the
# chart's Elasticsearch (one node), run by the ECK operator
# (prod/system/elastic-system/eck-operator).
#
# Login: through Authentik (OIDC, the zammad blueprint), set up with the first
# admin by the auto wizard (autoWizard below) at the first visit.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zammad
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: zammad
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  releaseName: zammad
  chart:
    spec:
      chart: zammad
      version: 19.1.5
      sourceRef:
        kind: HelmRepository
        name: zammad
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  # The init Job migrates the database on install and upgrade.
  timeout: 15m
  values:
    secrets:
      postgresql:
        useExisting: true
        secretName: zammad-db-app
        secretKey: password
      redis:
        useExisting: true
        secretName: zammad-redis
        secretKey: redis-password
    # Zammad's first setup, applied once by its auto wizard at the first visit to
    # the web UI (the chart makes the Secret from it): the owner's admin account,
    # with the same email as in Authentik so the first login through Authentik
    # links to it; the system's address; and the login through Authentik (OIDC,
    # a public client with PKCE: no client secret). Later changes are made in
    # Zammad's settings; this isn't read again.
    autoWizard:
      enabled: true
      config: |
        {
          "TextModuleLocale": {"Locale": "en-us"},
          "Users": [
            {
              "login": "${ZAMMAD_ADMIN_EMAIL}",
              "firstname": "Admin",
              "lastname": "Zammad",
              "email": "${ZAMMAD_ADMIN_EMAIL}",
              "password": "${ZAMMAD_ADMIN_PASSWORD}"
            }
          ],
          "Settings": [
            {"name": "product_name", "value": "Homelab"},
            {"name": "fqdn", "value": "zammad${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}"},
            {"name": "http_type", "value": "https"},
            {"name": "system_online_service", "value": false},
            {"name": "user_create_account", "value": false},
            {"name": "auth_third_party_auto_link_at_inital_login", "value": true},
            {"name": "auth_openid_connect", "value": true},
            {"name": "auth_openid_connect_credentials", "value": {
              "display_name": "Authentik",
              "identifier": "zammad",
              "issuer": "https://auth.${BASE_DOMAIN}/application/o/zammad/",
              "uid_field": "sub",
              "scope": "openid email profile",
              "pkce": true
            }}
          ]
        }

    zammadConfig:
      # The chart's bundled Elasticsearch (elasticsearch below); its address and
      # the elastic user's password are found by the chart. reindex builds the
      # index from the database on each zammad-init run, which is quick at this size.
      elasticsearch:
        enabled: true
        # Its init step runs whenever this is true, enabled or not: the two go together.
        initialisation: true
        reindex: true
      postgresql:
        enabled: false
        host: zammad-db-rw
        user: zammad
        db: zammad_production
        pass: ""
      redis:
        enabled: true
        pass: ""
      memcached:
        enabled: true
      # No privileged init container: the chart's volume-permissions one exists
      # only to chmod the temporary folder (an emptyDir is world-writable without
      # the sticky bit, which Ruby refuses). A memory-backed one (tmpfs) has the
      # sticky bit, so the namespace can enforce Pod Security's baseline.
      initContainers:
        volumePermissions:
          enabled: false
        # zammad-init's steps boot Rails: past the namespace's 512 MiB default
        # (cluster-policy's LimitRange) the database step was OOM-killed.
        postgresql:
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1536Mi}
        zammad:
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1536Mi}
        elasticsearch:
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1536Mi}
      tmpDirVolume:
        emptyDir:
          medium: Memory
          sizeLimit: 100Mi
      # Requests and limits by QUEUE-resource-limits.md's rules, as a first
      # estimate: re-measured once a week of use exists.
      nginx:
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 500m, memory: 128Mi}
      railsserver:
        resources:
          requests: {cpu: 100m, memory: 768Mi}
          limits: {cpu: 1000m, memory: 1536Mi}
      scheduler:
        resources:
          requests: {cpu: 50m, memory: 512Mi}
          limits: {cpu: 1000m, memory: 1Gi}
      websocket:
        resources:
          requests: {cpu: 20m, memory: 256Mi}
          limits: {cpu: 500m, memory: 512Mi}

    # Sessions and the live-update channel only: losing them on a restart means
    # logging in again, so no volume.
    redis:
      auth:
        existingSecret: zammad-redis
        existingSecretPasswordKey: redis-password
      persistence:
        enabled: false
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 500m, memory: 256Mi}
    memcached:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 500m, memory: 128Mi}

    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: cloudflare-letsencrypt
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
        traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd
      hosts:
      - host: zammad${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        paths:
        - path: /
          pathType: Prefix
      tls:
      - secretName: zammad-tls
        hosts:
        - zammad${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}

    # The eck-elasticsearch subchart: one node, its data on nas-iscsi (single-copy
    # and constantly written; only nodes with Talos's iSCSI tools mount it). The
    # chart's sizes: 512 MiB heap in 1 GiB, Elastic's half-and-half rule.
    elasticsearch:
      nodeSets:
      - name: default
        count: 1
        config:
          # No vm.max_map_count change on the nodes: mmap off instead.
          node.store.allow_mmap: false
        volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: nas-iscsi
            resources:
              requests:
                storage: 5Gi
        podTemplate:
          spec:
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                  - matchExpressions:
                    - key: extensions.talos.dev/iscsi-tools
                      operator: Exists
            containers:
            - name: elasticsearch
              env:
              - name: ES_JAVA_OPTS
                value: "-Xms512m -Xmx512m"
              resources:
                requests: {cpu: 100m, memory: 1Gi}
                limits: {cpu: 1000m, memory: 1Gi}
