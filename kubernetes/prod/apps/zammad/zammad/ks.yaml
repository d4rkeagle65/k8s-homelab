apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zammad
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: zammad
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/apps/zammad/zammad/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: zammad
  # zammad-db is a CloudNativePG Cluster, backed up through the Barman plugin;
  # its Elasticsearch is run by the ECK operator.
  dependsOn:
  - name: cnpg
  - name: plugin-barman-cloud
  - name: eck-operator
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
