# The token the task runners authenticate with (helmrelease.yaml's N8N_RUNNERS_AUTH_TOKEN,
# read by n8n and its runners alike), made once in the cluster; nothing outside it needs
# the value. To rotate: delete the Secret n8n-runners, then restart n8n.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: n8n-runners
spec:
  secretKeys: [runners-auth-token]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-runners
spec:
  refreshPolicy: CreatedOnce
  target:
    name: n8n-runners
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: n8n-runners
