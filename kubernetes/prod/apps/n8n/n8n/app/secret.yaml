# From the cluster-secrets Vaultwarden item. The encryption key protects every
# credential n8n stores: lose it and they can't be decrypted, so it is set here
# rather than generated by n8n. The token authenticates the task runners.
apiVersion: v1
kind: Secret
metadata:
  name: n8n
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  encryption-key: ${N8N_ENCRYPTION_KEY}
  runners-auth-token: ${N8N_RUNNERS_AUTH_TOKEN}
