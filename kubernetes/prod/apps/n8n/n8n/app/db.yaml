# n8n's database on PostgreSQL 18 (Debian trixie), taking over from n8n-postgres
# (Debian bullseye; old-queues/QUEUE-postgres18.md). Created empty; the data is copied in
# with pg_dump and pg_restore while n8n is stopped.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  primaryUpdateMethod: switchover
  # Scheduled before ordinary pods when nodes are short (cluster-policy).
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  affinity:
    podAntiAffinityType: preferred
  enablePDB: true
  enableSuperuserAccess: false
  storage:
    size: 5Gi
    storageClass: local-db
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
