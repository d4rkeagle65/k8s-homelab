# The credentials n8n imports at each start (helmrelease.yaml's import-credentials), each a
# file in n8n's export format with a fixed ID the workflows in n8n/workflows/ name, built
# from Key Vault (this namespace opts in to the azure-keyvault store; not cluster-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: n8n-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: n8n-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        zammad-api.json: |
          {"id": "ZammadApiFromKV1", "name": "Zammad API", "type": "httpHeaderAuth",
           "data": {"name": "Authorization", "value": {{ printf "Token token=%s" .zammadToken | toJson }}}}
        # The webhooks' Basic Auth ("Zammad: tickets in"): each sender's existing token as the
        # password, in its URL as https://<user>:<token>@<n8n>/webhook/zammad/<source>.
        semaphore-alerts.json: |
          {"id": "SemaphoreAlertKV", "name": "Semaphore alerts", "type": "httpBasicAuth",
           "data": {"user": "semaphore", "password": {{ .semaphoreToken | toJson }}}}
        databasus-alerts.json: |
          {"id": "DatabasusAlertKV", "name": "Databasus alerts", "type": "httpBasicAuth",
           "data": {"user": "databasus", "password": {{ .databasusToken | toJson }}}}
  data:
  - {secretKey: zammadToken, remoteRef: {key: ZAMMAD-BRIDGE-API-TOKEN}}
  - {secretKey: semaphoreToken, remoteRef: {key: SEMAPHORE-ALERT-TOKEN}}
  - {secretKey: databasusToken, remoteRef: {key: DATABASUS-ALERT-TOKEN}}
