# n8n, workflow automation, with its task runners as a sidecar ("external
# mode"): the runners execute Code-node JavaScript and Python apart from n8n
# itself, which n8n's docs require for any instance holding real credentials.
# The two images' versions must match. Reachable from private networks only;
# logins are n8n's own (its OIDC is an Enterprise feature).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: n8n
      homelab.local/category: apps
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-important
      securityContext:
        # n8n and the runners run as the image's node user.
        fsGroup: 1000
    controllers:
      main:
        containers:
          main:
            image: &image
              repository: n8nio/n8n
              tag: 2.43.3
            env: &env
              - name: DB_TYPE
                value: postgresdb
              - name: DB_POSTGRESDB_HOST
                value: n8n-db-rw
              - name: DB_POSTGRESDB_PORT
                value: "5432"
              - name: DB_POSTGRESDB_DATABASE
                value: app
              - name: DB_POSTGRESDB_USER
                valueFrom:
                  secretKeyRef:
                    name: n8n-db-app
                    key: username
              - name: DB_POSTGRESDB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: n8n-db-app
                    key: password
              - name: N8N_ENCRYPTION_KEY
                valueFrom:
                  secretKeyRef:
                    name: n8n
                    key: encryption-key
              # Behind Traefik: the address users and webhooks see.
              - name: N8N_HOST
                value: n8n${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
              - name: N8N_PROTOCOL
                value: https
              - name: N8N_WEBHOOK_URL
                value: https://n8n${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/
              - name: N8N_PROXY_HOPS
                value: "1"
              # Task runners in the sidecar, reached inside the pod.
              - name: N8N_RUNNERS_ENABLED
                value: "true"
              - name: N8N_RUNNERS_MODE
                value: external
              - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
                value: 127.0.0.1
              - name: N8N_RUNNERS_AUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: n8n
                    key: runners-auth-token
              - name: N8N_NATIVE_PYTHON_RUNNER
                value: "true"
              - name: GENERIC_TIMEZONE
                value: ${TIMEZONE}
              - name: TZ
                value: ${TIMEZONE}
              # Binary data from workflow runs to the data volume, not memory.
              - name: N8N_DEFAULT_BINARY_DATA_MODE
                value: filesystem
              # Execution logs are kept 14 days.
              - name: EXECUTIONS_DATA_PRUNE
                value: "true"
              - name: EXECUTIONS_DATA_MAX_AGE
                value: "336"
              - name: N8N_DIAGNOSTICS_ENABLED
                value: "false"
              # Prometheus metrics at /metrics on the main port.
              - name: N8N_METRICS
                value: "true"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5678
                  periodSeconds: 20
                  failureThreshold: 6
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5678
                  periodSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 60m
                memory: 672Mi
              limits:
                cpu: 500m
                memory: 1408Mi
          runners:
            image:
              repository: n8nio/runners
              tag: 2.43.3
            env:
              - name: N8N_RUNNERS_TASK_BROKER_URI
                value: http://127.0.0.1:5679
              - name: N8N_RUNNERS_AUTH_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: n8n
                    key: runners-auth-token
            # The launcher's health server (/healthz on 5680, on the pod's
            # address), not the runners' own (5681, off unless enabled).
            probes:
              liveness: &runnerprobe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 5680
                  periodSeconds: 30
                  failureThreshold: 5
              readiness: *runnerprobe
              startup:
                enabled: false
            # The task runners run workflows' code, hence the room above
            # their idle use.
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                cpu: 1000m
                memory: 1Gi
        # The credentials n8n/README.md lists, imported at each start from Key Vault
        # (externalsecret.yaml) with n8n's own CLI, which encrypts them and replaces one
        # of the same ID: Key Vault owns them, and an edit in n8n's editor lasts until the
        # next restart. A failed import is logged and n8n starts anyway; a workflow using
        # the credential then fails where it's used.
        initContainers:
          import-credentials:
            image: *image
            env: *env
            command:
              - sh
              - -c
              - |
                if ! ls /credentials/*.json >/dev/null 2>&1; then
                  echo "credentials: none to import (n8n-credentials missing or empty)"; exit 0
                fi
                if n8n import:credentials --separate --input=/credentials; then
                  for f in /credentials/*.json; do
                    id=$(sed -n 's/.*"id": *"\([^"]*\)".*/\1/p' "$f")
                    if n8n export:credentials --id="$id" --output=/tmp/check.json >/dev/null 2>&1; then
                      echo "credentials: $(basename "$f") imported as $id, read back"
                    else
                      echo "credentials: $(basename "$f") imported, but $id doesn't read back"
                    fi
                  done
                else
                  echo "credentials: the import failed; n8n starts with what it had"
                fi
                rm -f /tmp/check.json
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
    service:
      main:
        controller: main
        ports:
          http:
            port: 5678
    serviceMonitor:
      main:
        enabled: true
        serviceName: n8n
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 60s
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd
        hosts:
          - host: n8n${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: n8n-tls
            hosts:
              - n8n${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    persistence:
      data:
        existingClaim: n8n-data
        advancedMounts:
          main:
            main:
              - path: /home/node/.n8n
            import-credentials:
              - path: /home/node/.n8n
      credentials:
        type: secret
        name: n8n-credentials
        defaultMode: 0440
        advancedMounts:
          main:
            import-credentials:
              - path: /credentials
                readOnly: true
