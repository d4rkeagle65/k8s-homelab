# CouchDB's admin login and cluster secrets (values.yaml's extraSecretName): the login
# from Key Vault, the cookie secret and Erlang cookie made in the cluster. Made once:
# to apply a new admin password from Key Vault, or rotate the cookies, delete the
# Secret obsidian-couchdb-auth, then restart CouchDB.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: obsidian-couchdb-auth
spec:
  secretKeys: [cookieAuthSecret, erlangCookie]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-couchdb-auth
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: obsidian-couchdb-auth
    creationPolicy: Owner
  data:
  - {secretKey: adminUsername, remoteRef: {key: OBSIDIAN-COUCHDB-ADMINUSERNAME}}
  - {secretKey: adminPassword, remoteRef: {key: OBSIDIAN-COUCHDB-ADMINPASSWORD}}
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: obsidian-couchdb-auth
