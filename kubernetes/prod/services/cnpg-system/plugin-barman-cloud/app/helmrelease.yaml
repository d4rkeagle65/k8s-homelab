# CloudNativePG's Barman Cloud plugin: the databases' backups (base backups and
# continuous WAL archiving) to S3, here Garage on the NAS (docker/garage/). It
# must run in the operator's namespace, and gets its TLS certificates from
# cert-manager. Each database namespace defines an ObjectStore, and each
# Cluster names it under spec.plugins.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plugin-barman-cloud
  namespace: cnpg-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: cnpg-system
      homelab.local/category: services
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.1
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
