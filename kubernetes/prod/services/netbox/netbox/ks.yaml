apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: netbox
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: netbox
      homelab.local/category: services
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/services/netbox/netbox/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: netbox
  # netbox-postgres is a CloudNativePG Cluster.
  dependsOn:
  - name: cnpg
  - name: plugin-barman-cloud
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
