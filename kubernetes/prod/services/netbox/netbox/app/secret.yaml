# NetBox's own secrets, read by the chart as existingSecret. API v2 tokens are
# signed with a pepper: api_token_peppers is a JSON object of numbered ones
# ({"1": "<50+ characters>"}). Never remove one, or the tokens signed with it
# stop working; rotate by adding a higher-numbered one. It sits under data
# (its field holds the base64 form): substituted into stringData, the JSON
# would be read as a YAML mapping.
apiVersion: v1
kind: Secret
metadata:
  name: netbox
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  api_token_peppers: ${NETBOX_API_TOKEN_PEPPERS}
stringData:
  secret_key: ${NETBOX_SECRET_KEY}
  email_password: ""
