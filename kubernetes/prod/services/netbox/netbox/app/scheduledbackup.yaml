# A base backup every night at 02:50, and one as soon as this is applied.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: netbox-postgres-nightly
spec:
  schedule: "0 50 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: netbox-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
