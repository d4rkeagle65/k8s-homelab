# NetBox's uploaded images and attachments, on the NAS; the web pod and the
# worker both mount it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbox-media
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nfs-retain-rwo
  resources:
    requests:
      storage: 2Gi
