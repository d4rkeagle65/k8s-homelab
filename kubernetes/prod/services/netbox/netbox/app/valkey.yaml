# NetBox's Valkey (the open-source Redis): its background-task queue
# (database 0) and its cache (database 1). Nothing in it outlives a restart on
# purpose: no disk, no snapshots. Only NetBox's pods reach it
# (networkpolicy.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine
          args: [--save, "", --appendonly, "no", --maxmemory, 96mb, --maxmemory-policy, allkeys-lru]
          ports:
            - {name: valkey, containerPort: 6379}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            exec:
              command: [valkey-cli, ping]
            periodSeconds: 15
          livenessProbe:
            exec:
              command: [valkey-cli, ping]
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-valkey
spec:
  selector:
    app.kubernetes.io/name: netbox-valkey
  ports:
    - {name: valkey, port: 6379, targetPort: valkey}
