# NetBox's database on PostgreSQL 18 (Debian trixie), taking over from netbox-postgres
# (Debian bullseye; QUEUE-postgres18.md). Created empty; the data is copied in
# with pg_dump and pg_restore while NetBox is stopped.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbox-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  affinity:
    podAntiAffinityType: preferred
  enablePDB: true
  resources:
    requests:
      cpu: 20m
      memory: 192Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: netbox
      owner: app
  storage:
    size: 4Gi
    storageClass: local-db
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
