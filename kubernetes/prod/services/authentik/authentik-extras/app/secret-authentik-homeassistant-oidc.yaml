# homeassistant's existing Authentik client secret, preserved via Key Vault
# (AUTHENTIK-HOMEASSISTANT-OIDC-CLIENT-SECRET -> cluster-secrets). Read by the worker as
# HOMEASSISTANT_OIDC_CLIENT_SECRET for the homeassistant blueprint; the app keeps the same secret.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-homeassistant-oidc
  namespace: authentik
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  client-secret: ${AUTHENTIK_HOMEASSISTANT_OIDC_CLIENT_SECRET}
