# Reads Gameyfin's generated client secret from the gameyfin namespace
# (apps/gameyfin/gameyfin's externalsecret-oidc-client.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gameyfin
spec:
  provider:
    kubernetes:
      remoteNamespace: gameyfin
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authentik-oidc-reader
