# Grafana's client secret for the worker's GRAFANA_OIDC_CLIENT_SECRET (the grafana
# blueprint), copied from the Secret the monitoring namespace generates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-grafana-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: monitoring
  target:
    name: authentik-grafana-client
    creationPolicy: Owner
  data:
  - {secretKey: client-secret, remoteRef: {key: grafana-oidc-client, property: client-secret}}
