# Kept's client secret for the worker's KEPT_OIDC_CLIENT_SECRET (the kept
# blueprint), copied from the Secret the kept namespace generates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-kept-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kept
  target:
    name: authentik-kept-client
    creationPolicy: Owner
  data:
  - {secretKey: client-secret, remoteRef: {key: kept-oidc-client, property: KEPT_OIDC_CLIENT_SECRET}}
