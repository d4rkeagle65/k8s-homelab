# Immich's existing Authentik client secret, preserved via Key Vault
# (AUTHENTIK-IMMICH-OIDC-CLIENT-SECRET -> cluster-secrets). Read by the worker as
# IMMICH_OIDC_CLIENT_SECRET for the immich blueprint; Immich's own OAuth config keeps
# the same value, so converting the provider to a blueprint doesn't change its secret.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-immich-oidc
  namespace: authentik
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  client-secret: ${AUTHENTIK_IMMICH_OIDC_CLIENT_SECRET}
