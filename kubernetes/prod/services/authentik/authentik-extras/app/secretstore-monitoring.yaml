# Reads Grafana's generated client secret from the monitoring namespace
# (system/monitoring/monitoring-extras's externalsecret-oidc-client.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: monitoring
spec:
  provider:
    kubernetes:
      remoteNamespace: monitoring
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authentik-oidc-reader
