# Nextcloud's client secret for the worker's NEXTCLOUD_OIDC_CLIENT_SECRET (the nextcloud
# blueprint), copied from the Secret the nextcloud namespace generates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-nextcloud-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: nextcloud
  target:
    name: authentik-nextcloud-client
    creationPolicy: Owner
  data:
  - {secretKey: client-secret, remoteRef: {key: nextcloud-oidc-client, property: NEXTCLOUD_OIDC_CLIENT_SECRET}}
