# babybuddy-mcp's existing Authentik client secret, preserved via Key Vault
# (AUTHENTIK-BABYBUDDY_MCP-OIDC-CLIENT-SECRET -> cluster-secrets). Read by the worker as
# BABYBUDDY_MCP_OIDC_CLIENT_SECRET for the babybuddy-mcp blueprint; the app keeps the same secret.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-babybuddy-mcp-oidc
  namespace: authentik
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  client-secret: ${AUTHENTIK_BABYBUDDY_MCP_OIDC_CLIENT_SECRET}
