# Termix's OIDC client secret (QUEUE-bastion.md), straight from Key Vault: the authentik
# namespace holds only Authentik and opts in to the azure-keyvault store, so a new client
# secret no longer goes through cluster-secrets. The worker reads it as
# TERMIX_OIDC_CLIENT_SECRET for the termix blueprint; Termix reads the same Key Vault secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-termix-oidc
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: authentik-termix-oidc
    creationPolicy: Owner
  data:
  - secretKey: client-secret
    remoteRef:
      key: AUTHENTIK-TERMIX-OIDC-CLIENT-SECRET
