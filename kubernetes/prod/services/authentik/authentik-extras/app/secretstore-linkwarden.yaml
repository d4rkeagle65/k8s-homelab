# Reads Linkwarden's generated client secret from the linkwarden namespace
# (apps/linkwarden/linkwarden's externalsecret-oidc-client.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: linkwarden
spec:
  provider:
    kubernetes:
      remoteNamespace: linkwarden
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authentik-oidc-reader
