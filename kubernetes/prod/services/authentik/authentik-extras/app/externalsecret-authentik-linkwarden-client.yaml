# Linkwarden's client secret for the worker's LINKWARDEN_OIDC_CLIENT_SECRET (the linkwarden
# blueprint), copied from the Secret the linkwarden namespace generates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-linkwarden-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: linkwarden
  target:
    name: authentik-linkwarden-client
    creationPolicy: Owner
  data:
  - {secretKey: client-secret, remoteRef: {key: linkwarden-oidc-client, property: AUTHENTIK_CLIENT_SECRET}}
