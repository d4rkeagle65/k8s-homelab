# vaultwarden's existing Authentik client secret, preserved via Key Vault
# (AUTHENTIK-VAULTWARDEN-OIDC-CLIENT-SECRET -> cluster-secrets). Read by the worker as
# VAULTWARDEN_OIDC_CLIENT_SECRET for the vaultwarden blueprint; the app keeps the same secret.
apiVersion: v1
kind: Secret
metadata:
  name: authentik-vaultwarden-oidc
  namespace: authentik
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  client-secret: ${AUTHENTIK_VAULTWARDEN_OIDC_CLIENT_SECRET}
