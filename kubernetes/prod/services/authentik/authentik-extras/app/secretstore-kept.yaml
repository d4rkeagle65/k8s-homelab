# Reads Kept's generated client secret from the kept namespace
# (apps/kept/kept's externalsecret-oidc-client.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kept
spec:
  provider:
    kubernetes:
      remoteNamespace: kept
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authentik-oidc-reader
