# Homepage's client secret for the worker's HOMEPAGE_OIDC_CLIENT_SECRET (the homepage
# blueprint), copied from the Secret the homepage namespace generates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-homepage-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: homepage
  target:
    name: authentik-homepage-client
    creationPolicy: Owner
  data:
  - {secretKey: client-secret, remoteRef: {key: homepage-oidc-client, property: HOMEPAGE_OIDC_CLIENT_SECRET}}
