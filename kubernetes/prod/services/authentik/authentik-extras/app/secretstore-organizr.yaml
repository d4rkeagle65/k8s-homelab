# Reads Organizr's generated client secret from the organizr namespace
# (services/organizr/organizr's externalsecret-oidc-client.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: organizr
spec:
  provider:
    kubernetes:
      remoteNamespace: organizr
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authentik-oidc-reader
