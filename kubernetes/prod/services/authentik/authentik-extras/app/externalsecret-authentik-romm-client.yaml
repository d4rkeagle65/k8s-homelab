# RomM's client secret for the worker's ROMM_OIDC_CLIENT_SECRET (the romm blueprint),
# copied from the Secret the romm namespace generates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-romm-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: romm
  target:
    name: authentik-romm-client
    creationPolicy: Owner
  data:
  - {secretKey: client-secret, remoteRef: {key: romm-oidc-client, property: AUTHENTIK_CLIENT_SECRET}}
