apiVersion: v1
data:
  dockhand.yaml: |
    # Authentik blueprint: Dockhand's OIDC login. Authentik's worker mounts
    # this ConfigMap (blueprints.configMaps in authentik's values.yaml) and
    # applies it on change and periodically, reverting UI edits to what it
    # sets. The client secret is the worker's DOCKHAND_OIDC_CLIENT_SECRET
    # env var, from the authentik-dockhand-oidc Secret.
    #
    # Only authentik Admins may log in: in Dockhand's free edition every SSO
    # user is a full admin of its Docker host.
    version: 1
    metadata:
      name: Dockhand
    entries:
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Dockhand
      attrs:
        client_type: confidential
        client_id: dockhand
        client_secret: !Env DOCKHAND_OIDC_CLIENT_SECRET
        # A provider made by a blueprint or the API starts with none, and
        # Authentik then rejects every login ("Invalid grant_type").
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://dockhand.${BASE_DOMAIN}/api/auth/oidc/callback
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: dockhand
      attrs:
        name: Dockhand
        provider: !KeyOf provider
        meta_launch_url: https://dockhand.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/dockhand.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !Find [authentik_core.group, [name, authentik Admins]]
  grafana.yaml: |
    # Authentik blueprint: Grafana's OIDC login (monitoring). Like dockhand.yaml:
    # the client secret is the worker's GRAFANA_OIDC_CLIENT_SECRET env var, from
    # the authentik-grafana-oidc Secret. Members of Grafana Admins or Grafana
    # Viewers may log in; Grafana makes Grafana Admins its Admins, the rest
    # Viewers (role_attribute_path in its HelmRelease). Membership is set in the
    # UI: these entries set only the groups' names, so it isn't reverted.
    version: 1
    metadata:
      name: Grafana
    entries:
    - model: authentik_core.group
      id: admins
      identifiers:
        name: Grafana Admins
    - model: authentik_core.group
      id: viewers
      identifiers:
        name: Grafana Viewers
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Grafana
      attrs:
        client_type: confidential
        client_id: grafana
        client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/login/generic_oauth
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: grafana
      attrs:
        name: Grafana
        provider: !KeyOf provider
        meta_launch_url: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/grafana.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !KeyOf admins
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 1
      attrs:
        group: !KeyOf viewers
  grimmory.yaml: |
