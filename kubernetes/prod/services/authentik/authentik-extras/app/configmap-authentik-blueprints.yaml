apiVersion: v1
data:
  dockhand.yaml: |
    # Authentik blueprint: Dockhand's OIDC login. Authentik's worker mounts
    # this ConfigMap (blueprints.configMaps in authentik's values.yaml) and
    # applies it on change and periodically, reverting UI edits to what it
    # sets. The client secret is the worker's DOCKHAND_OIDC_CLIENT_SECRET
    # env var, from the authentik-dockhand-oidc Secret.
    #
    # Only authentik Admins may log in: in Dockhand's free edition every SSO
    # user is a full admin of its Docker host.
    version: 1
    metadata:
      name: Dockhand
    entries:
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Dockhand
      attrs:
        client_type: confidential
        client_id: dockhand
        client_secret: !Env DOCKHAND_OIDC_CLIENT_SECRET
        # A provider made by a blueprint or the API starts with none, and
        # Authentik then rejects every login ("Invalid grant_type").
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://dockhand.${BASE_DOMAIN}/api/auth/oidc/callback
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: dockhand
      attrs:
        name: Dockhand
        provider: !KeyOf provider
        meta_launch_url: https://dockhand.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/dockhand.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !Find [authentik_core.group, [name, authentik Admins]]
  semaphore.yaml: |
    # Authentik blueprint: Semaphore's OIDC login (the Ansible web UI on the
    # Docker host). Like dockhand.yaml: the client secret is the worker's
    # SEMAPHORE_OIDC_CLIENT_SECRET env var, from the authentik-semaphore-oidc
    # Secret, and only authentik Admins may log in. Semaphore makes OIDC users
    # ordinary users; its built-in admin promotes the owner once.
    version: 1
    metadata:
      name: Semaphore
    entries:
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Semaphore
      attrs:
        client_type: confidential
        client_id: semaphore
        client_secret: !Env SEMAPHORE_OIDC_CLIENT_SECRET
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://semaphore.${BASE_DOMAIN}/api/auth/oidc/authentik/redirect
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: semaphore
      attrs:
        name: Semaphore
        provider: !KeyOf provider
        meta_launch_url: https://semaphore.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/semaphore.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !Find [authentik_core.group, [name, authentik Admins]]
  stork.yaml: |
    # Authentik blueprint: Stork's OIDC login (Stork 2.5+, the web UI for the
    # Kea DHCP server on the Docker host). Like dockhand.yaml: the client
    # secret is the worker's STORK_OIDC_CLIENT_SECRET env var, from the
    # authentik-stork-oidc Secret, and only authentik Admins may log in
    # (Stork makes them super-admins).
    version: 1
    metadata:
      name: Stork
    entries:
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Stork
      attrs:
        client_type: confidential
        client_id: stork
        client_secret: !Env STORK_OIDC_CLIENT_SECRET
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://stork.${BASE_DOMAIN}/oidc/callback
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: stork
      attrs:
        name: Stork
        provider: !KeyOf provider
        meta_launch_url: https://stork.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/isc-kea.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !Find [authentik_core.group, [name, authentik Admins]]
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
