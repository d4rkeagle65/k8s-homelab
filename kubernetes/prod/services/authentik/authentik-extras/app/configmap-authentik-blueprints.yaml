      name: Organizr
    entries:
    - model: authentik_core.group
      id: admins
      identifiers:
        name: Organizr Admins
    - model: authentik_core.group
      id: users
      identifiers:
        name: Organizr Users
    - model: authentik_providers_oauth2.oauth2provider
