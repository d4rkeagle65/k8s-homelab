apiVersion: v1
data:
  booklore.yaml: |
    # Authentik blueprint: Booklore's OIDC login (its settings come from
    # booklore.yaml through the booklore-sync Job). Like grafana.yaml: the client
    # secret is the worker's BOOKLORE_OIDC_CLIENT_SECRET env var, from the
    # authentik-booklore-oidc Secret. Members of Booklore Admins or Booklore
    # Users may log in; Booklore sets their rights from the group
    # (groupMappings). Membership is set in the UI.
    version: 1
    metadata:
      name: Booklore
    entries:
    - model: authentik_core.group
      id: admins
      identifiers:
        name: Booklore Admins
    - model: authentik_core.group
      id: users
      identifiers:
        name: Booklore Users
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Booklore
      attrs:
        client_type: confidential
        client_id: booklore
        client_secret: !Env BOOKLORE_OIDC_CLIENT_SECRET
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://booklore${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/oauth2-callback
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: booklore
      attrs:
        name: Booklore
        provider: !KeyOf provider
        meta_launch_url: https://booklore${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/booklore.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !KeyOf admins
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 1
      attrs:
        group: !KeyOf users
  dockhand.yaml: |
    # Authentik blueprint: Dockhand's OIDC login. Authentik's worker mounts
    # this ConfigMap (blueprints.configMaps in authentik's values.yaml) and
    # applies it on change and periodically, reverting UI edits to what it
    # sets. The client secret is the worker's DOCKHAND_OIDC_CLIENT_SECRET
    # env var, from the authentik-dockhand-oidc Secret.
    #
    # Only authentik Admins may log in: in Dockhand's free edition every SSO
    # user is a full admin of its Docker host.
    version: 1
    metadata:
      name: Dockhand
    entries:
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Dockhand
      attrs:
        client_type: confidential
        client_id: dockhand
        client_secret: !Env DOCKHAND_OIDC_CLIENT_SECRET
        # A provider made by a blueprint or the API starts with none, and
        # Authentik then rejects every login ("Invalid grant_type").
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://dockhand.${BASE_DOMAIN}/api/auth/oidc/callback
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: dockhand
      attrs:
        name: Dockhand
        provider: !KeyOf provider
        meta_launch_url: https://dockhand.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/dockhand.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !Find [authentik_core.group, [name, authentik Admins]]
  grafana.yaml: |
    # Authentik blueprint: Grafana's OIDC login (monitoring). Like dockhand.yaml:
    # the client secret is the worker's GRAFANA_OIDC_CLIENT_SECRET env var, from
    # the authentik-grafana-oidc Secret. Members of Grafana Admins or Grafana
    # Viewers may log in; Grafana makes Grafana Admins its Admins, the rest
    # Viewers (role_attribute_path in its HelmRelease). Membership is set in the
    # UI: these entries set only the groups' names, so it isn't reverted.
    version: 1
    metadata:
      name: Grafana
    entries:
    - model: authentik_core.group
      id: admins
      identifiers:
        name: Grafana Admins
    - model: authentik_core.group
      id: viewers
      identifiers:
        name: Grafana Viewers
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Grafana
      attrs:
        client_type: confidential
        client_id: grafana
        client_secret: !Env GRAFANA_OIDC_CLIENT_SECRET
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/login/generic_oauth
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: grafana
      attrs:
        name: Grafana
        provider: !KeyOf provider
        meta_launch_url: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/grafana.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !KeyOf admins
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 1
      attrs:
        group: !KeyOf viewers
  homepage.yaml: |
    # Authentik blueprint: Homepage's OIDC login (its built-in auth gate). Like
    # dockhand.yaml: the client secret is the worker's HOMEPAGE_OIDC_CLIENT_SECRET
    # env var, from the authentik-homepage-oidc Secret, and only authentik Admins
    # may log in: Homepage admits whoever this provider authorizes, and its
    # widgets show the homelab's internals.
    version: 1
    metadata:
      name: Homepage
    entries:
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Homepage
      attrs:
        client_type: confidential
        client_id: homepage
        client_secret: !Env HOMEPAGE_OIDC_CLIENT_SECRET
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://home${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/api/auth/callback/homepage-oidc
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: homepage
      attrs:
        name: Homepage
        provider: !KeyOf provider
        meta_launch_url: https://home${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homepage.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !Find [authentik_core.group, [name, authentik Admins]]
  organizr.yaml: |
    # Authentik blueprint: Organizr's OIDC login (its settings come from
    # organizr.yaml through the organizr-sync Job). Like grafana.yaml: the client
    # secret is the worker's ORGANIZR_OIDC_CLIENT_SECRET env var, from the
    # authentik-organizr-oidc Secret. Members of Organizr Admins or Organizr
    # Users may log in; Organizr makes Organizr Admins its Admins, the rest
    # Users (oidcGroupMappings). Membership is set in the UI.
    version: 1
    metadata:
      name: Organizr
    entries:
    - model: authentik_core.group
      id: admins
      identifiers:
        name: Organizr Admins
    - model: authentik_core.group
      id: users
      identifiers:
        name: Organizr Users
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Organizr
      attrs:
        client_type: confidential
        client_id: organizr
        client_secret: !Env ORGANIZR_OIDC_CLIENT_SECRET
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://organizr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/api/v2/oidc/authentik/callback
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: organizr
      attrs:
        name: Organizr
        provider: !KeyOf provider
        meta_launch_url: https://organizr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/organizr.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !KeyOf admins
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 1
      attrs:
        group: !KeyOf users
  semaphore.yaml: |
    # Authentik blueprint: Semaphore's OIDC login (the Ansible web UI on the
    # Docker host). Like dockhand.yaml: the client secret is the worker's
    # SEMAPHORE_OIDC_CLIENT_SECRET env var, from the authentik-semaphore-oidc
    # Secret, and only authentik Admins may log in. Semaphore makes OIDC users
    # ordinary users; its built-in admin promotes the owner once.
    version: 1
    metadata:
      name: Semaphore
    entries:
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Semaphore
      attrs:
        client_type: confidential
        client_id: semaphore
        client_secret: !Env SEMAPHORE_OIDC_CLIENT_SECRET
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://semaphore.${BASE_DOMAIN}/api/auth/oidc/authentik/redirect
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: semaphore
      attrs:
        name: Semaphore
        provider: !KeyOf provider
        meta_launch_url: https://semaphore.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/semaphore.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !Find [authentik_core.group, [name, authentik Admins]]
  stork.yaml: |
    # Authentik blueprint: Stork's OIDC login (Stork 2.5+, the web UI for the
    # Kea DHCP server on the Docker host). Like dockhand.yaml: the client
    # secret is the worker's STORK_OIDC_CLIENT_SECRET env var, from the
    # authentik-stork-oidc Secret, and only authentik Admins may log in
    # (Stork makes them super-admins).
    version: 1
    metadata:
      name: Stork
    entries:
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Stork
      attrs:
        client_type: confidential
        client_id: stork
        client_secret: !Env STORK_OIDC_CLIENT_SECRET
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://stork.${BASE_DOMAIN}/oidc/callback
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: stork
      attrs:
        name: Stork
        provider: !KeyOf provider
        meta_launch_url: https://stork.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/isc-kea.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !Find [authentik_core.group, [name, authentik Admins]]
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
