    # env var, from the authentik-homepage-oidc Secret, and only authentik Admins
    # may log in: Homepage admits whoever this provider authorizes, and its
    # widgets show the homelab's internals.
    version: 1
    metadata:
      name: Homepage
    entries:
    - model: authentik_providers_oauth2.oauth2provider
      id: provider
      identifiers:
        name: Provider for Homepage
      attrs:
        client_type: confidential
        client_id: homepage
        client_secret: !Env HOMEPAGE_OIDC_CLIENT_SECRET
        grant_types:
        - authorization_code
        - refresh_token
        redirect_uris:
        - matching_mode: strict
          url: https://home${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/api/auth/callback/homepage-oidc
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        sub_mode: hashed_user_id
        issuer_mode: per_provider
    - model: authentik_core.application
      id: application
      identifiers:
        slug: homepage
      attrs:
        name: Homepage
        provider: !KeyOf provider
        meta_launch_url: https://home${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homepage.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !Find [authentik_core.group, [name, authentik Admins]]
  mealie.yaml: |
    # Authentik blueprint: Mealie's OIDC provider (made in the UI) is left as it
    # is except its scope mappings. Mealie refuses a login whose email_verified
    # claim isn't true, and Authentik's default email mapping says false, since
    # Authentik never verifies an address itself. Accounts here are made by the
    # owner, so their addresses are vouched for: this mapping says true, for
    # Mealie's provider only.
    version: 1
    metadata:
      name: mealie
    entries:
    - model: authentik_providers_oauth2.scopemapping
      id: email-verified
      identifiers:
        name: "Mealie: email (verified)"
      attrs:
        scope_name: email
        description: Email address, vouched for as verified
        expression: |
          return {"email": request.user.email, "email_verified": True}
    - model: authentik_providers_oauth2.oauth2provider
      identifiers:
        name: Provider for Mealie
      attrs:
        property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf email-verified
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-entitlements]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
  mesh-mini.yaml: |
    # Authentik blueprint: mesh-mini's login (Intel AMT remote management, which
    # has no login of its own) as a forward-auth proxy, like babybuddy's: Traefik's
    # authentik middleware asks the default-proxy-outpost, and the route sends
    # /outpost.goauthentik.io to it. authentik Admins only: it can power hosts off
    # and take over their consoles.
    #
    # This blueprint owns that outpost's provider list, so it lists every
    # provider the outpost serves: babybuddy's (made in the UI) as well as this one.
    version: 1
    metadata:
      name: mesh-mini
    entries:
    - model: authentik_providers_proxy.proxyprovider
      id: provider
      identifiers:
        name: Provider for mesh-mini
      attrs:
        mode: forward_single
        external_host: https://mesh${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
        invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
        access_token_validity: hours=24
    - model: authentik_core.application
      id: application
      identifiers:
        slug: mesh-mini
      attrs:
        name: mesh-mini
        provider: !KeyOf provider
        meta_launch_url: https://mesh${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        meta_description: Intel AMT remote management
        icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/meshcentral.png
        policy_engine_mode: any
    - model: authentik_policies.policybinding
      identifiers:
        target: !KeyOf application
        order: 0
      attrs:
        group: !Find [authentik_core.group, [name, authentik Admins]]
    - model: authentik_outposts.outpost
      identifiers:
        name: default-proxy-outpost
      attrs:
        providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, babybuddy-proxy]]
        - !KeyOf provider
  organizr.yaml: |
