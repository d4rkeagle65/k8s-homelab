# Grimmory's client secret for the worker's GRIMMORY_OIDC_CLIENT_SECRET (the grimmory
# blueprint), copied from the Secret the grimmory namespace generates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-grimmory-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: grimmory
  target:
    name: authentik-grimmory-client
    creationPolicy: Owner
  data:
  - {secretKey: client-secret, remoteRef: {key: grimmory-oidc-client, property: OIDC_CLIENT_SECRET}}
