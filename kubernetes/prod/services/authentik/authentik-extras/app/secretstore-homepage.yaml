# Reads Homepage's generated client secret from the homepage namespace
# (services/homepage/homepage's externalsecret-oidc-client.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: homepage
spec:
  provider:
    kubernetes:
      remoteNamespace: homepage
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authentik-oidc-reader
