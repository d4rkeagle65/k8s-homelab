# Reads RomM's generated client secret from the romm namespace
# (apps/romm/romm's externalsecret-oidc-client.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: romm
spec:
  provider:
    kubernetes:
      remoteNamespace: romm
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authentik-oidc-reader
