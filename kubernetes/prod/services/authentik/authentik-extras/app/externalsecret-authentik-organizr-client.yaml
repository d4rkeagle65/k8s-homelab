# Organizr's client secret for the worker's ORGANIZR_OIDC_CLIENT_SECRET (the organizr
# blueprint), copied from the Secret the organizr namespace generates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-organizr-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: organizr
  target:
    name: authentik-organizr-client
    creationPolicy: Owner
  data:
  - {secretKey: client-secret, remoteRef: {key: organizr-oidc-client, property: OIDC_CLIENT_SECRET}}
