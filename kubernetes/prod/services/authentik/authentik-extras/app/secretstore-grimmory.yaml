# Reads Grimmory's generated client secret from the grimmory namespace
# (apps/grimmory/grimmory's externalsecret-oidc-client.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: grimmory
spec:
  provider:
    kubernetes:
      remoteNamespace: grimmory
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authentik-oidc-reader
