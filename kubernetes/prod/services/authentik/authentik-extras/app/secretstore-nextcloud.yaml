# Reads Nextcloud's generated client secret from the nextcloud namespace
# (apps/nextcloud/nextcloud's externalsecret-oidc-client.yaml).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: nextcloud
spec:
  provider:
    kubernetes:
      remoteNamespace: nextcloud
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: authentik-oidc-reader
