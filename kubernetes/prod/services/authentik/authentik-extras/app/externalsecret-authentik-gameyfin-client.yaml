# Gameyfin's client secret for the worker's GAMEYFIN_OIDC_CLIENT_SECRET (the gameyfin
# blueprint), copied from the Secret the gameyfin namespace generates.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-gameyfin-client
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: gameyfin
  target:
    name: authentik-gameyfin-client
    creationPolicy: Owner
  data:
  - {secretKey: client-secret, remoteRef: {key: gameyfin-oidc-client, property: AUTHENTIK_CLIENT_SECRET}}
