# Redis's and the Sentinels' passwords (values.yaml's existingSecret), each its own, made
# once in the cluster and never in Key Vault. Immich's REDIS_URL is built from them
# (immich-extras' externalsecret-immich-redis.yaml). To rotate both: delete the Secret
# redis-ha-auth; it is made again, and redis-ha and Immich need restarting.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: redis-ha-auth
spec:
  secretKeys: [auth, sentinel-password]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-ha-auth
spec:
  refreshPolicy: CreatedOnce
  target:
    name: redis-ha-auth
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: redis-ha-auth
