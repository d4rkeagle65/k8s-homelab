# Redis's and the Sentinels' passwords (values.yaml's existingSecret). immich's
# REDIS_URL (immich-redis-url) holds the same two, so change all three together.
apiVersion: v1
kind: Secret
metadata:
  name: redis-ha-creds
  namespace: redis-ha
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  auth: ${REDIS_HA_CREDS_AUTH}
  sentinel-password: ${REDIS_HA_CREDS_SENTINEL_PASSWORD}
