apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- cronjob.yaml
- deployment-report.yaml
- networkpolicy.yaml
- pvc.yaml
- secret.yaml
- service.yaml
- servicemonitor.yaml
# Renovate's global settings and the script that turns its report into
# metrics. The generated name carries a hash, so a change reaches the next run.
configMapGenerator:
- name: renovate
  files:
  - config/config.js
  - config/report-to-metrics.py
