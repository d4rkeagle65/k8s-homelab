# The GitHub token Renovate pushes its branches and opens its pull requests
# with: a fine-grained token limited to this repository, with read and write
# on contents, pull requests and issues (the Dependency Dashboard is an issue).
apiVersion: v1
kind: Secret
metadata:
  name: renovate
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  RENOVATE_TOKEN: ${RENOVATE_GITHUB_TOKEN}
