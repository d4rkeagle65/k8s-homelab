# The GitHub token Renovate pushes its branches and opens its pull requests
# with: a fine-grained token limited to this repository, with read and write
# on contents, pull requests, issues (the Dependency Dashboard is an issue) and
# commit statuses (the release-age check on each branch), and read on
# Dependabot alerts (vulnerability fixes jump the queue).
apiVersion: v1
kind: Secret
metadata:
  name: renovate
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  RENOVATE_TOKEN: ${RENOVATE_GITHUB_TOKEN}
