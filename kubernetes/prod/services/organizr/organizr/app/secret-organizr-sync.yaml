# What the organizr-sync Job reads through env:NAME in organizr.yaml: the
# first-run setup's values, Authentik's client secret, and the keys of the apps
# on Organizr's homepage. Base64 fields under data, plain ones under stringData.
apiVersion: v1
kind: Secret
metadata:
  name: organizr-sync
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  OIDC_CLIENT_SECRET: ${AUTHENTIK_ORGANIZR_OIDC_CLIENT_SECRET}
  SONARR_KEY: ${MEDIA_SONARR_API_KEY}
  RADARR_KEY: ${MEDIA_RADARR_API_KEY}
  LIDARR_KEY: ${MEDIA_LIDARR_API_KEY}
  PROWLARR_KEY: ${MEDIA_PROWLARR_API_KEY}
stringData:
  ORGANIZR_ADMIN_USERNAME: ${ORGANIZR_ADMIN_USERNAME}
  ORGANIZR_ADMIN_PASSWORD: ${ORGANIZR_ADMIN_PASSWORD}
  ORGANIZR_ADMIN_EMAIL: ${ORGANIZR_ADMIN_EMAIL}
  ORGANIZR_API_KEY: ${ORGANIZR_API_KEY}
  ORGANIZR_HASH_KEY: ${ORGANIZR_HASH_KEY}
  ORGANIZR_REGISTRATION_PASSWORD: ${ORGANIZR_REGISTRATION_PASSWORD}
  QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME}
  QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
