# The relay's STARTTLS certificate. Clients must connect by this name for
# it to validate. ExternalDNS puts the name in Pi-hole at the main ingress
# address, from the annotation on Traefik's Service.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smtp-oauth-relay
spec:
  dnsNames:
  - smtp-relay.${BASE_DOMAIN}
  issuerRef:
    kind: ClusterIssuer
    name: cloudflare-letsencrypt
  privateKey:
    rotationPolicy: Always
  secretName: smtp-oauth-relay-tls
