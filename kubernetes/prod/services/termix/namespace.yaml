apiVersion: v1
kind: Namespace
metadata:
  labels:
    homelab.local/category: services
    homelab.local/data: database
    homelab.local/exposure: lan
    # Reads its own Key Vault secrets (azure-keyvault's conditions): a namespace of
    # its own, as that label must never go on a shared one.
    homelab.local/keyvault: allowed
    homelab.local/login: authentik-oidc
    pod-security.kubernetes.io/enforce: restricted
  name: termix
