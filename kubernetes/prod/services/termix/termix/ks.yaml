apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: termix
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: termix
      homelab.local/category: services
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/services/termix/termix/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: termix
  # termix-db is a CloudNativePG Cluster; its secrets come from Key Vault.
  dependsOn:
  - name: cnpg
  - name: plugin-barman-cloud
  - name: azure-keyvault
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
