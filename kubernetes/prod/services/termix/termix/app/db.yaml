# Termix's database (DATABASE_DIALECT postgres): hosts, credentials (encrypted by
# Termix before they reach it), users and the audit log.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: termix-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  primaryUpdateMethod: switchover
  # WAL to Garage at least hourly (scripts/tests/test_structure.py,
  # test_databases_archive_hourly, says why).
  postgresql:
    parameters:
      archive_timeout: 1h
  # Scheduled before ordinary pods when nodes are short (cluster-policy).
  priorityClassName: homelab-critical
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  # Spread over the workers (scripts/tests/test_structure.py,
  # test_databases_spread, says why).
  affinity:
    podAntiAffinityType: required
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchLabels:
              cnpg.io/podRole: instance
          namespaceSelector: {}
          topologyKey: kubernetes.io/hostname
  enablePDB: true
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: termix
      owner: app
  storage:
    size: 2Gi
    storageClass: local-db
  # Continuous WAL archiving and base backups to Garage (objectstore.yaml).
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
