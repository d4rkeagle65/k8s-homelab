# Termix's secrets, straight from Key Vault (this namespace opts in to the azure-keyvault
# store; not cluster-secrets). TERMIX_REQUIRE_EXTERNAL_SECRETS makes Termix refuse to
# start without the first four, rather than generate them into its data folder.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: termix
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: termix
    creationPolicy: Owner
  data:
  - {secretKey: JWT_SECRET, remoteRef: {key: TERMIX-JWT-SECRET}}
  - {secretKey: DATABASE_KEY, remoteRef: {key: TERMIX-DATABASE-KEY}}
  - {secretKey: ENCRYPTION_KEY, remoteRef: {key: TERMIX-ENCRYPTION-KEY}}
  - {secretKey: INTERNAL_AUTH_TOKEN, remoteRef: {key: TERMIX-INTERNAL-AUTH-TOKEN}}
  - {secretKey: GUACAMOLE_ENCRYPTION_KEY, remoteRef: {key: TERMIX-GUACAMOLE-ENCRYPTION-KEY}}
  - {secretKey: OIDC_CLIENT_SECRET, remoteRef: {key: AUTHENTIK-TERMIX-OIDC-CLIENT-SECRET}}
---
# The access key for the database backups in Garage, from Key Vault too.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-backup-s3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: cnpg-backup-s3
    creationPolicy: Owner
  data:
  - {secretKey: ACCESS_KEY_ID, remoteRef: {key: CNPG-BACKUP-S3-ACCESS-KEY-ID}}
  - {secretKey: ACCESS_SECRET_KEY, remoteRef: {key: CNPG-BACKUP-S3-SECRET-ACCESS-KEY}}
---
# The NetBox sync's (cronjob-termix-netbox-sync.yaml): NetBox's read token, the Termix
# API key made in Termix's UI for it, and the login name on each kind of host.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: termix-sync
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: termix-sync
    creationPolicy: Owner
  data:
  - {secretKey: NETBOX_TOKEN, remoteRef: {key: NETBOX-READ-TOKEN}}
  - {secretKey: TERMIX_API_KEY, remoteRef: {key: TERMIX-SYNC-API-KEY}}
  - {secretKey: TERMIX_SSH_ADMIN_USER, remoteRef: {key: TERMIX-SSH-ADMIN-USER}}
  - {secretKey: TERMIX_SSH_SYNOLOGY_USER, remoteRef: {key: TERMIX-SSH-SYNOLOGY-USER}}
  - {secretKey: TERMIX_SSH_TERRAMASTER_USER, remoteRef: {key: TERMIX-SSH-TERRAMASTER-USER}}
