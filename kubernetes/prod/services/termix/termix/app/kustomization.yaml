# Termix, the web bastion (QUEUE-bastion.md): SSH and remote desktop to the hosts from
# the browser, behind Authentik twice, on the private networks and the tailnet only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- externalsecret.yaml
- objectstore.yaml
- db.yaml
- scheduledbackup-db.yaml
- pvc.yaml
- deployment.yaml
- service-authentik-outpost.yaml
- ingress.yaml
- cronjob-termix-netbox-sync.yaml
configMapGenerator:
# The sync's script; the name's hash brings a change to the next run.
- name: termix-netbox-sync
  files:
  - sync/termix-netbox-sync.py
