# A base backup of termix's database every night at 02:40 (CloudNativePG's
# schedule has a seconds field first), and one as soon as this is applied.
# Between them, the WAL archive covers every change, so any moment in the
# retention window can be restored.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: termix-db-nightly
spec:
  schedule: "0 40 2 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: termix-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
