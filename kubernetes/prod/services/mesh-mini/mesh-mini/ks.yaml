apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mesh-mini
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: mesh-mini
      homelab.local/category: services
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/services/mesh-mini/mesh-mini/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: mesh-mini
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
