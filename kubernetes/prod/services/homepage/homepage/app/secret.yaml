# Homepage's login secrets and its widgets' keys, from the cluster-secrets
# Vaultwarden item: the same fields the apps' own Secrets use (base64 ones under
# data, plain ones under stringData). Homepage reads HOMEPAGE_VAR_* into its
# config's {{HOMEPAGE_VAR_*}} placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: homepage
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  HOMEPAGE_OIDC_CLIENT_SECRET: ${AUTHENTIK_HOMEPAGE_OIDC_CLIENT_SECRET}
  HOMEPAGE_VAR_PIHOLE1_PASSWORD: ${PIHOLE_PASSWORD}
  HOMEPAGE_VAR_PIHOLE2_PASSWORD: ${PIHOLE2_PASSWORD}
  HOMEPAGE_VAR_SONARR_KEY: ${MEDIA_SONARR_API_KEY}
  HOMEPAGE_VAR_RADARR_KEY: ${MEDIA_RADARR_API_KEY}
  HOMEPAGE_VAR_LIDARR_KEY: ${MEDIA_LIDARR_API_KEY}
  HOMEPAGE_VAR_PROWLARR_KEY: ${MEDIA_PROWLARR_API_KEY}
  HOMEPAGE_VAR_BOOKSHELF_KEY: ${MEDIA_BOOKSHELF_API_KEY}
  HOMEPAGE_VAR_IMMICH_KEY: ${IMMICH_POWER_TOOLS_APIKEY_IMMICH_APIKEY}
  HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_TUNNEL_SECRET_ACCOUNT_ID}
stringData:
  HOMEPAGE_AUTH_SECRET: ${HOMEPAGE_AUTH_SECRET}
  HOMEPAGE_VAR_PVE_TOKEN: ${PVE_EXPORTER_TOKEN_VALUE}
  HOMEPAGE_VAR_HASS_TOKEN: ${HOMEASSISTANT_TOKEN}
  HOMEPAGE_VAR_QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME}
  HOMEPAGE_VAR_QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
  HOMEPAGE_VAR_GRAFANA_USERNAME: ${GRAFANA_ADMIN_USER}
  HOMEPAGE_VAR_GRAFANA_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
  HOMEPAGE_VAR_SYNOLOGY_USERNAME: ${SYNOLOGY_HOMEPAGE_USERNAME}
  HOMEPAGE_VAR_SYNOLOGY_PASSWORD: ${SYNOLOGY_HOMEPAGE_PASSWORD}
  HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID}
  HOMEPAGE_VAR_CLOUDFLARE_TOKEN: ${CLOUDFLARE_HOMEPAGE_API_TOKEN}
  HOMEPAGE_VAR_TAILSCALE_KEY: ${TAILSCALE_API_KEY}
  HOMEPAGE_VAR_TAILSCALE_DEVICE: ${TAILSCALE_DEVICE_ID}
