# The key Homepage signs its login sessions with (helmrelease.yaml's envFrom), made once
# in the cluster. To rotate: delete the Secret homepage-auth, then restart Homepage;
# everyone logs in again.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: homepage-auth
spec:
  secretKeys: [HOMEPAGE_AUTH_SECRET]
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-auth
spec:
  refreshPolicy: CreatedOnce
  target:
    name: homepage-auth
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: homepage-auth
