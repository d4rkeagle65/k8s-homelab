            subPath: custom.css
            readOnly: true
          - path: /app/config/custom.js
            subPath: custom.js
            readOnly: true
          - path: /app/config/services.yaml
            subPath: services.yaml
            readOnly: true
      # Homepage writes its logs and caches beside its config.
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs
