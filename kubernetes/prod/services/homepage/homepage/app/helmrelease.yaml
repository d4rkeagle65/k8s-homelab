                    description: Media server
                    namespace: emby
                    app: emby
                    widget:
                      type: emby
                      url: http://emby.emby.svc.${CLUSTER_DOMAIN}:8096
                      key: "{{ "{{HOMEPAGE_VAR_EMBY_KEY}}" }}"
                      enableBlocks: true
                - Tdarr:
                    icon: tdarr.png
                    href: https://tdarr.${BASE_DOMAIN}
                    description: Transcoding
                    namespace: media
                    app: tdarr
                    widget:
                      type: tdarr
