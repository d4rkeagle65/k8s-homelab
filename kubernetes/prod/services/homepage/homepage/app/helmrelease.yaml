# Homepage, the homelab's start page: its services and their widgets from
# git (configMaps below; the chart restarts it when they change), behind its
# own Authentik login (the homepage blueprint in authentik-extras) and only on
# the private networks. QUEUE-dashboards.md.
#
# The config passes through Helm's templating (app-template's configMaps), so
# each of Homepage's own {{HOMEPAGE_VAR_*}} placeholders is written as a Helm
# string literal that renders to it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: homepage
      homelab.local/category: services
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      priorityClassName: homelab-important
    controllers:
      main:
        # Its own account, with the API token mounted: the kubernetes widget
        # and service discovery read the cluster (rbac below).
        serviceAccount:
          identifier: homepage
        pod:
          automountServiceAccountToken: true
        containers:
          main:
            image:
              repository: ghcr.io/gethomepage/homepage
              tag: v2.6.0
            env:
              HOMEPAGE_ALLOWED_HOSTS: home${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
              HOMEPAGE_EXTERNAL_URL: https://home${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
              HOMEPAGE_AUTH_ENABLED: "true"
              HOMEPAGE_OIDC_ISSUER: https://auth.${BASE_DOMAIN}/application/o/homepage/
              HOMEPAGE_OIDC_CLIENT_ID: homepage
              HOMEPAGE_OIDC_NAME: Authentik
              HOMEPAGE_OIDC_AUTO_LOGIN: "true"
            envFrom:
              - secretRef:
                  name: homepage
            resources:
              requests: {cpu: 60m, memory: 288Mi}
              limits: {cpu: 1000m, memory: 640Mi}
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  # The kubelet would send the pod's IP as Host, which Homepage's
                  # host check refuses (400); localhost:3000 is always allowed.
                  httpGet:
                    path: /api/healthcheck
                    port: 3000
                    httpHeaders:
                      - name: Host
                        value: localhost:3000
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probe
    # The kubernetes widget reads nodes, pods and their metrics; its service
    # discovery lists Ingresses.
    serviceAccount:
      homepage: {}
    rbac:
      roles:
        homepage:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: [namespaces, pods, nodes]
              verbs: [get, list]
            - apiGroups: [networking.k8s.io]
              resources: [ingresses]
              verbs: [get, list]
            - apiGroups: [metrics.k8s.io]
              resources: [nodes, pods]
              verbs: [get, list]
      bindings:
        homepage:
          type: ClusterRoleBinding
          roleRef:
            identifier: homepage
          subjects:
            - identifier: homepage
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    ingress:
      main:
        className: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd
        hosts:
          - host: home${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
        tls:
          - secretName: homepage-tls
            hosts:
              - home${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    configMaps:
      config:
        data:
          # Tabs of cards; the quick links and the status row have no tab, so
          # they show on every tab. The cluster's totals along the top.
          settings.yaml: |
            title: Homelab
            theme: dark
            color: neutral
            headerStyle: clean
            statusStyle: dot
            hideVersion: true
            useEqualHeights: true
            target: _blank
            # Each group fills whole rows: its card count is a multiple of its
            # columns. A row style group spans the page, so a group of 4 in 3
            # columns leaves one card alone on a row of its own. Cards without
            # a widget go in groups of their own, more to a row:
            # useEqualHeights stretches them to a stat card's height beside one.
            # The quick links are icons only, which ignore columns: each icon
            # takes 60px or more, as many to a row as fit.
            layout:
              Quick links: {style: row, header: false, iconsOnly: true}
              Status: {style: row, columns: 4, header: false}
              Featured: {tab: Apps, style: row, columns: 3}
              Everyday: {tab: Apps, style: row, columns: 4}
              Watch: {tab: Media, style: row, columns: 3}
              Downloads: {tab: Media, style: row, columns: 3}
              Library: {tab: Media, style: row, columns: 4}
              More: {tab: Media, style: row, columns: 2}
              Upcoming: {tab: Media, style: row, columns: 1}
              Hosts: {tab: Infrastructure, style: row, columns: 4}
              Storage: {tab: Infrastructure, style: row, columns: 4}
              Observability: {tab: Infrastructure, style: row, columns: 3}
              Tools: {tab: Infrastructure, style: row, columns: 5}
              DNS and DHCP: {tab: Network, style: row, columns: 4}
              Edge: {tab: Network, style: row, columns: 3}
              Wired: {tab: Network, style: row, columns: 4}
              Wi-Fi: {tab: Network, style: row, columns: 3}
              Cluster docs: {tab: Reference}
              Infrastructure docs: {tab: Reference}
              Observability docs: {tab: Reference}
              App docs: {tab: Reference}
          widgets.yaml: |
            - kubernetes:
                cluster:
                  show: true
                  cpu: true
                  memory: true
                  showLabel: true
                  label: cluster
                nodes:
                  show: false
            - datetime:
                text_size: md
                format:
                  dateStyle: long
                  timeStyle: short
          kubernetes.yaml: |
            mode: cluster
          bookmarks.yaml: |
            - Quick links:
                - Semaphore:
                    - icon: semaphore.png
                      href: https://semaphore.${BASE_DOMAIN}
                - Dockhand:
                    - icon: dockhand.png
                      href: https://dockhand.${BASE_DOMAIN}
                - NetBox:
                    - icon: netbox.png
                      href: https://netbox.${BASE_DOMAIN}
                - Zammad:
                    - icon: zammad.png
                      href: https://zammad${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                - Grafana:
                    - icon: grafana.png
                      href: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                - Organizr:
                    - icon: organizr.png
                      href: https://organizr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                - HASS:
                    - icon: home-assistant.png
                      href: https://homeassistant.${BASE_DOMAIN}
                - Authentik:
                    - icon: authentik.png
                      href: https://auth.${BASE_DOMAIN}
                - Immich:
                    - icon: immich.png
                      href: https://immich.${BASE_DOMAIN}
                - Linkwarden:
                    - icon: linkwarden.png
                      href: https://linkwarden${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                - Grimmory:
                    - icon: sh-grimmory.png
                      href: https://grimmory${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                - Kept:
                    - icon: mdi-package-variant-closed
                      href: https://kept${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                - n8n:
                    - icon: n8n.png
                      href: https://n8n.${BASE_DOMAIN}
                - Termix:
                    - icon: termix.png
                      href: https://termix${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                - GitHub:
                    - icon: github.png
                      href: https://github.com/d4rkeagle65/k8s-homelab
            - Cluster docs:
                - Flux:
                    - icon: flux-cd.png
                      href: https://fluxcd.io/flux/
                      description: GitOps toolkit
                - Kubernetes:
                    - icon: kubernetes.png
                      href: https://kubernetes.io/docs/home/
                      description: Concepts and reference
                - CloudNativePG:
                    - icon: sh-cloudnativepg.png
                      href: https://cloudnative-pg.io/documentation/current/
                      description: Postgres operator
                - Traefik:
                    - icon: traefik.png
                      href: https://doc.traefik.io/traefik/
                      description: Ingress and middlewares
                - cert-manager:
                    - icon: cert-manager.png
                      href: https://cert-manager.io/docs/
                      description: Certificates
                - app-template:
                    - icon: mdi-package-variant
                      href: https://bjw-s-labs.github.io/helm-charts/docs/app-template/
                      description: The bjw-s chart
            - Infrastructure docs:
                - Proxmox VE:
                    - icon: proxmox.png
                      href: https://pve.proxmox.com/pve-docs/
                      description: Admin guide
                - OpenTofu:
                    - icon: opentofu.png
                      href: https://search.opentofu.org/provider/bpg/proxmox/latest
                      description: The bpg Proxmox provider
                - Ansible:
                    - icon: ansible.png
                      href: https://docs.ansible.com/ansible/latest/collections/index_module.html
                      description: Module index
                - Synology:
                    - icon: synology.png
                      href: https://kb.synology.com/en-global/search?query=iSCSI
                      description: Knowledge center
                - NetBox:
                    - icon: netbox.png
                      href: https://netboxlabs.com/docs/netbox/
                      description: Data model and API
                - Kea:
                    - icon: isc-kea.png
                      href: https://kea.readthedocs.io/
                      description: DHCP server
                - Pi-hole:
                    - icon: pi-hole.png
                      href: https://docs.pi-hole.net/
                      description: DNS and ad blocking
            - Observability docs:
                - PromQL:
                    - icon: prometheus.png
                      href: https://prometheus.io/docs/prometheus/latest/querying/basics/
                      description: Querying basics
                - LogQL:
                    - icon: loki.png
                      href: https://grafana.com/docs/loki/latest/query/
                      description: Querying logs
                - Grafana:
                    - icon: grafana.png
                      href: https://grafana.com/docs/grafana/latest/
                      description: Dashboards and alerting
                - Alloy:
                    - icon: alloy.png
                      href: https://grafana.com/docs/alloy/latest/reference/components/
                      description: Collector components
                - Dashboards:
                    - icon: grafana.png
                      href: https://grafana.com/grafana/dashboards/
                      description: Community dashboards
                - Alertmanager:
                    - icon: alertmanager.png
                      href: https://prometheus.io/docs/alerting/latest/configuration/
                      description: Routes and receivers
            - App docs:
                - Homepage:
                    - icon: homepage.png
                      href: https://gethomepage.dev/widgets/
                      description: Widgets for this page
                - Authentik:
                    - icon: authentik.png
                      href: https://docs.goauthentik.io/
                      description: Providers and blueprints
                - Home Assistant:
                    - icon: home-assistant.png
                      href: https://www.home-assistant.io/docs/
                      description: Configuration
                - Immich:
                    - icon: immich.png
                      href: https://immich.app/docs/
                      description: Photo server
                - Kept:
                    - icon: mdi-package-variant-closed
                      href: https://keptinventory.info/
                      description: Inventory, backups and sign-in
                - Linkwarden:
                    - icon: linkwarden.png
                      href: https://docs.linkwarden.app/
                      description: Bookmarks, the extension and the app
                - Servarr wiki:
                    - icon: sonarr.png
                      href: https://wiki.servarr.com/
                      description: Sonarr, Radarr and friends
                - Icons:
                    - icon: mdi-image-search
                      href: https://dashboardicons.com/
                      description: Icons for this page
          # Each Docker host's containers, read through its docker-socket-proxy
          # stack (docker/docker-socket-proxy*: the container list and stats
          # only): a card with server and container shows that container's state.
          docker.yaml: |
            docker-vm-1:
              host: ${DOCKHAND_ADDRESS}
              port: 9339
            docker-vm-2:
              host: ${DOCKER_VM_2_MGMT_ADDRESS}
              port: 9339
            terramaster:
              host: ${TERRAMASTER_MGMT_ADDRESS}
              port: 9339
          custom.css: ""
          custom.js: ""
          # The prometheusmetric cards ask Prometheus once a minute, its scrape
          # interval; a query that can come back empty ends in "or vector(0)",
          # since an empty result shows as "-". Cards with namespace and app (or
          # podSelector) show their pods' state and CPU and memory.
          services.yaml: |
            - Status:
                - Alerts:
                    icon: alertmanager.png
                    href: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/alerting/list
                    description: Firing now, by severity
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Critical
                          query: count(ALERTS{alertstate="firing", severity="critical"}) or vector(0)
                          format: {type: number}
                        - label: Warning
                          query: count(ALERTS{alertstate="firing", severity="warning"}) or vector(0)
                          format: {type: number}
                        - label: Info
                          query: count(ALERTS{alertstate="firing", severity="info"}) or vector(0)
                          format: {type: number}
                        - label: Pending
                          query: count(ALERTS{alertstate="pending"}) or vector(0)
                          format: {type: number}
                - Watchdog:
                    icon: healthchecks.png
                    href: https://healthchecks.io
                    description: The dead-man's switch, on Healthchecks.io
                    # Alertmanager pings it every 5 minutes with its always-firing
                    # Watchdog; Healthchecks.io raises it when the pings stop. With
                    # no uuid, the project's checks up and down: the Watchdog's own.
                    widget:
                      type: healthchecks
                      url: https://healthchecks.io
                      key: "{{ "{{HOMEPAGE_VAR_HEALTHCHECKS_KEY}}" }}"
                - Kubernetes:
                    icon: kubernetes.png
                    href: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/dashboards
                    description: Nodes, pods and restarts
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Nodes ready
                          query: count(kube_node_status_condition{condition="Ready", status="true"} == 1) or vector(0)
                          format: {type: number}
                        - label: Pods ready
                          query: count(kube_pod_status_ready{condition="true"} == 1) or vector(0)
                          format: {type: number}
                        - label: Not ready
                          query: count(kube_pod_status_ready{condition="false"} == 1) or vector(0)
                          format: {type: number}
                        - label: Restarts 24h
                          query: round(sum(increase(kube_pod_container_status_restarts_total[1d])))
                          format: {type: number}
                - Flux:
                    icon: flux-cd.png
                    description: GitOps from the repo
                    namespace: flux-system
                    podSelector: app.kubernetes.io/instance=flux-system
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Kustomizations
                          query: count(gotk_reconcile_duration_seconds_count{kind="Kustomization"}) or vector(0)
                          format: {type: number}
                        - label: Helm releases
                          query: count(gotk_reconcile_duration_seconds_count{kind="HelmRelease"}) or vector(0)
                          format: {type: number}
                        - label: Errors 1h
                          query: round(sum(increase(controller_runtime_reconcile_errors_total{namespace="flux-system"}[1h]))) or vector(0)
                          format: {type: number}
            - Featured:
                - Home Assistant:
                    icon: home-assistant.png
                    href: https://homeassistant.${BASE_DOMAIN}
                    description: Home automation
                    namespace: homeassistant
                    app: homeassistant
                    podSelector: app=homeassistant
                    widget:
                      type: homeassistant
                      url: http://homeassistant.homeassistant.svc.${CLUSTER_DOMAIN}:8123
                      key: "{{ "{{HOMEPAGE_VAR_HASS_TOKEN}}" }}"
                - Immich:
                    icon: immich.png
                    href: https://immich.${BASE_DOMAIN}
                    description: Photos and videos
                    namespace: immich
                    app: immich
                    podSelector: app.kubernetes.io/instance=immich
                    widget:
                      type: immich
                      version: 2
                      url: http://immich-server.immich.svc.${CLUSTER_DOMAIN}:2283
                      key: "{{ "{{HOMEPAGE_VAR_IMMICH_KEY}}" }}"
                - Grimmory:
                    icon: sh-grimmory.png
                    href: https://grimmory${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                    description: E-books
                    namespace: grimmory
                    app: grimmory
                    # Grimmory keeps Booklore's API, so Booklore's widget reads it.
                    widget:
                      type: booklore
                      url: http://grimmory.grimmory.svc.${CLUSTER_DOMAIN}:6060
                      username: homepage
                      password: "{{ "{{HOMEPAGE_VAR_GRIMMORY_PASSWORD}}" }}"
                - Mealie:
                    icon: mealie.png
                    href: https://mealie.${BASE_DOMAIN}
                    description: Recipes
                    namespace: mealie
                    app: mealie
                    podSelector: app=mealie
                    widget:
                      type: mealie
                      version: 2
                      url: http://mealie.mealie.svc.${CLUSTER_DOMAIN}:9000
                      key: "{{ "{{HOMEPAGE_VAR_MEALIE_KEY}}" }}"
                - Linkwarden:
                    icon: linkwarden.png
                    href: https://linkwarden${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                    description: Bookmarks and archived pages
                    namespace: linkwarden
                    app: linkwarden
                    podSelector: app.kubernetes.io/controller=linkwarden
                    # An access token made in Linkwarden (Settings > Access Tokens).
                    widget:
                      type: linkwarden
                      url: http://linkwarden.linkwarden.svc.${CLUSTER_DOMAIN}:3000
                      key: "{{ "{{HOMEPAGE_VAR_LINKWARDEN_KEY}}" }}"
                - Authentik:
                    icon: authentik.png
                    href: https://auth.${BASE_DOMAIN}
                    description: Single sign-on
                    namespace: authentik
                    app: authentik
                    widget:
                      type: authentik
                      version: 2
                      url: http://authentik-server.authentik.svc.${CLUSTER_DOMAIN}:80
                      key: "{{ "{{HOMEPAGE_VAR_AUTHENTIK_KEY}}" }}"
            - Everyday:
                - Vaultwarden:
                    icon: vaultwarden.png
                    href: https://vaultwarden.${BASE_DOMAIN}
                    description: Passwords
                    siteMonitor: https://vaultwarden.${BASE_DOMAIN}
                    server: docker-vm-1
                    container: vaultwarden
                - n8n:
                    icon: n8n.png
                    href: https://n8n.${BASE_DOMAIN}
                    description: Workflow automation
                    namespace: n8n
                    app: n8n
                - Baby Buddy:
                    icon: babybuddy.png
                    href: https://bb.${BASE_DOMAIN}
                    description: Feeds, sleeps and changes
                    namespace: babybuddy
                    app: babybuddy
                    podSelector: app=babybuddy
                - Kept:
                    icon: mdi-package-variant-closed
