                    description: Household inventory
                    namespace: kept
                    app: kept
                    podSelector: app.kubernetes.io/name=kept,app.kubernetes.io/component=server
                - Immich Power Tools:
                    icon: immich.png
                    href: https://immichpt.${BASE_DOMAIN}
                    description: Bulk photo tools
                    namespace: immich
                    app: immich-power-tools
                    podSelector: app=immich-power-tools
                - Obsidian sync:
                    icon: obsidian.png
                    href: https://obsidian.${BASE_DOMAIN}
                    description: Notes sync (CouchDB)
                    namespace: obsidian
                    app: couchdb
                    podSelector: app=couchdb
                - ManicTime:
                    icon: mdi-clock-outline
                    href: https://manictime.${BASE_DOMAIN}
                    description: Time tracking
                    namespace: manictime
                    app: manictime-server
                - Organizr:
                    icon: organizr.png
                    href: https://organizr${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                    description: Apps in tabs
                    namespace: organizr
                    app: organizr
                - Zammad:
                    icon: zammad.png
                    href: https://zammad${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                    description: Helpdesk, alerts as tickets
                    siteMonitor: https://zammad${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
            - Watch:
                - Seerr:
                    icon: seerr.png
                    href: https://seerr.${BASE_DOMAIN}
                    description: Requests
                    namespace: media
                    app: seerr
                    widget:
                      type: seerr
                      url: http://seerr.media.svc.${CLUSTER_DOMAIN}:5055
