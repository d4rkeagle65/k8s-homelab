                          service_group: Library
                          service_name: Sonarr
                          baseUrl: https://sonarr.${BASE_DOMAIN}
                        - type: radarr
                          service_group: Library
                          service_name: Radarr
                          baseUrl: https://radarr.${BASE_DOMAIN}
            - Hosts:
                - Proxmox:
                    icon: proxmox.png
                    href: https://proxmox.${BASE_DOMAIN}
                    description: Virtualisation cluster
                    widget:
                      type: proxmox
                      url: https://proxmox.${BASE_DOMAIN}
                      username: prometheus@pve!exporter
                      password: "{{ "{{HOMEPAGE_VAR_PVE_TOKEN}}" }}"
                - Proxmox hosts:
                    icon: mdi-server
                    href: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/d/homelab-drives
                    description: CPU, memory and the most worn SSD
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Up
                          query: count(up{job="proxmox-hosts"} == 1) or vector(0)
                          format: {type: number}
                        - label: CPU
                          query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="proxmox-hosts", mode="idle"}[5m])))
                          format: {type: percent, options: {maximumFractionDigits: 0}}
                        - label: Memory
                          query: 100 * (1 - sum(node_memory_MemAvailable_bytes{job="proxmox-hosts"}) / sum(node_memory_MemTotal_bytes{job="proxmox-hosts"}))
                          format: {type: percent, options: {maximumFractionDigits: 0}}
                        - label: SSD wear
                          query: 100 * max(nvme_percentage_used_ratio{job="proxmox-hosts"})
                          format: {type: percent, options: {maximumFractionDigits: 0}}
                - Docker VM 1:
                    icon: docker.png
                    href: https://dockhand.${BASE_DOMAIN}
                    description: Stacks through Dockhand
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Containers
                          query: count(count by (name) (container_last_seen{job="docker-vm", name!=""})) or vector(0)
                          format: {type: number}
                        - label: CPU
                          query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="docker-vm", mode="idle"}[5m])))
                          format: {type: percent, options: {maximumFractionDigits: 0}}
                        - label: Free memory
                          query: node_memory_MemAvailable_bytes{job="docker-vm"}
                          format: {type: bytes}
                - Docker VM 2:
                    icon: docker.png
                    href: https://dockhand.${BASE_DOMAIN}
                    description: DHCP's standby, through Hawser
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        # No cAdvisor there, so no container count: its node-exporter only.
                        - label: Up
                          query: max(up{job="docker-vm-2"}) or vector(0)
                          format: {type: number}
                        - label: CPU
                          query: 100 * (1 - avg(rate(node_cpu_seconds_total{job="docker-vm-2", mode="idle"}[5m])))
                          format: {type: percent, options: {maximumFractionDigits: 0}}
                        - label: Free memory
                          query: node_memory_MemAvailable_bytes{job="docker-vm-2"}
                          format: {type: bytes}
            - Storage:
                - Synology:
                    icon: synology.png
                    href: https://${NAS_MGMT_HOSTNAME}:5001
                    description: Main NAS
                    widgets:
                    - type: diskstation
                      url: https://${NAS_MGMT_HOSTNAME}:5001
                      username: "{{ "{{HOMEPAGE_VAR_SYNOLOGY_USERNAME}}" }}"
                      password: "{{ "{{HOMEPAGE_VAR_SYNOLOGY_PASSWORD}}" }}"
                    - type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Pools healthy
                          query: count(raidStatus{nas="synology"} == 1) or vector(0)
                          format: {type: number}
                        - label: Disks OK
                          query: count(diskStatus{nas="synology"} == 1) or vector(0)
                          format: {type: number}
                        - label: Temp
                          query: temperature{nas="synology"}
                          format: {type: number, suffix: " °C"}
                - TerraMaster:
                    icon: terramaster.png
                    href: http://${TERRAMASTER_MGMT_ADDRESS}:8181
                    description: Second NAS
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Up
                          # The exporter's own up series carries no nas label; a failed scrape
                          # leaves this series absent.
                          query: count(ssCpuIdle{nas="terramaster"}) or vector(0)
                          format: {type: number}
                        - label: CPU
                          query: 100 - ssCpuIdle{nas="terramaster"}
                          format: {type: percent, options: {maximumFractionDigits: 0}}
                        - label: Free memory
                          query: memAvailReal{nas="terramaster"}
                          format: {type: bytes, scale: 1024}
                - Garage:
                    icon: garage.png
                    description: S3 for backups and logs
                    server: terramaster
                    container: garage
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Healthy
                          query: max(cluster_healthy{job="garage"}) or vector(0)
                          format: {type: number}
                        - label: Requests
                          query: sum(rate(api_s3_request_counter[5m]))
                          format: {type: number, suffix: /s, options: {maximumFractionDigits: 2}}
                        - label: Free
                          query: sum(garage_local_disk_avail{volume="data"})
                          format: {type: bytes}
                - Databases:
                    icon: sh-cloudnativepg.png
                    description: CloudNativePG, backed up to Garage
                    namespace: cnpg-system
                    app: cloudnative-pg
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Clusters
                          query: count(count by (namespace, cluster) (cnpg_collector_up)) or vector(0)
                          format: {type: number}
                        - label: Instances up
                          query: sum(cnpg_collector_up) or vector(0)
                          format: {type: number}
                        - label: Oldest backup
                          query: time() - min(barman_cloud_cloudnative_pg_io_last_available_backup_timestamp)
                          format: {type: duration}
            - Observability:
                - Grafana:
                    icon: grafana.png
                    href: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                    description: Dashboards, metrics and logs
                    namespace: monitoring
                    app: grafana
                    widget:
                      type: grafana
                      version: 2
                      url: http://kube-prometheus-stack-grafana.monitoring.svc.${CLUSTER_DOMAIN}:80
                      username: "{{ "{{HOMEPAGE_VAR_GRAFANA_USERNAME}}" }}"
                      password: "{{ "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}" }}"
                - Prometheus:
                    icon: prometheus.png
                    href: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/explore
                    description: Scrape targets
                    namespace: monitoring
                    app: prometheus
                    widget:
                      type: prometheus
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                - Loki:
                    icon: loki.png
                    href: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/a/grafana-lokiexplore-app/explore
                    description: Logs from every pod and host
                    namespace: monitoring
                    app: loki
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Lines
                          query: sum(rate(loki_distributor_lines_received_total[5m]))
                          format: {type: number, suffix: /s, options: {maximumFractionDigits: 0}}
                        - label: Streams
                          query: sum(loki_ingester_memory_streams) or vector(0)
                          format: {type: number}
            - Tools:
                - Dockhand:
                    icon: dockhand.png
                    href: https://dockhand.${BASE_DOMAIN}
                    description: Docker stacks
                    siteMonitor: https://dockhand.${BASE_DOMAIN}
                    # No widget: Dockhand's needs its admin login (a limited user is
                    # a paid licence), root on every Docker host. Its own container's
                    # state comes from docker/docker-socket-proxy instead.
                    server: docker-vm-1
                    container: dockhand
                - Semaphore:
                    icon: semaphore.png
                    href: https://semaphore.${BASE_DOMAIN}
                    description: Ansible and OpenTofu
                    siteMonitor: https://semaphore.${BASE_DOMAIN}
                    server: docker-vm-1
                    container: semaphore
                - Databasus:
                    icon: databasus.png
                    href: https://databasus.${BASE_DOMAIN}
                    description: Database backups
                    siteMonitor: https://databasus.${BASE_DOMAIN}
                    server: docker-vm-1
                    container: databasus
                - mesh-mini:
                    icon: meshcentral.png
                    href: https://mesh${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                    description: Intel AMT consoles
                    namespace: mesh-mini
                    app: mesh-mini
                - Headlamp:
                    icon: headlamp.png
                    href: https://headlamp${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                    description: Kubernetes web UI, read-only
                    namespace: headlamp
                    app: headlamp
                - Termix:
                    icon: termix.png
                    href: https://termix${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                    description: Web bastion, SSH and remote desktop
                    namespace: termix
                    app: termix
            - DNS and DHCP:
                - Pi-hole 1:
                    icon: pi-hole.png
                    href: https://pihole.${BASE_DOMAIN}/admin
                    description: DNS and ad blocking
                    widget:
                      type: pihole
                      url: http://${PIHOLE1_MGMT_ADDRESS}
                      version: 6
                      key: "{{ "{{HOMEPAGE_VAR_PIHOLE1_PASSWORD}}" }}"
                - Pi-hole 2:
                    icon: pi-hole.png
                    href: https://pihole2.${BASE_DOMAIN}/admin
                    description: DNS and ad blocking (replica)
                    widget:
                      type: pihole
                      url: http://${PIHOLE2_MGMT_ADDRESS}
                      version: 6
                      key: "{{ "{{HOMEPAGE_VAR_PIHOLE2_PASSWORD}}" }}"
                - Kea DHCP:
                    icon: isc-kea.png
                    href: https://stork.${BASE_DOMAIN}
                    description: Leases, from Kea's own counts
                    siteMonitor: https://stork.${BASE_DOMAIN}
                    server: docker-vm-1
                    container: kea-dhcp4
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Leases
                          query: sum(kea_dhcp4_assigned_addresses) or vector(0)
                          format: {type: number}
                        - label: Pool
                          query: sum(kea_dhcp4_total_addresses)
                          format: {type: number}
                        - label: Used
                          query: 100 * sum(kea_dhcp4_assigned_addresses) / sum(kea_dhcp4_total_addresses)
                          format: {type: percent, options: {maximumFractionDigits: 0}}
                - Kea standby:
                    icon: isc-kea.png
                    href: https://stork.${BASE_DOMAIN}
                    description: DHCP's hot standby, and the pair's HA state
                    server: docker-vm-2
                    container: kea-dhcp4
                    # The pair's HA state as the primary sees it, from docker/kea's
                    # kea-ha-exporter; Heard is how long since the primary heard
                    # from this standby.
                    widget:
                      type: customapi
                      url: http://${DOCKHAND_ADDRESS}:9548/status
                      refreshInterval: 60000
                      mappings:
                        - field: local.state
                          label: Primary
                        - field: remote.state
                          label: Standby
                        - field: remote.age
                          label: Heard
                          format: duration
            - Edge:
                - Traefik:
                    icon: traefik.png
                    description: Ingress and certificates
                    namespace: traefik
                    app: traefik
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Requests
                          query: sum(rate(traefik_service_requests_total[5m]))
                          format: {type: number, suffix: /s, options: {maximumFractionDigits: 1}}
                        - label: Errors
                          query: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) or vector(0)
                          format: {type: number, suffix: /s, options: {maximumFractionDigits: 2}}
                        - label: Next renewal
                          query: min(certmanager_certificate_renewal_timestamp_seconds) - time()
                          format: {type: duration}
                - Cloudflare tunnel:
                    icon: cloudflare.png
                    href: https://one.dash.cloudflare.com
                    description: The way in from the internet
                    namespace: cloudflare-tunnel
                    app: cloudflare-tunnel-ingress-controller
                    widget:
                      type: cloudflared
                      accountid: "{{ "{{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}" }}"
                      tunnelid: "{{ "{{HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID}}" }}"
                      key: "{{ "{{HOMEPAGE_VAR_CLOUDFLARE_TOKEN}}" }}"
                # The tailnet, from the tailscale-exporter's metrics: no API key or device
                # id to expire (kubernetes/prod/system/tailscale-exporter/).
                - Tailscale:
                    icon: tailscale.png
                    href: https://login.tailscale.com/admin/machines
                    description: Subnet router on the Docker host
                    server: docker-vm-1
                    container: tailscale
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Router up
                          query: max(tailscale_device_online{tags=~"(.*,)?tag:subnet-router(,.*)?"}) or vector(0)
                          format: {type: number}
                        - label: Online
                          query: sum(tailscale_device_online) or vector(0)
                          format: {type: number}
                        - label: Routes pending
                          query: count(tailscale_device_route_enabled == 0) or vector(0)
                          format: {type: number}
                        - label: Keys expiring
                          query: count((tailscale_device_key_expiry_timestamp_seconds - time()) < 7 * 86400) or vector(0)
                          format: {type: number}
            - Wired:
                - Switch:
                    icon: tp-link.png
                    href: https://${SWITCH_CORE_ADDRESS}
                    description: TL-SG3428 (SNMP)
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Ports linked
                          query: count(ifHighSpeed{switch="core"} > 0) or vector(0)
                          format: {type: number}
                        - label: In
                          query: 8 * sum(rate(ifHCInOctets{switch="core"}[5m]))
                          format: {type: bitrate}
                        - label: Out
                          query: 8 * sum(rate(ifHCOutOctets{switch="core"}[5m]))
                          format: {type: bitrate}
                        - label: Errors
                          query: sum(rate(ifInErrors{switch="core"}[5m]) + rate(ifOutErrors{switch="core"}[5m])) or vector(0)
                          format: {type: number, suffix: /s}
                # The small switches serve their web UI on HTTP only.
                - Switch 02:
                    icon: tp-link.png
                    href: http://${SWITCH_02_ADDRESS}
                    description: TL-SG108E (ping)
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Up
                          query: max(probe_success{switch="02"}) or vector(0)
                          format: {type: number}
                        - label: Ping
                          query: 1000 * max(probe_icmp_duration_seconds{switch="02", phase="rtt"})
                          format: {type: number, suffix: " ms", options: {maximumFractionDigits: 1}}
                - Switch 04:
                    icon: tp-link.png
                    href: http://${SWITCH_04_ADDRESS}
                    description: TL-SG105E (ping)
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Up
                          query: max(probe_success{switch="04"}) or vector(0)
                          format: {type: number}
                        - label: Ping
                          query: 1000 * max(probe_icmp_duration_seconds{switch="04", phase="rtt"})
                          format: {type: number, suffix: " ms", options: {maximumFractionDigits: 1}}
                - NetBox:
                    icon: netbox.png
                    href: https://netbox${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
                    description: Hosts, addresses and networks
                    siteMonitor: https://netbox${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/login/
                    server: docker-vm-1
                    container: netbox
                    # NetBox runs on the Docker host (docker/netbox/), through
                    # Traefik. A read-only API token of NetBox's own; its field
                    # holds the whole header value as NetBox shows it
                    # ("Bearer nbt_<key>.<token>").
                    widget:
                      type: customapi
                      url: https://netbox${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/api/status/
                      headers:
                        Authorization: "{{ "{{HOMEPAGE_VAR_NETBOX_TOKEN}}" }}"
                      mappings:
                        - field: netbox-version
                          label: Version
                        - field: rq-workers-running
                          label: Workers
            - Wi-Fi:
                - Production AP:
                    icon: openwrt.png
                    href: https://${OPENWRT_AP1_ADDRESS}
                    description: OpenWrt
                    siteMonitor: https://${OPENWRT_AP1_ADDRESS}
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Clients
                          query: sum(wifi_stations{ap="1"}) or vector(0)
                          format: {type: number}
                        - label: Signal
                          query: avg(wifi_station_signal_dbm{ap="1"})
                          format: {type: number, suffix: " dBm", options: {maximumFractionDigits: 0}}
                        - label: Uptime
                          query: time() - node_boot_time_seconds{ap="1"}
                          format: {type: duration}
                        - label: Load
                          query: node_load1{ap="1"}
                          format: {type: number, options: {maximumFractionDigits: 2}}
                - IoT AP:
                    icon: openwrt.png
                    href: https://${OPENWRT_AP2_ADDRESS}
                    description: OpenWrt
                    siteMonitor: https://${OPENWRT_AP2_ADDRESS}
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Clients
                          query: sum(wifi_stations{ap="2"}) or vector(0)
                          format: {type: number}
                        - label: Signal
                          query: avg(wifi_station_signal_dbm{ap="2"})
                          format: {type: number, suffix: " dBm", options: {maximumFractionDigits: 0}}
                        - label: Uptime
                          query: time() - node_boot_time_seconds{ap="2"}
                          format: {type: duration}
                        - label: Load
                          query: node_load1{ap="2"}
                          format: {type: number, options: {maximumFractionDigits: 2}}
                - Travel Router:
                    icon: openwrt.png
                    href: https://${OPENWRT_AP3_ADDRESS}
                    description: OpenWrt
                    siteMonitor: https://${OPENWRT_AP3_ADDRESS}
                    widget:
                      type: prometheusmetric
                      url: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
                      refreshInterval: 60000
                      metrics:
                        - label: Clients
                          query: sum(wifi_stations{ap="3"}) or vector(0)
                          format: {type: number}
                        - label: Signal
                          query: avg(wifi_station_signal_dbm{ap="3"})
                          format: {type: number, suffix: " dBm", options: {maximumFractionDigits: 0}}
                        - label: Uptime
                          query: time() - node_boot_time_seconds{ap="3"}
                          format: {type: duration}
                        - label: Load
                          query: node_load1{ap="3"}
                          format: {type: number, options: {maximumFractionDigits: 2}}
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /app/config/settings.yaml
            subPath: settings.yaml
            readOnly: true
          - path: /app/config/widgets.yaml
            subPath: widgets.yaml
            readOnly: true
          - path: /app/config/kubernetes.yaml
            subPath: kubernetes.yaml
            readOnly: true
          - path: /app/config/bookmarks.yaml
            subPath: bookmarks.yaml
            readOnly: true
          - path: /app/config/docker.yaml
            subPath: docker.yaml
            readOnly: true
          - path: /app/config/custom.css
            subPath: custom.css
            readOnly: true
          - path: /app/config/custom.js
            subPath: custom.js
            readOnly: true
          - path: /app/config/services.yaml
            subPath: services.yaml
            readOnly: true
      # Homepage writes its logs and caches beside its config.
      logs:
        type: emptyDir
        globalMounts:
          - path: /app/config/logs
