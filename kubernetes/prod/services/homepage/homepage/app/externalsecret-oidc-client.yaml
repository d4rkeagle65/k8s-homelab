# Homepage's Authentik client secret, made once here and read through helmrelease.yaml's
# envFrom. Authentik's worker reads it through authentik-extras'
# secretstore-homepage.yaml, which the Role below lets read only this Secret. To rotate:
# delete the Secret homepage-oidc-client, then restart Authentik's worker and Homepage.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: homepage-oidc-client
spec:
  secretKeys: [HOMEPAGE_OIDC_CLIENT_SECRET]
  length: 64
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-oidc-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: homepage-oidc-client
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: homepage-oidc-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-oidc-reader-homepage
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [homepage-oidc-client]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-oidc-reader-homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-oidc-reader-homepage
subjects:
- kind: ServiceAccount
  name: authentik-oidc-reader
  namespace: authentik
