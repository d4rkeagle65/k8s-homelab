apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mariadb-operator
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: mariadb-system
      homelab.local/category: services
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/services/mariadb-system/mariadb-operator/app
  prune: true
  # Ready only once Helm has installed the CRDs and the operator, so an app
  # whose MariaDB depends on this waits for them.
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: mariadb-system
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
