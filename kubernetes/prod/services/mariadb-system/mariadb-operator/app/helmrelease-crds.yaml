# mariadb-operator's CRDs, a chart of their own so they upgrade on their own
# schedule. Never pruned: uninstalling the CRDs deletes every MariaDB with them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mariadb-operator-crds
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: mariadb-system
      homelab.local/category: services
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: mariadb-operator-crds
      version: 26.10.1
      sourceRef:
        kind: HelmRepository
        name: mariadb-operator
        namespace: flux-system
