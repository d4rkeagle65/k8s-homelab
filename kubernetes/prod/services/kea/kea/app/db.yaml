# Kea's host reservations (QUEUE-kea-ha.md), read by both Keas: the Docker VM's
# and its hot-standby partner, so either serves them while the other's host is
# down. Kea's own tool makes the schema (kea-admin, from docker/kea/), never
# this file.
#
# Reached from outside the cluster through its own LoadBalancer address
# (KEA_DB_ADDRESS, on the primary), which only the two Kea hosts may reach
# (KEA_DB_CLIENTS: one CIDR holding both, as both the Service and pg_hba take
# one), and only over TLS. Its server certificate comes from a ten-year CA,
# kea-db-root-ca (certificates-db.yaml), so a Kea host holding that CA can check
# the server (ssl-mode verify-ca, the site file's hosts-databases).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: kea-db
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 2
  primaryUpdateMethod: switchover
  # DHCP depends on it (cluster-policy).
  priorityClassName: homelab-critical
  # Spread over the workers (scripts/tests/test_structure.py,
  # test_databases_spread, says why).
  affinity:
    podAntiAffinityType: required
    additionalPodAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 50
        podAffinityTerm:
          labelSelector:
            matchLabels:
              cnpg.io/podRole: instance
          namespaceSelector: {}
          topologyKey: kubernetes.io/hostname
  enablePDB: true
  # The server's certificate and CA from cert-manager (certificates-db.yaml); the
  # client CA and replication certificate stay CloudNativePG's own.
  certificates:
    serverTLSSecret: kea-db-server-tls
    serverCASecret: kea-db-root-ca
  resources:
    requests:
      cpu: 20m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 896Mi
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  enableSuperuserAccess: false
  bootstrap:
    initdb:
      database: kea
      owner: kea
      secret:
        name: kea-db-credentials
  postgresql:
    # WAL to Garage at least hourly (scripts/tests/test_structure.py,
    # test_databases_archive_hourly, says why).
    parameters:
      archive_timeout: 1h
    # After the operator's own lines (local, and the replicas' certificates):
    # nothing without TLS, and kea's database only from the two Kea hosts.
    pg_hba:
    - hostnossl all all all reject
    - hostssl kea kea ${KEA_DB_CLIENTS} scram-sha-256
    - hostssl kea all all reject
  managed:
    services:
      additional:
      - selectorType: rw
        serviceTemplate:
          metadata:
            name: kea-db-lan
            annotations:
              metallb.io/loadBalancerIPs: ${KEA_DB_ADDRESS}
          spec:
            type: LoadBalancer
            # Local keeps the client's own address, which pg_hba checks too.
            externalTrafficPolicy: Local
            loadBalancerSourceRanges:
            - ${KEA_DB_CLIENTS}
  storage:
    size: 2Gi
    storageClass: local-db
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: garage
