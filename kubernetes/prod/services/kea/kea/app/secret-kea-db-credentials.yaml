# The kea role's login: the same password the Docker VM's Kea already uses
# (Dockhand's KEA_DB_PASSWORD), so moving Kea here changes only the host it
# connects to. Read by the Cluster's bootstrap.
apiVersion: v1
kind: Secret
metadata:
  name: kea-db-credentials
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: kubernetes.io/basic-auth
stringData:
  username: kea
  password: ${KEA_DB_PASSWORD}
