# A base backup every night at 03:05, and one as soon as this is applied.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: kea-db-nightly
spec:
  schedule: "0 5 3 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: kea-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
