# Azure Key Vault (QUEUE-azure-keyvault.md): one secret per cluster-secrets variable, named
# with "_" replaced by "-". Signs in as the k8s-homelab-external-secrets service principal,
# which holds only "Key Vault Secrets User" (read) on the vault; its ID and secret are in
# the azure-keyvault-bootstrap Secret in flux-system, applied by hand from kubernetes/.local/.
#
# Like the bitwarden-* stores, it serves ExternalSecrets in flux-system only (`conditions`):
# the principal can read every secret in the vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  conditions:
  - namespaces:
    - flux-system
  provider:
    azurekv:
      authType: ServicePrincipal
      vaultUrl: ${AZURE_KEYVAULT_URL}
      tenantId: ${AZURE_TENANT_ID}
      authSecretRef:
        clientId:
          name: azure-keyvault-bootstrap
          namespace: flux-system
          key: AZURE_CLIENT_ID
        clientSecret:
          name: azure-keyvault-bootstrap
          namespace: flux-system
          key: AZURE_CLIENT_SECRET
