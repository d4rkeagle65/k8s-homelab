# Azure Key Vault (old-queues/QUEUE-azure-keyvault.md): one secret per cluster-secrets variable, named
# with "_" replaced by "-". Signs in as the k8s-homelab-external-secrets service principal,
# which holds only "Key Vault Secrets User" (read) on the vault; its ID and secret are in
# the azure-keyvault-bootstrap Secret in flux-system, applied by hand from kubernetes/.local/.
#
# It serves ExternalSecrets in flux-system (cluster-secrets) and in a namespace labelled
# homelab.local/keyvault: allowed, where an app reads its own secrets directly, so
# cluster-secrets can retire app by app (`conditions`). The principal can read every
# secret in the vault and the store can't limit which a namespace asks for: label only
# a namespace of its own for that app, never a shared one. Per-app identities scoped to
# their own secrets are planned (QUEUE.md, "Key Vault per app").
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
spec:
  conditions:
  - namespaces:
    - flux-system
  - namespaceSelector:
      matchLabels:
        homelab.local/keyvault: allowed
  provider:
    azurekv:
      authType: ServicePrincipal
      vaultUrl: ${AZURE_KEYVAULT_URL}
      tenantId: ${AZURE_TENANT_ID}
      authSecretRef:
        clientId:
          name: azure-keyvault-bootstrap
          namespace: flux-system
          key: AZURE_CLIENT_ID
        clientSecret:
          name: azure-keyvault-bootstrap
          namespace: flux-system
          key: AZURE_CLIENT_SECRET
