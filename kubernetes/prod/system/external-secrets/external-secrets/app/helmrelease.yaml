# External Secrets Operator (https://external-secrets.io). Builds Kubernetes
# Secrets from Vaultwarden items, read through the bitwarden-cli pod
# (../../bitwarden-cli). The chart installs its own CRDs (installCRDs: true).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: external-secrets
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  # The bitwarden-cli NetworkPolicy selects the controller by this name.
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.12.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # A ServiceMonitor and metrics Service each for the controller, the webhook
    # and the cert controller. The controller's
    # externalsecret_provider_api_calls_count counts every read from a secret
    # store: one per ExternalSecret data entry per refresh.
    serviceMonitor:
      enabled: true
    # Requests and limits by QUEUE-resource-limits.md's rules; the webhook's
    # CPU request above them (its 95th percentile is 0), since every apply of
    # an ExternalSecret waits on it.
    resources:
      requests: {cpu: 10m, memory: 192Mi}
      limits: {cpu: 500m, memory: 512Mi}
    # The controller's health server (port 8082), off in the chart by default:
    # a controller that stops reconciling is restarted, and isn't counted ready.
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
    webhook:
      resources:
        requests: {cpu: 50m, memory: 192Mi}
        limits: {cpu: 500m, memory: 512Mi}
    certController:
      resources:
        requests: {cpu: 10m, memory: 160Mi}
        limits: {cpu: 500m, memory: 512Mi}
    installCRDs: true
