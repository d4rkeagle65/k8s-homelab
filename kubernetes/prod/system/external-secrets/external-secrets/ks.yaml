apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: external-secrets
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/system/external-secrets/external-secrets/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: external-secrets
  # Operator: Ready only once the HelmRelease (and so its CRDs) is installed,
  # so Kustomizations using its APIs can depend on it.
  wait: true
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
