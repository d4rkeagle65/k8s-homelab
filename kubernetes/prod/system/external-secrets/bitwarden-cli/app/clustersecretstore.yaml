# How External Secrets reads Vaultwarden items through bw serve. From the
# external-secrets Bitwarden example; `key` is the item's ID (the itemId in
# its web-vault URL), `property` the field's name.
# https://external-secrets.io/latest/examples/bitwarden/
#
# Each store serves ExternalSecrets in flux-system only (`conditions`): the
# CLI can read every item the Vaultwarden account can, so an ExternalSecret
# anywhere else could otherwise read any of them. To use a store from another
# namespace, add that namespace to its list.
#
# refreshInterval: 1m rechecks each VALID store every minute. A store that
# fails validation (the bitwarden-cli pod restarting, Vaultwarden down) is
# retried with exponential backoff instead, capped at about 17 minutes, so
# after a long outage it can stay invalid that long once the cause is gone;
# cluster-secrets can't sync meanwhile. To recheck one at once:
#   kubectl annotate clustersecretstore <name> homelab.local/revalidate=<time> --overwrite
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-login
spec:
  refreshInterval: 1m
  conditions:
  - namespaces:
    - flux-system
  provider:
    webhook:
      url: "http://bitwarden-cli.external-secrets.svc:8087/object/item/{{ .remoteRef.key }}"
      headers:
        Content-Type: application/json
      result:
        jsonPath: "$.data.login.{{ .remoteRef.property }}"
---
# Custom fields: what cluster-secrets uses, one field per variable.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-fields
spec:
  refreshInterval: 1m
  conditions:
  - namespaces:
    - flux-system
  provider:
    webhook:
      url: "http://bitwarden-cli.external-secrets.svc:8087/object/item/{{ .remoteRef.key }}"
      result:
        jsonPath: "$.data.fields[?@.name==\"{{ .remoteRef.property }}\"].value"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: bitwarden-notes
spec:
  refreshInterval: 1m
  conditions:
  - namespaces:
    - flux-system
  provider:
    webhook:
      url: "http://bitwarden-cli.external-secrets.svc:8087/object/item/{{ .remoteRef.key }}"
      result:
        jsonPath: "$.data.notes"
