# Headlamp (github.com/kubernetes-sigs/headlamp), the Kubernetes web UI, read
# only. Every request acts as its ServiceAccount (unsafeUseServiceAccountToken),
# which is safe only because its one route sits behind Authentik for authentik
# Admins (ingress.yaml). That account has the built-in "view" role (namespaced
# objects, Secrets excluded; Flux's aggregate into it) and rbac.yaml's
# cluster-scoped reads, nothing that writes: changes still go through git.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: headlamp
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: headlamp
      version: 0.46.0
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
  values:
    priorityClassName: homelab-important
    fullnameOverride: headlamp
    config:
      inCluster: true
      unsafeUseServiceAccountToken: true
      pluginsDir: /headlamp/plugins
    clusterRoleBinding:
      create: true
      clusterRoleName: view
    # The Flux plugin, at a pinned release checked against its published
    # checksum (Artifact Hub headlamp-plugins/headlamp_flux), unpacked into the
    # plugins folder before Headlamp starts. The chart's plugin manager would
    # install with an unpinned installer instead.
    initContainers:
      - name: flux-plugin
        image: alpine:3.24.2
        command:
          - sh
          - -ec
          - |
            cd /tmp
            wget -q -O flux.tgz https://github.com/headlamp-k8s/plugins/releases/download/flux-0.7.0/headlamp-k8s-flux-0.7.0.tar.gz
            echo "837dc962a4ca485b86b010e5a3463d3ffc71c51778125394f006a210921b7c65  flux.tgz" | sha256sum -c -
            tar xzf flux.tgz -C /headlamp/plugins
        securityContext:
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
          - {name: plugins, mountPath: /headlamp/plugins}
          - {name: init-tmp, mountPath: /tmp}
    # config: the default plugin folders it makes under its home at start (the
    # root filesystem is read only).
    volumes:
      - {name: plugins, emptyDir: {}}
      - {name: init-tmp, emptyDir: {}}
      - {name: config, emptyDir: {}}
    volumeMounts:
      - {name: plugins, mountPath: /headlamp/plugins}
      - {name: config, mountPath: /home/headlamp/.config}
    podSecurityContext:
      seccompProfile: {type: RuntimeDefault}
    securityContext:
      runAsNonRoot: true
      runAsUser: 100
      runAsGroup: 101
      privileged: false
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: [ALL]}
    ingress:
      enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 512Mi
