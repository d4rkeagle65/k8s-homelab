apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik-isolated
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: traefik-isolated
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/system/traefik-isolated/traefik-isolated/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: traefik-isolated
  wait: true
  # The chart's CRDs come from the main traefik release.
  dependsOn:
  - name: traefik
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
