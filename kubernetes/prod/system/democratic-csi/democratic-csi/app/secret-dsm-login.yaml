# democratic-csi's DSM login, passed into the HelmRelease's driver settings by
# its valuesFrom, so the password isn't in the HelmRelease object. The DSM user
# is in the administrators group: DSM's API makes LUNs for administrators only.
apiVersion: v1
kind: Secret
metadata:
  name: democratic-csi-dsm-login
type: Opaque
stringData:
  username: ${SYNOLOGY_CSI_USERNAME}
  password: ${SYNOLOGY_CSI_PASSWORD}
