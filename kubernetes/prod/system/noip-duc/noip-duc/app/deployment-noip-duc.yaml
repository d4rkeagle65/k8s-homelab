apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: noip-duc
  name: noip-duc
  namespace: noip-duc
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: noip-duc
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: noip-duc
    spec:
      containers:
      - env:
        - name: NOIP_HOSTNAMES
          value: all.ddnskey.com
        - name: NOIP_USERNAME
          valueFrom:
            secretKeyRef:
              key: NOIP_USERNAME
              name: noip-duc-credentials
        - name: NOIP_PASSWORD
          valueFrom:
            secretKeyRef:
              key: NOIP_PASSWORD
              name: noip-duc-credentials
        image: noipcom/noip-duc:latest
        imagePullPolicy: Always
        name: noip-duc
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
