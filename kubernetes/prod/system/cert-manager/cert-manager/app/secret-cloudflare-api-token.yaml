# cert-manager's Cloudflare API token, for the DNS-01 challenges of the
# cloudflare-letsencrypt ClusterIssuer (kubernetes/cluster/).
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  api-token: ${CERT_MANAGER_CLOUDFLARE_API_TOKEN_API_TOKEN}
