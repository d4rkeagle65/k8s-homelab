# Cluster-wide scheduling policy: the PriorityClass and the LimitRanges. Its
# objects live in other namespaces (each LimitRange names its own), so there is
# no targetNamespace: one would move them all into cluster-policy.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-policy
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: cluster-policy
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/system/cluster-policy/cluster-policy/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
