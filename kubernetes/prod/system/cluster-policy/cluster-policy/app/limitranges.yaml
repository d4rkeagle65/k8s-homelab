# Defaults for a container that sets no requests or limits of its own, in every
# apps and services namespace (QUEUE-resource-limits.md's floor and ceiling).
# Only defaults: a container's own values always win, and nothing is capped.
# Applied when a pod is created, so a running pod changes only at its restart.
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: authentik
spec:
  limits:
  - type: Container
    defaultRequest: {cpu: 10m, memory: 64Mi}
    default: {cpu: 500m, memory: 512Mi}
