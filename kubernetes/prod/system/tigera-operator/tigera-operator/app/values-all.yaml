additionalLabels: {}
affinity: {}
apiServer:
  enabled: true
calicoctl:
  image: docker.io/calico/ctl
  tag: v3.30.2
certs:
  node: {}
  typha: {}
defaultFelixConfiguration:
  enabled: false
dnsConfig: {}
goldmane:
  enabled: true
imagePullSecrets: {}
installation:
  calicoNetwork:
    bgp: Enabled
    hostPorts: Enabled
    ipPools:
    - allowedUses:
      - Workload
      - Tunnel
      assignmentMode: Automatic
      blockSize: 26
      cidr: ${CALICO_POD_CIDR}
      disableBGPExport: false
      disableNewAllocations: false
      encapsulation: VXLANCrossSubnet
      name: default-ipv4-ippool
      natOutgoing: Enabled
      nodeSelector: all()
    linuxDataplane: Iptables
    linuxPolicySetupTimeoutSeconds: 0
    multiInterfaceMode: None
    nodeAddressAutodetectionV4:
      interface: eth0
    windowsDataplane: Disabled
  cni:
    ipam:
      type: Calico
    type: Calico
  controlPlaneReplicas: 2
  enabled: true
  flexVolumePath: /usr/libexec/kubernetes/kubelet-plugins/volume/exec/
  imagePullSecrets: []
  kubeletVolumePluginPath: /var/lib/kubelet
  kubernetesProvider: ""
  logging:
    cni:
      logFileMaxAgeDays: 30
      logFileMaxCount: 10
      logFileMaxSize: 100Mi
      logSeverity: Info
  nodeUpdateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  nonPrivileged: Disabled
  variant: Calico
kubeletVolumePluginPath: /var/lib/kubelet
kubernetesServiceEndpoint:
  host: ""
  port: "6443"
manageCRDs: true
nodeSelector:
  kubernetes.io/os: linux
podAnnotations: {}
podLabels: {}
priorityClassName: ""
resources: {}
tigeraOperator:
  image: tigera/operator
  registry: quay.io
  version: v1.38.3
tolerations:
- effect: NoExecute
  operator: Exists
- effect: NoSchedule
  operator: Exists
whisker:
  enabled: true
