# Requests and limits by QUEUE-resource-limits.md's rules (batch 6), set on the
# operator's resources, which pass them to its pods; calico-node's CPU limit is
# 1000m, as it carries every pod's network.
apiServer:
  enabled: true
  apiServerDeployment:
    spec:
      template:
        spec:
          containers:
          - name: calico-apiserver
            resources:
              requests: {cpu: 10m, memory: 160Mi}
              limits: {cpu: 500m, memory: 512Mi}
goldmane:
  enabled: true
  goldmaneDeployment:
    spec:
      template:
        spec:
          containers:
          - name: goldmane
            resources:
              requests: {cpu: 60m, memory: 192Mi}
              limits: {cpu: 500m, memory: 512Mi}
installation:
  calicoNodeDaemonSet:
    spec:
      template:
        spec:
          containers:
          - name: calico-node
            resources:
              requests: {cpu: 80m, memory: 256Mi}
              limits: {cpu: 1000m, memory: 512Mi}
  typhaDeployment:
    spec:
      template:
        spec:
          containers:
          - name: calico-typha
            resources:
              requests: {cpu: 10m, memory: 160Mi}
              limits: {cpu: 500m, memory: 512Mi}
  calicoKubeControllersDeployment:
    spec:
      template:
        spec:
          containers:
          - name: calico-kube-controllers
            resources:
              requests: {cpu: 20m, memory: 160Mi}
              limits: {cpu: 500m, memory: 512Mi}
  csiNodeDriverDaemonSet:
    spec:
      template:
        spec:
          containers:
          - name: calico-csi
            resources:
              requests: {cpu: 10m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
          - name: csi-node-driver-registrar
            resources:
              requests: {cpu: 10m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
  calicoNetwork:
    bgp: Enabled
    hostPorts: Enabled
    ipPools:
    - allowedUses:
      - Workload
      - Tunnel
      assignmentMode: Automatic
      blockSize: 26
      cidr: ${CALICO_POD_CIDR}
      disableBGPExport: false
      disableNewAllocations: false
      encapsulation: VXLANCrossSubnet
      name: default-ipv4-ippool
      natOutgoing: Enabled
      nodeSelector: all()
    linuxDataplane: Iptables
    linuxPolicySetupTimeoutSeconds: 0
    multiInterfaceMode: None
    nodeAddressAutodetectionV4:
      kubernetes: NodeInternalIP
    windowsDataplane: Disabled
  cni:
    ipam:
      type: Calico
    type: Calico
  controlPlaneReplicas: 2
  enabled: true
  # None: no FlexVolume driver (it serves only Calico's application-layer policy,
  # unused here). Talos keeps /usr/libexec read-only, and calico-node can't start
  # on a Talos node while its init container tries to write there.
  flexVolumePath: None
  kubeletVolumePluginPath: /var/lib/kubelet
  kubernetesProvider: ""
  logging:
    cni:
      logFileMaxAgeDays: 30
      logFileMaxCount: 10
      logFileMaxSize: 100Mi
      logSeverity: Info
  nodeUpdateStrategy:
    rollingUpdate:
      maxUnavailable: 1
    type: RollingUpdate
  nonPrivileged: Disabled
  variant: Calico
whisker:
  enabled: true
  whiskerDeployment:
    spec:
      template:
        spec:
          containers:
          - name: whisker
            resources:
              requests: {cpu: 10m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
          - name: whisker-backend
            resources:
              requests: {cpu: 10m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
# The operator itself: a few millicores and about 150Mi in use; its starts are busier.
resources:
  requests: {cpu: 20m, memory: 192Mi}
  limits: {cpu: 1000m, memory: 896Mi}
