# The tunnel ingress controller's Cloudflare account, API token and tunnel
# name (values.yaml's cloudflare.secretRef).
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-tunnel-secret
  namespace: cloudflare-tunnel
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  account_id: ${CLOUDFLARE_TUNNEL_SECRET_ACCOUNT_ID}
  api_token: ${CLOUDFLARE_TUNNEL_SECRET_API_TOKEN}
  tunnel_name: ${CLOUDFLARE_TUNNEL_SECRET_TUNNEL_NAME}
