# Node-local volumes: `local-db` for the CloudNativePG databases, each Talos
# worker's second disk. A volume is a directory on the node its pod runs on;
# the databases' own replication (two CloudNativePG instances) covers losing a
# node.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: local-path-storage
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
        namespace: flux-system
  values:
    # Requests and limits by QUEUE-resource-limits.md's rules.
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
    helperImage:
      # Pinned rather than the chart's `latest`.
      tag: 1.37.0
    # One class, local-db: a directory per volume on a Talos worker's local-db
    # user volume (talos/patches/worker-local-db.yaml). Nodes not listed (the
    # control planes) are refused. Node names are WORKER_NODE_* fields of the
    # cluster-secrets Vaultwarden item. The provisioner reads a changed class
    # list only when it starts: after an
    # edit here, `kubectl rollout restart -n local-path-storage
    # deploy/local-path-provisioner`, or new volumes go where they used to.
    nodePathMap: []
    storageClass:
      provisionerName: rancher.io/local-path
    storageClassConfigs:
      local-db:
        storageClass:
          create: true
          defaultClass: false
          defaultVolumeType: hostPath
          # Deleting a claim (or a CNPG Cluster) never deletes its data.
          reclaimPolicy: Retain
          volumeBindingMode: WaitForFirstConsumer
        nodePathMap:
        - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
          paths: []
        - node: ${WORKER_NODE_4}
          paths:
          - /var/mnt/local-db
        - node: ${WORKER_NODE_5}
          paths:
          - /var/mnt/local-db
        - node: ${WORKER_NODE_6}
          paths:
          - /var/mnt/local-db
        - node: ${WORKER_NODE_7}
          paths:
          - /var/mnt/local-db
