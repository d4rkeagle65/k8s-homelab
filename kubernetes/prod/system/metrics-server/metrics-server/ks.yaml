apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: metrics-server
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/system/metrics-server/metrics-server/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: metrics-server
  dependsOn: []
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
