apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-services
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: external-services
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/system/external-services/external-services/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: external-services
  # vaultwarden's Certificate is a cert-manager CRD.
  dependsOn:
  - name: cert-manager
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
