# Dockhand, in Docker on the new Docker host, port 3000. It listens only on
# the host's management-network address; DOCKHAND_ADDRESS is that address's
# hand-made Pi-hole name, hence ExternalName. Traefik reaches the management
# network through the nodes' second interface (eth1).
#
# Dockhand drives Docker through the host's socket, so it's root on that
# host: LAN and VPN only, and its own login must stay on.
apiVersion: v1
kind: Service
metadata:
  name: dockhand
spec:
  type: ExternalName
  externalName: ${DOCKHAND_ADDRESS}
  ports:
  - name: http
    port: 3000
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dockhand
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd,traefik_redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: dockhand.${BASE_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dockhand
            port:
              number: 3000
  tls:
  - hosts:
    - dockhand.${BASE_DOMAIN}
    secretName: dockhand-tls
