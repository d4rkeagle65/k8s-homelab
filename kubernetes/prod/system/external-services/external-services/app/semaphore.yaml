# Semaphore, the Ansible web UI, in Docker on the Docker host, port 3001 on its
# management address only (docker/semaphore/). DOCKHAND_ADDRESS is that
# address's hand-made Pi-hole name (dockhand runs on the same host). It holds
# root SSH keys to the Proxmox hosts, so the route is private-only and it logs
# users in through Authentik itself (OIDC).
apiVersion: v1
kind: Service
metadata:
  name: semaphore
spec:
  type: ExternalName
  externalName: ${DOCKHAND_ADDRESS}
  ports:
  - name: http
    port: 3001
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: semaphore
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: semaphore.${BASE_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: semaphore
            port:
              number: 3001
  tls:
  - hosts:
    - semaphore.${BASE_DOMAIN}
    secretName: semaphore-tls
