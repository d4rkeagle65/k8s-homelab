# When main moves, Flux calls each Docker stack's webhook in Dockhand (docker/<stack>/,
# deployed from git by Dockhand), from inside the network. Dockhand re-clones and
# redeploys a stack only if files in its own folder changed, so one call per stack
# per commit is all it takes; any body is accepted. The stack IDs are Dockhand's.
# claude-code has none: it redeploys on its own weekly schedule, since a redeploy
# restarts the session running in it.
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: dockhand-cadvisor
spec:
  type: generic
  # Dockhand answers after the sync and any redeploy; Flux's default is 15s.
  timeout: 2m
  address: http://${DOCKHAND_ADDRESS}:3000/api/git/stacks/9/webhook
  secretRef:
    name: dockhand-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: dockhand-cadvisor
spec:
  providerRef:
    name: dockhand-cadvisor
  eventSeverity: info
  eventSources:
  - kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Only a new commit's artifact, not every other event the source emits.
  inclusionList:
  - ".*stored artifact.*"
---
