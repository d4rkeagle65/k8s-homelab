# The header Dockhand's stack webhooks check (it takes X-Gitlab-Token as a plain
# secret; Flux's generic-hmac signs with X-Signature, which Dockhand doesn't read).
# cluster-secrets builds it from the Vaultwarden field DOCKHAND_WEBHOOK_SECRET.
apiVersion: v1
kind: Secret
metadata:
  name: dockhand-webhook
type: Opaque
stringData:
  headers: "${DOCKHAND_WEBHOOK_HEADER}"
