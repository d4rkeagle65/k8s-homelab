# The header Dockhand's stack webhooks check (it takes X-Gitlab-Token as a plain
# secret; Flux's generic-hmac signs with X-Signature, which Dockhand doesn't read),
# built from the Vaultwarden field DOCKHAND_WEBHOOK_SECRET.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dockhand-webhook
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-fields
  target:
    name: dockhand-webhook
    creationPolicy: Owner
    template:
      data:
        headers: |
          X-Gitlab-Token: {{ .token }}
  data:
  - secretKey: token
    remoteRef:
      key: 7a95474d-9b99-419d-a6ee-d5d0781a59eb
      property: DOCKHAND_WEBHOOK_SECRET
