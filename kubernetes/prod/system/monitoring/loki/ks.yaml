apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: monitoring
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/system/monitoring/loki/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: monitoring
  dependsOn:
  - name: monitoring-extras
  - name: kube-prometheus-stack
  # Alloy waits for Loki to be ready.
  wait: true
  timeout: 15m
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
