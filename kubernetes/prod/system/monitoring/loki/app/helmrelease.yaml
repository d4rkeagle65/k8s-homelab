# Logs: Loki as a single binary, its chunks and index in the Garage bucket
# loki-logs on the NAS, kept 14 days. Only the write-ahead log and caches are
# local, on an emptyDir, so the pod can restart on any worker and a host's loss
# costs at most the few minutes not yet flushed. QUEUE-monitoring.md has the
# decisions.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: monitoring
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: loki
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    deploymentMode: SingleBinary
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
        - from: "2026-10-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h
      # Garage (path-style, plain HTTP on the management network). The key is
      # expanded from the loki-s3 Secret's environment variables at start
      # (-config.expand-env); $$ keeps Flux from substituting them itself.
      storage:
        type: s3
        bucketNames:
          chunks: loki-logs
          ruler: loki-logs
          admin: loki-logs
        s3:
          endpoint: ${CNPG_BACKUP_S3_ENDPOINT}
          region: garage
          accessKeyId: $${LOKI_S3_ACCESS_KEY_ID}
          secretAccessKey: $${LOKI_S3_SECRET_ACCESS_KEY}
          s3ForcePathStyle: true
          insecure: true
      limits_config:
        retention_period: 336h
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        allow_structured_metadata: true
        volume_enabled: true
      compactor:
        retention_enabled: true
        delete_request_store: s3
        working_directory: /var/loki/compactor
      pattern_ingester:
        enabled: false

    singleBinary:
      replicas: 1
      extraArgs:
      - -config.expand-env=true
      extraEnvFrom:
      - secretRef:
          name: loki-s3
      # No volume claim: the root filesystem is read-only, so /var/loki is an
      # emptyDir (write-ahead log, index cache, compactor scratch).
      persistence:
        enabled: false
      extraVolumes:
      - name: data
        emptyDir:
          sizeLimit: 4Gi
      extraVolumeMounts:
      - name: data
        mountPath: /var/loki
      resources:
        requests: {cpu: 50m, memory: 384Mi}
        limits: {memory: 1Gi}

    # Single binary: none of the scalable mode's components, caches or test
    # helpers (the memcached caches alone would be several GiB of requests).
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    minio:
      enabled: false

    monitoring:
      serviceMonitor:
        enabled: true
