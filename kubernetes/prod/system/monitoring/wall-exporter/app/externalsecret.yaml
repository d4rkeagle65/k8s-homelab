# The apps' keys, straight from Key Vault (this namespace opts in to the azure-keyvault
# store; not cluster-secrets). One ExternalSecret each, read optionally by the Deployment,
# so a key missing in Key Vault costs only its own app's numbers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wall-exporter-emby
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: wall-exporter-emby
    creationPolicy: Owner
  data:
  - {secretKey: EMBY_API_KEY, remoteRef: {key: EMBY-API-KEY}}
---
