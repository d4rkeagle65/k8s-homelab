# Log collection: Grafana Alloy on every node, reading the container logs of
# the pods on its own node from /var/log/pods and pushing them to Loki.
# Labels stay few (namespace, app, container, pod, node); log search tuning is
# a later phase of QUEUE-monitoring.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: monitoring
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: monitoring
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: 1.13.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    controller:
      type: daemonset
      # Every node, the control planes included.
      tolerations:
      - operator: Exists
    alloy:
      enableReporting: false
      mounts:
        varlog: true
      extraEnv:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}
      configMap:
        content: |
          logging {
            level  = "info"
            format = "logfmt"
          }

          // The pods on this node only.
          discovery.kubernetes "pods" {
            role = "pod"
            selectors {
              role  = "pod"
              field = "spec.nodeName=" + sys.env("NODE_NAME")
            }
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_node_name"]
              target_label  = "node"
            }
            // app: the app.kubernetes.io/name label, else app, else the
            // container's name.
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_container_name"]
              separator     = ";"
              regex         = "^;*([^;]+)(;.*)?$"
              target_label  = "app"
            }
            // The doubled dollar is Flux's escape: Alloy receives a single one,
            // the regex back-reference to the first group.
            rule {
              source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
              separator     = "/"
              target_label  = "__path__"
              replacement   = "/var/log/pods/*$${1}/*.log"
            }
          }

          local.file_match "pod_logs" {
            path_targets = discovery.relabel.pod_logs.output
          }

          loki.source.file "pod_logs" {
            targets    = local.file_match.pod_logs.targets
            forward_to = [loki.process.pod_logs.receiver]
          }

          loki.process "pod_logs" {
            // CRI-O's log format: timestamp, stream, the line.
            stage.cri {}
            stage.label_drop {
              values = ["filename"]
            }
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki:3100/loki/api/v1/push"
            }
          }
    serviceMonitor:
      enabled: true
