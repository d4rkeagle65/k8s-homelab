# qBittorrent's web UI login for its exporter (it exempts no client from the
# login), from Key Vault through cluster-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: qbittorrent-exporter
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME}
  QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
