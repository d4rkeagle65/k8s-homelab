# Grafana's Authentik client secret, made once here and read by Grafana (the
# kube-prometheus-stack release's GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET). Authentik's
# worker reads it through authentik-extras' secretstore-monitoring.yaml, which the Role
# below lets read only this Secret. To rotate: delete the Secret grafana-oidc-client,
# then restart Authentik's worker and Grafana.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: grafana-oidc-client
spec:
  secretKeys: [client-secret]
  length: 64
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc-client
spec:
  refreshPolicy: CreatedOnce
  target:
    name: grafana-oidc-client
    creationPolicy: Owner
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: Password
        name: grafana-oidc-client
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: authentik-oidc-reader-grafana
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [grafana-oidc-client]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authentik-oidc-reader-grafana
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: authentik-oidc-reader-grafana
subjects:
- kind: ServiceAccount
  name: authentik-oidc-reader
  namespace: authentik
