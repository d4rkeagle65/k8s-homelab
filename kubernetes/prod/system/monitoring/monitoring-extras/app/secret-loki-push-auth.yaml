# The login Traefik checks on Loki's push route (ingress-loki-push.yaml): Alloy
# on the Debian hosts sends it (LOKI_PUSH_PASSWORD, an environment secret in
# Semaphore's Debian Host Baseline group, holds the same password).
apiVersion: v1
kind: Secret
metadata:
  name: loki-push-auth
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: kubernetes.io/basic-auth
stringData:
  username: alloy
  password: "${LOKI_PUSH_PASSWORD}"
