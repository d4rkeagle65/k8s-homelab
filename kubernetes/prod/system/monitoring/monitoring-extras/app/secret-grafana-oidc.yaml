# Grafana's Authentik client secret: the same cluster-secrets field (base64)
# as Authentik's own copy, authentik-grafana-oidc in authentik-extras.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oidc
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  client-secret: ${AUTHENTIK_GRAFANA_OIDC_CLIENT_SECRET}
