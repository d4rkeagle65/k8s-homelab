# Loki's key for its Garage bucket (loki-logs), from the cluster-secrets
# Vaultwarden item. The key names are the environment variables Loki expands
# into its config (-config.expand-env).
apiVersion: v1
kind: Secret
metadata:
  name: loki-s3
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  LOKI_S3_ACCESS_KEY_ID: ${LOKI_S3_ACCESS_KEY_ID}
  LOKI_S3_SECRET_ACCESS_KEY: ${LOKI_S3_SECRET_ACCESS_KEY}
