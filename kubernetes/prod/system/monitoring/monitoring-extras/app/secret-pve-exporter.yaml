# The Proxmox exporter's API token (prometheus@pve!exporter, PVEAuditor, read
# only), from Key Vault through cluster-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: pve-exporter
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  PVE_TOKEN_VALUE: ${PVE_EXPORTER_TOKEN_VALUE}
