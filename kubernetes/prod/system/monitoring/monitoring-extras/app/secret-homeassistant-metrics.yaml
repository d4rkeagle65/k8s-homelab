# A long-lived Home Assistant token (its owner's profile, named "prometheus"),
# from the cluster-secrets Vaultwarden item, for Prometheus's scrape.
apiVersion: v1
kind: Secret
metadata:
  name: homeassistant-metrics
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  token: ${HOMEASSISTANT_TOKEN}
