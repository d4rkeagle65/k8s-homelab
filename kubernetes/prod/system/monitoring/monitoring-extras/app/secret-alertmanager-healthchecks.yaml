# The dead-man's switch's ping URL (a Healthchecks.io check, period 5 minutes,
# grace 10), mounted into Alertmanager (alertmanagerSpec.secrets) and read by
# its webhook's url_file, so the URL is in no rendered config.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-healthchecks
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  url: "${HEALTHCHECKS_WATCHDOG_URL}"
