# The bearer token Alertmanager sends with each alert to n8n's "Zammad: tickets in"
# (n8n/workflows/), mounted into Alertmanager (alertmanagerSpec.secrets) and read by its
# webhook's credentials_file, so the token is in no rendered config. n8n's Alertmanager
# credential carries the same Key Vault secret (kubernetes/prod/apps/n8n/n8n/app/).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-n8n
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: alertmanager-n8n
    creationPolicy: Owner
  data:
  - {secretKey: token, remoteRef: {key: ALERTMANAGER-N8N-TOKEN}}
