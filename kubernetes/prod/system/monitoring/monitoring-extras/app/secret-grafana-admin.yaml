# Grafana's admin login, from the cluster-secrets Vaultwarden item. Keep both
# values to letters and digits: they are substituted into this YAML as is.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  admin-user: ${GRAFANA_ADMIN_USER}
  admin-password: ${GRAFANA_ADMIN_PASSWORD}
