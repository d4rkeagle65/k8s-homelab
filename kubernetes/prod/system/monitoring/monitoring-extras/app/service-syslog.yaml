# The Synology's, the core switch's and the firewall's syslog, received by alloy-events (its
# loki.source.syslog) on a MetalLB address of its own: 514/TCP takes RFC 5424 (DSM's "IETF"
# format), 514/UDP and 1514 (TCP and UDP) the older BSD format (RFC 3164). 514/UDP is BSD
# because the switch can send only there. Only these ports: the Alloy pod's own HTTP port
# (its UI and debug pages) stays inside.
apiVersion: v1
kind: Service
metadata:
  name: alloy-syslog
  annotations:
    metallb.io/loadBalancerIPs: ${ALLOY_SYSLOG_ADDRESS}
spec:
  type: LoadBalancer
  # Local keeps each packet's source address: Cluster sends it through a node, which
  # replaces it with the node's, and a sender naming no host would be labelled as
  # that node. MetalLB announces the address from the node running the pod.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/instance: alloy-events
    app.kubernetes.io/name: alloy
  ports:
  - {name: syslog-tcp, port: 514, targetPort: 5514, protocol: TCP}
  - {name: syslog-udp, port: 514, targetPort: 5514, protocol: UDP}
  - {name: bsd-tcp, port: 1514, targetPort: 5515, protocol: TCP}
  - {name: bsd-udp, port: 1514, targetPort: 5515, protocol: UDP}
