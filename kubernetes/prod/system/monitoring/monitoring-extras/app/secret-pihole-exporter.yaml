# The Pi-holes' app passwords for the exporter: the same cluster-secrets variables
# (base64) as nebula-sync's.
apiVersion: v1
kind: Secret
metadata:
  name: pihole-exporter
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  pihole1: ${PIHOLE_1_PASSWORD}
  pihole2: ${PIHOLE_2_APP_PASSWORD}
