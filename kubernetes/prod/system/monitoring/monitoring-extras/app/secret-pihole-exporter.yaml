# The Pi-holes' web passwords for the exporter: the same cluster-secrets fields
# (base64) as nebula-sync's.
apiVersion: v1
kind: Secret
metadata:
  name: pihole-exporter
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  pihole1: ${PIHOLE_PASSWORD}
  pihole2: ${PIHOLE2_PASSWORD}
