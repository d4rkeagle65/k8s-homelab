# The media apps' API keys for exportarr: the same cluster-secrets fields
# (base64) as the apps' own Secrets in media.
apiVersion: v1
kind: Secret
metadata:
  name: exportarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
data:
  radarr: ${MEDIA_RADARR_API_KEY}
  sonarr: ${MEDIA_SONARR_API_KEY}
  lidarr: ${MEDIA_LIDARR_API_KEY}
  prowlarr: ${MEDIA_PROWLARR_API_KEY}
  bookshelf: ${MEDIA_BOOKSHELF_API_KEY}
  whisparr: ${MEDIA_WHISPARR_API_KEY}
