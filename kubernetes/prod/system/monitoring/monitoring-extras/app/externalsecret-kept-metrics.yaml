# Kept's metrics token for Prometheus (monitors' scrapeconfig-kept.yaml), copied from
# the Secret the kept namespace generates (apps/kept/kept's externalsecret-metrics.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kept-metrics-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kept
spec:
  provider:
    kubernetes:
      remoteNamespace: kept
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: kept-metrics-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kept-metrics-token
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: kept
  target:
    name: kept-metrics-token
    creationPolicy: Owner
  data:
  - {secretKey: token, remoteRef: {key: kept-metrics-token, property: KEPT_METRICS_TOKEN}}
