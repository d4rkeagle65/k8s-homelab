# Kept's metrics token (KEPT_METRICS_TOKEN), from Key Vault through cluster-secrets,
# for Prometheus's scrape (monitors' scrapeconfig-kept.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: kept-metrics
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  token: ${KEPT_METRICS_TOKEN}
