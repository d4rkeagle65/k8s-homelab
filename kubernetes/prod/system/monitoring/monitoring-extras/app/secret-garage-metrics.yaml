# Garage's metrics token (the garage stack's GARAGE_METRICS_TOKEN in Dockhand,
# copied into the cluster-secrets Vaultwarden item), for Prometheus's scrape.
apiVersion: v1
kind: Secret
metadata:
  name: garage-metrics
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  token: "${GARAGE_METRICS_TOKEN}"
