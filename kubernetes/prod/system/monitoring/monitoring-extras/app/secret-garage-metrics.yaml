# Garage's metrics token (Key Vault's GARAGE-METRICS-TOKEN, which the garage
# stack reads too), for Prometheus's scrape.
apiVersion: v1
kind: Secret
metadata:
  name: garage-metrics
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  token: "${GARAGE_METRICS_TOKEN}"
