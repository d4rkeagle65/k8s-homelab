# node-exporter on the Pi-holes (ansible/tasks/host-exporters.yml), on their
# management addresses.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: pihole-hosts
spec:
  staticConfigs:
  - targets:
    - ${PIHOLE1_MGMT_ADDRESS}:9100
    - ${PIHOLE2_MGMT_ADDRESS}:9100
  scrapeInterval: 60s
  relabelings:
  - targetLabel: job
    replacement: pihole-hosts
  # Only failed units' state, as in scrapeconfig-proxmox-hosts.yaml.
  metricRelabelings:
  - action: drop
    sourceLabels: [__name__, state]
    regex: node_systemd_unit_state;(active|activating|deactivating|inactive)
