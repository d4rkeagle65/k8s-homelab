# Every CloudNativePG database instance in the cluster (each instance's
# exporter on its metrics port): one monitor rather than one per Cluster.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
  - port: metrics
    interval: 60s
