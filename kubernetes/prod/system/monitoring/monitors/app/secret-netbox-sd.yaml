# NetBox's read-only token, for Prometheus to discover the Docker VMs through NetBox's
# Prometheus SD plugin (scrapeconfig-docker-vm*.yaml). The plugin sends it as
# "Bearer <token>", so NETBOX_READ_TOKEN holds the token alone.
apiVersion: v1
kind: Secret
metadata:
  name: netbox-sd
type: Opaque
stringData:
  token: "${NETBOX_READ_TOKEN}"
