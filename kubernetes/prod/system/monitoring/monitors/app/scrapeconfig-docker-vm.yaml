# The first Docker VM, at its management name: node-exporter
# (ansible/tasks/host-exporters.yml), cAdvisor's per-container metrics
# (docker/cadvisor), Kea's statistics through Stork's agent and Kea's HA state
# (docker/kea).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: docker-vm
spec:
  staticConfigs:
  - targets:
    - ${DOCKHAND_ADDRESS}:9100
    labels:
      exporter: node
  - targets:
    - ${DOCKHAND_ADDRESS}:9338
    labels:
      exporter: cadvisor
  - targets:
    - ${DOCKHAND_ADDRESS}:9547
    labels:
      exporter: kea
  - targets:
    - ${DOCKHAND_ADDRESS}:9548
    labels:
      exporter: kea-ha
  scrapeInterval: 60s
  relabelings:
  - targetLabel: job
    replacement: docker-vm
  # Only failed units' state, as in scrapeconfig-proxmox-hosts.yaml.
  metricRelabelings:
  - action: drop
    sourceLabels: [__name__, state]
    regex: node_systemd_unit_state;(active|activating|deactivating|inactive)
