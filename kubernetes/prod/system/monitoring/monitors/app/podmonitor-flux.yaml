# Flux's controllers (Flux's own recommended monitor): reconciliation counts,
# durations and failures.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: flux-system
spec:
  namespaceSelector:
    matchNames:
    - flux-system
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - helm-controller
      - source-controller
      - kustomize-controller
      - notification-controller
  podMetricsEndpoints:
  - port: http-prom
    interval: 60s
    relabelings:
    - action: keep
      sourceLabels: [__meta_kubernetes_pod_phase]
      regex: Running
