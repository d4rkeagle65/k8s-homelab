# The second Docker VM: node-exporter (ansible/tasks/host-exporters.yml). A job of its
# own, so the first VM's queries (job="docker-vm": Homepage's card, the restart-loop
# rule) stay one host's. Its address comes from NetBox, as scrapeconfig-docker-vm.yaml
# says, by its Proxmox VM ID (120).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: docker-vm-2
spec:
  httpSDConfigs:
  - url: https://netbox${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/api/plugins/prometheus-sd/virtual-machines/?tag=docker_vm&status=active&status=failed&cf_vmid=120
    refreshInterval: 5m
    authorization:
      type: Bearer
      credentials:
        name: netbox-sd
        key: token
  scrapeInterval: 60s
  relabelings:
  - sourceLabels: [__meta_netbox_primary_ip4]
    regex: (.+)
    targetLabel: __address__
    replacement: $${1}:9100
  - targetLabel: exporter
    replacement: node
  - targetLabel: job
    replacement: docker-vm-2
  # Only failed units' state, as in scrapeconfig-proxmox-hosts.yaml.
  metricRelabelings:
  - action: drop
    sourceLabels: [__name__, state]
    regex: node_systemd_unit_state;(active|activating|deactivating|inactive)
