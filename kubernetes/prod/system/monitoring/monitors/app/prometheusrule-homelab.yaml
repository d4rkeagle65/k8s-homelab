# The homelab's own alerts, beside the chart's: what the chart has no rule for.
# warning and critical alerts become Zammad tickets (zammad-bridge), so each says
# what to look at. The chart's KubePodCrashLooping and CPUThrottlingHigh already
# cover the cluster's restart loops and throttling.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab
spec:
  groups:
  - name: homelab.containers
    rules:
    - alert: ContainerMemoryNearLimit
      expr: |
        max by (namespace, pod, container) (
          container_memory_working_set_bytes{job="kubelet", container!=""}
            / (container_spec_memory_limit_bytes{job="kubelet", container!=""} > 0)
        ) > 0.9
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: A container is using over 90% of its memory limit.
        description: >-
          {{ $labels.namespace }}/{{ $labels.pod }} {{ $labels.container }} is at
          {{ $value | humanizePercentage }} of its memory limit: raise the limit
          (QUEUE-resource-limits.md's rules) before it's OOM-killed.
    # Every running container has CPU and memory limits (QUEUE-resource-limits.md).
    # The LimitRanges' defaults reach only pods created after them, so a pod older
    # than its namespace's LimitRange shows here until it restarts. Talos runs the
    # control plane, kube-proxy and CoreDNS, which the rules leave alone.
    - alert: ContainerWithoutLimits
      expr: |
        max by (namespace, container) (
          (
            (kube_pod_container_info unless on (namespace, pod, container) kube_pod_container_resource_limits{resource="memory"})
            or
            (kube_pod_container_info unless on (namespace, pod, container) kube_pod_container_resource_limits{resource="cpu"})
          )
          and on (namespace, pod) (kube_pod_status_phase{phase="Running"} == 1)
        )
        unless on (namespace, container)
          kube_pod_container_info{namespace="kube-system", container=~"kube-apiserver|kube-controller-manager|kube-scheduler|kube-proxy|coredns"}
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: A container runs without a CPU or memory limit.
        description: >-
          {{ $labels.namespace }} {{ $labels.container }} has run for an hour without a CPU
          or memory limit: set both by QUEUE-resource-limits.md's rules, or restart it if
          its pod is older than the namespace's LimitRange.
    - alert: DockerContainerRestarting
      expr: changes(container_start_time_seconds{job="docker-vm", name!=""}[30m]) >= 3
      labels:
        severity: warning
      annotations:
        summary: A container on the Docker VM is restarting in a loop.
        description: >-
          {{ $labels.name }} started {{ $value }} times in 30 minutes: read its log
          in Dockhand.
  - name: homelab.flux
    rules:
    # One alert per failing object, never per dependent: an object waiting on a
    # failing one is Ready=False with reason DependencyNotReady, and is left out.
    # reason is dropped by the max so a change of reason keeps the same alert, and
    # the 3m window bridges a retry's moment of Ready=Unknown, which would otherwise
    # restart the 15 minutes and close the ticket only to open another. A longer
    # window adds its length to every run, and fires on failures that heal alone.
    - alert: FluxObjectNotReady
      expr: |
        max by (customresource_kind, exported_namespace, name) (
          max_over_time(gotk_resource_info{ready="False", reason!="DependencyNotReady", suspended!="true"}[3m])
        )
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: A Flux object has failed to reconcile for 15 minutes.
        description: >-
          {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }}
          is not Ready, so nothing it applies is updated, and the objects that depend
          on it wait too: read its message with
          `flux get all -A --status-selector ready=false`.
  - name: homelab.external-secrets
    rules:
    # The Ready=False series is 1 while the last sync failed. 30 minutes is two of
    # cluster-secrets' 15-minute refreshes, so one failed refresh that the next one
    # heals opens no ticket.
    - alert: ExternalSecretNotSynced
      expr: |
        max by (exported_namespace, name) (
          externalsecret_status_condition{condition="Ready", status="False"}
        ) == 1
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: An ExternalSecret has failed to sync for 30 minutes.
        description: >-
          {{ $labels.exported_namespace }}/{{ $labels.name }} isn't syncing. Its Secret
          keeps the last values, so a changed or new variable doesn't arrive: read
          `kubectl -n {{ $labels.exported_namespace }} describe externalsecret {{ $labels.name }}`.
          For cluster-secrets, check the azure-keyvault ClusterSecretStore and the
          azure-keyvault-bootstrap Secret in flux-system (QUEUE-azure-keyvault.md).
  # Bookshelf's metadata comes from Hardcover through rreading-glasses, on one
  # API token with a daily budget; once it's spent, every lookup rreading-glasses
  # hasn't cached fails until the budget resets (about midnight UTC).
  - name: homelab.bookshelf
    rules:
    - alert: HardcoverDailyBudgetExhausted
      # Spent, and lookups failing because of it: a budget read as 0 right after
      # a restart, before any response has reported it, fails nothing.
      expr: |
        max(rg_gql_ratelimit_remaining{bucket="daily"}) == 0
          and on() sum(increase(rg_http_requests_count{status=~"5.."}[15m])) > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Hardcover's daily API budget is spent; Bookshelf can't look up new books.
        description: >-
          rreading-glasses reports 0 of the token's daily Hardcover budget left and
          its lookups are failing. Searches and author refreshes for anything not
          already cached fail until the budget resets (about midnight UTC). Stop any
          bulk work (author repairs, mass imports) and let it reset.
    - alert: HardcoverDailyBudgetLow
      # Under a tenth of the most it has reported in two days (Hardcover doesn't
      # publish the size of the budget, so the peak stands in for it).
      expr: |
        max(rg_gql_ratelimit_remaining{bucket="daily"}) > 0
          and max(rg_gql_ratelimit_remaining{bucket="daily"})
            < 0.1 * max(max_over_time(rg_gql_ratelimit_remaining{bucket="daily"}[2d]))
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Hardcover's daily API budget is under 10%.
        description: >-
          rreading-glasses reports {{ $value }} Hardcover lookups left today, under a
          tenth of its recent peak. Pause bulk work (author repairs, mass imports)
          until the budget resets (about midnight UTC), or Bookshelf's searches will
          start failing.
  - name: homelab.drives
    rules:
    - alert: DriveWearHigh
      expr: nvme_percentage_used_ratio > 0.8
      labels:
        severity: warning
      annotations:
        summary: An NVMe drive has used over 80% of its rated endurance.
        description: >-
          {{ $labels.instance }} {{ $labels.device }} is at {{ $value | humanizePercentage }}
          of its rated wear: plan its replacement (QUEUE.md).
    - alert: DriveWearCritical
      expr: nvme_percentage_used_ratio > 0.9
      labels:
        severity: critical
      annotations:
        summary: An NVMe drive has used over 90% of its rated endurance.
        description: >-
          {{ $labels.instance }} {{ $labels.device }} is at {{ $value | humanizePercentage }}
          of its rated wear: replace it, or move what it carries off it.
    - alert: DriveSpareLow
      expr: nvme_available_spare_ratio < 2 * nvme_available_spare_threshold_ratio
      labels:
        severity: warning
      annotations:
        summary: An NVMe drive's spare capacity is near its threshold.
        description: >-
          {{ $labels.instance }} {{ $labels.device }} has {{ $value | humanizePercentage }}
          spare left, under twice its threshold; at the threshold it reports failure.
    - alert: DriveCriticalWarning
      expr: nvme_critical_warning > 0
      labels:
        severity: critical
      annotations:
        summary: An NVMe drive reports a critical warning.
        description: >-
          {{ $labels.instance }} {{ $labels.device }} set its critical-warning flags
          ({{ $value }}): read `nvme smart-log` on the host.
  - name: homelab.nas
    rules:
    - alert: TerraMasterSNMPDown
      expr: max(up{job=~".*snmp.*", nas="terramaster"}) == 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: The TerraMaster's SNMP agent stopped answering.
        description: >-
          Its community is a hand edit to /etc/snmp/snmpd.conf that TOS can rewrite
          (an update, a reboot, saving SNMP in its UI): check line 33
          (QUEUE-monitoring.md).
  # Every database's backup (QUEUE-monitoring.md, phase 9; the Backups dashboard):
  # a night is missed after 26 hours. Postgres from the Barman Cloud plugin's
  # metrics (CloudNativePG's own backup timestamps stay empty with the plugin);
  # MariaDB from kube-state-metrics' view of each PhysicalBackup.
  - name: homelab.backups
    rules:
    # Each Postgres cluster's newest good and failed base backup, its instances'
    # pod names less their ordinal; the alerts below and the Backups dashboard
    # read these.
    - record: cnpg:backup_last_available_timestamp:max
      expr: |
        max by (namespace, cluster) (label_replace(
          barman_cloud_cloudnative_pg_io_last_available_backup_timestamp > 0,
          "cluster", "$${1}", "pod", "(.*)-[0-9]+"))
    - record: cnpg:backup_last_failed_timestamp:max
      expr: |
        max by (namespace, cluster) (label_replace(
          barman_cloud_cloudnative_pg_io_last_failed_backup_timestamp > 0,
          "cluster", "$${1}", "pod", "(.*)-[0-9]+"))
    # Seconds since the cluster last archived WAL (its primary archives; the
    # smallest across its instances).
    - record: cnpg:archiver_seconds_since_last_archival:min
      expr: |
        min by (namespace, cluster) (label_replace(
          cnpg_pg_stat_archiver_seconds_since_last_archival,
          "cluster", "$${1}", "pod", "(.*)-[0-9]+"))
    - alert: PostgresBackupTooOld
      expr: time() - cnpg:backup_last_available_timestamp:max > 26 * 3600
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: A Postgres database's newest base backup is over 26 hours old.
        description: >-
          {{ $labels.namespace }}/{{ $labels.cluster }}: newest backup
          {{ $value | humanizeDuration }} ago. Its ScheduledBackup is in
          media-backup/ or beside the Cluster; a retired cluster's alert stops when
          it's deleted.
    - alert: PostgresBackupFailed
      expr: |
        cnpg:backup_last_failed_timestamp:max
          > on (namespace, cluster) cnpg:backup_last_available_timestamp:max
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: A Postgres database's newest backup attempt failed.
        description: >-
          {{ $labels.namespace }}/{{ $labels.cluster }}: its last failed backup is newer
          than its last good one; read the Backup objects in its namespace.
    - alert: PostgresWALArchivingFailing
      expr: increase(cnpg_pg_stat_archiver_failed_count[1h]) > 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: A Postgres database is failing to archive WAL to Garage.
        description: >-
          {{ $labels.namespace }}/{{ $labels.pod }}: WAL archiving failed in the last
          hour, so its point-in-time recovery has a gap; read its pod's plugin sidecar log.
    - alert: MariaDBBackupTooOld
      expr: (time() - mariadb_physicalbackup_last_schedule_timestamp) > 26 * 3600
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: A MariaDB database's newest physical backup is over 26 hours old.
        description: >-
          {{ $labels.exported_namespace }}/{{ $labels.mariadb }} (PhysicalBackup
          {{ $labels.name }}): newest backup started {{ $value | humanizeDuration }} ago.
    - alert: MariaDBBackupNotComplete
      expr: mariadb_physicalbackup_complete == 0
      for: 2h
      labels:
        severity: warning
      annotations:
        summary: A MariaDB database's newest physical backup hasn't completed.
        description: >-
          {{ $labels.exported_namespace }}/{{ $labels.mariadb }} (PhysicalBackup
          {{ $labels.name }}): two hours without completing; read its Job's log.
    # Proxmox's vzdump, from each host's node-exporter
    # (ansible/files/proxmox-backup-metrics.py, every 15 minutes). A guest the
    # backup job covers with no archive at all counts as too old.
    - alert: ProxmoxBackupTooOld
      expr: |
        (time() - proxmox_backup_archive_timestamp_seconds > 26 * 3600
          and on (vmid) proxmox_backup_guest_covered == 1)
        or (proxmox_backup_guest_covered == 1
          unless on (vmid) proxmox_backup_archive_timestamp_seconds)
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: A Proxmox guest's newest backup is over 26 hours old, or missing.
        description: >-
          {{ $labels.vmid }} ({{ $labels.guest }}): no archive on the backup storage
          from the last 26 hours. Read the host's vzdump task log (Datacenter, Backup).
    - alert: ProxmoxBackupFailed
      expr: proxmox_backup_last_result == 0
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: A Proxmox guest's newest vzdump run failed.
        description: >-
          {{ $labels.vmid }} ({{ $labels.guest }}): its newest backup run didn't finish;
          read that night's vzdump task log on its host.
    # The collector itself: a read failed, it stopped running, or a host answers
    # without it (not yet installed: ansible/tasks/host-exporters.yml).
    - alert: ProxmoxBackupCollectorFailing
      expr: |
        proxmox_backup_collector_success == 0
        or time() - proxmox_backup_collector_last_run_timestamp_seconds > 3600
        or (up{job="proxmox-hosts"} == 1
          unless on (instance) proxmox_backup_collector_success)
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: A Proxmox host isn't reporting its backups.
        description: >-
          {{ $labels.instance }}: proxmox-backup-metrics failed, stopped, or isn't
          installed, so its guests' backups go unwatched; read
          journalctl -u proxmox-backup-metrics there.
    # Garage's backup buckets (garage-backup-exporter). Only docker-backups alerts
    # here: Databasus and Vaultwarden's files have no other watch, while the
    # Postgres and MariaDB backups in the other buckets alert from their own
    # metrics above.
    - alert: GarageBackupTooOld
      expr: time() - garage_backup_newest_object_timestamp_seconds{bucket="docker-backups"} > 26 * 3600
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: A Docker host backup in Garage is over 26 hours old.
        description: >-
          {{ $labels.bucket }}/{{ $labels.prefix }}: newest file
          {{ $value | humanizeDuration }} old. Databasus's backups are its databases'
          names; vaultwarden/ is the Vaultwarden stack's own backup job.
    - alert: GarageBackupExporterFailing
      expr: |
        garage_backup_bucket_up == 0
        or time() - garage_backup_last_refresh_timestamp_seconds > 1800
        or up{job="garage-backup-exporter"} == 0
        or absent(up{job="garage-backup-exporter"})
      for: 30m
      labels:
        severity: warning
      annotations:
        summary: Garage's backup buckets aren't being listed.
        description: >-
          {{ with $labels.bucket }}{{ . }}: {{ end }}garage-backup-exporter can't list
          the bucket, has stopped listing, or isn't running, so the Docker host backups go
          unwatched; read its pod's log in monitoring.
