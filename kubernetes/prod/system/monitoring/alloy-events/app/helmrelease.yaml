# Kubernetes events (scheduling, image pulls, OOM kills, probe failures) into
# Loki, from one Alloy for the whole cluster: the per-node DaemonSet (alloy)
# would send each event once per node. Events land in namespace "cluster-events"
# streams labelled with the event's own namespace and kind.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-events
  namespace: monitoring
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: monitoring
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: 1.13.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    controller:
      type: deployment
      replicas: 1
    # The config reloader beside Alloy.
    configReloader:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
    alloy:
      enableReporting: false
      resources:
        requests: {cpu: 10m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
      configMap:
        content: |
          logging {
            level  = "info"
            format = "logfmt"
          }

          loki.source.kubernetes_events "cluster" {
            job_name   = "cluster-events"
            log_format = "logfmt"
            forward_to = [loki.write.default.receiver]
          }

          // The NASes' syslog, through the alloy-syslog LoadBalancer
          // (monitoring-extras/app/service-syslog.yaml): 5514 RFC 5424, 5515 the
          // older BSD format. Stamped on arrival (BSD's timestamps carry no
          // year). Labelled source="syslog", the sender's host and the app
          // name; the rest stays in the line.
          loki.source.syslog "nas" {
            listener {
              address       = "0.0.0.0:5514"
              protocol      = "tcp"
              syslog_format = "rfc5424"
              labels        = {source = "syslog"}
            }
            listener {
              address       = "0.0.0.0:5514"
              protocol      = "udp"
              syslog_format = "rfc5424"
              labels        = {source = "syslog"}
            }
            listener {
              address       = "0.0.0.0:5515"
              protocol      = "tcp"
              syslog_format = "rfc3164"
              labels        = {source = "syslog"}
            }
            listener {
              address       = "0.0.0.0:5515"
              protocol      = "udp"
              syslog_format = "rfc3164"
              labels        = {source = "syslog"}
            }
            relabel_rules = loki.relabel.syslog.rules
            forward_to    = [loki.write.default.receiver]
          }

          loki.relabel "syslog" {
            forward_to = []
            rule {
              source_labels = ["__syslog_message_hostname"]
              target_label  = "host"
            }
            rule {
              source_labels = ["__syslog_message_app_name"]
              target_label  = "app"
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki:3100/loki/api/v1/push"
            }
          }
    serviceMonitor:
      enabled: true
