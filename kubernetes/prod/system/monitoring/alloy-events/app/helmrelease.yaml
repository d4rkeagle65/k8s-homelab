# Kubernetes events (scheduling, image pulls, OOM kills, probe failures) into
# Loki, from one Alloy for the whole cluster: the per-node DaemonSet (alloy)
# would send each event once per node. Events land in namespace "cluster-events"
# streams labelled with the event's own namespace and kind.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-events
  namespace: monitoring
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: monitoring
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  chart:
    spec:
      chart: alloy
      version: 1.13.1
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    controller:
      type: deployment
      replicas: 1
    # The config reloader beside Alloy.
    configReloader:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
    alloy:
      enableReporting: false
      # For the syslog listener's raw format on 514/UDP (below), experimental in Alloy;
      # it enables experimental components, and changes none of the stable ones.
      stabilityLevel: experimental
      resources:
        requests: {cpu: 10m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
      configMap:
        content: |
          logging {
            level  = "info"
            format = "logfmt"
          }

          loki.source.kubernetes_events "cluster" {
            job_name   = "cluster-events"
            log_format = "logfmt"
            forward_to = [loki.write.default.receiver]
          }

          // The NASes', the core switch's and the firewall's syslog, through the alloy-syslog LoadBalancer
          // (monitoring-extras/app/service-syslog.yaml): 514/TCP RFC 5424 (the
          // Synology), 514/UDP unparsed (the core switch, which can only send there
          // and whose lines are neither format: a numeric date after the priority),
          // 1514 BSD on both (the firewall, on TCP). Stamped on arrival (BSD's timestamps carry no
          // year). Labelled source="syslog", the sender's host, the app name and
          // the listener it came in on (the Service's port and protocol); the rest
          // stays in the line.
          loki.source.syslog "nas" {
            listener {
              address       = "0.0.0.0:5514"
              protocol      = "tcp"
              syslog_format = "rfc5424"
              labels        = {source = "syslog", listener = "514/tcp"}
            }
            listener {
              address       = "0.0.0.0:5514"
              protocol      = "udp"
              syslog_format = "raw"
              labels        = {source = "syslog", listener = "514/udp"}
            }
            listener {
              address       = "0.0.0.0:5515"
              protocol      = "tcp"
              syslog_format = "rfc3164"
              labels        = {source = "syslog", listener = "1514/tcp"}
            }
            listener {
              address       = "0.0.0.0:5515"
              protocol      = "udp"
              syslog_format = "rfc3164"
              labels        = {source = "syslog", listener = "1514/udp"}
            }
            relabel_rules = loki.relabel.syslog.rules
            forward_to    = [loki.write.default.receiver]
          }

          loki.relabel "syslog" {
            forward_to = []
            rule {
              source_labels = ["__syslog_message_hostname"]
              target_label  = "host"
            }
            // A sender that names no host, or only its address (the switch), is named by
            // its reverse DNS, else its address.
            rule {
              source_labels = ["__syslog_message_hostname", "__syslog_connection_ip_address"]
              separator     = ";"
              regex         = "(?:|[0-9.]+);(.+)"
              target_label  = "host"
            }
            rule {
              source_labels = ["__syslog_message_hostname", "__syslog_connection_hostname"]
              separator     = ";"
              regex         = "(?:|[0-9.]+);(.+?)\\.?"
              target_label  = "host"
            }
            rule {
              source_labels = ["__syslog_message_app_name"]
              target_label  = "app"
            }
          }

          loki.write "default" {
            endpoint {
              url = "http://loki:3100/loki/api/v1/push"
            }
          }
    serviceMonitor:
      enabled: true
