# Pi-hole's own statistics (queries, blocked, clients, upstreams, cache) from
# both Pi-holes through their API (Pi-hole v6), one exporter container each:
# its comma-joined list form would need both passwords in one Secret value.
# Each Pi-hole is reached on its management address.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pihole-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      # The liveness probe fetches the metrics: after its Pi-hole restarted
      # (2026-10-15) an exporter hung on every scrape while its port still
      # accepted connections, until restarted by hand.
      - name: pihole1
        image: ekofr/pihole-exporter:v1.2.0
        env:
        - {name: PIHOLE_PROTOCOL, value: http}
        - {name: PIHOLE_HOSTNAME, value: "${PIHOLE1_MGMT_ADDRESS}"}
        - {name: PIHOLE_PORT, value: "80"}
        - {name: PORT, value: "9617"}
        - name: PIHOLE_PASSWORD
          valueFrom:
            secretKeyRef: {name: pihole-exporter, key: pihole1}
        ports:
        - {name: pihole1, containerPort: 9617}
        readinessProbe: {tcpSocket: {port: pihole1}, periodSeconds: 30}
        livenessProbe: {httpGet: {path: /metrics, port: pihole1}, timeoutSeconds: 15, periodSeconds: 60, failureThreshold: 3}
        securityContext: &container
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources: &resources
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
      - name: pihole2
        image: ekofr/pihole-exporter:v1.2.0
        env:
        - {name: PIHOLE_PROTOCOL, value: http}
        - {name: PIHOLE_HOSTNAME, value: "${PIHOLE2_MGMT_ADDRESS}"}
        - {name: PIHOLE_PORT, value: "80"}
        - {name: PORT, value: "9618"}
        - name: PIHOLE_PASSWORD
          valueFrom:
            secretKeyRef: {name: pihole-exporter, key: pihole2}
        ports:
        - {name: pihole2, containerPort: 9618}
        readinessProbe: {tcpSocket: {port: pihole2}, periodSeconds: 30}
        livenessProbe: {httpGet: {path: /metrics, port: pihole2}, timeoutSeconds: 15, periodSeconds: 60, failureThreshold: 3}
        securityContext: *container
        resources: *resources
---
apiVersion: v1
kind: Service
metadata:
  name: pihole-exporter
  labels:
    app.kubernetes.io/name: pihole-exporter
spec:
  selector:
    app.kubernetes.io/name: pihole-exporter
  ports:
  - {name: pihole1, port: 9617, targetPort: pihole1}
  - {name: pihole2, port: 9618, targetPort: pihole2}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pihole-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pihole-exporter
  endpoints:
  - {port: pihole1, interval: 60s}
  - {port: pihole2, interval: 60s}
