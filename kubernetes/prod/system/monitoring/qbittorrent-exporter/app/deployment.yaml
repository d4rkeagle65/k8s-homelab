# qBittorrent's statistics (transfer rates, torrents by state, sizes, trackers)
# through its web API, logging in as the web UI's user.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qbittorrent-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: qbittorrent-exporter
        image: ghcr.io/martabal/qbittorrent-exporter:v2.0.3
        env:
        - name: QBITTORRENT_BASE_URL
          value: http://qbittorrent.media.svc.${CLUSTER_DOMAIN}:8080
        envFrom:
        - secretRef:
            name: qbittorrent-exporter
        ports:
        - name: http
          containerPort: 8090
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 5m, memory: 24Mi}
          limits: {memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-exporter
  labels:
    app.kubernetes.io/name: qbittorrent-exporter
spec:
  selector:
    app.kubernetes.io/name: qbittorrent-exporter
  ports:
  - name: http
    port: 8090
    targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: qbittorrent-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: qbittorrent-exporter
  endpoints:
  - port: http
    interval: 60s
