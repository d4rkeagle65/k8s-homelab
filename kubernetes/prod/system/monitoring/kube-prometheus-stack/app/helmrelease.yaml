# Metrics and Grafana: the Prometheus Operator, Prometheus, Alertmanager,
# Grafana, node-exporter and kube-state-metrics. old-queues/QUEUE-monitoring.md has the
# decisions behind these values (storage, retention, the memory budget).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: monitoring
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.10.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: kps
    cleanPrometheusOperatorObjectNames: true

    # The scheduler and controller-manager listen on the node address
    # (talos/patches/controlplane-metrics.yaml), found by their pods' labels.
    # etcd is a Talos service, not a pod, so this release keeps only its rules
    # and monitors/app/scrapeconfig-etcd.yaml scrapes it. kube-proxy's metrics
    # stay on 127.0.0.1 (Talos's bootstrap manifest), so it stays off.
    kubeEtcd:
      enabled: true
      service:
        enabled: false
      serviceMonitor:
        enabled: false
    kubeScheduler:
      enabled: true
    kubeControllerManager:
      enabled: true
    kubeProxy:
      enabled: false
    windowsMonitoring:
      enabled: false
    # The API server's latency and size histograms are most of a small
    # cluster's series and of what Prometheus writes; nothing here reads them.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: (apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_slo_duration_seconds|apiserver_response_sizes|apiserver_request_body_size_bytes|apiserver_watch_events_sizes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|etcd_request_duration_seconds|apiserver_admission_.+_duration_seconds|workqueue_.+_duration_seconds|rest_client_.+_duration_seconds|rest_client_.+_size_bytes)_bucket
        - action: drop
          sourceLabels: [__name__]
          regex: kubernetes_feature_enabled|etcd_requests_total|etcd_request_duration_seconds_(count|sum)
    # The kubelet's probe and runtime timing histograms and its feature list,
    # likewise unread; the chart's own drop is kept first.
    kubelet:
      serviceMonitor:
        metricRelabelings:
        - action: drop
          sourceLabels: [__name__, le]
          regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        - action: drop
          sourceLabels: [__name__]
          regex: (prober_probe_duration_seconds|kubelet_runtime_operations_duration_seconds|kubelet_http_requests_duration_seconds|kubelet_pod_worker_duration_seconds|kubelet_pod_start_sli_duration_seconds)_bucket|kubernetes_feature_enabled
        # The probe timings come from their own endpoint, /metrics/probes.
        probesMetricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: prober_probe_duration_seconds_bucket
        # cAdvisor's: setting these replaces the chart's defaults, so they are
        # copied here (chart 92.3.0) with the last rule added: memory-failure
        # counters, block-device usage, load and health, which nothing reads.
        cAdvisorMetricRelabelings:
        - sourceLabels: [__name__]
          action: drop
          regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
        - sourceLabels: [__name__]
          action: drop
          regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
        - sourceLabels: [__name__]
          action: drop
          regex: container_memory_(mapped_file|swap)
        - sourceLabels: [__name__]
          action: drop
          regex: container_(file_descriptors|tasks_state|threads_max)
        - sourceLabels: [__name__, scope]
          action: drop
          regex: container_memory_failures_total;hierarchy
        - sourceLabels: [__name__, interface]
          action: drop
          regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
        - sourceLabels: [__name__]
          action: drop
          regex: container_spec.*
        - sourceLabels: [id, pod]
          action: drop
          regex: .+;
        - sourceLabels: [__name__]
          action: drop
          regex: container_(memory_failures_total|blkio_device_usage_total|cpu_load_d_average_10s|cpu_load_average_10s|health_state)
    defaultRules:
      rules:
        # The API server's SLO and latency rules read the request-latency
        # histograms dropped below (kubeApiServer).
        kubeApiserverAvailability: false
        kubeApiserverBurnrate: false
        kubeApiserverHistogram: false
        kubeApiserverSlos: false
        kubeProxy: false
        windows: false
      # The chart's KubeJobFailed fires for as long as a failed Job is kept, so one
      # failure a later run of its CronJob made good stays an open ticket until
      # failedJobsHistoryLimit pushes it out: the homelab rules' KubeJobFailed
      # replaces it (monitors/app/prometheusrule-homelab.yaml).
      disabled:
        KubeJobFailed: true
    # etcdMemberCommunicationSlow (99th-percentile peer round trip over 150 ms) fires
    # on the short slowdowns a busy host or a node's restart brings, each over in 8 to
    # 20 minutes (2026-10-23); held 30 minutes, it tickets only slowness that stays.
    customRules:
      etcdMemberCommunicationSlow:
        for: 30m

    prometheusOperator:
      resources:
        requests: {cpu: 20m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
      # The config-reloader sidecar in each Prometheus and Alertmanager pod.
      prometheusConfigReloader:
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}

    prometheus:
      prometheusSpec:
        # Two replicas, each scraping everything into its own volume on a
        # different worker: losing a host loses neither metrics nor history.
        replicas: 2
        # Scheduled before ordinary pods when nodes are short (cluster-policy).
        priorityClassName: homelab-critical
        podAntiAffinity: hard
        # Every 60 seconds (Prometheus's default is 15): plenty for a lab, and
        # a quarter of the writes.
        scrapeInterval: 60s
        evaluationInterval: 60s
        retention: 15d
        retentionSize: 18GB
        # CPU limit as a database's: compactions are its busiest minutes.
        resources:
          requests: {cpu: 100m, memory: 2432Mi}
          limits: {cpu: 1000m, memory: 5Gi}
        # nas-iscsi: each replica's own LUN on the NAS, so the constant writes
        # miss the hosts' SSDs and the volume follows its pod to any Talos node.
        # A block device, not NFS, which Prometheus's docs rule out for its
        # database. Only Talos nodes mount nas-iscsi, hence the affinity, which
        # every node meets now that the LXC nodes are gone.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: extensions.talos.dev/iscsi-tools
                      operator: Exists
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nas-iscsi
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 20Gi
        # Pick up monitors and rules from every namespace, not only those
        # labelled with this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

    alertmanager:
      # The chart's default config (its inhibit rules) plus two routes: the
      # always-firing Watchdog to Healthchecks.io every 5 minutes, the
      # dead-man's switch outside the cluster that notifies the owner when the
      # pings stop (the cluster, Prometheus, Alertmanager or the internet down);
      # and warning and critical alerts to Zammad through zammad-bridge
      # (old-queues/QUEUE-zammad.md), each alert on its own (group_by '...') so a ticket
      # opens, gets a note every repeat_interval while it fires, and closes on
      # recovery. Setting this replaces the chart's default whole, so its parts
      # are repeated here.
      config:
        global:
          resolve_timeout: 5m
        inhibit_rules:
        - source_matchers: [severity = critical]
          target_matchers: [severity =~ warning|info]
          equal: [namespace, alertname]
        - source_matchers: [severity = warning]
          target_matchers: [severity = info]
          equal: [namespace, alertname]
        - source_matchers: [alertname = InfoInhibitor]
          target_matchers: [severity = info]
          equal: [namespace]
        - target_matchers: [alertname = InfoInhibitor]
        route:
          group_by: [namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: "null"
          routes:
          - receiver: healthchecks
            matchers: [alertname = "Watchdog"]
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 5m
          - receiver: zammad
            matchers: [severity =~ "warning|critical", alertname != "InfoInhibitor"]
            group_by: ["..."]
        receivers:
        - name: "null"
        - name: healthchecks
          webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks/url
            send_resolved: false
        - name: zammad
          webhook_configs:
          - url: http://zammad-bridge.monitoring.svc.${CLUSTER_DOMAIN}:8080/alertmanager
            send_resolved: true
          # n8n's "Zammad: tickets in" (n8n/workflows/), alongside the bridge until its
          # decisions read right: Alertmanager isn't in its write_sources, so it writes
          # nothing (QUEUE-n8n-zammad.md, stage 4). Its bearer token from monitoring-extras'
          # alertmanager-n8n.
          - url: http://n8n.n8n.svc.${CLUSTER_DOMAIN}:5678/webhook/zammad/alertmanager
            send_resolved: true
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/alertmanager-n8n/token
        templates:
        - /etc/alertmanager/config/*.tmpl
      alertmanagerSpec:
        # Two, clustered, on different workers.
        replicas: 2
        # The dead-man's switch's ping URL, at
        # /etc/alertmanager/secrets/alertmanager-healthchecks/url, and n8n's bearer
        # token, at /etc/alertmanager/secrets/alertmanager-n8n/token.
        secrets: [alertmanager-healthchecks, alertmanager-n8n]
        # Scheduled before ordinary pods when nodes are short (cluster-policy).
        priorityClassName: homelab-critical
        podAntiAffinity: hard
        retention: 120h
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 500m, memory: 512Mi}
        # On nas-iscsi, preferring Talos nodes, for the same reasons as
        # Prometheus's storage above.
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: extensions.talos.dev/iscsi-tools
                      operator: Exists
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: nas-iscsi
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi

    kube-state-metrics:
      resources:
        requests: {cpu: 10m, memory: 256Mi}
        limits: {cpu: 500m, memory: 640Mi}
      # Each namespace's category (apps, services, system) as
      # kube_namespace_labels{label_homelab_local_category}, for the Resources
      # dashboard's filter.
      metricLabelsAllowlist:
      - namespaces=[homelab.local/category]
      # Flux's objects as metrics (gotk_resource_info: each Kustomization's,
      # HelmRelease's and source's ready state, revision and suspension), for
      # Flux's own dashboards (monitoring/dashboards) and the FluxObjectNotReady
      # alert (monitors/). Kustomizations and HelmReleases also carry their Ready
      # condition's reason, so the alert can leave out DependencyNotReady: those
      # wait on another object, which alerts for itself. From
      # fluxcd/flux2-monitoring-example, without its image-automation kinds
      # (not installed here) and without its collectors: [] and
      # --custom-resource-state-only, which would drop every other metric.
      rbac:
        extraRules:
        - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
          - notification.toolkit.fluxcd.io
          resources:
          - gitrepositories
          - buckets
          - helmrepositories
          - helmcharts
          - ocirepositories
          - kustomizations
          - helmreleases
          - alerts
          - providers
          - receivers
          verbs:
          - list
          - watch
        # mariadb-operator's PhysicalBackups and MariaDBs, for the Backups
        # dashboard and the alerts (old-queues/QUEUE-monitoring.md, phase 9): the operator
        # exports no backup or readiness metrics.
        - apiGroups:
          - k8s.mariadb.com
          resources:
          - physicalbackups
          - mariadbs
          verbs:
          - list
          - watch
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
            # Each MariaDB PhysicalBackup's last start and whether it completed
            # (mariadb_physicalbackup_*): the Backups dashboard and the
            # homelab.backups alerts.
            - groupVersionKind:
                group: k8s.mariadb.com
                version: v1alpha1
                kind: PhysicalBackup
              metricNamePrefix: mariadb
              metrics:
              - name: physicalbackup_last_schedule_timestamp
                help: When the PhysicalBackup's newest backup started, in Unix seconds.
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  name: [metadata, name]
                  mariadb: [spec, mariaDbRef, name]
                each:
                  type: Gauge
                  gauge:
                    path: [status, lastScheduleTime]
              - name: physicalbackup_complete
                help: 1 when the PhysicalBackup's newest backup completed.
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  name: [metadata, name]
                  mariadb: [spec, mariaDbRef, name]
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions, "[type=Complete]", status]
              # A template (a suspended schedule, such as a MariaDB's replica
              # recovery source) never completes, and the alerts skip it.
              - name: physicalbackup_suspended
                help: 1 when the PhysicalBackup's schedule is suspended.
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  name: [metadata, name]
                  mariadb: [spec, mariaDbRef, name]
                each:
                  type: Gauge
                  gauge:
                    path: [spec, schedule, suspend]
                    nilIsZero: true
            # Each MariaDB's Ready condition (mariadb_ready): MariaDBNotReady.
            - groupVersionKind:
                group: k8s.mariadb.com
                version: v1alpha1
                kind: MariaDB
              metricNamePrefix: mariadb
              metrics:
              - name: ready
                help: 1 when the MariaDB is Ready, 0 while it fails, recovers a replica or switches its primary.
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  mariadb: [metadata, name]
                each:
                  type: Gauge
                  gauge:
                    path: [status, conditions, "[type=Ready]", status]
            - groupVersionKind:
                group: kustomize.toolkit.fluxcd.io
                version: v1
                kind: Kustomization
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Kustomization resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  reason:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - reason
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - lastAppliedRevision
                  source_name:
                  - spec
                  - sourceRef
                  - name
            - groupVersionKind:
                group: helm.toolkit.fluxcd.io
                version: v2
                kind: HelmRelease
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux HelmRelease resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  reason:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - reason
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - history
                  - '0'
                  - chartVersion
                  chart_name:
                  - status
                  - history
                  - '0'
                  - chartName
                  chart_app_version:
                  - status
                  - history
                  - '0'
                  - appVersion
                  chart_ref_name:
                  - spec
                  - chartRef
                  - name
                  chart_source_name:
                  - spec
                  - chart
                  - spec
                  - sourceRef
                  - name
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: GitRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux GitRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  url:
                  - spec
                  - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: Bucket
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Bucket resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  endpoint:
                  - spec
                  - endpoint
                  bucket_name:
                  - spec
                  - bucketName
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux HelmRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  url:
                  - spec
                  - url
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: HelmChart
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux HelmChart resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  chart_name:
                  - spec
                  - chart
                  chart_version:
                  - spec
                  - version
            - groupVersionKind:
                group: source.toolkit.fluxcd.io
                version: v1
                kind: OCIRepository
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux OCIRepository resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  revision:
                  - status
                  - artifact
                  - revision
                  url:
                  - spec
                  - url
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1beta3
                kind: Alert
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Alert resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  suspended:
                  - spec
                  - suspend
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1beta3
                kind: Provider
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Provider resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  suspended:
                  - spec
                  - suspend
            - groupVersionKind:
                group: notification.toolkit.fluxcd.io
                version: v1
                kind: Receiver
              metricNamePrefix: gotk
              metrics:
              - name: resource_info
                help: The current state of a Flux Receiver resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name:
                      - metadata
                      - name
                labelsFromPath:
                  exported_namespace:
                  - metadata
                  - namespace
                  ready:
                  - status
                  - conditions
                  - '[type=Ready]'
                  - status
                  suspended:
                  - spec
                  - suspend
                  webhook_path:
                  - status
                  - webhookPath

    prometheus-node-exporter:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 1000m, memory: 256Mi}

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # The claim is in monitoring-extras. Recreate, so two Grafanas never
      # share its SQLite database during an upgrade.
      persistence:
        enabled: true
        existingClaim: grafana-data
      deploymentStrategy:
        type: Recreate
      resources:
        requests: {cpu: 20m, memory: 640Mi}
        limits: {cpu: 500m, memory: 1408Mi}
      # Its init containers (the data folder's owner, the grafana.com dashboards).
      initChownData:
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
      downloadDashboards:
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
      # Grafana's own latency and size histograms and its feature-flag list
      # (about 2,800 series); no dashboard here reads them.
      serviceMonitor:
        metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: grafana_.+_bucket|grafana_feature_toggles_info
      # The Authentik client secret (monitoring-extras); Grafana reads any
      # GF_<SECTION>_<KEY> variable as that setting.
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oidc
            key: client-secret
      # Dashboards in ConfigMaps labelled grafana_dashboard, from any
      # namespace, so a chart can ship its own (CloudNativePG's does).
      sidecar:
        # The dashboards and data sources sidecars (peaks about 94Mi, 44m).
        resources:
          requests: {cpu: 20m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
        dashboards:
          searchNamespace: ALL
          # A ConfigMap's grafana_folder annotation names its folder
          # (monitoring/dashboards).
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
      # Community dashboards from grafana.com, by ID and pinned revision, in
      # folders (QUEUE-dashboards.md). Their data-source inputs map to the
      # fixed UIDs of the Prometheus and Loki data sources.
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
          - name: hosts
            folder: Hosts
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/hosts
          - name: kubernetes
            folder: Kubernetes
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: network
            folder: Network
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/network
          - name: storage
            folder: Storage
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/storage
          - name: apps
            folder: Apps
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/apps
          - name: logs
            folder: Logs
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/logs
      dashboards:
        hosts:
          node-exporter-full:
            gnetId: 1860
            revision: 45
            datasource: Prometheus
          proxmox:
            gnetId: 10347
            revision: 5
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
