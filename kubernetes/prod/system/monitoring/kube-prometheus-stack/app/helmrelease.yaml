        storage:
          synology:
            gnetId: 14284
            revision: 10
            datasource: [{name: DS_PROMETHEUS, value: prometheus}, {name: VAR_NASDEVICES, value: "1"}]
        apps:
          mysql:
            gnetId: 14057
            revision: 1
            datasource: Prometheus
        logs:
          kubernetes-logs:
            gnetId: 16976
