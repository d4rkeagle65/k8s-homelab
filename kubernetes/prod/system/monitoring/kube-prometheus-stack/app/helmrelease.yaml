# Metrics and Grafana: the Prometheus Operator, Prometheus, Alertmanager,
# Grafana, node-exporter and kube-state-metrics. QUEUE-monitoring.md has the
# decisions behind these values (storage, retention, the memory budget).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: monitoring
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 92.3.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    fullnameOverride: kps
    cleanPrometheusOperatorObjectNames: true

    # kubeadm binds the scheduler's, the controller-manager's, etcd's and
    # kube-proxy's metrics to 127.0.0.1, out of Prometheus's reach: their scrapes
    # and rules stay off until those bind to the node address (phase 5).
    kubeEtcd:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeProxy:
      enabled: false
    windowsMonitoring:
      enabled: false
    # The API server's latency and size histograms are most of a small
    # cluster's series and of what Prometheus writes; nothing here reads them.
    kubeApiServer:
      serviceMonitor:
        metricRelabelings:
        - action: drop
          sourceLabels: [__name__]
          regex: (apiserver_request_duration_seconds|apiserver_request_sli_duration_seconds|apiserver_request_slo_duration_seconds|apiserver_response_sizes|apiserver_request_body_size_bytes|apiserver_watch_events_sizes|apiserver_watch_list_duration_seconds|apiserver_watch_cache_read_wait_seconds|etcd_request_duration_seconds|apiserver_admission_.+_duration_seconds|workqueue_.+_duration_seconds|rest_client_.+_duration_seconds|rest_client_.+_size_bytes)_bucket
        - action: drop
          sourceLabels: [__name__]
          regex: kubernetes_feature_enabled
    # The kubelet's probe and runtime timing histograms and its feature list,
    # likewise unread; the chart's own drop is kept first.
    kubelet:
      serviceMonitor:
        metricRelabelings:
        - action: drop
          sourceLabels: [__name__, le]
          regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        - action: drop
          sourceLabels: [__name__]
          regex: (prober_probe_duration_seconds|kubelet_runtime_operations_duration_seconds|kubelet_http_requests_duration_seconds|kubelet_pod_worker_duration_seconds|kubelet_pod_start_sli_duration_seconds)_bucket|kubernetes_feature_enabled
    defaultRules:
      rules:
        # The API server's SLO and latency rules read the request-latency
        # histograms dropped below (kubeApiServer).
        kubeApiserverAvailability: false
        kubeApiserverBurnrate: false
        kubeApiserverHistogram: false
        kubeApiserverSlos: false
        etcd: false
        kubeControllerManager: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeProxy: false
        windows: false

    prometheusOperator:
      resources:
        requests: {cpu: 20m, memory: 64Mi}
        limits: {memory: 256Mi}

    prometheus:
      prometheusSpec:
        # Two replicas, each scraping everything into its own volume on a
        # different worker: losing a host loses neither metrics nor history.
        replicas: 2
        podAntiAffinity: hard
        # Every 60 seconds (Prometheus's default is 15): plenty for a lab, and
        # a quarter of the writes.
        scrapeInterval: 60s
        evaluationInterval: 60s
        retention: 15d
        retentionSize: 18GB
        resources:
          requests: {cpu: 100m, memory: 768Mi}
          limits: {memory: 2Gi}
        # nas-block: a directory on the worker's own iSCSI LUN on the NAS, so
        # the constant writes miss the hosts' SSDs. A block device, not NFS,
        # which Prometheus's docs rule out for its database.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nas-block
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 20Gi
        # Pick up monitors and rules from every namespace, not only those
        # labelled with this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

    alertmanager:
      alertmanagerSpec:
        # Two, clustered, on different workers.
        replicas: 2
        podAntiAffinity: hard
        retention: 120h
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {memory: 128Mi}
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: nas-block
              accessModes: [ReadWriteOnce]
              resources:
                requests:
                  storage: 1Gi

    kube-state-metrics:
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}

    prometheus-node-exporter:
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 64Mi}

    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      # The claim is in monitoring-extras. Recreate, so two Grafanas never
      # share its SQLite database during an upgrade.
      persistence:
        enabled: true
        existingClaim: grafana-data
      deploymentStrategy:
        type: Recreate
      # About 450 MiB in use from the start.
      resources:
        requests: {cpu: 20m, memory: 384Mi}
        limits: {memory: 1Gi}
      # The Authentik client secret (monitoring-extras); Grafana reads any
      # GF_<SECTION>_<KEY> variable as that setting.
      envValueFrom:
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
          secretKeyRef:
            name: grafana-oidc
            key: client-secret
      # Dashboards in ConfigMaps labelled grafana_dashboard, from any
      # namespace, so a chart can ship its own (CloudNativePG's does).
      sidecar:
        dashboards:
          searchNamespace: ALL
          # A ConfigMap's grafana_folder annotation names its folder
          # (monitoring/dashboards).
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
      # Community dashboards from grafana.com, by ID and pinned revision, in
      # folders (QUEUE-dashboards.md). Their data-source inputs map to the
      # fixed UIDs of the Prometheus and Loki data sources.
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
          - name: hosts
            folder: Hosts
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/hosts
          - name: kubernetes
            folder: Kubernetes
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: network
            folder: Network
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/network
          - name: storage
            folder: Storage
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/storage
          - name: apps
            folder: Apps
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/apps
          - name: logs
            folder: Logs
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/logs
      dashboards:
        hosts:
          node-exporter-full:
            gnetId: 1860
            revision: 45
            datasource: Prometheus
          proxmox:
            gnetId: 10347
            revision: 5
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
          cadvisor:
            gnetId: 19792
            revision: 6
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
        kubernetes:
          k8s-views-global:
            gnetId: 15757
            revision: 43
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
          k8s-views-namespaces:
            gnetId: 15758
            revision: 46
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
          k8s-views-nodes:
            gnetId: 15759
            revision: 40
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
          k8s-views-pods:
            gnetId: 15760
            revision: 41
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
          k8s-system-api-server:
            gnetId: 15761
            revision: 21
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
        network:
          traefik:
            gnetId: 17346
            revision: 9
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
          pihole:
            gnetId: 10176
            revision: 3
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
          cert-manager:
            gnetId: 20842
            revision: 3
            datasource: Prometheus
          kea:
            gnetId: 12688
            revision: 4
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
          openwrt:
            gnetId: 11147
            revision: 1
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
        storage:
          synology:
            gnetId: 14284
            revision: 10
            datasource: [{name: DS_PROMETHEUS, value: prometheus}, {name: VAR_NASDEVICES, value: "1"}]
        apps:
          mysql:
            gnetId: 14057
            revision: 1
            datasource: Prometheus
        logs:
          kubernetes-logs:
            gnetId: 16976
            revision: 7
            datasource: [{name: DS_PROMETHEUS, value: prometheus}, {name: DS_LOKI, value: loki}]
      # Loki (its own release) as a data source next to Prometheus.
      additionalDataSources:
      - name: Loki
        uid: loki
        type: loki
        url: http://loki:3100
        access: proxy
        jsonData:
          maxLines: 5000
      grafana.ini:
        server:
          root_url: https://grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        # Login through Authentik (its Grafana blueprint). Grafana Admins
        # become Admins, everyone else Viewers; who may log in at all is
        # Authentik's policy (Grafana Admins or Grafana Viewers). The local
        # admin from grafana-admin stays as the way in when Authentik is down.
        auth.generic_oauth:
          enabled: true
          name: Authentik
          client_id: grafana
          scopes: openid email profile
          auth_url: https://auth.${BASE_DOMAIN}/application/o/authorize/
          token_url: https://auth.${BASE_DOMAIN}/application/o/token/
          api_url: https://auth.${BASE_DOMAIN}/application/o/userinfo/
          signout_redirect_url: https://auth.${BASE_DOMAIN}/application/o/grafana/end-session/
          use_pkce: true
          allow_sign_up: true
          login_attribute_path: preferred_username
          email_attribute_path: email
          name_attribute_path: name
          role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || 'Viewer'
        analytics:
          reporting_enabled: false
          check_for_updates: false
          check_for_plugin_updates: false
      ingress:
        enabled: true
        ingressClassName: traefik
        annotations:
          cert-manager.io/cluster-issuer: cloudflare-letsencrypt
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
          traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd
        hosts:
        - grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
        tls:
        - secretName: grafana-tls
          hosts:
          - grafana${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
