            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
        network:
          traefik:
            gnetId: 17346
            revision: 9
            datasource: [{name: DS_PROMETHEUS, value: prometheus}]
          pihole:
            gnetId: 10176
