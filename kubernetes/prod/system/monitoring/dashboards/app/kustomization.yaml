apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
# Dashboards written here, one ConfigMap per Grafana folder: Grafana's sidecar
# loads every ConfigMap labelled grafana_dashboard, into the folder its
# grafana_folder annotation names. No ${...} in the JSON: Flux would
# substitute it; Grafana's $variable form works without braces.
configMapGenerator:
- name: dashboards-homelab
  files:
  - json/drives.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
    annotations:
      grafana_folder: Homelab
