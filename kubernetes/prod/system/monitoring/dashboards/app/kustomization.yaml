apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []
# Dashboards written here or copied from a project, one ConfigMap per Grafana
# folder: Grafana's sidecar loads every ConfigMap labelled grafana_dashboard,
# into the folder its grafana_folder annotation names. Flux substitutes ${...}
# in them like everywhere else, so a dashboard writes Grafana's variables as
# $name, and a ${...} it must keep (${__field.displayName}) as $${...}. Each
# panel's data source is the fixed uid prometheus.
configMapGenerator:
- name: dashboards-homelab
  files:
  - json/homelab/overview.json
  - json/homelab/drives.json
  - json/homelab/home-assistant.json
  - json/homelab/resources.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
    annotations:
      grafana_folder: Homelab
# exportarr's own (examples/grafana/dashboard2.json, v2.3.0) and
# qbittorrent-exporter's (grafana/dashboard.json, v2.0.3).
- name: dashboards-apps
  files:
  - json/apps/media-exportarr.json
  - json/apps/qbittorrent.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
    annotations:
      grafana_folder: Apps
# Garage's own (script/telemetry, main-v1).
- name: dashboards-storage
  files:
  - json/storage/garage.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
    annotations:
      grafana_folder: Storage
# Flux's own (fluxcd/flux2-monitoring-example); the cluster one reads
# gotk_resource_info, which kube-state-metrics makes from Flux's objects
# (customResourceState in the kube-prometheus-stack release).
- name: dashboards-kubernetes
  files:
  - json/kubernetes/flux-cluster.json
  - json/kubernetes/flux-control-plane.json
  options:
    disableNameSuffixHash: true
    labels:
      grafana_dashboard: "1"
    annotations:
      grafana_folder: Kubernetes
