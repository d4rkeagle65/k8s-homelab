# The read-only Garage key backup-monitor (docker/garage/README.md, "More buckets"),
# allowed to read cnpg-backups, docker-backups and mariadb-backups, and Garage's S3
# address.
apiVersion: v1
kind: Secret
metadata:
  name: garage-backup-exporter
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
type: Opaque
stringData:
  S3_ENDPOINT: "${GARAGE_S3_ENDPOINT}"
  AWS_ACCESS_KEY_ID: "${GARAGE_BACKUP_MONITOR_S3_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${GARAGE_BACKUP_MONITOR_S3_SECRET_ACCESS_KEY}"
