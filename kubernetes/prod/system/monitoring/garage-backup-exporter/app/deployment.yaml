# The newest object under each backup in Garage's backup buckets
# (garage-backup-exporter.py), for the Backups dashboard and the
# homelab.backups alerts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage-backup-exporter
  labels:
    app.kubernetes.io/name: garage-backup-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: garage-backup-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage-backup-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: garage-backup-exporter
        image: python:3.14.8-alpine
        command: [python, -u, /app/garage-backup-exporter.py]
        envFrom:
        - secretRef:
            name: garage-backup-exporter
        env:
        # Garage signs for its own region name (s3_region in its config).
        - {name: S3_REGION, value: garage}
        # How many leading folders name one backup (garage-backup-exporter.py's prefix_of).
        - {name: BUCKETS, value: "cnpg-backups:2,docker-backups:1,mariadb-backups:1"}
        - {name: REFRESH_SECONDS, value: "600"}
        ports:
        - {name: http, containerPort: 8080}
        # /metrics answers once the first listing is done.
        readinessProbe:
          httpGet: {path: /metrics, port: http}
          periodSeconds: 30
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 60
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - {name: app, mountPath: /app, readOnly: true}
      volumes:
      - name: app
        configMap:
          name: garage-backup-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: garage-backup-exporter
  labels:
    app.kubernetes.io/name: garage-backup-exporter
spec:
  selector:
    app.kubernetes.io/name: garage-backup-exporter
  ports:
  - {name: http, port: 8080, targetPort: http}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: garage-backup-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: garage-backup-exporter
  endpoints:
  - port: http
    interval: 60s
