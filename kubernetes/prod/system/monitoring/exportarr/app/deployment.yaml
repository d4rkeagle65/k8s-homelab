# exportarr for the media apps: one container per app, each reading its API
# (queue, library, health, history) with its own key. Bookshelf is a Readarr
# fork and uses exportarr's readarr mode, which later exportarr releases drop:
# stay on 2.3.0 while Bookshelf is in use. Whisparr is a Sonarr fork and uses
# exportarr's sonarr mode.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exportarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exportarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      # The first container carries the shared settings, as YAML anchors. Each
      # answers /healthz, which its probes ask.
      - name: radarr
        image: ghcr.io/onedr0p/exportarr:v2.3.0
        args: [radarr]
        env:
        - name: PORT
          value: "9707"
        - name: URL
          value: http://radarr.media.svc.${CLUSTER_DOMAIN}:7878
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: exportarr
              key: radarr
        ports:
        - name: radarr
          containerPort: 9707
        readinessProbe: {httpGet: {path: /healthz, port: radarr}, periodSeconds: 30}
        livenessProbe: {httpGet: {path: /healthz, port: radarr}, periodSeconds: 60, failureThreshold: 5}
        securityContext: &container
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources: &resources
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
      - name: sonarr
        image: ghcr.io/onedr0p/exportarr:v2.3.0
        args: [sonarr]
        env:
        - name: PORT
          value: "9708"
        - name: URL
          value: http://sonarr.media.svc.${CLUSTER_DOMAIN}:8989
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: exportarr
              key: sonarr
        ports:
        - name: sonarr
          containerPort: 9708
        readinessProbe: {httpGet: {path: /healthz, port: sonarr}, periodSeconds: 30}
        livenessProbe: {httpGet: {path: /healthz, port: sonarr}, periodSeconds: 60, failureThreshold: 5}
        securityContext: *container
        resources: *resources
      - name: lidarr
        image: ghcr.io/onedr0p/exportarr:v2.3.0
        args: [lidarr]
        env:
        - name: PORT
          value: "9709"
        - name: URL
          value: http://lidarr.media.svc.${CLUSTER_DOMAIN}:8686
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: exportarr
              key: lidarr
        ports:
        - name: lidarr
          containerPort: 9709
        readinessProbe: {httpGet: {path: /healthz, port: lidarr}, periodSeconds: 30}
        livenessProbe: {httpGet: {path: /healthz, port: lidarr}, periodSeconds: 60, failureThreshold: 5}
        securityContext: *container
        resources: *resources
      - name: prowlarr
        image: ghcr.io/onedr0p/exportarr:v2.3.0
        args: [prowlarr]
        env:
        - name: PORT
          value: "9710"
        - name: URL
          value: http://prowlarr.media.svc.${CLUSTER_DOMAIN}:9696
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: exportarr
              key: prowlarr
        ports:
        - name: prowlarr
          containerPort: 9710
        readinessProbe: {httpGet: {path: /healthz, port: prowlarr}, periodSeconds: 30}
        livenessProbe: {httpGet: {path: /healthz, port: prowlarr}, periodSeconds: 60, failureThreshold: 5}
        securityContext: *container
        resources: *resources
      - name: bookshelf
        image: ghcr.io/onedr0p/exportarr:v2.3.0
        args: [readarr]
        env:
        - name: PORT
          value: "9711"
        - name: URL
          value: http://bookshelf.media.svc.${CLUSTER_DOMAIN}:8787
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: exportarr
              key: bookshelf
        ports:
        - name: bookshelf
          containerPort: 9711
        readinessProbe: {httpGet: {path: /healthz, port: bookshelf}, periodSeconds: 30}
        livenessProbe: {httpGet: {path: /healthz, port: bookshelf}, periodSeconds: 60, failureThreshold: 5}
        securityContext: *container
        resources: *resources
      - name: whisparr
        image: ghcr.io/onedr0p/exportarr:v2.3.0
        args: [sonarr]
        env:
        - name: PORT
          value: "9712"
        - name: URL
          value: http://whisparr.media.svc.${CLUSTER_DOMAIN}:6969
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: exportarr
              key: whisparr
        ports:
        - name: whisparr
          containerPort: 9712
        readinessProbe: {httpGet: {path: /healthz, port: whisparr}, periodSeconds: 30}
        livenessProbe: {httpGet: {path: /healthz, port: whisparr}, periodSeconds: 60, failureThreshold: 5}
        securityContext: *container
        resources: *resources
---
apiVersion: v1
kind: Service
metadata:
  name: exportarr
  labels:
    app.kubernetes.io/name: exportarr
spec:
  selector:
    app.kubernetes.io/name: exportarr
  ports:
  - name: radarr
    port: 9707
    targetPort: radarr
  - name: sonarr
    port: 9708
    targetPort: sonarr
  - name: lidarr
    port: 9709
    targetPort: lidarr
  - name: prowlarr
    port: 9710
    targetPort: prowlarr
  - name: bookshelf
    port: 9711
    targetPort: bookshelf
  - name: whisparr
    port: 9712
    targetPort: whisparr
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exportarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr
  endpoints:
  - port: radarr
    interval: 120s
    scrapeTimeout: 60s
  - port: sonarr
    interval: 120s
    scrapeTimeout: 60s
  - port: lidarr
    interval: 120s
    scrapeTimeout: 60s
  - port: prowlarr
    interval: 120s
    scrapeTimeout: 60s
  - port: bookshelf
    interval: 120s
    scrapeTimeout: 60s
  - port: whisparr
    interval: 120s
    scrapeTimeout: 60s
