# exportarr for the media apps: one container per app, each reading its API
# (queue, library, health, history) with its own key. Bookshelf is a Readarr
# fork and uses exportarr's readarr mode, which later exportarr releases drop:
# stay on 2.3.0 while Bookshelf is in use. Whisparr joins once its key is in
# Vaultwarden.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exportarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exportarr
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      # The first container carries the shared settings, as YAML anchors.
      - name: radarr
        image: ghcr.io/onedr0p/exportarr:v2.3.0
        args: [radarr]
        env:
        - name: PORT
          value: "9707"
        - name: URL
          value: http://radarr.media.svc.${CLUSTER_DOMAIN}:7878
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: exportarr
              key: radarr
        ports:
        - name: radarr
          containerPort: 9707
        securityContext: &container
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources: &resources
          requests: {cpu: 5m, memory: 24Mi}
          limits: {memory: 96Mi}
      - name: sonarr
        image: ghcr.io/onedr0p/exportarr:v2.3.0
        args: [sonarr]
        env:
        - name: PORT
          value: "9708"
        - name: URL
          value: http://sonarr.media.svc.${CLUSTER_DOMAIN}:8989
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: exportarr
              key: sonarr
        ports:
        - name: sonarr
          containerPort: 9708
        securityContext: *container
        resources: *resources
      - name: lidarr
        image: ghcr.io/onedr0p/exportarr:v2.3.0
        args: [lidarr]
        env:
        - name: PORT
          value: "9709"
        - name: URL
          value: http://lidarr.media.svc.${CLUSTER_DOMAIN}:8686
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: exportarr
              key: lidarr
        ports:
        - name: lidarr
          containerPort: 9709
        securityContext: *container
        resources: *resources
      - name: prowlarr
        image: ghcr.io/onedr0p/exportarr:v2.3.0
        args: [prowlarr]
        env:
        - name: PORT
          value: "9710"
        - name: URL
          value: http://prowlarr.media.svc.${CLUSTER_DOMAIN}:9696
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: exportarr
              key: prowlarr
        ports:
        - name: prowlarr
          containerPort: 9710
        securityContext: *container
        resources: *resources
      - name: bookshelf
        image: ghcr.io/onedr0p/exportarr:v2.3.0
        args: [readarr]
        env:
        - name: PORT
          value: "9711"
        - name: URL
          value: http://bookshelf.media.svc.${CLUSTER_DOMAIN}:8787
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: exportarr
              key: bookshelf
        ports:
        - name: bookshelf
          containerPort: 9711
        securityContext: *container
        resources: *resources
---
apiVersion: v1
kind: Service
metadata:
  name: exportarr
  labels:
    app.kubernetes.io/name: exportarr
spec:
  selector:
    app.kubernetes.io/name: exportarr
  ports:
  - name: radarr
    port: 9707
    targetPort: radarr
  - name: sonarr
    port: 9708
    targetPort: sonarr
  - name: lidarr
    port: 9709
    targetPort: lidarr
  - name: prowlarr
    port: 9710
    targetPort: prowlarr
  - name: bookshelf
    port: 9711
    targetPort: bookshelf
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: exportarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: exportarr
  endpoints:
  - port: radarr
    interval: 120s
    scrapeTimeout: 60s
  - port: sonarr
    interval: 120s
    scrapeTimeout: 60s
  - port: lidarr
    interval: 120s
    scrapeTimeout: 60s
  - port: prowlarr
    interval: 120s
    scrapeTimeout: 60s
  - port: bookshelf
    interval: 120s
    scrapeTimeout: 60s
