# Dockhand's notifications into the bridge (Dockhand: Settings, Notifications,
# an Apprise channel jsons://zammad-bridge.<domain>/dockhand/<DOCKHAND_ALERT_TOKEN>).
# Only /dockhand is routed, from private networks only (LAN, cluster, tailnet;
# never the tunnel); Alertmanager reaches the bridge inside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zammad-bridge-dockhand
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: traefik_private-networks@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: zammad-bridge${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
    http:
      paths:
      - path: /dockhand/
        pathType: Prefix
        backend:
          service:
            name: zammad-bridge
            port:
              name: http
  tls:
  - secretName: zammad-bridge-dockhand-tls
    hosts:
    - zammad-bridge${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
