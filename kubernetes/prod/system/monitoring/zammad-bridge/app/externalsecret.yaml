# The token the bridge's periodic check reads and closes tickets with (zammad-bridge.py):
# an agent's, with ticket.agent only, straight from Key Vault (this namespace opts in to
# the azure-keyvault store; not cluster-secrets).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zammad-bridge-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: zammad-bridge-api
    creationPolicy: Owner
  data:
  - {secretKey: ZAMMAD_API_TOKEN, remoteRef: {key: ZAMMAD-BRIDGE-API-TOKEN}}
