# Alertmanager's warning and critical alerts into Zammad as tickets
# (zammad-bridge.py; the route is kube-prometheus-stack's alertmanager.config).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zammad-bridge
  labels:
    app.kubernetes.io/name: zammad-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zammad-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zammad-bridge
    spec:
      # Alerts reach Zammad through it (cluster-policy).
      priorityClassName: homelab-critical
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: zammad-bridge
        image: python:3.14.8-alpine
        command: [python, -u, /app/zammad-bridge.py]
        env:
        - name: ZAMMAD_URL
          valueFrom:
            secretKeyRef:
              name: zammad-bridge
              key: ZAMMAD_URL
        # Dockhand's, Semaphore's and Databasus's notifications, each at
        # /<route>/<its token> (ingress-dockhand.yaml).
        - name: DOCKHAND_TOKEN
          valueFrom:
            secretKeyRef:
              name: zammad-bridge
              key: DOCKHAND_TOKEN
        - name: SEMAPHORE_TOKEN
          valueFrom:
            secretKeyRef:
              name: zammad-bridge
              key: SEMAPHORE_TOKEN
        - name: DATABASUS_TOKEN
          valueFrom:
            secretKeyRef:
              name: zammad-bridge
              key: DATABASUS_TOKEN
        # Asked which members of a group alert are down (zammad-bridge.py).
        - name: PROMETHEUS_URL
          value: http://kps-prometheus.monitoring.svc.${CLUSTER_DOMAIN}:9090
        ports:
        - {name: http, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 30
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 60
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - {name: app, mountPath: /app, readOnly: true}
      volumes:
      - name: app
        configMap:
          name: zammad-bridge
---
apiVersion: v1
kind: Service
metadata:
  name: zammad-bridge
  labels:
    app.kubernetes.io/name: zammad-bridge
spec:
  selector:
    app.kubernetes.io/name: zammad-bridge
  ports:
  - {name: http, port: 8080, targetPort: http}
