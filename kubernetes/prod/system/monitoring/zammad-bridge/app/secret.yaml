# Zammad's Checkmk endpoint for the bridge (Zammad: Integrations, Checkmk; the
# token is in its path), and the tokens Dockhand's, Semaphore's and Databasus's
# notifications carry in theirs.
apiVersion: v1
kind: Secret
metadata:
  name: zammad-bridge
type: Opaque
stringData:
  ZAMMAD_URL: ${ZAMMAD_ALERT_WEBHOOK_URL}
  DOCKHAND_TOKEN: ${DOCKHAND_ALERT_TOKEN}
  SEMAPHORE_TOKEN: ${SEMAPHORE_ALERT_TOKEN}
  DATABASUS_TOKEN: ${DATABASUS_ALERT_TOKEN}
