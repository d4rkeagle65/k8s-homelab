# The firewall over SNMPv3, through the exporter: system, interfaces, and the Linux
# host's memory, load and CPU (the CloudGen box runs net-snmp). Its address comes from
# NetBox: the Prometheus SD plugin lists the devices of role Firewall that are Active or
# Failed (still alerting; README.md, "What a NetBox status means") with their
# primary address, which becomes the exporter's target. If NetBox can't be read,
# Prometheus keeps the targets it last found.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: firewall-snmp
spec:
  httpSDConfigs:
  - url: https://netbox${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}/api/plugins/prometheus-sd/devices/?role=firewall&status=active&status=failed
    refreshInterval: 5m
    authorization:
      type: Bearer
      credentials:
        name: netbox-sd
        key: token
  metricsPath: /snmp
  params:
    module: [system, if_mib, ucd_memory, ucd_system_stats, ucd_la_table]
    auth: [homelab_v3]
  scrapeInterval: 120s
  scrapeTimeout: 60s
  relabelings:
  - sourceLabels: [__meta_netbox_primary_ip4]
    targetLabel: __param_target
  - sourceLabels: [__meta_netbox_primary_ip4]
    targetLabel: instance
  - targetLabel: __address__
    replacement: snmp-exporter-prometheus-snmp-exporter:9116
  - targetLabel: firewall
    replacement: main
  - targetLabel: job
    replacement: firewall-snmp
