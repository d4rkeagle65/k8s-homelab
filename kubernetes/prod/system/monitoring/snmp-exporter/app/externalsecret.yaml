# The SNMPv3 user the switch and the firewall answer to, from Key Vault (this namespace opts
# in to the azure-keyvault store; not cluster-secrets), as the exporter's environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snmp-exporter-v3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: snmp-exporter-v3
    creationPolicy: Owner
  data:
  - {secretKey: SNMP_V3_USERNAME, remoteRef: {key: SNMP-V3-USERNAME}}
  - {secretKey: SNMP_V3_AUTH_PASSPHRASE, remoteRef: {key: SNMP-V3-AUTH-PASSPHRASE}}
  - {secretKey: SNMP_V3_PRIV_PASSPHRASE, remoteRef: {key: SNMP-V3-PRIV-PASSPHRASE}}
