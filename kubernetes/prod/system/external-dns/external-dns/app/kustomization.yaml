apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- helmrelease-netbox.yaml
- secret-netbox.yaml
configMapGenerator:
# The NetBox DNS webhook (helmrelease-netbox.yaml names it, so no hash suffix;
# its checksum annotation there rolls the pod instead).
- name: netbox-dns-webhook
  files:
  - netbox-dns-webhook.py
  options:
    disableNameSuffixHash: true
