# ExternalDNS: an A record in NetBox DNS for each hostname of a `traefik` or
# `traefik-isolated` Ingress, at the address that controller publishes in the
# Ingress's status. Cloudflare tunnel Ingresses are left out; the tunnel
# controller handles public DNS. Also each name in the
# external-dns.kubernetes.io/hostname annotation of a Service, at its address:
# only Traefik's has one (smtp-relay, which has no Ingress). (v0.23 reads only
# the external-dns.kubernetes.io/ prefix, not external-dns.alpha.kubernetes.io/.)
#
# NetBox owns local DNS, and netbox-dns-sync copies it to the Pi-holes
# (old-queues/QUEUE-netbox-dns.md). ExternalDNS writes through its own webhook provider
# (netbox-dns-webhook.py), a sidecar in this pod listening on 127.0.0.1 only.
# The webhook lists and changes only the records it marked (description
# external-dns), which is the ownership the noop registry leaves to it: so
# with policy sync a hostname leaving an Ingress loses its record, and a
# hand-made record of the same name is never taken over.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-netbox
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: external-dns
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  releaseName: external-dns-netbox
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Requests and limits by QUEUE-resource-limits.md's rules.
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
    # The webhook script's checksum (its first 12 hex digits), so a change to it
    # rolls the pod; test_netbox_dns_webhook.py checks it matches.
    podAnnotations:
      homelab.local/webhook-sha256: "2104f8631fad"
    # The webhook is a native sidecar (initContainers below), not the chart's
    # provider.webhook container: Kubernetes starts ExternalDNS only once its
    # startup probe passes, where the chart's runs beside it and ExternalDNS
    # gave up on a slow start and restarted. Emptied (each key, since the
    # chart's templates read provider.webhook's keys), provider.webhook also
    # takes the chart's webhook Service port and scrape endpoint, which the
    # webhook has no metrics for. A chart version adding a key under
    # provider.webhook brings its container back unless that key is emptied
    # here too: diff the rendered Deployment when upgrading the chart.
    provider:
      name: webhook
      webhook:
        image: null
        env: null
        args: null
        extraVolumeMounts: null
        resources: null
        securityContext: null
        livenessProbe: null
        readinessProbe: null
        service: null
        serviceMonitor: null
    initContainers:
    - name: webhook
      image: python:3.14.8-alpine
      restartPolicy: Always
      args: [python, -u, /app/netbox-dns-webhook.py]
      env:
      - name: NETBOX_URL
        value: https://netbox${SUBDOMAIN_SUFFIX}.${BASE_DOMAIN}
      - name: DOMAIN_FILTER
        value: ${BASE_DOMAIN}
      - name: NETBOX_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-netbox
            key: NETBOX_TOKEN
      ports:
      - {name: http-webhook, containerPort: 8080, protocol: TCP}
      # Up to two minutes to start; /healthz answers once the API port is bound.
      startupProbe:
        httpGet: {path: /healthz, port: http-webhook}
        periodSeconds: 2
        failureThreshold: 60
      livenessProbe:
        httpGet: {path: /healthz, port: http-webhook}
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 2
      readinessProbe:
        httpGet: {path: /healthz, port: http-webhook}
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
      volumeMounts:
      - {name: webhook, mountPath: /app, readOnly: true}
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {cpu: 500m, memory: 256Mi}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
    extraVolumes:
    - name: webhook
      configMap:
        name: netbox-dns-webhook
    sources:
    - ingress
    - service
    policy: sync
    serviceMonitor:
      enabled: true
    registry: noop
    domainFilters:
    - ${BASE_DOMAIN}
    interval: 1m
    extraArgs:
    - --ingress-class=traefik
    - --ingress-class=traefik-isolated
