# ExternalDNS: writes a Pi-hole local DNS record for each hostname of a
# `traefik` or `traefik-isolated` Ingress, pointing at the address that
# controller publishes in the Ingress's status (INGRESS_IP or
# ISOLATED_INGRESS_IP). Cloudflare tunnel Ingresses are left out; the tunnel
# controller handles public DNS.
#
# Also each name in the external-dns.kubernetes.io/hostname annotation of a
# Service, at that Service's address: only Traefik's has one (smtp-relay,
# which has no Ingress). A Service without the annotation is ignored.
# (v0.23 reads only the external-dns.kubernetes.io/ prefix, not the older
# external-dns.alpha.kubernetes.io/.)
#
# upsert-only: it adds and updates records but never deletes any, so records
# made by hand in Pi-hole stay. The flip side: when a hostname leaves an
# Ingress, delete its Pi-hole record by hand. A hand-made record with exactly
# the same name as an Ingress hostname would be taken over.
#
# Pi-hole can't store ownership records, hence the noop registry.
# https://kubernetes-sigs.github.io/external-dns/latest/docs/tutorials/pihole/
#
# PIHOLE_URL is the Pi-hole web address, scheme included and no path (for
# example http://<address>). If it's https with Pi-hole's self-signed
# certificate, add --pihole-tls-skip-verify.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: external-dns
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  releaseName: external-dns
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    provider:
      name: pihole
    sources:
    - ingress
    - service
    policy: upsert-only
    registry: noop
    domainFilters:
    - ${BASE_DOMAIN}
    interval: 1m
    env:
    - name: EXTERNAL_DNS_PIHOLE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: external-dns-pihole
          key: EXTERNAL_DNS_PIHOLE_PASSWORD
    extraArgs:
    - --pihole-server=${PIHOLE_URL}
    - --ingress-class=traefik
    - --ingress-class=traefik-isolated
