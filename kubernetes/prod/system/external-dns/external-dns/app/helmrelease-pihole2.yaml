# The same ExternalDNS as helmrelease.yaml (read its notes there), writing to
# the second Pi-hole, so a new record reaches both within a minute instead of
# waiting for nebula-sync's hourly copy. Keep the two releases' values the
# same apart from the Pi-hole each writes to: nebula-sync still copies
# Pi-hole 1's records over Pi-hole 2's every hour.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns-pihole2
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: external-dns
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  releaseName: external-dns-pihole2
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Requests and limits by QUEUE-resource-limits.md's rules.
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {cpu: 500m, memory: 512Mi}
    provider:
      name: pihole
    sources:
    - ingress
    - service
    policy: upsert-only
    serviceMonitor:
      enabled: true
    registry: noop
    domainFilters:
    - ${BASE_DOMAIN}
    interval: 1m
    env:
    - name: EXTERNAL_DNS_PIHOLE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: external-dns-pihole2
          key: EXTERNAL_DNS_PIHOLE_PASSWORD
    extraArgs:
    - --pihole-server=${PIHOLE2_URL}
    - --ingress-class=traefik
    - --ingress-class=traefik-isolated
