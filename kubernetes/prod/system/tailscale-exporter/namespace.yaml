apiVersion: v1
kind: Namespace
metadata:
  labels:
    homelab.local/category: system
    homelab.local/data: stateless
    homelab.local/exposure: cluster
    # Reads its own Key Vault secrets (azure-keyvault's conditions): a namespace of
    # its own, as that label must never go on a shared one.
    homelab.local/keyvault: allowed
    homelab.local/login: none
    pod-security.kubernetes.io/enforce: restricted
  name: tailscale-exporter
