# The read-only Tailscale OAuth client (QUEUE-tailscale.md), straight from Key Vault:
# this namespace opts in to the azure-keyvault store, so cluster-secrets isn't used.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-exporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-keyvault
  target:
    name: tailscale-exporter
    creationPolicy: Owner
  data:
  - secretKey: TS_CLIENT_ID
    remoteRef:
      key: TAILSCALE-EXPORTER-OAUTH-CLIENT-ID
  - secretKey: TS_CLIENT_SECRET
    remoteRef:
      key: TAILSCALE-EXPORTER-OAUTH-CLIENT-SECRET
