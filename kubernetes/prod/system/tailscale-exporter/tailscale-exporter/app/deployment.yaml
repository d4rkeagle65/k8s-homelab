# The tailnet's state for Prometheus (tailscale-exporter.py), and the alerts on it
# (prometheusrule.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-exporter
  labels:
    app.kubernetes.io/name: tailscale-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tailscale-exporter
        image: python:3.15.1-alpine
        command: [python, -u, /app/tailscale-exporter.py]
        envFrom:
        - secretRef:
            name: tailscale-exporter
        env:
        - {name: REFRESH_SECONDS, value: "120"}
        ports:
        - {name: http, containerPort: 8080}
        # /metrics answers once the first read is done.
        readinessProbe:
          httpGet: {path: /metrics, port: http}
          periodSeconds: 30
        livenessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 60
        resources:
          requests: {cpu: 10m, memory: 48Mi}
          limits: {cpu: 500m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - {name: app, mountPath: /app, readOnly: true}
      volumes:
      - name: app
        configMap:
          name: tailscale-exporter
---
apiVersion: v1
kind: Service
metadata:
  name: tailscale-exporter
  labels:
    app.kubernetes.io/name: tailscale-exporter
spec:
  selector:
    app.kubernetes.io/name: tailscale-exporter
  ports:
  - {name: http, port: 8080, targetPort: http}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tailscale-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-exporter
  endpoints:
  - port: http
    interval: 120s
