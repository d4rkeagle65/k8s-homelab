apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tailscale-exporter
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: tailscale-exporter
      homelab.local/category: system
      homelab.local/env: prod
      homelab.local/managed-by: hand
  interval: 30m
  path: ./kubernetes/prod/system/tailscale-exporter/tailscale-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: tailscale-exporter
  dependsOn:
  - name: azure-keyvault
  - name: kube-prometheus-stack
  postBuild:
    substituteFrom:
    - kind: ConfigMap
      name: cluster-settings
      optional: true
    - kind: Secret
      name: cluster-secrets
      optional: true
