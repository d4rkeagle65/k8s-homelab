# A long-lived token for the semaphore ServiceAccount. Kubernetes fills in the
# token and the cluster's CA certificate itself, so nothing secret is in git.
# Deleting this Secret revokes the token; Flux then makes a new one.
apiVersion: v1
kind: Secret
metadata:
  name: semaphore-token
  annotations:
    kubernetes.io/service-account.name: semaphore
type: kubernetes.io/service-account-token
