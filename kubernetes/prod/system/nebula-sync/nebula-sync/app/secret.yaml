# The two Pi-holes' app passwords (Pi-hole: Settings > Web interface / API >
# Configure app password). Pi-hole 1's is the one ExternalDNS uses too: a
# Pi-hole has a single app password. cluster-secrets gives both base64-encoded,
# as it does every variable used in a Secret's data.
apiVersion: v1
kind: Secret
metadata:
  name: nebula-sync
type: Opaque
data:
  primary-password: ${PIHOLE_1_PASSWORD}
  replica-password: ${PIHOLE_2_APP_PASSWORD}
