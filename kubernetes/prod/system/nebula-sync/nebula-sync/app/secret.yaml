# The two Pi-holes' app passwords (Pi-hole: Settings > Web interface / API >
# Configure app password). Pi-hole 1's is the one ExternalDNS uses too: a
# Pi-hole has a single app password. Both fields hold them base64-encoded, as
# for every variable used in a Secret's data.
apiVersion: v1
kind: Secret
metadata:
  name: nebula-sync
type: Opaque
data:
  primary-password: ${PIHOLE_PASSWORD}
  replica-password: ${PIHOLE2_PASSWORD}
