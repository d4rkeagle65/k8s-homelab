# Talos's target, the same for every playbook that works on the Talos nodes
# (talos-update.yml, talos-reboot.yml, kubernetes-update.yml): the installer image
# in talos/patches/common.yaml, the one place Talos's version and schematic are set
# (tofu/proxmox/talos-config.tf reads it too), and its version, which talosctl
# matches.

talos_common: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../talos/patches/common.yaml') }}"
talos_image: "{{ talos_common | regex_search('image: (factory\\.talos\\.dev/[^\\s]+:v[0-9.]+)', '\\1') | first }}"
talos_version: "{{ talos_image.split(':') | last }}"
