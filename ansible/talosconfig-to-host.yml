# One-off: copies the talosconfig Semaphore holds as the secret extra variable
# talosconfig_b64 (the "k8s and Talos Connection" variable group) into
# /root/talosconfig.b64 on the one host target_hosts names, as the same base64 on
# one line, mode 0600, so it can be saved (Vaultwarden) and re-entered as the
# environment variable TALOSCONFIG_B64: Semaphore never shows a secret back. The
# value is never printed: the write has no_log, the checks show only their
# expressions, and the command line carries only a file name.
#
# Template: this playbook, the inventory Run Command uses, the repository, and the
# "k8s and Talos Connection" variable group, with talosconfig_b64 still in it;
# survey: target_hosts (one host you can log in to). Afterwards: copy the file
# off, `shred -u /root/talosconfig.b64` on the host, and delete the template and
# this playbook.
#
# In check mode (--check) it checks the value and the host, and writes nothing.

- ansible.builtin.import_playbook: select-hosts.yml
  vars:
    select_from: all
    select_required: true
    select_one: true

- name: Check the talosconfig
  hosts: semaphore
  gather_facts: false
  tasks:
    - name: talosconfig_b64 is set and decodes to a talosconfig
      ansible.builtin.assert:
        that:
          - talosconfig_b64 | default('') | length > 0
          - (talosconfig_b64 | regex_replace('\s', '') | b64decode) is search('(?m)^contexts:')
          - (talosconfig_b64 | regex_replace('\s', '') | b64decode) is search('(?m)^ +key:')
        fail_msg: >-
          talosconfig_b64 is unset, or doesn't decode to a talosconfig with a client key:
          the template needs the "k8s and Talos Connection" group with it still in it.
          Nothing was written.
        success_msg: "talosconfig_b64 decodes to a talosconfig with a client key"

- name: Write it on the host
  hosts: targets
  gather_facts: false
  become: true
  tasks:
    - name: Write /root/talosconfig.b64 (mode 0600)
      ansible.builtin.copy:
        content: "{{ hostvars['semaphore'].talosconfig_b64 | regex_replace('\\s', '') }}\n"
        dest: /root/talosconfig.b64
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Read it back
      ansible.builtin.stat:
        path: /root/talosconfig.b64
        checksum_algorithm: sha256
      register: written
      when: not ansible_check_mode

    - name: It holds the value Semaphore has
      ansible.builtin.assert:
        that:
          - written.stat.exists
          - written.stat.mode == '0600'
          - written.stat.checksum == ((hostvars['semaphore'].talosconfig_b64 | regex_replace('\s', '')) ~ '\n') | hash('sha256')
        fail_msg: /root/talosconfig.b64 doesn't hold the value Semaphore has, or isn't 0600.
        quiet: true
      when: not ansible_check_mode

    - name: Say what's there
      ansible.builtin.debug:
        msg: >-
          /root/talosconfig.b64 holds the value Semaphore has ({{ written.stat.size }} bytes,
          mode 0600). Copy it off, then shred -u it.
      when: not ansible_check_mode
