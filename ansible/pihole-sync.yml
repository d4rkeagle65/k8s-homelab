# Copies the Pi-hole settings nebula-sync can't (Pi-hole refuses them through
# its API: pihole-FTL --config or pihole.toml only) from the primary Pi-hole to
# the others. nebula-sync (kubernetes/prod/system/nebula-sync/) copies the rest.
#
# For each setting in pihole_synced_settings it reads the primary's value with
# `pihole-FTL --config <setting>`, compares each other Pi-hole's, and on a
# difference sets it there, reads it back, restarts FTL (these settings only
# take effect on a restart) and waits for that Pi-hole to answer DNS again. A
# Pi-hole is changed only while the primary answers, and one at a time.
#
# Inventory: the pihole group, as for pihole-update.yml. Optional:
# pihole_primary (default the group's first host), the Pi-hole edited by hand;
# pihole_synced_settings (default [misc.dnsmasq_lines]); dns_check_name
# (default pi.hole).
#
# In check mode (--check) it reports which Pi-holes differ, and how, and
# changes nothing.

- name: Read the primary Pi-hole's settings
  hosts: pihole
  gather_facts: false
  vars:
    primary: "{{ pihole_primary | default(groups['pihole'][0]) }}"
  tasks:
    - name: The primary is in the pihole group
      ansible.builtin.assert:
        that: primary in groups['pihole']
        fail_msg: "pihole_primary ({{ primary }}) isn't a host in the pihole group."
        quiet: true
      run_once: true

    - name: Read each setting on the primary
      ansible.builtin.command:
        argv: [pihole-FTL, --config, "{{ item }}"]
      loop: "{{ pihole_synced_settings | default(['misc.dnsmasq_lines']) }}"
      register: primary_read
      changed_when: false
      check_mode: false
      delegate_to: "{{ primary }}"
      run_once: true

    # An empty answer is a failed read, not an empty setting: an empty list
    # prints as [].
    - name: Every setting was read
      ansible.builtin.assert:
        that: primary_read.results | map(attribute='stdout') | select('equalto', '') | list | length == 0
        fail_msg: "The primary returned nothing for: {{ primary_read.results | selectattr('stdout', 'equalto', '') | map(attribute='item') | join(', ') }}"
        quiet: true
      run_once: true

    # run_once sets the fact on every Pi-hole, for the next play.
    - name: Keep the primary's values
      ansible.builtin.set_fact:
        wanted: "{{ dict(primary_read.results | map(attribute='item') | zip(primary_read.results | map(attribute='stdout'))) }}"
      run_once: true

- name: Bring the other Pi-holes in line, one at a time
  hosts: pihole
  serial: 1
  order: inventory
  any_errors_fatal: true
  gather_facts: false
  vars:
    primary: "{{ pihole_primary | default(groups['pihole'][0]) }}"
  tasks:
    - name: Skip the primary
      ansible.builtin.meta: end_host
      when: inventory_hostname == primary

    - name: Read each setting here
      ansible.builtin.command:
        argv: [pihole-FTL, --config, "{{ item }}"]
      loop: "{{ wanted.keys() | list }}"
      register: here_read
      changed_when: false
      check_mode: false

    - name: Every setting was read here too
      ansible.builtin.assert:
        that: here_read.results | map(attribute='stdout') | select('equalto', '') | list | length == 0
        fail_msg: "{{ inventory_hostname }} returned nothing for: {{ here_read.results | selectattr('stdout', 'equalto', '') | map(attribute='item') | join(', ') }}"
        quiet: true

    - name: Find the settings that differ
      ansible.builtin.set_fact:
        to_set: "{{ (to_set | default([])) + ([item.item] if item.stdout != wanted[item.item] else []) }}"
      loop: "{{ here_read.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Report the differences
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ 'matches the primary' if not to_set else
          (to_set | map('regex_replace', '$', ' differs') | join('; ')) }}

    - name: Show each difference
      ansible.builtin.debug:
        msg:
          - "{{ item }} on the primary: {{ wanted[item] }}"
          - "{{ item }} here: {{ (here_read.results | selectattr('item', 'equalto', item) | first).stdout }}"
      loop: "{{ to_set }}"

    - name: The primary answers DNS before this one changes
      ansible.builtin.command: >-
        python3 {{ playbook_dir }}/files/dns-answers.py {{ dns_check_name | default('pi.hole') }}
        {{ hostvars[primary].ansible_host | default(primary) }}
      delegate_to: localhost
      register: primary_answer
      until: primary_answer.rc == 0
      retries: 2
      delay: 5
      changed_when: false
      check_mode: false
      when: to_set | length > 0

    - name: Set each differing setting
      ansible.builtin.command:
        argv: [pihole-FTL, --config, "{{ item }}", "{{ wanted[item] }}"]
      loop: "{{ to_set }}"

    - name: Read them back
      ansible.builtin.command:
        argv: [pihole-FTL, --config, "{{ item }}"]
      loop: "{{ to_set }}"
      register: read_back
      changed_when: false
      when: not ansible_check_mode

    - name: Each now matches the primary
      ansible.builtin.assert:
        that: item.stdout == wanted[item.item]
        fail_msg: "{{ item.item }} on {{ inventory_hostname }} still differs after setting it."
        quiet: true
      loop: "{{ read_back.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: not ansible_check_mode

    - name: Restart FTL so the settings take effect
      ansible.builtin.systemd_service:
        name: pihole-FTL
        state: restarted
      when: to_set | length > 0

    - name: Wait for it to answer DNS again
      ansible.builtin.command: >-
        python3 {{ playbook_dir }}/files/dns-answers.py {{ dns_check_name | default('pi.hole') }}
        {{ ansible_host | default(inventory_hostname) }}
      delegate_to: localhost
      register: self_answer
      until: self_answer.rc == 0
      retries: 20
      delay: 6
      changed_when: false
      when: to_set | length > 0 and not ansible_check_mode
