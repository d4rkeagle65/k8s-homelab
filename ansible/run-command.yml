# Runs one shell command on the hosts named, and prints each host's output in
# the run's log: the owner starts it from Semaphore and passes on the task ID,
# rather than running the command by hand and pasting what it printed.
#
# Inputs (the template's survey):
#   run_command      the command, run by the remote login shell (sh on the
#                    OpenWrt access points, so no bash-only syntax there)
#   target_hosts     one or more inventory hosts or groups, separated by
#                    commas, spaces or new lines; every name must be in the
#                    inventory, or nothing runs (select-hosts.yml; run_hosts,
#                    its older name, still works). Required: no default
#   run_timeout      optional: seconds before the command is stopped (300)
#   run_command_b64  optional, in place of run_command: the command base64-encoded.
#                    Ansible expands {{ ... }} in a variable's value, so a command
#                    holding braces (docker's --format '{{.Names}}') fails as
#                    run_command; decoded from base64 it is used exactly as given.
#
# It goes through `raw`, which needs no Python on the host (the access points
# have none), so the output is the terminal's: stdout and stderr together.
# A command that exits non-zero fails that host after printing its output.
# The command itself is printed first, its secret-shaped values redacted (the
# patterns are in that task). What the command prints lands in Semaphore's log,
# kept with the task: never run one that prints a secret, and remember the
# command's text is kept in the task's settings unredacted: no secret in it.
#
# In check mode (--check) it lists the hosts it would run on and runs nothing.

- ansible.builtin.import_playbook: select-hosts.yml
  vars:
    select_from: all
    select_required: true
    select_alias: "{{ run_hosts | default('') }}"
    select_alias_name: run_hosts

- name: The command
  hosts: semaphore
  gather_facts: false
  vars:
    the_command: "{{ run_command_b64 | b64decode if run_command_b64 | default('') | length > 0 else run_command | default('') }}"
  tasks:
    - name: A command was given
      ansible.builtin.assert:
        that: (the_command | trim) != ''
        fail_msg: No command given. Nothing was run.
        quiet: true

    # What runs, in the log before it runs anywhere; secret-shaped values are
    # redacted (a value after a password/token/secret/key/credentials name, an
    # Authorization header's value, a user:password after -u/--user,
    # NetBox/GitHub/Dockhand tokens, a private key block). No backslashes in these patterns: through YAML and Jinja they
    # stop matching.
    - name: The command (secrets redacted)
      ansible.builtin.debug:
        msg: "{{ the_command
          | regex_replace('(?i)((pass(word|wd)?|token|secret|api[_-]?key|credentials?)[a-z_]*[ ]*[=:][ ]*)[^ ;&|\"\n]+', '\\1<redacted>')
          | regex_replace('(?i)(authorization:[ ]*(bearer|basic|token)[ ]+)[^ \"\n]+', '\\1<redacted>')
          | regex_replace('((^| )(-u|--user)[ ]+[^ :]+:)[^ ;&|\"\n]+', '\\1<redacted>')
          | regex_replace('(nbt|ghp|gho|ghs|dh)_[A-Za-z0-9_.]+', '<redacted>')
          | regex_replace('(?s)-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----', '<redacted private key>')
          | split('\n') }}"

    - name: Keep it for the hosts
      ansible.builtin.set_fact:
        run_the_command: "{{ the_command }}"

- name: Run the command
  hosts: targets
  gather_facts: false
  tasks:
    - name: Run it
      ansible.builtin.raw: "{{ hostvars['semaphore'].run_the_command }}"
      register: run_result
      timeout: "{{ run_timeout | default(300) | int }}"
      failed_when: false
      changed_when: false

    - name: Its output
      ansible.builtin.debug:
        msg:
          rc: "{{ run_result.rc | default('not run') }}"
          output: "{{ run_result.stdout_lines | default([]) }}"
      when: not ansible_check_mode

    - name: It exited 0
      ansible.builtin.assert:
        that: run_result.rc | default(0) == 0
        fail_msg: "Exited {{ run_result.rc }} (its output is above)."
        quiet: true
      when: not ansible_check_mode
