# Kea's high-availability pair (old-queues/QUEUE-kea-ha.md): the primary on one Docker VM,
# the hot-standby partner on another (docker/kea-standby/). Writes each host's
# site files, the part of Kea's configuration that never goes in git:
#
#   standby  /opt/kea/site/site.json and api-credentials, copied from the
#            primary's (the same subnets, reservations database and API login)
#   both     /opt/kea/site/api-password (the API login's password, which each
#            peer sends the other) and /opt/kea/site/ha.json (this server's name
#            in the pair and both peers' API addresses, their NetBox primary IPs)
#
# Then on each host it checks the pair's configuration, docker/kea/
# kea-dhcp4.conf as main has it, with Kea's own config test against the files
# just written, and reports. A Kea whose files changed reloads them through its
# API (config-reload); none is restarted. Dockhand redeploys the primary's stack
# when kea-dhcp4.conf changes, and deploys the standby's.
#
# Inputs (the template's survey, target "Variable"): kea_primary and kea_standby,
# the two hosts' inventory names. Secrets are read and written with no_log.
#
# With kea_db_verify_ca: true it also makes both Keas verify kea-db's server
# certificate (old-queues/QUEUE-kea-ha.md): the kea-db CA's public certificate, read from the
# cluster (a cert-manager CertificateRequest's status.ca in the kea namespace, which
# holds no key; the Role is kubernetes/prod/services/kea/kea/app/rbac-semaphore.yaml),
# goes to /opt/kea/site/kea-db-ca.pem on each host, and the site file's
# hosts-databases get "ssl-mode": "verify-ca" and "trust-anchor" pointing at it
# (kea-db-init takes its PGSSLROOTCERT from the same entry, docker/kea/compose.yaml).
# That needs the "k8s and Talos Connection" variable group on the template. The
# hosts then go one at a time: a Kea whose files changed reloads them, then must
# read a reservation page from the database; one that can't gets its previous site
# file back, reloads again, and the run stops before the other host.
#
# In check mode (--check) it reports what it would write and changes nothing.

- ansible.builtin.import_playbook: _semaphore-host.yml

- name: The kea-db CA's certificate, from the cluster
  hosts: semaphore
  gather_facts: false
  tasks:
    - name: Read it, removing the API's CA file whatever happens
      when: kea_db_verify_ca | default(false) | bool
      block:
        - name: The Kubernetes API's address, token and CA certificate
          ansible.builtin.include_tasks: tasks/k8s-connection.yml

        - name: Read the kea namespace's CertificateRequests
          ansible.builtin.uri:
            url: "{{ k8s_api_url }}/apis/cert-manager.io/v1/namespaces/kea/certificaterequests"
            headers:
              Authorization: "Bearer {{ k8s_token }}"
            ca_path: "{{ playbook_dir }}/.k8s-ca.pem"
            return_content: true
          register: kea_crs
          check_mode: false
          no_log: true

        # The newest ready request for kea-db's server certificate: its status.ca is
        # the CA that signed what kea-db serves.
        - name: Settle the CA's certificate
          ansible.builtin.set_fact:
            kea_db_ca_pem: >-
              {% set found = [] %}{%
              for c in kea_crs.json['items']
                if (c.metadata.annotations | default({}))['cert-manager.io/certificate-name'] | default('') == 'kea-db-server-tls'
                and (c.status | default({})).ca | default('') | length > 0
                and ((c.status | default({})).conditions | default([]) | selectattr('type', 'equalto', 'Ready')
                     | selectattr('status', 'equalto', 'True') | list) %}{%
                set _ = found.append(c) %}{% endfor %}{{
              ((found | sort(attribute='metadata.creationTimestamp') | last).status.ca | b64decode)
              if found else '' }}

        - name: It's one certificate, and no key
          ansible.builtin.assert:
            that:
              - kea_db_ca_pem is search('^-----BEGIN CERTIFICATE-----')
              - kea_db_ca_pem.split('-----BEGIN CERTIFICATE-----') | length == 2
              - kea_db_ca_pem is not search('PRIVATE KEY')
            fail_msg: kea-db-server-tls has no ready CertificateRequest with one CA certificate; nothing was written.
            quiet: true
      always:
        - name: Remove the Kubernetes CA certificate file
          ansible.builtin.include_tasks: tasks/local-tools-cleanup.yml
          when: kea_db_verify_ca | default(false) | bool

- name: The pair is named and the primary's files read
  hosts: "{{ kea_primary | default('none') }}"
  gather_facts: false
  tasks:
    - name: Two different hosts, both in the inventory
      ansible.builtin.assert:
        that:
          - kea_standby is defined and kea_standby in groups['all']
          - kea_standby != inventory_hostname
          - hostvars[kea_standby].primary_ip4 is defined and primary_ip4 is defined
        fail_msg: "Set kea_primary and kea_standby to two inventory hosts with NetBox primary addresses; nothing was written."
        quiet: true

    - name: Read the primary's site file
      ansible.builtin.slurp:
        path: /opt/kea/site/site.json
      register: site_json

    - name: Read the primary's API login
      ansible.builtin.slurp:
        path: /opt/kea/site/api-credentials
      register: api_credentials
      no_log: true

    - name: The login is one user:password line
      ansible.builtin.assert:
        that: (api_credentials.content | b64decode | trim).split(':') | length >= 2
        fail_msg: "/opt/kea/site/api-credentials isn't one user:password line; nothing was written."
        quiet: true
      no_log: true

    # The site file is a JSON fragment Kea includes inside Dhcp4 (docker/kea/
    # kea-dhcp4.conf). With kea_db_verify_ca, every hosts-databases entry verifies
    # kea-db's certificate against the CA file the next play writes.
    - name: The site file, with verify-ca if asked for
      ansible.builtin.set_fact:
        kea_site_obj: "{{ ('{' ~ ((site_json.content | b64decode) | trim | regex_replace(',\\s*$', '')) ~ '}') | from_json }}"
      no_log: true

    - name: Render it
      ansible.builtin.set_fact:
        kea_site_new: >-
          {% if kea_db_verify_ca | default(false) | bool %}{%
            set dbs = [] %}{% for d in kea_site_obj['hosts-databases'] %}{%
              set _ = dbs.append(d | combine({'ssl-mode': 'verify-ca',
                                              'trust-anchor': '/etc/kea/site/kea-db-ca.pem'})) %}{% endfor %}{{
            (kea_site_obj | combine({'hosts-databases': dbs})
             | to_nice_json(indent=2, sort_keys=False))[2:-2] }}{{
            ',' if (site_json.content | b64decode | trim).endswith(',') else '' }}{%
          else %}{{ site_json.content | b64decode }}{% endif %}
        kea_first_subnet: "{{ (kea_site_obj['subnet4'] | default([{}]) | first).id | default(0) }}"
      no_log: true

    - name: Settle the pair
      ansible.builtin.set_fact:
        kea_pair:
          primary: "{{ inventory_hostname }}"
          standby: "{{ kea_standby }}"
          primary_ip: "{{ primary_ip4 | string | split('/') | first }}"
          standby_ip: "{{ hostvars[kea_standby].primary_ip4 | string | split('/') | first }}"
          api_user: "{{ (api_credentials.content | b64decode | trim).split(':', 1)[0] }}"
          api_password: "{{ (api_credentials.content | b64decode | trim).split(':', 1)[1] }}"
          site_json: "{{ kea_site_new }}"
          verify_ca: "{{ kea_db_verify_ca | default(false) | bool }}"
          first_subnet: "{{ kea_first_subnet }}"
      no_log: true

- name: Each host's site files
  hosts: "{{ (kea_primary | default('none')) ~ ',' ~ (kea_standby | default('none')) }}"
  gather_facts: false
  # One host at a time, the run stopping at the first that fails: a database TLS
  # change one Kea can't use is found, and undone, before the other runs it.
  serial: 1
  max_fail_percentage: 0
  vars:
    pair: "{{ hostvars[kea_primary].kea_pair }}"
    role: "{{ 'primary' if inventory_hostname == pair.primary else 'standby' }}"
    image: docker.cloudsmith.io/isc/docker/kea-dhcp4:3.2.1
  tasks:
    - name: The folders
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - {path: /opt/kea/site, mode: "0700"}
        - {path: /opt/kea/lib, mode: "0755"}

    - name: The kea-db CA's certificate
      ansible.builtin.copy:
        dest: /opt/kea/site/kea-db-ca.pem
        content: "{{ hostvars['semaphore'].kea_db_ca_pem | trim }}\n"
        mode: "0644"
      when: pair.verify_ca | bool
      register: ca_written

    # The standby's is the primary's; the primary's changes only for verify-ca. The
    # copy replaced is kept beside it (backup), for the check after the reload.
    - name: The site file
      ansible.builtin.copy:
        dest: /opt/kea/site/site.json
        content: "{{ pair.site_json }}"
        mode: "0644"
        backup: true
      when: role == 'standby' or pair.verify_ca | bool
      register: site_written
      no_log: true

    - name: The standby's API login, the primary's
      ansible.builtin.copy:
        dest: /opt/kea/site/api-credentials
        content: "{{ pair.api_user }}:{{ pair.api_password }}\n"
        mode: "0600"
      when: role == 'standby'
      no_log: true

    - name: The password each peer sends the other
      ansible.builtin.copy:
        dest: /opt/kea/site/api-password
        content: "{{ pair.api_password }}"
        mode: "0600"
      register: password_written
      no_log: true

    - name: This server's place in the pair
      ansible.builtin.copy:
        dest: /opt/kea/site/ha.json
        mode: "0644"
        content: |
          "high-availability": [
            {
              "this-server-name": "{{ role }}",
              "mode": "hot-standby",
              "heartbeat-delay": 10000,
              "max-response-delay": 60000,
              "max-ack-delay": 5000,
              "max-unacked-clients": 0,
              "multi-threading": {
                "enable-multi-threading": true,
                "http-dedicated-listener": false
              },
              "peers": [
                {
                  "name": "primary",
                  "url": "http://{{ pair.primary_ip }}:8000/",
                  "role": "primary",
                  "auto-failover": true,
                  "basic-auth-user": "{{ pair.api_user }}",
                  "basic-auth-password-file": "/etc/kea/site/api-password"
                },
                {
                  "name": "standby",
                  "url": "http://{{ pair.standby_ip }}:8000/",
                  "role": "standby",
                  "auto-failover": true,
                  "basic-auth-user": "{{ pair.api_user }}",
                  "basic-auth-password-file": "/etc/kea/site/api-password"
                }
              ]
            }
          ]
      register: ha_written

    - name: The pair's configuration, as main has it
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/d4rkeagle65/k8s-homelab/main/docker/kea/kea-dhcp4.conf
        dest: /tmp/kea-dhcp4.conf.check
        mode: "0644"
        force: true
      check_mode: false

    - name: Kea's own test of it, with these files
      ansible.builtin.command:
        argv: [docker, run, --rm, -v, /opt/kea/site:/etc/kea/site:ro, -v, /tmp/kea-dhcp4.conf.check:/etc/kea/kea-dhcp4.conf:ro,
               "{{ image }}", kea-dhcp4, -t, /etc/kea/kea-dhcp4.conf]
      register: kea_test
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} is the {{ role }}; Kea's config test:
          {{ ('passed' if kea_test.rc == 0 else 'FAILED: ' ~ (kea_test.stdout ~ kea_test.stderr)[-600:])
             if kea_test is not skipped else 'not run (check mode)' }}

    - name: The configuration passed
      ansible.builtin.assert:
        that: kea_test.rc == 0
        fail_msg: "Kea's config test failed on {{ inventory_hostname }} (above); its running Kea is unchanged."
        quiet: true
      when: not ansible_check_mode

    # A running Kea reads its site files only at start or on config-reload: one
    # whose files just changed reloads them (through its API on the host), so the
    # standby never runs an old copy of the primary's subnets.
    - name: Is this host's Kea running
      ansible.builtin.command:
        argv: [docker, inspect, -f, "{{ '{{' }}.State.Running{{ '}}' }}", kea-dhcp4]
      register: kea_running
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Reload Kea's configuration where its files changed
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: POST
        body_format: json
        body: {command: config-reload}
        url_username: "{{ pair.api_user }}"
        url_password: "{{ pair.api_password }}"
        force_basic_auth: true
        return_content: true
      register: reload
      when:
        - not ansible_check_mode
        - kea_running.stdout | default('') == 'true'
        - site_written is changed or password_written is changed or ha_written is changed or ca_written is changed
      changed_when: true
      no_log: true

    - name: The reload took
      ansible.builtin.assert:
        that: (reload.json | first).result == 0
        fail_msg: "Kea on {{ inventory_hostname }} refused config-reload: {{ (reload.json | first).text | default('?') }}"
        quiet: true
      when: reload is not skipped

    # With verify-ca, a reload succeeds even when the database refuses the new TLS
    # (Kea serves on and retries it), so the database itself is asked: a page of the
    # first subnet's reservations answers 0 (found) or 3 (none), never 1 (no database).
    - name: Kea reads its reservations from the database
      ansible.builtin.uri:
        url: http://127.0.0.1:8000/
        method: POST
        body_format: json
        body: "{{ {'command': 'reservation-get-page', 'arguments': {'subnet-id': pair.first_subnet | int, 'limit': 1}} }}"
        url_username: "{{ pair.api_user }}"
        url_password: "{{ pair.api_password }}"
        force_basic_auth: true
        return_content: true
      register: db_read
      when: pair.verify_ca | bool and reload is not skipped
      failed_when: false
      no_log: true

    - name: If it can't, the previous site file back, and stop
      when: db_read is not skipped and ((db_read.json | default([{}]) | first).result | default(1)) not in [0, 3]
      block:
        - name: Restore the site file it ran before
          ansible.builtin.copy:
            src: "{{ site_written.backup_file }}"
            dest: /opt/kea/site/site.json
            remote_src: true
            mode: "0644"
          when: site_written.backup_file is defined

        - name: Reload it
          ansible.builtin.uri:
            url: http://127.0.0.1:8000/
            method: POST
            body_format: json
            body: {command: config-reload}
            url_username: "{{ pair.api_user }}"
            url_password: "{{ pair.api_password }}"
            force_basic_auth: true
          no_log: true

        - name: Stop before the other host
          ansible.builtin.fail:
            msg: >-
              Kea on {{ inventory_hostname }} couldn't read its reservations with verify-ca
              ({{ (db_read.json | default([{}]) | first).text | default('no answer') }}); its previous
              site file is back and reloaded. Its log says why: docker logs kea-dhcp4.

    - name: Report the database's TLS
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ 'verify-ca; its reservations read from the database'
             if db_read is not skipped else ('verify-ca would be set (check mode)' if ansible_check_mode
             else 'not reloaded (its files were already so, or its Kea is not running)') }}
      when: pair.verify_ca | bool
