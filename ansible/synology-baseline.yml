# The Synology's own baseline (DSM, not Debian: baseline.yml is for those).
# For now: the web bastion's SSH key, Docker, as Synology's own package, and
# Dockhand's Hawser agent, so Dockhand deploys the NAS's stacks (docker/CLAUDE.md)
# as it does the Docker VM's.
#
# The bastion's keys: tasks/nas-bastion-keys.yml, for the account nas_bastion_user (by
# default the login below).
#
# DSM's Docker is a package from its Package Center: Container Manager from
# DSM 7.2, Docker before it (synology_docker_package overrides the choice). It's
# installed with synopkg from Synology's server, started, and read back from the
# Docker daemon itself. Each step that runs as root sets DSM's own PATH first
# (nas_path, /etc/profile's): an SSH session that isn't a login has only
# /usr/bin:/bin:/usr/sbin:/sbin, sudo keeps it (DSM sets no secure_path), and the
# package's scripts call synoshare and the like by name, so without it Docker's
# install fails with "failed to create docker share". The package keeps its data
# in a `docker` shared folder; a missing one is made first, on
# synology_docker_volume (default /volume1), the way the other shares are (empty
# user lists, DSM's ACLs), and read back, as the install that worked by hand had
# it. Should the install still fail, it prints DSM's reason and says to install
# the package from Package Center once; the next run finds it and goes on. DSM
# has no apt, and nothing here needs Python on the NAS: every step is one `raw`
# script.
#
# Inventory: the NetBox one; the `synology` group is the NetBox tag. The login is
# the host's ansible_user (its local config context), an administrator with
# passwordless sudo through a sudoers.d file made by hand, which a DSM update may
# remove; the first step says so when sudo asks for a password.
#
# Hawser: tasks/nas-hawser.yml (docker-host.yml's header says how the token is
# made), its stacks on the data volume (synology_hawser_stacks, default
# /volume1/docker/hawser-stacks): DSM's system partition is small and an update
# may reset it.
#
# In check mode (--check) it reports DSM's version, the package, whether
# Docker answers and what Hawser would change, and changes nothing.

- ansible.builtin.import_playbook: select-hosts.yml
  vars:
    select_from: synology

- name: The Synology's baseline
  hosts: targets
  gather_facts: false
  vars_files: [vars/hawser.yml]
  vars:
    nas_docker: /usr/local/bin/docker
    hawser_token: "{{ lookup('ansible.builtin.env', 'HAWSER_TOKEN') }}"
    hawser_stacks: "{{ synology_hawser_stacks | default('/volume1/docker/hawser-stacks') }}"
    # DSM's /etc/profile PATH, which a non-login SSH session lacks.
    nas_path: /sbin:/bin:/usr/sbin:/usr/bin:/usr/syno/sbin:/usr/syno/bin:/usr/local/sbin:/usr/local/bin
  tasks:
    # Without become: a sudo that asks for a password would otherwise fail
    # every later step with Ansible's generic "missing sudo password".
    - name: This is DSM 7 or later, with passwordless sudo
      ansible.builtin.raw: |
        [ -r /etc.defaults/VERSION ] || { echo "ERROR not DSM: no /etc.defaults/VERSION"; exit 1; }
        . /etc.defaults/VERSION
        echo "DSM=$productversion"
        echo "MAJOR=$majorversion"
        echo "MINOR=$minorversion"
        echo "BUILD=$buildnumber"
        echo "MODEL=$(sed -n 's/^upnpmodelname="\(.*\)"$/\1/p' /etc/synoinfo.conf | head -1)"
        echo "ARCH=$(uname -m)"
        echo "MEM_MB=$(awk '/^MemTotal:/ {print int($2/1024)}' /proc/meminfo)"
        if sudo -n true 2>/dev/null; then echo "SUDO=ok"; else echo "SUDO=password"; fi
      register: dsm_raw
      changed_when: false
      check_mode: false
      failed_when: dsm_raw.rc != 0 or 'ERROR' in dsm_raw.stdout

    - name: Read DSM's facts
      ansible.builtin.set_fact:
        # KEY=value lines; no value holds an "=".
        dsm: "{{ dict(dsm_raw.stdout_lines | select('search', '^[A-Z_]+=') | map('split', '=')) }}"

    - name: DSM is new enough and sudo needs no password
      ansible.builtin.assert:
        that:
          - dsm.MAJOR | int >= 7
          - dsm.SUDO == 'ok'
        fail_msg: >-
          {{ inventory_hostname }}: DSM {{ dsm.DSM }}, sudo {{ dsm.SUDO }}.
          {{ 'DSM 7 or later is needed (synopkg install_from_server). ' if dsm.MAJOR | int < 7 else '' }}
          {{ 'sudo asked for a password: the sudoers.d file for ' ~ (ansible_user | default('the login')) ~
             ' is gone (a DSM update removes it); recreate it as root, then check with sudo -k; sudo -n true.'
             if dsm.SUDO != 'ok' else '' }}
        quiet: true

    - name: The web bastion's SSH keys
      ansible.builtin.include_tasks: tasks/nas-bastion-keys.yml

    # Prints one CHANGE line per change, then VERIFIED with the daemon's version
    # (UNVERIFIED in check mode while the package is missing or stopped).
    - name: Docker, as Synology's package
      ansible.builtin.raw: |
        PATH={{ nas_path | quote }}; export PATH
        dry={{ 1 if ansible_check_mode else 0 }}
        pkg='{{ synology_docker_package | default('ContainerManager' if dsm.MAJOR | int > 7 or (dsm.MAJOR | int == 7 and dsm.MINOR | int >= 2) else 'Docker') }}'
        synopkg=/usr/syno/bin/synopkg
        docker=/usr/local/bin/docker
        pending=0
        installed() {
          # A version, or nothing: synopkg's answer for a missing package isn't one.
          v=$($synopkg version "$pkg" 2>/dev/null || true)
          case "$v" in [0-9]*) echo "$v" ;; esac
        }
        answers() {
          server=$($docker version --format '{% raw %}{{.Server.Version}}{% endraw %}' 2>/dev/null) && [ -n "$server" ]
        }
        ver=$(installed)
        synoshare=/usr/syno/sbin/synoshare
        share_vol={{ synology_docker_volume | default('/volume1') | quote }}
        if [ -z "$ver" ] && ! $synoshare --get docker >/dev/null 2>&1; then
          [ -d "$share_vol" ] || { echo "ERROR $share_vol doesn't exist (synology_docker_volume)"; exit 1; }
          echo "CHANGE make the shared folder docker at $share_vol/docker (the package's wizard would)"
          pending=1
          if [ "$dry" = 0 ]; then
            $synoshare --add docker "Docker's data" "$share_vol/docker" "" "" "" 0 0 >/dev/null ||
              { echo "ERROR synoshare --add docker failed"; exit 1; }
            $synoshare --get docker | grep -qF "[$share_vol/docker]" ||
              { echo "ERROR the docker share doesn't read back at $share_vol/docker"; exit 1; }
          fi
        fi
        if [ -z "$ver" ]; then
          echo "CHANGE install $pkg from Synology's package server"
          pending=1
          if [ "$dry" = 0 ]; then
            if ! $synopkg install_from_server "$pkg"; then
              echo "ERROR synopkg install_from_server $pkg failed; DSM's log says:"
              grep -F "$pkg" /var/log/messages | grep -v pkg_version | tail -n 3 | sed 's/^/  /'
              echo "ERROR install $pkg once from Package Center, then run this again: it finds it and goes on"
              exit 1
            fi
            ver=$(installed)
            [ -n "$ver" ] || { echo "ERROR $pkg isn't installed after install_from_server"; exit 1; }
          fi
        fi
        echo "PACKAGE $pkg ${ver:-not installed}"
        # Running means the daemon answers, whatever the package says.
        if [ -n "$ver" ] && ! answers; then
          echo "CHANGE start $pkg"
          pending=1
          [ "$dry" = 1 ] || $synopkg start "$pkg" || { echo "ERROR synopkg start $pkg failed"; exit 1; }
        fi
        if [ "$dry" = 1 ] && [ "$pending" = 1 ]; then
          echo "UNVERIFIED until the changes above are made (check mode)"
          exit 0
        fi
        # The daemon takes a few seconds to answer after the package starts.
        i=0
        until answers; do
          i=$((i + 1))
          [ "$i" -le 30 ] || { echo "ERROR the Docker daemon doesn't answer ($docker version)"; exit 1; }
          sleep 2
        done
        if $docker compose version >/dev/null 2>&1; then compose="docker compose $($docker compose version --short 2>/dev/null)"
        elif [ -x /usr/local/bin/docker-compose ]; then compose="docker-compose $(/usr/local/bin/docker-compose version --short 2>/dev/null)"
        else compose=none; fi
        echo "VERIFIED Docker $server answers; compose: $compose; data root $($docker info --format '{% raw %}{{.DockerRootDir}}{% endraw %}' 2>/dev/null)"
      become: true
      register: docker_pkg
      changed_when: "'CHANGE' in docker_pkg.stdout"
      failed_when: docker_pkg.rc != 0 or 'ERROR' in docker_pkg.stdout
      # raw is skipped in check mode unless told otherwise; the script itself
      # changes nothing then.
      check_mode: false

    - name: Hawser, Dockhand's agent
      ansible.builtin.include_tasks: tasks/nas-hawser.yml

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ dsm.MODEL }} ({{ dsm.ARCH }}, {{ dsm.MEM_MB }} MB) on DSM
          {{ dsm.DSM }} build {{ dsm.BUILD }};
          bastion keys: {{ bastion_keys.stdout_lines | select('search', '^(CHANGE|VERIFIED|UNVERIFIED)') | join('; ') }};
          {{ docker_pkg.stdout_lines | select('search', '^(CHANGE|PACKAGE|VERIFIED|UNVERIFIED)') | join('; ') }};
          Hawser {{ 'not set up (no HAWSER_TOKEN)' if hawser_raw is skipped else
          (hawser_raw.stdout_lines | select('search', '^(CHANGE|VERIFIED|UNVERIFIED)') | join('; ')) }}
