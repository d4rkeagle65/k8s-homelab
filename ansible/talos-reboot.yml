# Reboots Talos VMs one at a time through Proxmox, which stops each VM and starts it again, so
# a change Proxmox holds pending (memory, cores, a disk) takes effect; a reboot from inside
# Talos keeps the same VM process and doesn't. For each VM, in the order given: every node
# Ready, every database cluster whole and etcd whole and caught up first, its pods checked to
# fit elsewhere; then out of service (database primaries switched over, cordon, drain), the
# Proxmox reboot, the node back Ready on a new boot with nothing left pending, uncordoned,
# every database cluster whole, and for a control plane its static pods Ready and etcd caught
# up again, before the next (tasks/talos-vm-reboot.yml). A failed step stops the run and says
# what it left cordoned.
#
# Built as talos-upgrade.yml is (its header says how): semaphore plans, each VM is a host of
# its own named for its node, so every line of its work reads [node] (its Proxmox calls
# [node -> Proxmox host]), and semaphore cleans up.
#
# Which VMs: target_hosts (required), VM IDs or names,
# separated by commas or spaces, rebooted in that order; ALL (any case) for every Talos VM,
# control planes first. They're found in Proxmox and the cluster, not the inventory, so this
# reads target_hosts itself rather than through select-hosts.yml. Each must be a
# Proxmox VM whose name is a Talos node's. ALL holds Flux on its current revision until the run
# ends, however it ends (tasks/flux-freeze.yml): what's merged meanwhile deploys afterwards.
#
# Inventory: the proxmox group (its first host makes the pvesh calls, for the whole Proxmox
# cluster). Variables: the Kubernetes variable group (k8s_api_url, k8s_ca_b64, k8s_token) and
# talosconfig_b64, as for talos-upgrade.yml. Optional: reboot_shutdown_timeout, the seconds
# Proxmox waits for the guest to shut down before failing the reboot (default 300).
#
# In check mode (--check) it reports each VM's node, host, HA state and pending changes, runs
# the checks (etcd's included) and lists what it would drain, and changes nothing.

- ansible.builtin.import_playbook: require-hosts.yml
  vars:
    required_group: proxmox

- name: Plan the reboots
  hosts: semaphore
  gather_facts: false
  vars_files: [vars/talos.yml]
  vars:
    pve_api_host: "{{ groups['proxmox'] | first }}"
    vm_selection: "{{ target_hosts | default('') | string | trim }}"
  tasks:
    - name: Check and plan, cleaning up if that fails
      block:
        - name: target_hosts names the VMs to reboot
          ansible.builtin.assert:
            that: vm_selection | length > 0
            fail_msg: >-
              target_hosts is unset: the VM IDs or names to reboot, separated by commas or spaces,
              or ALL for every Talos VM. Nothing was run.
            quiet: true

        - name: Decode the Kubernetes CA certificate
          ansible.builtin.set_fact:
            k8s_ca_pem: "{{ k8s_ca_b64 | regex_replace('\\s', '') | b64decode }}"

        - name: The CA certificate is one
          ansible.builtin.assert:
            that: k8s_ca_pem is search('-----BEGIN CERTIFICATE-----')
            fail_msg: >-
              k8s_ca_b64 doesn't decode to a certificate: it takes the base64 text of the
              token Secret's ca.crt, as stored, not decoded (ansible/README.md).
            quiet: true

        - name: Write the Kubernetes CA certificate for the API checks
          ansible.builtin.copy:
            content: "{{ k8s_ca_pem }}"
            dest: "{{ playbook_dir }}/.k8s-ca.pem"
            mode: "0600"
          check_mode: false

        - name: Set up kubectl
          ansible.builtin.include_tasks: tasks/kubectl-local.yml

        - name: Set up talosctl {{ talos_version }}
          ansible.builtin.include_tasks: tasks/talosctl-local.yml

        - name: Read the nodes
          ansible.builtin.command: "{{ kubectl_cmd }} get nodes -o json"
          register: reboot_nodes_json
          changed_when: false
          check_mode: false

        - name: Read the Proxmox cluster's guests
          ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
          delegate_to: "{{ pve_api_host }}"
          register: reboot_guests_json
          changed_when: false
          check_mode: false

        - name: Read Proxmox HA's resources
          ansible.builtin.command: pvesh get /cluster/ha/resources --output-format json
          delegate_to: "{{ pve_api_host }}"
          register: reboot_ha_json
          changed_when: false
          check_mode: false

        - name: Keep the Talos nodes, the VMs and HA's
          ansible.builtin.set_fact:
            talos_by_name: >-
              {% set out = {} %}{% for n in (reboot_nodes_json.stdout | from_json)['items']
                 if n.status.nodeInfo.osImage is search('^Talos') %}{%
                set _ = out.update({n.metadata.name: {'name': n.metadata.name,
                  'address': (n.status.addresses | selectattr('type', 'equalto', 'InternalIP') | first).address,
                  'control_plane': 'node-role.kubernetes.io/control-plane' in n.metadata.labels}}) %}{%
              endfor %}{{ out }}
            reboot_qemu: "{{ reboot_guests_json.stdout | from_json | selectattr('type', 'equalto', 'qemu') | list }}"
            reboot_ha_sids: "{{ reboot_ha_json.stdout | from_json | map(attribute='sid') | list }}"

        - name: Keep the control planes' addresses, for etcd
          ansible.builtin.set_fact:
            talos_cp_addresses: >-
              {{ talos_by_name.values() | selectattr('control_plane') | map(attribute='address') | sort | list }}

        - name: Read target_hosts
          ansible.builtin.set_fact:
            reboot_tokens: >-
              {% if vm_selection | lower == 'all' %}{{
                reboot_qemu | selectattr('name', 'in', talos_by_name.keys() | list) | map(attribute='name')
                | map('extract', talos_by_name) | sort(attribute='name')
                | sort(attribute='control_plane', reverse=true) | map(attribute='name') | list }}{%
              else %}{{ vm_selection | regex_replace('[,\s]+', ' ') | trim | split(' ') }}{% endif %}

        - name: Match each to its VM and Talos node
          ansible.builtin.set_fact:
            reboot_plan: >-
              {% set out = [] %}{% for t in reboot_tokens %}{%
                set g = reboot_qemu | selectattr('vmid', 'equalto', t | int) | list if t is match('^[0-9]+$')
                        else reboot_qemu | selectattr('name', 'equalto', t) | list %}{%
                if g | length == 1 and g[0].name in talos_by_name %}{%
                  set _ = out.append(talos_by_name[g[0].name] | combine({'vmid': g[0].vmid,
                    'host': g[0].node, 'ha': ('vm:' ~ g[0].vmid) in reboot_ha_sids})) %}{%
                endif %}{% endfor %}{{ out }}
            reboot_unknown: >-
              {% set out = [] %}{% for t in reboot_tokens %}{%
                set g = reboot_qemu | selectattr('vmid', 'equalto', t | int) | list if t is match('^[0-9]+$')
                        else reboot_qemu | selectattr('name', 'equalto', t) | list %}{%
                if not (g | length == 1 and g[0].name in talos_by_name) %}{% set _ = out.append(t) %}{% endif %}{%
              endfor %}{{ out }}

        - name: Every VM named is a Talos node's, and none twice
          ansible.builtin.assert:
            that:
              - reboot_unknown | length == 0
              - reboot_plan | length > 0
              - reboot_plan | map(attribute='vmid') | unique | list | length == reboot_plan | length
            fail_msg: >-
              target_hosts ({{ vm_selection }}): {{ ('not the VM of a Talos node: ' ~ reboot_unknown | join(', '))
              if reboot_unknown else 'a VM named twice, or none' }}. Nothing was rebooted.
            quiet: true

        - name: Read what Proxmox holds pending for each
          ansible.builtin.command: >-
            pvesh get /nodes/{{ vm.host }}/qemu/{{ vm.vmid }}/pending --output-format json
          delegate_to: "{{ pve_api_host }}"
          register: reboot_pending
          changed_when: false
          check_mode: false
          loop: "{{ reboot_plan }}"
          loop_control:
            loop_var: vm
            label: "{{ vm.vmid }}"

        - name: Report the plan
          ansible.builtin.debug:
            msg: >-
              {% set out = [] %}{% for r in reboot_pending.results %}{% set p = [] %}{%
                for i in r.stdout | from_json if i.pending is defined or i.delete is defined %}{%
                  set _ = p.append(i.key ~ (' removed' if i.delete is defined
                    else ' ' ~ i.value | default('unset') ~ ' -> ' ~ i.pending)) %}{%
                endfor %}{%
                set _ = out.append('VM ' ~ r.vm.vmid ~ ' ' ~ r.vm.name ~ ' ('
                  ~ ('control plane' if r.vm.control_plane else 'worker') ~ ') on ' ~ r.vm.host
                  ~ ', HA ' ~ ('yes' if r.vm.ha else 'no') ~ ', pending: ' ~ (p | join(', ') or 'nothing')) %}{%
              endfor %}{{ out }}

        - name: Hand each VM to the next play, as a host named for its node
          ansible.builtin.add_host:
            name: "{{ item.name }}"
            groups: talos_reboot_vms
            talos_vm: "{{ item }}"
            ansible_connection: local
            ansible_python_interpreter: "{{ ansible_playbook_python }}"
          loop: "{{ reboot_plan }}"
          loop_control:
            label: "{{ item.vmid }} {{ item.name }}"
          changed_when: false

        - name: Hold Flux while every Talos VM reboots
          ansible.builtin.include_tasks: tasks/flux-freeze.yml
          vars:
            kubectl_host: semaphore
          when: vm_selection | lower == 'all'

      rescue:
        - name: Lift the hold on Flux
          ansible.builtin.include_tasks: tasks/flux-thaw.yml
          vars:
            kubectl_host: semaphore

        - name: Remove the CA certificate, and kubectl and talosctl with their configs
          ansible.builtin.include_tasks: tasks/local-tools-cleanup.yml

        - name: Stop the run
          ansible.builtin.fail:
            msg: "{{ ansible_failed_result.msg | default('A step failed') }}"

- name: Reboot each VM, one at a time
  hosts: talos_reboot_vms
  serial: 1
  gather_facts: false
  vars_files: [vars/talos.yml]
  vars:
    pve_api_host: "{{ groups['proxmox'] | first }}"
    kubectl_cmd: "{{ hostvars['semaphore'].kubectl_cmd }}"
    # The node itself, as in talos-upgrade.yml: its kubectl steps read [node].
    kubectl_host: "{{ inventory_hostname }}"
    talosctl_cmd: "{{ hostvars['semaphore'].talosctl_cmd }}"
    talos_cp_addresses: "{{ hostvars['semaphore'].talos_cp_addresses }}"
  tasks:
    - name: Reboot it, unless a VM before it failed
      when: hostvars['semaphore'].talos_stopped_at is not defined
      block:
        - name: Flux is still held, if this run holds it
          ansible.builtin.include_tasks: tasks/flux-held.yml
          vars:
            flux_frozen: "{{ hostvars['semaphore'].flux_frozen | default(false) }}"

        - name: Reboot VM {{ talos_vm.vmid }} ({{ inventory_hostname }})
          ansible.builtin.include_tasks: tasks/talos-vm-reboot.yml

      rescue:
        - name: Record where the run stopped, so the VMs after it are left alone
          ansible.builtin.set_fact:
            talos_stopped_at: "VM {{ talos_vm.vmid }} ({{ inventory_hostname }}): {{ ansible_failed_result.msg | default('a step failed') }}"
          delegate_to: semaphore
          delegate_facts: true

- name: Clean up, and say whether every VM was rebooted
  hosts: semaphore
  gather_facts: false
  tasks:
    - name: Lift the hold on Flux
      ansible.builtin.include_tasks: tasks/flux-thaw.yml
      vars:
        kubectl_host: semaphore

    - name: Remove the CA certificate, and kubectl and talosctl with their configs
      ansible.builtin.include_tasks: tasks/local-tools-cleanup.yml

    - name: Every VM to reboot was rebooted
      ansible.builtin.assert:
        that: talos_stopped_at is not defined
        fail_msg: "The run stopped at {{ talos_stopped_at | default('') }}. The VMs after it were left as they were."
        success_msg: >-
          {{ 'Every VM planned passed its checks; none was rebooted (check mode).'
             if ansible_check_mode else 'Every VM planned was rebooted.' }}
