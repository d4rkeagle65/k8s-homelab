# One-off: writes the two Talos admin credentials, each base64 on one line, into
# root-only files on the one host target_hosts names, so the owner can save them
# (a Vaultwarden login of their own; talos/README.md):
#   /root/talosconfig.b64     the talosconfig Semaphore holds (TALOSCONFIG_B64,
#                             group_vars/all.yml), which Semaphore never shows back
#   /root/talos_secrets.b64   TALOS_SECRETS, the cluster's secrets bundle, rebuilt from a
#                             control plane's running machine config (talosctl gen secrets
#                             --from-controlplane-config) and checked: its Talos CA is the
#                             one that talosconfig trusts
# Nothing is printed: the tasks holding either value have no_log, and the checks
# show only their expressions. Mode 0600, root:root, read back by checksum.
#
# Template: this playbook, Run Command's inventory, the repository, the "k8s and
# Talos Connection" variable group; survey: target_hosts (one host). Afterwards:
# copy both off (`ssh <host> sudo cat /root/talos_secrets.b64 | clip.exe` from WSL),
# `shred -u` them on the host, delete the template, and a pull request removes this
# playbook.
#
# In check mode (--check) it builds and checks both on Semaphore, and writes nothing.

- ansible.builtin.import_playbook: select-hosts.yml
  vars:
    select_from: all
    select_required: true
    select_one: true

- name: Build the secrets bundle from a control plane
  hosts: semaphore
  gather_facts: false
  vars_files: [vars/talos.yml]
  tasks:
    - name: Build and check, cleaning up whatever happens
      block:
        - name: Set up talosctl {{ talos_version }}
          ansible.builtin.include_tasks: tasks/talosctl-local.yml

        - name: Read the talosconfig's context
          ansible.builtin.set_fact:
            tc_doc: "{{ talosconfig_b64 | regex_replace('\\s', '') | b64decode | from_yaml }}"
          no_log: true

        - name: Settle a control plane to read, and the CA the talosconfig trusts
          ansible.builtin.set_fact:
            tc_endpoint: "{{ tc_doc.contexts[tc_doc.context].endpoints | first }}"
            tc_ca: "{{ tc_doc.contexts[tc_doc.context].ca }}"
          no_log: true

        # Both write only to files, so what they print (an error) holds no secret: no
        # no_log, so a failure says why. The machine config comes from the
        # MachineConfig resource (its spec is the config as applied), or, failing that,
        # the file on the node.
        - name: Read the control plane's running machine config
          ansible.builtin.shell: >-
            umask 077 &&
            {{ talosctl_cmd }} -e {{ tc_endpoint }} -n {{ tc_endpoint }}
            get machineconfig v1alpha1 -o jsonpath='{.spec}' > {{ talos_dir }}/controlplane.yaml
            || {{ talosctl_cmd }} -e {{ tc_endpoint }} -n {{ tc_endpoint }}
            read /system/state/config.yaml > {{ talos_dir }}/controlplane.yaml
          changed_when: false
          check_mode: false

        - name: The machine config is a control plane's
          ansible.builtin.command: grep -qE '^ *type:[ ]*controlplane' {{ talos_dir }}/controlplane.yaml
          changed_when: false
          check_mode: false

        - name: Rebuild the secrets bundle from it
          ansible.builtin.shell: >-
            umask 077 &&
            {{ talosctl_cmd }} gen secrets
            --from-controlplane-config {{ talos_dir }}/controlplane.yaml
            -o {{ talos_dir }}/secrets.yaml
          changed_when: false
          check_mode: false

        - name: Read the bundle
          ansible.builtin.slurp:
            src: "{{ talos_dir }}/secrets.yaml"
          register: ts_raw
          no_log: true

        - name: The bundle's Talos CA is the one the talosconfig trusts
          ansible.builtin.assert:
            that:
              - (ts_raw.content | b64decode | from_yaml).certs.os.crt == tc_ca
              - (ts_raw.content | b64decode | from_yaml).certs.os.key | length > 0
            fail_msg: >-
              The rebuilt bundle's Talos CA isn't the talosconfig's, or has no key: nothing is
              written. Read the control plane's config by hand before trusting either.
            quiet: true

        - name: Keep both, base64 on one line, for the host
          ansible.builtin.set_fact:
            out_talos_secrets: "{{ ts_raw.content }}"
            out_talosconfig: "{{ talosconfig_b64 | regex_replace('\\s', '') }}"
          no_log: true
      always:
        - name: Remove talosctl, its talosconfig, the machine config and the bundle
          ansible.builtin.include_tasks: tasks/local-tools-cleanup.yml

- name: Write them on the host
  hosts: targets
  gather_facts: false
  become: true
  tasks:
    - name: Write /root/talosconfig.b64 and /root/talos_secrets.b64 (mode 0600)
      ansible.builtin.copy:
        content: "{{ hostvars['semaphore'][item.var] }}\n"
        dest: "/root/{{ item.file }}"
        owner: root
        group: root
        mode: "0600"
      loop:
        - {file: talosconfig.b64, var: out_talosconfig}
        - {file: talos_secrets.b64, var: out_talos_secrets}
      loop_control:
        label: "/root/{{ item.file }}"
      no_log: true

    - name: Read them back
      ansible.builtin.stat:
        path: "/root/{{ item.file }}"
        checksum_algorithm: sha256
      loop:
        - {file: talosconfig.b64, var: out_talosconfig}
        - {file: talos_secrets.b64, var: out_talos_secrets}
      loop_control:
        label: "/root/{{ item.file }}"
      register: written
      when: not ansible_check_mode

    - name: Each holds its value, mode 0600
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == '0600'
          - item.stat.checksum == (hostvars['semaphore'][item.item.var] ~ '\n') | hash('sha256')
        fail_msg: "/root/{{ item.item.file }} doesn't hold its value, or isn't 0600."
        quiet: true
      loop: "{{ written.results }}"
      loop_control:
        label: "/root/{{ item.item.file }}"
      when: not ansible_check_mode

    - name: Say what's there
      ansible.builtin.debug:
        msg: >-
          {{ written.results | map(attribute='stat') | map(attribute='path') | join(' and ') }} hold
          the talosconfig and TALOS_SECRETS ({{ written.results | map(attribute='stat') |
          map(attribute='size') | join(' and ') }} bytes, mode 0600). Copy them off, then shred -u
          them.
      when: not ansible_check_mode
