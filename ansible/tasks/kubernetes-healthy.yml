# The Kubernetes API server is ready and every node is Ready, read through
# Semaphore's read-only ServiceAccount (kubernetes/prod/system/cluster-access/).
# With k8s_wait set, it keeps asking for up to 15 minutes, for after a reboot.
- name: The API server is ready
  ansible.builtin.uri:
    url: "{{ k8s_api_url }}/readyz"
    headers:
      Authorization: "Bearer {{ k8s_token }}"
    ca_path: "{{ playbook_dir }}/.k8s-ca.pem"
    return_content: true
  register: readyz
  until: readyz.status == 200 and readyz.content == 'ok'
  retries: "{{ 90 if k8s_wait | default(false) else 0 }}"
  delay: 10
  check_mode: false
  no_log: true

- name: Read the nodes
  ansible.builtin.uri:
    url: "{{ k8s_api_url }}/api/v1/nodes"
    headers:
      Authorization: "Bearer {{ k8s_token }}"
    ca_path: "{{ playbook_dir }}/.k8s-ca.pem"
    return_content: true
  register: k8s_nodes
  no_log: true
  until: >-
    k8s_nodes.json is defined and
    (k8s_nodes.json['items'] | length) > 0 and
    (k8s_nodes.json['items'] | map(attribute='status.conditions') |
     map('selectattr', 'type', 'equalto', 'Ready') | map('first') |
     selectattr('status', 'ne', 'True') | list | length) == 0
  retries: "{{ 90 if k8s_wait | default(false) else 0 }}"
  delay: 10
  check_mode: false

- name: Every node is Ready
  ansible.builtin.assert:
    that: >-
      (k8s_nodes.json['items'] | map(attribute='status.conditions') |
       map('selectattr', 'type', 'equalto', 'Ready') | map('first') |
       selectattr('status', 'ne', 'True') | list | length) == 0
    fail_msg: "Not every Kubernetes node is Ready; stopping before the next host."
    quiet: true
