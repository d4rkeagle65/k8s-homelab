# Whether the pods on capacity_nodes fit on the other nodes, by memory
# requests as the scheduler counts them: what has to move (less DaemonSets,
# static pods, which belong to their node, and database instances, which stay
# with their node's disk) against what's free on every other node taking pods.
# A pod with a negative priority (homelab-low) neither needs room nor holds
# it: any other pod short of room evicts it, and it waits, down, until there's
# room again. Reports both, and those that would wait, and warns, not stops,
# when the rest don't fit either, since they then wait too. For
# proxmox-host-reboot.yml and talos-node-upgrade.yml; kubectl_cmd and
# kubectl_host from kubectl-local.yml.
- name: Read the nodes
  ansible.builtin.command: "{{ kubectl_cmd }} get nodes -o json"
  delegate_to: "{{ kubectl_host }}"
  register: capacity_nodes_json
  changed_when: false
  check_mode: false
  when: capacity_nodes | length > 0

- name: Read the pods
  ansible.builtin.command: "{{ kubectl_cmd }} get pods -A -o json"
  delegate_to: "{{ kubectl_host }}"
  register: capacity_pods_json
  changed_when: false
  check_mode: false
  when: capacity_nodes | length > 0

- name: Work out whether their pods fit elsewhere
  ansible.builtin.set_fact:
    capacity_room: >-
      {% set used = {} %}{% set moving = [0] %}{% set yielding = [0] %}{% set low = [] %}{%
      for p in (capacity_pods_json.stdout | from_json)['items']
         if p.status.phase | default('') in ['Running', 'Pending'] and p.spec.nodeName is defined %}{%
        set req = p.spec.containers | map(attribute='resources') | map('default', {}) |
                  map(attribute='requests', default={}) | map(attribute='memory', default='0') |
                  map('string') | map('regex_replace', 'i$', '') | map('upper') | map('human_to_bytes') | sum %}{%
        set is_low = p.spec.priority | default(0) < 0 %}{%
        if not is_low %}{% set _ = used.update({p.spec.nodeName: used.get(p.spec.nodeName, 0) + req}) %}{% endif %}{%
        if p.spec.nodeName in capacity_nodes
           and not p.metadata.ownerReferences | default([]) | map(attribute='kind')
                   | select('in', ['DaemonSet', 'Node']) | list
           and 'cnpg.io/cluster' not in p.metadata.labels | default({}) %}{%
          if is_low %}{% set _ = yielding.append(yielding.pop() + req) %}{%
            set _ = low.append(p.metadata.namespace ~ '/' ~ p.metadata.name) %}{%
          else %}{% set _ = moving.append(moving.pop() + req) %}{% endif %}{%
        endif %}{% endfor %}{% set free = [0] %}{%
      for n in (capacity_nodes_json.stdout | from_json)['items']
         if n.metadata.name not in capacity_nodes and not n.spec.unschedulable | default(false)
            and not n.spec.taints | default([]) | selectattr('effect', 'in', ['NoSchedule', 'NoExecute']) | list %}{%
        set _ = free.append(free.pop() + [0, (n.status.allocatable.memory | string | regex_replace('i$', '') | upper | human_to_bytes)
                                               - used.get(n.metadata.name, 0)] | max) %}{%
      endfor %}{{ {'moving': moving[0], 'free': free[0], 'low': yielding[0], 'low_pods': low} }}
  when: capacity_nodes | length > 0

- name: Report the room
  ansible.builtin.debug:
    msg:
      - >-
        {{ capacity_nodes | join(', ') }}: {{ '%.1f' % (capacity_room.moving / 1073741824) }} GiB of memory requests
        to move, {{ '%.1f' % (capacity_room.free / 1073741824) }} GiB free on the other nodes taking pods, counting
        what low-priority pods there hold as free.
      - >-
        Low priority, moving only if there's room left: {{ '%.1f' % (capacity_room.low / 1073741824) }} GiB
        ({{ capacity_room.low_pods | join(', ') or 'none' }}). Low-priority pods elsewhere are evicted
        if what moves needs their room.
  when: capacity_nodes | length > 0

- name: Warn when the pods here don't fit
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ capacity_nodes | join(', ') }}: their pods request {{ '%.1f' % (capacity_room.moving / 1073741824) }} GiB
      of memory and the other nodes have {{ '%.1f' % (capacity_room.free / 1073741824) }} GiB free, even with every
      low-priority pod evicted, so some will wait, down, until these nodes are back. Going on.
  when: capacity_nodes | length > 0 and capacity_room.moving > capacity_room.free
