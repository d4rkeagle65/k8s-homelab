# LLDP on every host, so the switches see which host and interface is on each
# port. lldpd sends the interface's name as its port ID (`portidsubtype
# ifname`) rather than its MAC address, and runs at every boot. It reads
# /etc/lldpd.d/*.conf only when it starts, so a changed file restarts it; the
# setting is then read back from lldpd itself. Every run reports it.

- name: The lldpd package
  ansible.builtin.apt:
    name: lldpd
    state: present
  register: lldpd_package

- name: lldpd's configuration folder
  ansible.builtin.file:
    path: /etc/lldpd.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: lldpd_dir

# In check mode a host without the package has no folder yet to write into.
- name: Send the interface name as the port ID
  ansible.builtin.copy:
    dest: /etc/lldpd.d/port.conf
    content: |
      # From ansible/tasks/proxmox-lldpd.yml.
      configure lldp portidsubtype ifname
    owner: root
    group: root
    mode: "0644"
  register: lldpd_conf
  when: not (ansible_check_mode and lldpd_dir is changed)

# The package starts lldpd as it installs, before the file above exists, so a
# new file always means a restart. In check mode a host without the package
# has no unit yet to enable.
- name: lldpd running, and at every boot
  ansible.builtin.systemd_service:
    name: lldpd
    enabled: true
    state: "{{ 'restarted' if lldpd_conf is changed else 'started' }}"
  when: not (ansible_check_mode and lldpd_package is changed)

- name: Read lldpd's port ID setting
  ansible.builtin.command:
    argv: [lldpcli, -f, keyvalue, show, configuration]
  register: lldpd_config
  changed_when: false
  check_mode: false
  failed_when: false

- name: Report lldpd's port ID setting
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: lldpd port ID
      {{ (lldpd_config.stdout | regex_search('lldp-portid-type=(\S+)', '\1') or ['unknown (' ~ (lldpd_config.stderr | default('', true) | trim or 'lldpcli not run') ~ ')']) | first }};
      wanted ifname.

- name: lldpd sends the interface name
  ansible.builtin.assert:
    that:
      - lldpd_config.rc == 0
      - lldpd_config.stdout is search('lldp-portid-type=ifname$', multiline=True)
    fail_msg: >-
      {{ inventory_hostname }}: lldpd doesn't report portidsubtype ifname after its restart
      (lldpcli rc {{ lldpd_config.rc }}); check /etc/lldpd.d/port.conf and journalctl -u lldpd.
    quiet: true
  when: not ansible_check_mode
