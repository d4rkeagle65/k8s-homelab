# Reboots this Proxmox host without breaking either cluster, for
# proxmox-reboot.yml and proxmox-upgrade.yml:
#
# 1. Every Kubernetes node running here (a guest whose name is a node's) is
#    taken out of service: its database primaries switched to a replica on
#    another node, then cordoned and drained (k8s-node-drain.yml). Two control
#    planes on one host would take etcd's quorum down with it, so that stops
#    the run, and so do pods that wouldn't fit on the other nodes by their
#    memory requests (reboot_allow_pending: true accepts them waiting).
# 2. Every HA VM here leaves by HA maintenance mode on this node, which makes
#    HA move it where its rules allow (checked for room first,
#    evacuate-pick.yml); the VMs evacuate lists are live-migrated off
#    (evacuate-check.yml). Any other guest here is shut down with the host and
#    starts again at boot, and is listed first.
# 3. The host reboots once this host's DNS servers have others answering.
# 4. Afterwards: quorum, every Kubernetes node Ready, this host's nodes
#    uncordoned, every database cluster whole again, this host's DNS servers
#    answering, maintenance mode off (HA moves its VMs back where this node is
#    their preferred one), and the evacuated VMs moved back (unless
#    evacuate_return is false). A failed check stops the run, before the next host.
#
# Needs proxmox-guests.yml, dns-guests.yml (dns_here, dns_elsewhere, or both
# empty), evacuate_plan, kubectl_cmd and kubectl_host (kubectl-local.yml),
# and the CA at .k8s-ca.pem for kubernetes-healthy.yml.

- name: Start the list of database maintenance windows
  ansible.builtin.set_fact:
    cnpg_maintenance_all: []

- name: Plan the HA VMs' moves off this host
  ansible.builtin.include_tasks: evacuate-pick.yml

- name: Read the Kubernetes nodes
  ansible.builtin.command: "{{ kubectl_cmd }} get nodes -o json"
  delegate_to: "{{ kubectl_host }}"
  register: reboot_nodes_json
  changed_when: false
  check_mode: false

- name: Work out what runs here
  ansible.builtin.set_fact:
    reboot_k8s_here: "{{ reboot_here_running | map(attribute='name') | intersect(reboot_all_nodes | map(attribute='metadata.name')) }}"
    reboot_cp_here: >-
      {% set cps = [] %}{% for n in reboot_all_nodes
         if 'node-role.kubernetes.io/control-plane' in n.metadata.labels | default({}) %}{%
         set _ = cps.append(n.metadata.name) %}{% endfor %}{{ cps | intersect(reboot_here_running | map(attribute='name')) }}
    reboot_others_here: >-
      {{ reboot_here_running | map(attribute='name')
         | difference(reboot_all_nodes | map(attribute='metadata.name'))
         | difference(evacuate_plan | map(attribute='name')) | difference(ha_plan | map(attribute='name')) }}
  vars:
    reboot_all_nodes: "{{ (reboot_nodes_json.stdout | from_json)['items'] }}"
    reboot_here_running: "{{ pve_guests | selectattr('node', 'equalto', pve_node) | selectattr('status', 'equalto', 'running') | list }}"

- name: Report what the reboot does to it
  ansible.builtin.debug:
    msg:
      - "Kubernetes nodes to drain: {{ reboot_k8s_here or ['none'] }} (control planes: {{ reboot_cp_here or ['none'] }})"
      - "HA VMs, moved off by HA maintenance mode: {{ ha_plan | map(attribute='name') | list or ['none'] }}"
      - "Other VMs to move off first: {{ evacuate_plan | map(attribute='name') | list or ['none'] }}"
      - "Shut down and started again with the host, or moved by Proxmox HA: {{ reboot_others_here or ['none'] }}"

- name: At most one control plane here, so etcd keeps its quorum
  ansible.builtin.assert:
    that: reboot_cp_here | length <= 1
    fail_msg: >-
      {{ inventory_hostname }} runs the control planes {{ reboot_cp_here | join(', ') }}; rebooting it
      would take etcd's quorum down. Move one to another host first.
    quiet: true

# Memory requests, as the scheduler counts them: what has to move (pods on
# this host's nodes, less DaemonSets and database instances, which stay with
# their node's disk) against what's free on every other node taking pods.
- name: Read the pods
  ansible.builtin.command: "{{ kubectl_cmd }} get pods -A -o json"
  delegate_to: "{{ kubectl_host }}"
  register: reboot_pods_json
  changed_when: false
  check_mode: false
  when: reboot_k8s_here | length > 0

- name: Work out whether their pods fit elsewhere
  ansible.builtin.set_fact:
    reboot_room: >-
      {% set used = {} %}{% set moving = [0] %}{%
      for p in (reboot_pods_json.stdout | from_json)['items']
         if p.status.phase | default('') in ['Running', 'Pending'] and p.spec.nodeName is defined %}{%
        set req = p.spec.containers | map(attribute='resources') | map('default', {}) |
                  map(attribute='requests', default={}) | map(attribute='memory', default='0') |
                  map('string') | map('regex_replace', 'i$', '') | map('upper') | map('human_to_bytes') | sum %}{%
        set _ = used.update({p.spec.nodeName: used.get(p.spec.nodeName, 0) + req}) %}{%
        if p.spec.nodeName in reboot_k8s_here
           and 'DaemonSet' not in p.metadata.ownerReferences | default([]) | map(attribute='kind')
           and 'cnpg.io/cluster' not in p.metadata.labels | default({}) %}{%
          set _ = moving.append(moving.pop() + req) %}{%
        endif %}{% endfor %}{% set free = [0] %}{%
      for n in (reboot_nodes_json.stdout | from_json)['items']
         if n.metadata.name not in reboot_k8s_here and not n.spec.unschedulable | default(false)
            and not n.spec.taints | default([]) | selectattr('effect', 'in', ['NoSchedule', 'NoExecute']) | list %}{%
        set _ = free.append(free.pop() + [0, (n.status.allocatable.memory | string | regex_replace('i$', '') | upper | human_to_bytes)
                                               - used.get(n.metadata.name, 0)] | max) %}{%
      endfor %}{{ {'moving': moving[0], 'free': free[0]} }}
  when: reboot_k8s_here | length > 0

- name: Report the room
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ '%.1f' % (reboot_room.moving / 1073741824) }} GiB of memory requests
      to move, {{ '%.1f' % (reboot_room.free / 1073741824) }} GiB free on the other nodes taking pods.
  when: reboot_k8s_here | length > 0

- name: The pods here fit on the other nodes
  ansible.builtin.assert:
    that: reboot_room.moving <= reboot_room.free or reboot_allow_pending | default(false) | bool
    fail_msg: >-
      {{ inventory_hostname }}: its nodes' pods request {{ '%.1f' % (reboot_room.moving / 1073741824) }} GiB
      of memory and the other nodes have {{ '%.1f' % (reboot_room.free / 1073741824) }} GiB free, so some
      would wait, down, until it's back. Nothing drained. Add a worker, or set reboot_allow_pending: true
      to accept that.
    quiet: true
  when: reboot_k8s_here | length > 0

- name: Drain, reboot and bring back, saying what's left cordoned if it fails
  block:
    - name: Take each Kubernetes node here out of service
      ansible.builtin.include_tasks: k8s-node-drain.yml
      loop: "{{ reboot_k8s_here }}"
      loop_control:
        loop_var: k8s_node

    - name: The other DNS servers answer, just before the reboot
      ansible.builtin.include_tasks: dns-answers.yml
      vars:
        dns_check: "{{ dns_elsewhere }}"
        dns_wait: true
      when: dns_here | default([]) | length > 0 and dns_elsewhere | default([]) | length > 0

    - name: Move the VMs off
      ansible.builtin.include_tasks: migrate.yml
      loop: "{{ evacuate_plan }}"
      loop_control:
        loop_var: planned
        label: "{{ planned.name }}"
      vars:
        mig: "{{ planned | combine({'from_node': pve_node, 'node': planned.to_node}) }}"

    - name: Put this node in HA maintenance, so HA moves its HA VMs off
      ansible.builtin.command: ha-manager crm-command node-maintenance enable {{ pve_node }}
      changed_when: true
      when: ha_plan | length > 0 and not ansible_check_mode

    - name: Wait for every HA VM to be running on another node
      ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
      register: reboot_ha_off
      changed_when: false
      until: >-
        reboot_ha_off.stdout | from_json | selectattr('vmid', 'in', ha_plan | map(attribute='vmid') | list)
        | rejectattr('node', 'equalto', pve_node) | selectattr('status', 'equalto', 'running') | list | length
        == ha_plan | length
      retries: 60
      delay: 10
      when: ha_plan | length > 0 and not ansible_check_mode

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 900
        msg: "{{ reboot_reason | default('Rebooting the host (Semaphore)') }}"

    - name: The Proxmox cluster has quorum again
      ansible.builtin.include_tasks: proxmox-quorate.yml
      vars:
        quorate_wait: true

    - name: Take this node out of HA maintenance
      ansible.builtin.command: ha-manager crm-command node-maintenance disable {{ pve_node }}
      changed_when: true
      when: ha_plan | length > 0 and not ansible_check_mode

    - name: Wait for the HA VMs to be running, back here where this node is preferred
      ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
      register: reboot_ha_back
      changed_when: false
      until: >-
        reboot_ha_back.stdout | from_json | selectattr('vmid', 'in', ha_plan | map(attribute='vmid') | list)
        | selectattr('status', 'equalto', 'running') | list | length == ha_plan | length
        and reboot_ha_back.stdout | from_json
            | selectattr('vmid', 'in', ha_plan | selectattr('preferred_here') | map(attribute='vmid') | list)
            | rejectattr('node', 'equalto', pve_node) | list | length == 0
      retries: 60
      delay: 10
      when: ha_plan | length > 0 and not ansible_check_mode

    - name: Wait for every Kubernetes node to be Ready
      ansible.builtin.include_tasks: kubernetes-healthy.yml
      args:
        apply:
          delegate_to: localhost
      vars:
        k8s_wait: true

    - name: Uncordon this host's Kubernetes nodes
      ansible.builtin.command: "{{ kubectl_cmd }} uncordon {{ item }}"
      delegate_to: "{{ kubectl_host }}"
      loop: "{{ reboot_k8s_here }}"
      changed_when: true

    - name: Read them back
      ansible.builtin.command: "{{ kubectl_cmd }} get node {{ item }} -o jsonpath={.spec.unschedulable}"
      delegate_to: "{{ kubectl_host }}"
      loop: "{{ reboot_k8s_here }}"
      register: reboot_uncordoned
      failed_when: reboot_uncordoned.stdout | trim == 'true'
      changed_when: false
      when: not ansible_check_mode

    - name: Close the database maintenance windows
      ansible.builtin.include_tasks: cnpg-maintenance-end.yml
      vars:
        cnpg_maintenance: "{{ cnpg_maintenance_all }}"
      when: cnpg_maintenance_all | length > 0

    - name: Wait for every database cluster to be whole again
      ansible.builtin.include_tasks: cnpg-healthy.yml
      vars:
        cnpg_wait: true

    - name: Wait for this host's DNS servers to answer again
      ansible.builtin.include_tasks: dns-answers.yml
      vars:
        dns_check: "{{ dns_here }}"
        dns_wait: true
      when: dns_here | default([]) | length > 0

    - name: Move the VMs back
      ansible.builtin.include_tasks: migrate.yml
      loop: "{{ evacuate_plan }}"
      loop_control:
        loop_var: planned
        label: "{{ planned.name }}"
      vars:
        mig: "{{ planned | combine({'from_node': planned.to_node, 'node': pve_node}) }}"
      when: evacuate_return | default(true) | bool

  rescue:
    - name: Say what this host's failure left behind
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} stopped at: {{ ansible_failed_task.name | default('?') }}"
          - "Its Kubernetes nodes may still be cordoned: {{ reboot_k8s_here or ['none'] }}"
          - "Once they're Ready: kubectl uncordon {{ reboot_k8s_here | join(' ') }}"
          - "VMs it may have moved off (back to {{ pve_node }} by hand if wanted): {{ evacuate_plan | map(attribute='name') | list or ['none'] }}"
          - >-
            {{ 'HA maintenance may still be on: ha-manager crm-command node-maintenance disable ' ~ pve_node
               if ha_plan | default([]) | length > 0 else 'HA maintenance was not used.' }}

    - name: Stop the run
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('A step failed') }} ({{ inventory_hostname }}); see the message above."
