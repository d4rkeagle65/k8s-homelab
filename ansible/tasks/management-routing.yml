# Answers on a host's management address (the one Semaphore logs in on,
# ansible_host) must leave through the management interface: through the
# default route on another network, the firewall drops them as strangers (an
# SSH banner that never comes). Every host is checked and reported; a host with
# management_gateway set (its NetBox local context) and netplan gets the fix the
# first Docker VM has by hand: routing table 250 for that address, the gateway
# its default (/etc/netplan/60-management.yaml), applied and read back; on a
# Docker host also the mark that sends containers' answers on published ports
# the same way (below).
#
# A host without netplan (the Pi-hole containers, whose interfaces Proxmox
# writes) takes interface_gateways instead, in its NetBox local context: each
# interface other than the default route's, mapped to its network's gateway
# ({"eth1": "<gateway>", ...}). Every listed address then gets a table and a
# rule of its own, so a client on a network the host isn't on gets its answer
# back through the firewall it came through. files/homelab-source-routing sets
# them, run at boot and after a networking restart by its systemd unit, and
# each is read back. Undo it with `systemctl disable --now homelab-source-routing`,
# which removes the rules and empties the tables. Proxmox hosts are reported only.

- name: Does it use netplan
  ansible.builtin.stat:
    path: /etc/netplan
  register: netplan_dir

- name: The management interface and its network
  vars:
    mgmt: "{{ ansible_facts.interfaces | map('regex_replace', '-', '_') | map('extract', ansible_facts)
              | selectattr('ipv4', 'defined') | selectattr('ipv4.address', 'equalto', ansible_host) | list }}"
  ansible.builtin.set_fact:
    mgmt_if: "{{ (mgmt | first).device }}"
    mgmt_net: "{{ (mgmt | first).ipv4.network }}/{{ (mgmt | first).ipv4.prefix }}"
  when: mgmt | length == 1

- name: The fix, where management_gateway is set
  when: management_gateway is defined and netplan_dir.stat.isdir | default(false)
  block:
    - name: Ask the host how it reaches the gateway
      ansible.builtin.command:
        argv: [ip, -o, route, get, "{{ management_gateway | default('0.0.0.0') }}", from, "{{ ansible_host }}"]
      register: gw_route
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Its gateway is known and on the management network
      ansible.builtin.assert:
        that:
          - mgmt_if is defined
          - management_gateway is defined
          - gw_route.rc == 0 and (' dev ' ~ mgmt_if ~ ' ') in gw_route.stdout and ' via ' not in gw_route.stdout
        fail_msg: "Set management_gateway (the management network's gateway, directly on {{ mgmt_if | default('the interface holding ' ~ ansible_host) }}) for {{ inventory_hostname }}; nothing was changed."
        quiet: true

    # A container's answer on a published port is routed while its source is
    # still the container's address (Docker rewrites it to ansible_host only
    # afterwards), so the rule on ansible_host never matches it and it leaves
    # by the default route. On a Docker host, a connection arriving on the
    # management interface is marked (conntrack mark 250) and its answers get
    # fwmark 250, which the netplan rule below sends through table 250: the
    # nft table in /etc/mgmt-return.nft, loaded at boot by mgmt-return.service.
    - name: Does it run Docker
      ansible.builtin.stat:
        path: /usr/bin/dockerd
      register: mgmt_dockerd

    - name: Mark management connections so containers' answers leave through it too
      when: mgmt_dockerd.stat.exists
      block:
        - name: The nft table
          ansible.builtin.copy:
            dest: /etc/mgmt-return.nft
            mode: "0644"
            content: |
              # Written by ansible/tasks/management-routing.yml.
              # Connections that arrive on {{ mgmt_if }} (management) get conntrack mark 250;
              # their answers from Docker containers get fwmark 250, which netplan's
              # "mark: 250" rule (60-management.yaml) routes through table 250.
              add table inet mgmt_return
              delete table inet mgmt_return
              table inet mgmt_return {
                  chain prerouting {
                      type filter hook prerouting priority mangle; policy accept;
                      iifname "{{ mgmt_if }}" ct state new ct mark set 250
                      iifname != "{{ mgmt_if }}" ct mark 250 meta mark set 250
                  }
              }
          register: mgmt_nft

        - name: Its unit, loading it at boot
          ansible.builtin.copy:
            dest: /etc/systemd/system/mgmt-return.service
            mode: "0644"
            content: |
              # Written by ansible/tasks/management-routing.yml.
              [Unit]
              Description=Mark management-interface connections so replies leave by {{ mgmt_if }}

              [Service]
              Type=oneshot
              RemainAfterExit=yes
              ExecStart=/usr/sbin/nft -f /etc/mgmt-return.nft

              [Install]
              WantedBy=multi-user.target
          register: mgmt_unit

        - name: Enable it, and load the table now if either changed
          ansible.builtin.systemd_service:
            name: mgmt-return.service
            enabled: true
            state: "{{ 'restarted' if (mgmt_nft is changed or mgmt_unit is changed) else 'started' }}"
            daemon_reload: "{{ mgmt_unit is changed }}"
          # In check mode the unit isn't written yet, so there's nothing to enable.
          when: not ansible_check_mode

    - name: Answers on the management address leave through it
      ansible.builtin.copy:
        dest: /etc/netplan/60-management.yaml
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              {{ mgmt_if }}:
                routes:
                  - to: {{ mgmt_net }}
                    from: {{ ansible_host }}
                    scope: link
                    table: 250
                  - to: default
                    via: {{ management_gateway }}
                    table: 250
                routing-policy:
                  - from: {{ ansible_host }}
                    table: 250
                    priority: 5300
          {% if mgmt_dockerd.stat.exists %}
                  - to: 0.0.0.0/0
                    mark: 250
                    table: 250
                    priority: 5301
          {% endif %}
      register: mgmt_netplan

    - name: Apply it
      ansible.builtin.command: netplan apply
      when: mgmt_netplan is changed and not ansible_check_mode

    - name: Read the rule back
      ansible.builtin.command: ip rule show
      register: rules
      changed_when: false
      when: not ansible_check_mode

    - name: The rule is in place
      ansible.builtin.assert:
        that: rules.stdout is search('from ' ~ ansible_host ~ ' lookup 250')
        fail_msg: "netplan applied, but no rule sends {{ ansible_host }}'s answers through table 250."
        quiet: true
      when: not ansible_check_mode

    - name: Read the mark's table back
      ansible.builtin.command: nft list table inet mgmt_return
      register: mgmt_nft_live
      changed_when: false
      failed_when: false
      when: mgmt_dockerd.stat.exists and not ansible_check_mode

    - name: Containers' answers are marked and routed through table 250
      ansible.builtin.assert:
        that:
          - mgmt_nft_live.rc == 0
          - mgmt_nft_live.stdout is search('iifname "' ~ mgmt_if ~ '" ct state new ct mark set 0x000000fa')
          - rules.stdout is search('fwmark 0xfa lookup 250')
        fail_msg: >-
          The mark for containers' answers isn't in place on {{ inventory_hostname }}
          (nft table inet mgmt_return, and a rule 'fwmark 0xfa lookup 250'); read
          `systemctl status mgmt-return` and `ip rule`.
        quiet: true
      when: mgmt_dockerd.stat.exists and not ansible_check_mode

- name: The fix, where interface_gateways is set and there's no netplan
  when: interface_gateways is defined and not (netplan_dir.stat.isdir | default(false))
  vars:
    sr_tables: "{{ dict(interface_gateways.keys() | sort | zip(range(201, 300))) }}"
  block:
    - name: Ask the host how it reaches each gateway
      ansible.builtin.command:
        argv: [ip, -o, route, get, "{{ item.value }}"]
      loop: "{{ interface_gateways | dict2items }}"
      register: sr_gw_routes
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Each gateway is directly on its interface
      ansible.builtin.assert:
        that:
          - item.rc == 0 and (' dev ' ~ item.item.key ~ ' ') in item.stdout and ' via ' not in item.stdout
        fail_msg: "interface_gateways maps {{ item.item.key }} to {{ item.item.value }}, which isn't directly on {{ item.item.key }} for {{ inventory_hostname }}; nothing was changed."
        quiet: true
      loop: "{{ sr_gw_routes.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: The script that sets the tables and rules
      ansible.builtin.copy:
        src: homelab-source-routing
        dest: /usr/local/sbin/homelab-source-routing
        mode: "0755"
      register: sr_script

    - name: Its interfaces, tables and gateways
      ansible.builtin.copy:
        dest: /etc/homelab-source-routing.conf
        mode: "0644"
        content: |
          # <interface> <table> <gateway>, from interface_gateways (ansible/tasks/management-routing.yml)
          {% for name, gw in interface_gateways | dictsort %}
          {{ name }} {{ sr_tables[name] }} {{ gw }}
          {% endfor %}
      register: sr_conf

    - name: Its unit, run at boot and again after a networking restart
      ansible.builtin.copy:
        dest: /etc/systemd/system/homelab-source-routing.service
        mode: "0644"
        content: |
          [Unit]
          Description=Answers from each address leave by its own interface
          After=network.target networking.service
          PartOf=networking.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/usr/local/sbin/homelab-source-routing
          ExecStop=/usr/local/sbin/homelab-source-routing stop

          [Install]
          WantedBy=multi-user.target
      register: sr_unit

    - name: Run it
      ansible.builtin.systemd_service:
        name: homelab-source-routing
        enabled: true
        daemon_reload: "{{ sr_unit is changed }}"
        state: "{{ 'restarted' if (sr_script is changed or sr_conf is changed or sr_unit is changed) else 'started' }}"
      when: not ansible_check_mode

    - name: Read back where answers from each address leave
      ansible.builtin.command:
        argv: [ip, -o, route, get, 192.0.2.1, from, "{{ ansible_facts[item | replace('-', '_')].ipv4.address }}"]
      loop: "{{ interface_gateways.keys() | list }}"
      register: sr_back
      changed_when: false
      when: not ansible_check_mode

    - name: Each leaves by its own interface
      ansible.builtin.assert:
        that: (' dev ' ~ item.item ~ ' ') in item.stdout and (' via ' ~ interface_gateways[item.item] ~ ' ') in item.stdout
        fail_msg: "The unit ran, but answers from {{ item.item }}'s address still leave as: {{ item.stdout }}"
        quiet: true
      loop: "{{ sr_back.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when: not ansible_check_mode

# Read after the fixes above, so the report says how things are when the run ends.
- name: Where answers from the management address leave
  ansible.builtin.command:
    argv: [ip, -o, route, get, 192.0.2.1, from, "{{ ansible_host }}"]
  register: mgmt_now
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report the management routing
  vars:
    out_if: "{{ mgmt_now.stdout.split(' dev ')[1].split()[0] if ' dev ' in mgmt_now.stdout else '?' }}"
    fix_set: >-
      {{ (management_gateway is defined and netplan_dir.stat.isdir | default(false))
         or (interface_gateways is defined and not (netplan_dir.stat.isdir | default(false))) }}
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{
      ('answers from ' ~ ansible_host ~ ' leave by ' ~ out_if ~ (', its management interface' if out_if == mgmt_if
        else ', not its management interface ' ~ mgmt_if ~ ('; the fix set for it would change that (a dry run)'
          if ansible_check_mode and fix_set | bool else
          ' (set management_gateway where netplan runs, interface_gateways elsewhere)')))
      if mgmt_if is defined and not mgmt_if is match('^(br-|docker)') else
      ("can't tell: " ~ ansible_host ~ ", its inventory address, isn't a network of its own (an override, or a Docker bridge Semaphore uses on its own host)") }}
