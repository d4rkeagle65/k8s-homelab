# Prometheus's exporters on the machines outside the cluster, from Debian's own
# packages: node-exporter (CPU, memory, ZFS, disks, network) listening on the
# host's management address, and on hosts with physical disks the packaged
# textfile collectors for SMART and NVMe (each SSD's wear: percentage used,
# data written), refreshed by their systemd timers. The Kubernetes nodes are
# left alone: the cluster runs node-exporter there on the same port.
#
# Variables (the Debian Host Baseline variable group):
#   host_exporters       true: install and keep them; empty or false: only report
#   management_network   the management network (CIDR); each host listens on its
#                        own address there, found on the host, so no host needs
#                        one set (the Docker VM's ansible_host is the Docker
#                        bridge's, which nothing outside the VM reaches)
#   host_exporter_smart  default true for the proxmox group, false elsewhere

- name: Settle the exporter settings
  ansible.builtin.set_fact:
    he_on: "{{ host_exporters | default(false) | bool }}"
    he_skip: "{{ 'k8s_nodes' in group_names }}"
    he_net: "{{ management_network | default('') | trim }}"
    he_smart: "{{ host_exporter_smart | default('proxmox' in group_names) | bool }}"
    he_packages: >-
      {{ ['prometheus-node-exporter'] +
         (['prometheus-node-exporter-collectors', 'smartmontools', 'nvme-cli']
          if host_exporter_smart | default('proxmox' in group_names) | bool else []) }}

# The host's own address on the management network, from its interfaces.
- name: Find this host's address on the management network
  ansible.builtin.command:
    argv:
    - python3
    - -c
    - |
      import ipaddress, json, subprocess, sys
      net = ipaddress.ip_network(sys.argv[1], strict=False)
      found = [a["local"] for i in json.loads(subprocess.check_output(["ip", "-j", "-4", "addr"]))
               for a in i.get("addr_info", []) if ipaddress.ip_address(a["local"]) in net]
      print(" ".join(found))
    - "{{ he_net }}"
  register: he_found
  changed_when: false
  check_mode: false
  when: not he_skip and he_net | length > 0

- name: Settle the listen address
  ansible.builtin.set_fact:
    he_addr: "{{ (he_found.stdout | default('')).split() | first | default('') }}"
  when: not he_skip

- name: Read the exporter's state
  ansible.builtin.shell: |
    echo "installed=$(dpkg-query -W -f='${db:Status-Abbrev}' prometheus-node-exporter 2>/dev/null | cut -c1-2)"
    echo "active=$(systemctl is-active prometheus-node-exporter 2>/dev/null)"
    echo "args=$(grep -E '^ARGS=' /etc/default/prometheus-node-exporter 2>/dev/null)"
  register: he_state
  changed_when: false
  check_mode: false
  when: not he_skip

- name: Report the exporter as found
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: node-exporter
      {{ 'installed' if 'installed=ii' in he_state.stdout else 'not installed' }},
      {{ he_state.stdout | regex_search('active=(\S*)', '\1') | first | default('') or 'not running' }};
      {{ ('managing it on ' ~ he_addr ~ ':9100' ~ (' with SMART/NVMe' if he_smart else ''))
         if he_on and he_addr else ('no address on the management network (management_network: '
         ~ (he_net or 'not set') ~ ')' if he_on else 'off (host_exporters is not set)') }}
  when: not he_skip

- name: Exporters
  when: he_on and not he_skip
  block:
    - name: The host has exactly one address on the management network
      ansible.builtin.assert:
        that:
          - he_net is match('^[0-9.]+/[0-9]+$')
          - (he_found.stdout | default('')).split() | length == 1
        fail_msg: >-
          {{ 'Set management_network to the management network with its prefix (for example
          192.0.2.0/24) in the Debian Host Baseline variable group.' if he_net is not
          match('^[0-9.]+/[0-9]+$') else inventory_hostname ~ ' has ' ~
          ((he_found.stdout | default('')).split() | length) ~ ' address(es) on ' ~ he_net ~ ': '
          ~ (he_found.stdout | default('') or 'none') ~ '; node-exporter would listen where
          Prometheus cannot reach it.' }}
        quiet: true

    - name: Install the exporter packages
      ansible.builtin.apt:
        name: "{{ he_packages }}"
        state: present
        install_recommends: false
        update_cache: true
        cache_valid_time: 3600
      environment:
        DEBIAN_FRONTEND: noninteractive
      when: not ansible_check_mode

    - name: Listen on the management address only
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-node-exporter
        regexp: '^ARGS='
        line: 'ARGS="--web.listen-address={{ he_addr }}:9100"'
        create: true
        mode: "0644"
      register: he_args

    - name: Run node-exporter
      ansible.builtin.systemd_service:
        name: prometheus-node-exporter
        enabled: true
        state: "{{ 'restarted' if he_args is changed else 'started' }}"
      when: not ansible_check_mode

    # The packaged collectors write their metrics files on a timer; one run now
    # so the read-back below sees them.
    - name: Run the SMART and NVMe collectors on their timers, and once now
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: "{{ item is search('timer$') }}"
        state: started
      loop:
      - prometheus-node-exporter-smartmon.timer
      - prometheus-node-exporter-nvme.timer
      - prometheus-node-exporter-smartmon.service
      - prometheus-node-exporter-nvme.service
      when: he_smart and not ansible_check_mode

    - name: Read the exporter back
      ansible.builtin.shell: |
        m=$(curl -sf --max-time 10 http://{{ he_addr }}:9100/metrics) || { echo "unreachable"; exit 0; }
        echo "uname=$(echo "$m" | grep -c '^node_uname_info')"
        echo "smart=$(echo "$m" | grep -c -E '^smartmon_')"
        echo "nvme=$(echo "$m" | grep -c -E '^nvme_')"
      register: he_back
      changed_when: false
      check_mode: false
      failed_when: >-
        not ansible_check_mode and
        ('unreachable' in he_back.stdout or 'uname=1' not in he_back.stdout)
      retries: 3
      delay: 5
      until: ansible_check_mode or 'uname=1' in he_back.stdout

    - name: Report the exporter
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: node-exporter on {{ he_addr }}:9100{{ (', SMART series ' ~
          (he_back.stdout | regex_search('smart=(\d+)', '\1') | first) ~ ', NVMe series ' ~
          (he_back.stdout | regex_search('nvme=(\d+)', '\1') | first)) if he_smart and he_back.stdout is defined
          and he_back.stdout is search('smart=') else '' }}
