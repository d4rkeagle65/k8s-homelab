# Takes node k8s_node out of service: cordon, move its databases off
# (cnpg-free-node.yml), drain. kubectl runs on kubectl_host. Undone by
# k8s-node-return.yml.
- name: Cordon the node
  ansible.builtin.command: kubectl --kubeconfig /etc/kubernetes/admin.conf cordon {{ k8s_node }}
  delegate_to: "{{ kubectl_host }}"
  changed_when: true

- name: Move the databases off the node
  ansible.builtin.include_tasks: cnpg-free-node.yml

- name: Drain the node
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/kubernetes/admin.conf drain {{ k8s_node }}
    --ignore-daemonsets --delete-emptydir-data --timeout=15m
  delegate_to: "{{ kubectl_host }}"
  changed_when: true
