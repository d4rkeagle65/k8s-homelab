# Moves guest mig.vmid from Proxmox node mig.from_node to mig.node through
# the cluster API (pvesh, from whichever host runs this), live when
# mig.running, with local disks copied along. For an HA VM the API files an
# HA migration request instead, which returns before the move, so this then
# waits until the cluster shows the guest on mig.node in the same state, or
# stops the run. A guest already there (HA moves VMs back by itself) is left.

- name: Read the location of {{ mig.name }}
  ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
  register: mig_before
  changed_when: false
  check_mode: false

- name: Note the move a real run would make
  ansible.builtin.debug:
    msg: "A real run moves {{ mig.name }} ({{ mig.vmid }}) from {{ mig.from_node }} to {{ mig.node }}{{ ' live' if mig.running else '' }}."
  when: ansible_check_mode

- name: Move {{ mig.name }}
  ansible.builtin.command: >-
    pvesh create /nodes/{{ mig_where }}/qemu/{{ mig.vmid }}/migrate --target {{ mig.node }}
    {{ '--online 1 --with-local-disks 1' if mig.running else '' }}
  changed_when: true
  when: not ansible_check_mode and mig_where != mig.node
  vars:
    mig_where: "{{ (mig_before.stdout | from_json | selectattr('vmid', 'equalto', mig.vmid | int) | first).node }}"

- name: Wait until the guest is on {{ mig.node }}
  ansible.builtin.command: pvesh get /cluster/resources --type vm --output-format json
  register: mig_after
  changed_when: false
  check_mode: false
  until: >-
    (mig_after.stdout | from_json | selectattr('vmid', 'equalto', mig.vmid | int) | first).node == mig.node
    and ((mig_after.stdout | from_json | selectattr('vmid', 'equalto', mig.vmid | int) | first).status == 'running') == mig.running
  retries: 60
  delay: 10
  when: not ansible_check_mode
