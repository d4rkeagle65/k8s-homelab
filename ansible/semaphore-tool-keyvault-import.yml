# One Semaphore variable group's values into Key Vault, once (QUEUE-semaphore-variables.md):
# Semaphore never returns a secret's value, but hands a task its groups' values. Run as
# "Tool: Variable Group → Key Vault (one time)" with two variable groups attached, "Key Vault
# Sync" (the Azure login and Semaphore's token) and the group to import; change the second
# between runs. One group a run: several groups share a variable's name (HAWSER_TOKEN,
# PG_CONN_STR), and in one task the last would win.
#
# It gathers every variable scripts/semaphore_variable_groups.yaml declares, for any group,
# from the run's extra variables or environment (no_log), and hands them on standard input
# (no file) to scripts/semaphore_keyvault_import.py, which asks Semaphore which group this
# template has attached and writes that group's values to their Key Vault secrets, unless
# Key Vault already holds one, reading each write back; it prints names only. A survey
# variable import_group, if given, names the group instead. Writing needs "Key Vault Secrets
# Officer" for the sync's identity, granted for the import and removed after. In check mode
# (--check) it reads Key Vault and says, for each value, whether it would write it, or finds
# it the same or different, and writes nothing.

- ansible.builtin.import_playbook: _semaphore-host.yml

- name: A variable group's values into Key Vault
  hosts: semaphore
  gather_facts: false
  vars:
    groups_config: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../scripts/semaphore_variable_groups.yaml') | from_yaml }}"
  tasks:
    - name: Gather each from the run's extra variables or environment
      ansible.builtin.set_fact:
        import_values: >-
          {{ import_values | default({}) | combine({item.0:
               (vars[item.0] if item.1 == 'variables' and item.0 in vars
                else (lookup('ansible.builtin.env', item.0, default='') if item.1 == 'environment' else none))}) }}
      loop: >-
        {{ groups_config.groups.values()
           | map(attribute='variables', default={}) | map('dict2items') | flatten
           | map(attribute='key') | product(['variables']) | list
         + groups_config.groups.values()
           | map(attribute='environment', default={}) | map('dict2items') | flatten
           | map(attribute='key') | product(['environment']) | list }}
      loop_control:
        label: "{{ item.0 }}"
      no_log: true

    - name: Write them to Key Vault (in check mode, compare them)
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/semaphore_keyvault_import.py"
        stdin: >-
          {{ {'project': groups_config.project, 'groups': groups_config.groups,
              'group': import_group | default(none) or none, 'dry_run': ansible_check_mode,
              'values': import_values | default({})} | to_json }}
      check_mode: false
      register: imported
      changed_when: "'written to' in imported.stdout"
      failed_when: false
      no_log: true

    - name: What it did (names only)
      ansible.builtin.debug:
        msg: "{{ imported.stdout_lines + ([] if not imported.stderr else ['(and ' ~ imported.stderr_lines | length ~ ' lines on stderr, not shown: they could quote the input)']) }}"

    - name: Stop when a value isn't in Key Vault as the group has it
      ansible.builtin.fail:
        msg: "Not every value is (or would be) in Key Vault as the group has it: see the lines above."
      when: imported.rc != 0
