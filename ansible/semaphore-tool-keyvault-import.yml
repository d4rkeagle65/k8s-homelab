# One Semaphore variable group's values into Key Vault, once (QUEUE-semaphore-variables.md):
# Semaphore never returns a secret's value, but hands a task its groups' values. Run as
# "Tool: Variable Group → Key Vault (one time)" with two variable groups, "Key Vault Sync" (the
# Azure login) and the group to import, and the survey's import_group naming that group as
# scripts/semaphore_variable_groups.yaml does. One group a run: several groups share a
# variable's name (HAWSER_TOKEN, PG_CONN_STR), and in one task the last would win.
#
# It gathers each variable the config declares for the group, from the run's extra variables
# or environment, and hands them to scripts/semaphore_keyvault_import.py on its standard
# input (no file, no_log), which writes each to its Key Vault secret unless Key Vault already
# holds one, and reads each write back; it prints names only. Writing needs "Key Vault Secrets
# Officer" on the vault for the sync's identity, granted for the import and removed after.
# In check mode (--check) it lists what it would import and writes nothing.

- ansible.builtin.import_playbook: _semaphore-host.yml

- name: A variable group's values into Key Vault
  hosts: semaphore
  gather_facts: false
  vars:
    groups_config: "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../scripts/semaphore_variable_groups.yaml') | from_yaml }}"
  tasks:
    - name: Check the group named is one the config declares
      ansible.builtin.assert:
        that:
          - import_group is defined and import_group | length > 0
          - import_group in groups_config.groups
        fail_msg: >-
          Set import_group (the survey) to a group scripts/semaphore_variable_groups.yaml
          declares, and attach that group to this template beside "Key Vault Sync".
        quiet: true

    - name: Name the variables to import
      ansible.builtin.set_fact:
        import_declared: "{{ groups_config.groups[import_group] }}"
        import_names: >-
          {{ (groups_config.groups[import_group].variables | default({}) | dict2items
              | map(attribute='key') | map('regex_replace', '^', 'variables:') | list)
           + (groups_config.groups[import_group].environment | default({}) | dict2items
              | map(attribute='key') | map('regex_replace', '^', 'environment:') | list) }}

    - name: Gather each from the run's extra variables or environment
      ansible.builtin.set_fact:
        import_values: >-
          {{ import_values | default({}) | combine({item.split(':', 1)[1]:
               (vars[item.split(':', 1)[1]] if item.startswith('variables:') and item.split(':', 1)[1] in vars
                else (lookup('ansible.builtin.env', item.split(':', 1)[1], default='') if item.startswith('environment:')
                else none))}) }}
      loop: "{{ import_names }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: Say what a real run would import
      ansible.builtin.debug:
        msg: "{{ import_group }}: would import {{ import_names | map('regex_replace', '^[a-z]+:', '') | join(', ') }}"
      when: ansible_check_mode

    - name: Write them to Key Vault
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../scripts/semaphore_keyvault_import.py"
        stdin: "{{ {'group': import_group, 'declared': import_declared, 'values': import_values} | to_json }}"
      register: imported
      changed_when: "'written to' in imported.stdout"
      failed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: What it did (names only)
      ansible.builtin.debug:
        msg: "{{ imported.stdout_lines + ([] if not imported.stderr else ['(and ' ~ imported.stderr_lines | length ~ ' lines on stderr, not shown: they could quote the input)']) }}"
      when: not ansible_check_mode

    - name: Stop when a value isn't in Key Vault as the group has it
      ansible.builtin.fail:
        msg: "Not every value is in Key Vault as {{ import_group }} has it: see the lines above."
      when: not ansible_check_mode and imported.rc != 0
