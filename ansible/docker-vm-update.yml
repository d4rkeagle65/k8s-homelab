# Updates the Docker VM's packages with Docker itself held: Semaphore runs in a
# container on this VM, so a Docker upgrade (which restarts the daemon, and
# with it every container unless live-restore is on) would end the run that
# started it. The VM is never rebooted here either; the run reports when a
# reboot or a Docker upgrade is due, for the owner to do from the host.
#
# Inventory (kept in Semaphore, never in git): group docker_vm, root over SSH.
# From inside a container on this VM, its management address hangs for some
# connections (the policy routing there), so address it the way the README
# says. Optional: docker_packages, the packages kept held (default below).
#
# Two switches, both off unless set (QUEUE.md, decision 7), each an extra variable
# (a survey's target "Variable"): one targeting "Environment" never reaches Ansible.
#   docker_live_restore: true  merges "live-restore": true into
#       /etc/docker/daemon.json (keeping the rest) and reloads Docker, which
#       applies it without restarting anything; read back from `docker info`.
#   upgrade_docker: true       upgrades the held Docker packages, only with
#       live-restore on (the containers then outlive the daemon's restart) and
#       only within docker-ce's major version (live-restore isn't supported
#       across majors: a major upgrade is reported, for a run by hand). The
#       running containers are read before and after; one that ran before and
#       isn't running after fails the run. Then each container still holding the
#       old daemon's socket is restarted. The packages are held again whatever
#       happens.
# Docker's own {{.Field}} format syntax would be read as Ansible's, so Docker
# is read as JSON (--format json).
#
# In check mode (--check) it lists the pending upgrades and changes nothing.

- ansible.builtin.import_playbook: select-hosts.yml
  vars:
    select_from: docker_vm

- name: Update the Docker VM
  hosts: targets
  gather_facts: false
  vars:
    held: "{{ docker_packages | default(['docker-ce', 'docker-ce-cli', 'docker-ce-rootless-extras', 'containerd.io', 'docker-buildx-plugin', 'docker-compose-plugin']) }}"
  tasks:
    # dpkg-query exits 1 when any name is unknown, so read every package dpkg
    # knows and keep the installed ones in the list. Through the shell, single
    # quoted: the command module expands ${...} in its arguments as environment
    # variables, which emptied the format and with it the list to hold.
    - name: Read the installed packages
      ansible.builtin.shell: dpkg-query -W -f='${Package}|${db:Status-Status}\n'
      register: dpkg_all
      changed_when: false
      check_mode: false

    - name: Docker's packages were read (an empty read holds nothing)
      ansible.builtin.assert:
        that: dpkg_all.stdout_lines | select('match', '^docker-ce[|]installed$') | list | length == 1
        fail_msg: "dpkg-query's list has no installed docker-ce: the read failed, so nothing is upgraded."
        quiet: true

    - name: Hold Docker's installed packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: >-
        {{ dpkg_all.stdout_lines | select('match', '^(' ~ held | map('regex_escape') | join('|') ~ ')[|]installed$') |
           map('regex_replace', '[|].*', '') | list }}

    - name: Read the holds back
      ansible.builtin.command: apt-mark showhold
      register: holds
      changed_when: false
      check_mode: false

    - name: Every installed Docker package is held before anything is upgraded
      vars:
        unheld: >-
          {{ dpkg_all.stdout_lines | select('match', '^(' ~ held | map('regex_escape') | join('|') ~ ')[|]installed$') |
             map('regex_replace', '[|].*', '') | difference(holds.stdout_lines) | list }}
      ansible.builtin.assert:
        that: unheld | length == 0
        fail_msg: "Not held: {{ unheld | join(', ') }}. Nothing is upgraded: an upgrade now would restart Docker."
        quiet: true
      when: not ansible_check_mode

    # Refreshing the lists only looks, so it runs in check mode too.
    - name: Refresh the package lists
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
      check_mode: false

    - name: List the pending upgrades
      ansible.builtin.command: apt list --upgradable
      register: upgradable
      changed_when: false
      check_mode: false

    - name: Show them
      ansible.builtin.debug:
        msg:
          - "To upgrade: {{ upgradable.stdout_lines | reject('match', '^Listing') |
               reject('match', '^(' ~ held | map('regex_escape') | join('|') ~ ')/') |
               map('regex_replace', '/.*', '') | join(', ') or 'nothing' }}"
          - "Held (Docker, for a run by hand): {{ upgradable.stdout_lines |
               select('match', '^(' ~ held | map('regex_escape') | join('|') ~ ')/') |
               map('regex_replace', '/.*', '') | join(', ') or 'nothing' }}"

    - name: Upgrade
      ansible.builtin.apt:
        upgrade: dist
        dpkg_options: force-confold,force-confdef
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Remove packages nothing needs any more
      ansible.builtin.apt:
        autoremove: true

    - name: Docker's live-restore
      when: docker_live_restore | default(false) | bool
      block:
        - name: Read daemon.json
          ansible.builtin.slurp:
            src: /etc/docker/daemon.json
          register: daemon_json
          failed_when: false
          check_mode: false

        - name: Settle the merged settings
          ansible.builtin.set_fact:
            daemon_settings: >-
              {{ ((daemon_json.content | b64decode | from_json) if daemon_json.content is defined else {})
                 | combine({'live-restore': true}) }}

        - name: Write daemon.json with live-restore on
          ansible.builtin.copy:
            dest: /etc/docker/daemon.json
            content: "{{ daemon_settings | to_nice_json }}\n"
            mode: "0644"
            backup: true
          register: daemon_written

        # live-restore is one of the settings Docker reloads (SIGHUP): no restart.
        - name: Reload Docker
          ansible.builtin.systemd_service:
            name: docker
            state: reloaded
          when: daemon_written is changed and not ansible_check_mode

        - name: Read Docker's settings back
          ansible.builtin.command: docker info --format json
          register: info_after
          changed_when: false
          check_mode: false

        - name: Live-restore is on
          ansible.builtin.assert:
            that: (info_after.stdout | from_json).LiveRestoreEnabled | bool
            fail_msg: daemon.json says live-restore, but docker info doesn't; read journalctl -u docker.
            quiet: true
          when: not ansible_check_mode

    - name: Docker's upgrade
      when: upgrade_docker | default(false) | bool
      block:
        - name: Read whether live-restore is on
          ansible.builtin.command: docker info --format json
          register: info_now
          changed_when: false
          check_mode: false

        - name: Read docker-ce's installed and candidate versions
          ansible.builtin.command: apt-cache policy docker-ce
          register: ce_policy
          changed_when: false
          check_mode: false

        - name: Settle the versions
          ansible.builtin.set_fact:
            ce_installed: "{{ ce_policy.stdout | regex_search('Installed: (\\S+)', '\\1') | first | default('') }}"
            ce_candidate: "{{ ce_policy.stdout | regex_search('Candidate: (\\S+)', '\\1') | first | default('') }}"
            live_restore_on: "{{ (info_now.stdout | from_json).LiveRestoreEnabled | bool }}"

        # 5:28.3.2-1~debian.13~trixie: the major is what follows the epoch.
        - name: Settle the majors
          ansible.builtin.set_fact:
            ce_major_installed: "{{ ce_installed | regex_replace('^[0-9]+:', '') | regex_replace('[.].*', '') }}"
            ce_major_candidate: "{{ ce_candidate | regex_replace('^[0-9]+:', '') | regex_replace('[.].*', '') }}"

        - name: Report the Docker upgrade
          ansible.builtin.debug:
            msg: >-
              docker-ce {{ ce_installed }} -> {{ ce_candidate }}:
              {{ 'nothing to do' if ce_installed == ce_candidate else
                 ('not upgraded: live-restore is off (set docker_live_restore: true first)' if not live_restore_on else
                 ('not upgraded: a major upgrade (' ~ ce_major_installed ~ ' to ' ~ ce_major_candidate ~ '), by hand'
                  if ce_major_installed != ce_major_candidate else 'upgrading')) }}

        - name: Upgrade Docker, its containers kept running
          when: ce_installed != ce_candidate and live_restore_on and ce_major_installed == ce_major_candidate and not ansible_check_mode
          block:
            - name: Read the running containers before
              ansible.builtin.command: docker ps --format json
              register: ps_before
              changed_when: false

            - name: Unhold Docker's packages
              ansible.builtin.dpkg_selections:
                name: "{{ item }}"
                selection: install
              loop: "{{ dpkg_all.stdout_lines | select('match', '^(' ~ held | map('regex_escape') | join('|') ~ ')[|]installed$') | map('regex_replace', '[|].*', '') | list }}"

            - name: Upgrade them
              ansible.builtin.apt:
                name: "{{ dpkg_all.stdout_lines | select('match', '^(' ~ held | map('regex_escape') | join('|') ~ ')[|]installed$') | map('regex_replace', '[|].*', '') | list }}"
                state: latest
                only_upgrade: true
                dpkg_options: force-confold,force-confdef
              environment:
                DEBIAN_FRONTEND: noninteractive

            - name: Give the containers a moment to settle
              ansible.builtin.wait_for:
                timeout: 20

            - name: Read the running containers after
              ansible.builtin.command: docker ps --format json
              register: ps_after
              changed_when: false

            - name: Every container that ran before still runs
              ansible.builtin.assert:
                that: missing | length == 0
                fail_msg: "Not running after the upgrade: {{ missing | join(', ') }}"
                success_msg: "{{ before_names | length }} container(s) running before and after"
              vars:
                before_names: "{{ ps_before.stdout_lines | map('from_json') | map(attribute='Names') | list }}"
                after_names: "{{ ps_after.stdout_lines | map('from_json') | map(attribute='Names') | list }}"
                missing: "{{ before_names | difference(after_names) }}"

            # Docker's restart makes a new docker.sock; a container that mounts the
            # file (Dockhand, Hawser) keeps the old one, alive but refused. Restart
            # each whose socket, seen through /proc/<pid>/root, isn't the host's.
            - name: Restart the containers holding the old daemon's socket
              ansible.builtin.shell: |
                {% raw %}
                set -eu
                stale() {
                  sock=$(stat -c %i /var/run/docker.sock)
                  for id in $(docker ps -q); do
                    docker inspect -f '{{.State.Pid}} {{.Name}} {{range .Mounts}}{{.Source}}={{.Destination}} {{end}}' "$id"
                  done | while read -r pid name mounts; do
                    for m in $mounts; do
                      case "${m%%=*}" in /var/run/docker.sock|/run/docker.sock) ;; *) continue ;; esac
                      [ "$(stat -L -c %i "/proc/$pid/root${m#*=}" 2>/dev/null)" = "$sock" ] || echo "${name#/}"
                      break
                    done
                  done
                }
                for n in $(stale); do docker restart "$n" >/dev/null; echo "$n"; done
                sleep 5
                left=$(stale)
                [ -z "$left" ] || { echo "still on the old socket: $left" >&2; exit 1; }
                {% endraw %}
              register: socket_restarts
              changed_when: socket_restarts.stdout_lines | length > 0

            - name: Report the restarts
              ansible.builtin.debug:
                msg: "Restarted for the new socket: {{ socket_restarts.stdout_lines | join(', ') or 'none' }}"
          always:
            - name: Hold Docker's packages again
              ansible.builtin.dpkg_selections:
                name: "{{ item }}"
                selection: hold
              loop: "{{ dpkg_all.stdout_lines | select('match', '^(' ~ held | map('regex_escape') | join('|') ~ ')[|]installed$') | map('regex_replace', '[|].*', '') | list }}"

    - name: Look for Debian's reboot-required flag
      ansible.builtin.stat:
        path: /run/reboot-required
      register: reboot_flag

    - name: Report what is left for the owner
      ansible.builtin.debug:
        msg:
          - "Reboot due: {{ 'yes, from Proxmox, when Vaultwarden, Kea, Dockhand and Semaphore can be down' if reboot_flag.stat.exists else 'no' }}"
          - "Docker upgrade due: {{ ('yes: set upgrade_docker: true, or by hand: apt-mark unhold, upgrade, hold again') if upgradable.stdout_lines | select('match', '^(' ~ held | map('regex_escape') | join('|') ~ ')/') | list and not (upgrade_docker | default(false) | bool) else 'no' }}"
