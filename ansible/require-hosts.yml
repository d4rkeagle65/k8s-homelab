# For a playbook that needs a group without working on it (talos-reboot.yml
# calls Proxmox's API through the proxmox group's first host): stops the run when
# the inventory gives it no hosts in that group. Ansible itself only warns when an
# inventory fails to parse (a tab in Semaphore's YAML) and then runs the plays
# against nothing, exiting 0, so the run would look like a success. A playbook
# that works on the group's hosts imports select-hosts.yml instead, which checks
# the same.
#
#   - ansible.builtin.import_playbook: require-hosts.yml
#     vars:
#       required_group: proxmox

- ansible.builtin.import_playbook: semaphore-host.yml

- name: The inventory has hosts to work on
  hosts: semaphore
  gather_facts: false
  tasks:
    - name: "{{ required_group }} has hosts"
      ansible.builtin.assert:
        that: groups[required_group] | default([]) | length > 0
        fail_msg: >-
          The inventory has no hosts in {{ required_group }}: either it failed to parse
          (the warnings above say why) or it lacks that group. Nothing was run.
        success_msg: "{{ groups[required_group] | length }} host(s) in {{ required_group }}"
