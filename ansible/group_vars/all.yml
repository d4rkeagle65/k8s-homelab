# The cluster's API (tasks/k8s-connection.yml) and Talos's (tasks/talosctl-local.yml),
# read from the run's environment: the "k8s and Talos Connection" variable group
# holds them as environment variables (secret) and no extra variables, so the NetBox
# sync, a Python template, shares it (scripts/netbox_seed.py reads the K8S_* ones;
# Semaphore hands a Python template a group's extra variables as arguments, which it
# refuses). An extra variable of the same name still takes precedence.
k8s_api_url: "{{ lookup('ansible.builtin.env', 'K8S_API_URL') }}"
k8s_ca_b64: "{{ lookup('ansible.builtin.env', 'K8S_CA_B64') }}"
k8s_token: "{{ lookup('ansible.builtin.env', 'K8S_TOKEN') }}"
talosconfig_b64: "{{ lookup('ansible.builtin.env', 'TALOSCONFIG_B64') }}"

# The web bastion's SSH key (QUEUE-bastion.md: Termix, kubernetes/prod/services/termix/):
# public halves only. Its private half is in Key Vault (TERMIX-SSH-PRIVATE-KEY) and in
# Termix. Added beside the owner's keys on every machine the playbooks give a login:
# the admin account on the Debian hosts (tasks/admin-user.yml), root on OpenWrt
# (openwrt-setting.yml). A list, so a new key can overlap the old one in a rotation;
# removing one here removes it from the admin account at the next run.
bastion_ssh_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICp9AkdMyivnEB8URZhPhSJF/NIB1XoRhmUkt5KRl1pG termix-bastion
