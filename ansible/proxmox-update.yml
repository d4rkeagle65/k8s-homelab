# Rolling upgrade of the Proxmox hosts, one at a time, with the Proxmox
# cluster and the Kubernetes cluster checked healthy before each host and after
# any reboot. A reboot drains the host's Kubernetes nodes first and waits for
# every database cluster afterwards (tasks/proxmox-host-reboot.yml, as
# proxmox-reboot.yml). A failed check stops the run before the next host is
# touched.
#
# Inventory (kept in Semaphore, never in git; see README.md):
#   proxmox    every host, in the order to upgrade them; root over SSH
#   no_reboot  hosts upgraded but never rebooted by this run
#   dns_guest_tag   the Proxmox tag on the DNS server containers (Pi-hole).
#              Unset, DNS isn't checked. Set, a host carrying one reboots only
#              while every other DNS server answers, and the run waits for its
#              own to answer again; a host carrying them all (two or more) is
#              left for a reboot by hand.
#   remove_old_kernels  true to purge kernels beyond the running one, the
#              newest keep_kernels (default 2) and any pinned in
#              proxmox-boot-tool; off, the run only lists them.
#   evacuate   per host, VMs to live-migrate off before its reboot:
#              [{vmid: 107, to: <inventory host>}]; moved back afterwards
#              unless evacuate_return is false. The Docker VM, where Semaphore
#              runs, needs this or no_reboot on its host.
# Variables: the "k8s and Talos Connection" variable group (K8S_API_URL, K8S_CA_B64 and
# K8S_TOKEN, tasks/k8s-connection.yml).
#
# In check mode (--check) it runs the checks and lists the pending upgrades,
# and changes nothing.

- ansible.builtin.import_playbook: _select-hosts.yml
  vars:
    select_from: proxmox

- name: Check the clusters before touching anything
  hosts: semaphore
  gather_facts: false
  vars_files: [vars/talos.yml]
  tasks:
    - name: The Kubernetes API's address, token and CA certificate
      ansible.builtin.include_tasks: tasks/k8s-connection.yml

    - name: The Kubernetes cluster is healthy
      ansible.builtin.include_tasks: tasks/kubernetes-healthy.yml

    - name: Set up kubectl, for draining a host's Kubernetes nodes before its reboot
      ansible.builtin.include_tasks: tasks/kubectl-local.yml

    - name: Set up talosctl {{ talos_version }}, for etcd around a control plane's host
      ansible.builtin.include_tasks: tasks/talosctl-local.yml

- name: Upgrade the Proxmox hosts one at a time
  hosts: targets
  serial: 1
  order: inventory
  any_errors_fatal: true
  gather_facts: false
  vars:
    in_no_reboot: "{{ inventory_hostname in groups.get('no_reboot', []) }}"
    dns_on: "{{ dns_guest_tag | default('') | length > 0 }}"
    kubectl_cmd: "{{ hostvars['semaphore'].kubectl_cmd }}"
    kubectl_host: semaphore
    talosctl_cmd: "{{ hostvars['semaphore'].talosctl_cmd }}"
    reboot_reason: Rebooting for the Proxmox upgrade (Semaphore)
  tasks:
    - name: The Proxmox cluster has quorum
      ansible.builtin.include_tasks: tasks/proxmox-quorate.yml

    - name: The Kubernetes cluster is healthy before this host
      ansible.builtin.include_tasks: tasks/kubernetes-healthy.yml
      args:
        apply:
          delegate_to: semaphore

    - name: Read the Proxmox guests
      ansible.builtin.include_tasks: tasks/proxmox-guests.yml

    - name: Find the DNS servers
      ansible.builtin.include_tasks: tasks/dns-guests.yml
      when: dns_on | bool

    - name: Work out whether DNS allows rebooting this host
      ansible.builtin.set_fact:
        dns_here: "{{ dns_here | default([]) if dns_on | bool else [] }}"
        dns_elsewhere: "{{ dns_elsewhere | default([]) if dns_on | bool else [] }}"
        dns_blocks_reboot: >-
          {{ dns_on | bool and dns_here | length > 0 and dns_elsewhere | length == 0
             and dns_guests | length > 1 }}

    - name: The other DNS servers answer
      ansible.builtin.include_tasks: tasks/dns-answers.yml
      vars:
        dns_check: "{{ dns_elsewhere }}"
      when: dns_here | length > 0 and dns_elsewhere | length > 0

    - name: Start the evacuation plan
      ansible.builtin.set_fact:
        evacuate_plan: []

    - name: Check the VMs to move off this host can go
      ansible.builtin.include_tasks: tasks/evacuate-check.yml
      loop: "{{ evacuate | default([]) }}"
      loop_control:
        loop_var: evac
      vars:
        evacuate_memory_margin_mb: "{{ evacuate_memory_margin | default(1024) }}"
      when: not in_no_reboot | bool

    # Refreshing the lists only looks, so it runs in check mode too.
    - name: Refresh the package lists
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
      check_mode: false

    - name: List the pending upgrades
      ansible.builtin.command: apt list --upgradable
      register: upgradable
      changed_when: false
      check_mode: false

    - name: Show the pending upgrades
      ansible.builtin.debug:
        msg: "{{ upgradable.stdout_lines | reject('match', '^Listing') | list or ['nothing to upgrade'] }}"

    - name: Upgrade (dist-upgrade, as Proxmox requires)
      ansible.builtin.apt:
        upgrade: dist
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Remove packages nothing needs any more
      ansible.builtin.apt:
        autoremove: true

    - name: Old kernels
      ansible.builtin.include_tasks: tasks/proxmox-old-kernels.yml

    # A reboot is due when Debian says so, or when the newest installed kernel
    # isn't the one running.
    - name: Read the running kernel
      ansible.builtin.command: uname -r
      register: running_kernel
      changed_when: false
      check_mode: false

    - name: Find the newest installed kernel
      ansible.builtin.shell: set -o pipefail; ls /boot/vmlinuz-* | sed 's#/boot/vmlinuz-##' | sort -V | tail -1
      args:
        executable: /bin/bash
      register: newest_kernel
      changed_when: false
      check_mode: false

    - name: Look for Debian's reboot-required flag
      ansible.builtin.stat:
        path: /run/reboot-required
      register: reboot_flag

    - name: Work out whether a reboot is due
      ansible.builtin.set_fact:
        reboot_due: "{{ reboot_flag.stat.exists or (newest_kernel.stdout | trim) != (running_kernel.stdout | trim) }}"

    - name: Decide whether to reboot
      ansible.builtin.set_fact:
        will_reboot: "{{ reboot_due and not in_no_reboot | bool and not dns_blocks_reboot | bool }}"

    - name: Reboot, draining its Kubernetes nodes and keeping DNS and the evacuated VMs up
      ansible.builtin.include_tasks: tasks/proxmox-host-reboot.yml
      when: will_reboot | bool

    - name: The Proxmox cluster has quorum after this host
      ansible.builtin.include_tasks: tasks/proxmox-quorate.yml

    - name: Note a reboot left for the owner
      ansible.builtin.set_fact:
        reboot_left: >-
          {{ inventory_hostname }} ({{ 'in no_reboot' if in_no_reboot | bool
          else 'it carries every DNS server' }})
      when: reboot_due and not will_reboot | bool

    - name: Note the VMs left on another host
      ansible.builtin.set_fact:
        moved_away: "{{ evacuate_plan | map(attribute='name') | list }}"
      when: will_reboot | bool and evacuate_plan | length > 0 and not evacuate_return | default(true) | bool

- name: Report
  hosts: semaphore
  gather_facts: false
  tasks:
    - name: Hosts that still need a reboot by hand
      ansible.builtin.debug:
        msg: >-
          {{ groups['proxmox'] | map('extract', hostvars) | selectattr('reboot_left', 'defined') |
             map(attribute='reboot_left') | list or ['none'] }}

    - name: VMs left on the host they were moved to (evacuate_return is false)
      ansible.builtin.debug:
        msg: >-
          {{ groups['proxmox'] | map('extract', hostvars) | selectattr('moved_away', 'defined') |
             map(attribute='moved_away') | flatten or ['none'] }}

    - name: DNS outages
      ansible.builtin.debug:
        msg: >-
          {{ 'DNS was not checked (dns_guest_tag is unset).'
             if hostvars[groups['proxmox'][0]].dns_guest_tag | default('') | length == 0
             else ('One DNS server only: DNS is down whenever its host reboots.'
                   if (groups['proxmox'] | map('extract', hostvars) | selectattr('dns_guests', 'defined') |
                       map(attribute='dns_guests') | first | default([]) | length) == 1
                   else 'none') }}

    # Only after a drain, and never in the way of the clean-up below: a failure
    # here is reported and the run carries on.
    - name: Spread the database primaries back over the nodes
      when: kubectl_cmd is defined and cnpg_drained | default(false)
      block:
        - name: Spread them
          ansible.builtin.include_tasks: tasks/cnpg-spread-primaries.yml
          vars:
            kubectl_host: semaphore
      rescue:
        - name: Say the spread failed, and carry on to the clean-up
          ansible.builtin.debug:
            msg: >-
              Spreading the database primaries failed
              ({{ ansible_failed_result.msg | default('a step failed') | truncate(200) }}).
              The run's own work is done; the next run that drains spreads them, or switch
              them by hand.

    - name: Remove the CA certificate, and kubectl and talosctl with their configs
      ansible.builtin.include_tasks: tasks/local-tools-cleanup.yml
